[project]
name = "mic_ingest"
version = "0.0.0"
description = "Micronutrient Information Center Knowledge Base - LinkML-based nutrient knowledge extraction"
authors = [{name = "Corey Cox", email = "corey@tislab.org"}]
license = {text = "BSD-3"}
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    # LinkML ecosystem
    "linkml>=1.9.3",
    "linkml-runtime>=1.9.4",
    "linkml-dataops",
    # Ontology access
    "oaklib>=0.6.0",
    # LLM / Anthropic
    "anthropic>=0.39.0",
    # Web/parsing
    "beautifulsoup4>=4.13.3",
    "requests>=2.31.0",
    "lxml",
    # Data handling
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # Rendering
    "jinja2>=3.0",
    # KG Integration (existing)
    "koza>=2.2.0",
    "kgx>=2.4.0",
    "biolink-model>=4.3.7",
    # Utilities
    "loguru",
    "importlib-metadata>=4.8.0",
    "markdownify>=1.2.2",
]

[project.optional-dependencies]
validation = [
    "linkml-data-qc",
    "linkml-term-validator",
    "linkml-reference-validator",
]

dev = [
    "pytest>=8.1.1",
    "mkdocs>=1.4",
    "mkdocs-material>=9.5",
    "mkdocs-macros-plugin",
    "black",
    "ruff",
]

[project.scripts]
ingest = "mic_ingest.cli:app"

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff]
line-length = 120
ignore = [
    "D100", # `missing-module-docstring`
    "D101", # `missing-function-docstring`
    "D102", # `missing-method-docstring`
    "D103", # `missing-class-docstring`
    "D211", # `no-blank-line-before-class`
    "D212", # `multi-line-summary-first-line`
    "D203", # `blank-line-before-docstring`
    "F541", # f-strings with no placeholders
    "S101", # Use of assert detected
]
fixable = ["ALL"]
select = [
    "B", # bugbear
    "D", # pydocstyle
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # isort
    "S", # flake8-bandit
    "W", # Warning
]
unfixable = []
target-version = "py310"

[tool.codespell]
skip = "*.po,*.ts,.git,pyproject.toml"
count = ""
quiet-level = 3

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
