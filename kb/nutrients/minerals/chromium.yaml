name: Chromium
nutrient_term:
  preferred_term: chromium
  term:
    id: CHEBI:28073
    label: chromium atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/chromium
alternate_names:
  - Cr
  - Trivalent chromium
  - Chromium(III)
description: |
  Chromium is a trace metal found in all organisms. The predominant form in the body is
  trivalent chromium (Cr3+), which has been proposed to potentiate insulin function when
  provided at pharmacological doses. However, the nutritional essentiality of chromium has
  been questioned in recent years, as dietary deficiency has not been clearly described in
  humans. While the US Institute of Medicine set an adequate intake (AI) for chromium in
  2001, the European Food Safety Authority concluded in 2014 that requirements could not
  be established. The evidence for chromium supplementation benefits in diabetes prevention
  or treatment remains mixed.

functions:
  - name: Potential Insulin Potentiator
    description: |
      Trivalent chromium has been proposed to be a cofactor for a biologically active
      molecule that could enhance the effects of insulin on target tissues. Chromium may
      potentiate insulin signaling, though the molecular mechanisms remain unclear and
      the essentiality of chromium for this function is debated. Some studies suggest
      chromium may act at pharmacological rather than nutritional doses.
    biological_processes:
      - preferred_term: insulin receptor signaling pathway
        term:
          id: GO:0008286
          label: insulin receptor signaling pathway
    mic_references:
      - 8
      - 10
      - 11
      - 12
    evidence:
      - reference: PMID:22423897
        supports: PARTIAL
        snippet: "chromium, which has been shown to reduce insulin resistance in some, but not all, studies"
        explanation: Evidence for chromium's effects on insulin resistance is mixed

deficiency:
  name: Chromium Deficiency
  description: |
    Dietary chromium deficiency has not been clearly observed in humans. Potential cases
    were thought to have occurred in patients on long-term parenteral nutrition without
    supplemental chromium, who developed abnormal glucose utilization. However, because
    intravenous solutions provide chromium at doses well above dietary levels, it has been
    suggested that chromium might produce biological effects only at pharmacological doses,
    not nutritional ones. The absence of animal models for chromium deficiency makes it
    difficult to study biochemical abnormalities associated with inadequate intakes.
  phenotypes:
    - name: Impaired glucose tolerance
      phenotype_term:
        preferred_term: impaired glucose tolerance
      frequency: OCCASIONAL
      context: Reported in parenteral nutrition patients; causality unclear
      mic_references:
        - 18
        - 19

  at_risk_groups:
    - name: Patients on parenteral nutrition
      description: |
        Patients receiving long-term intravenous feeding without supplemental chromium
        may theoretically be at risk, though evidence is limited
      mic_references:
        - 18

    - name: Endurance athletes
      description: |
        Urinary chromium loss reportedly increased by endurance exercise, though chromium
        absorption may also increase to compensate
      mic_references:
        - 20
        - 21

  mic_references:
    - 3
    - 14
    - 18
    - 19

toxicity:
  name: Chromium Toxicity
  description: |
    Hexavalent chromium (Cr6+) is a recognized carcinogen causing lung, nasal, and sinus
    cancers when inhaled. However, trivalent chromium (Cr3+) has low toxicity from oral
    intake because it is poorly absorbed and rapidly excreted. The Food and Nutrition Board
    did not set a tolerable upper intake level (UL) for trivalent chromium due to lack of
    convincing evidence of adverse effects. Chromium picolinate has raised some safety
    concerns based on cell culture studies suggesting potential DNA damage, though a human
    study found no evidence of increased oxidative DNA damage. Isolated case reports of
    kidney failure have occurred with high-dose chromium picolinate supplementation.
  adverse_effects:
    - name: Kidney failure
      description: |
        Isolated case reports of kidney failure with high-dose chromium picolinate
        (600-2,400 mcg/day). Individuals with pre-existing kidney or liver disease
        may be at increased risk.
      severity: severe
  mic_references:
    - 5
    - 75
    - 76
    - 77
    - 78
    - 79
    - 80
    - 83
    - 84
    - 85

