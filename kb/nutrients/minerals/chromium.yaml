drug_interactions:
  - name: Antacids and Chromium
    description: |
      Antacids may decrease chromium absorption. Chromium supplements should be taken
      at a different time than antacids.
    drug_term:
      preferred_term: antacid
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: LOW
    mic_references:
      - 73

  - name: Insulin and Chromium
    description: |
      Because chromium may enhance the effects of insulin, individuals taking insulin
      or oral medications for diabetes should consult their healthcare provider before
      taking chromium supplements to avoid hypoglycemia.
    drug_term:
      preferred_term: insulin
    interaction_type: SYNERGISTIC
    clinical_significance: MODERATE
    mic_references:
      - 74

nutrient_interactions:
  - name: Vitamin C and Chromium
    description: |
      Vitamin C may increase chromium absorption. Taking vitamin C along with chromium
      supplements may enhance chromium uptake.
    nutrient_term:
      preferred_term: vitamin C
    interaction_type: INCREASES_ABSORPTION
    mic_references:
      - 68

  - name: Simple Sugars and Chromium
    description: |
      Foods high in simple sugars (sucrose, fructose) are usually low in chromium and
      may promote chromium excretion.
    nutrient_term:
      preferred_term: simple sugars
    interaction_type: INCREASES_EXCRETION
    mic_references:
      - 6
      - 71

disease_associations:
  - name: Type 2 Diabetes Prevention
    description: |
      Chromium has been proposed to help prevent or treat impaired glucose tolerance and
      type 2 diabetes by enhancing insulin action. However, randomized controlled trials
      have produced mixed results. A meta-analysis of nine trials found no effect of
      chromium (200-1,000 mcg/day) on fasting glucose in people without diabetes. The
      evidence does not support chromium supplementation for diabetes prevention in the
      general population.
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: THERAPEUTIC
    population_context: Evidence is mixed; most trials show no significant benefit
    mic_references:
      - 23
      - 24
      - 25
      - 26
      - 27
      - 28
      - 29
    evidence:
      - reference: PMID:29021369
        supports: NO_EVIDENCE
        snippet: "beneficial effects in humans have not been unequivocally established"
        explanation: Recent review concludes human benefits are not established

  - name: Metabolic Syndrome
    description: |
      Evidence that supplemental chromium can help treat metabolic syndrome is largely
      lacking. While some studies suggest modest effects on lipid profiles or glucose
      metabolism, results are inconsistent.
    disease_term:
      preferred_term: metabolic syndrome
      term:
        id: MONDO:0005154
        label: metabolic syndrome
    relationship_type: THERAPEUTIC
    population_context: Evidence is largely lacking
    mic_references:
      - 58
      - 59
      - 60

  - name: Polycystic Ovary Syndrome
    description: |
      Some studies have investigated chromium supplementation for polycystic ovary
      syndrome (PCOS), which is associated with insulin resistance. However, evidence
      of benefit is limited and inconsistent.
    disease_term:
      preferred_term: polycystic ovary syndrome
      term:
        id: MONDO:0008315
        label: polycystic ovary syndrome
    relationship_type: THERAPEUTIC
    population_context: Limited evidence of benefit
    mic_references:
      - 61
      - 62
      - 63
      - 64

