  notes: |
    The nutritional essentiality of chromium is debated. In 2001 the US Institute of Medicine
    set adequate intake (AI) values based on chromium content in healthy diets. However, in
    2014 the European Food Safety Authority concluded that requirements for chromium could
    not be established. A well-balanced diet including fruits, vegetables, meat, fish, and
    grains should easily cover dietary needs. No Tolerable Upper Intake Level (UL) has been
    set due to lack of convincing adverse effects data.

bioavailability:
  description: |
    Chromium absorption from the gastrointestinal tract is low, typically less than 2.5%
    of ingested chromium. Absorption may be enhanced by vitamin C. Most absorbed chromium
    is rapidly excreted in the urine. The amount of chromium in food is variable and has
    been measured accurately in relatively few foods.
  mic_references:
    - 6
    - 68

references:
  - reference: PMID:29021369
    title: New Evidence against Chromium as an Essential Trace Element
    findings:
      - statement: Chromium is not an essential element
        supporting_text: "chromium currently can only be considered pharmacologically active and not an essential element"
  - reference: PMID:22423897
    title: Molecular mechanisms of chromium in alleviating insulin resistance
    findings:
      - statement: Chromium effects on insulin resistance are inconsistent
        supporting_text: "chromium, which has been shown to reduce insulin resistance in some, but not all, studies"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Chromium. The essentiality of chromium as a nutrient is
  debated. Evidence items include exact quotes from PubMed abstracts. The MIC reference
  numbers (mic_references) correspond to the numbered citations on the source page.
  The page contains 85 references.

  Key controversy: While chromium was historically considered essential, recent evidence
  suggests it may only have pharmacological effects at supraphysiological doses rather
  than being nutritionally essential.
