name: Iron
nutrient_term:
  preferred_term: iron
  term:
    id: CHEBI:18248
    label: iron atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/iron
alternate_names:
  - Fe
description: |
  Iron is an essential component of hundreds of proteins and enzymes that support
  essential biological functions, including oxygen transport, energy production, and
  DNA synthesis. Hemoglobin, myoglobin, cytochromes, and peroxidases require
  iron-containing heme as a prosthetic group. Iron deficiency is the most common
  nutritional deficiency worldwide, affecting primarily children, women of
  childbearing age, pregnant women, and individuals with certain medical conditions.
  Body iron is tightly regulated by the hormone hepcidin.

functions:
  - name: Oxygen Transport
    description: |
      Iron is essential for oxygen transport in the blood. Hemoglobin in red blood
      cells binds oxygen in the lungs and delivers it to tissues throughout the body.
      Myoglobin stores oxygen in muscle cells. About two-thirds of body iron is
      found in hemoglobin.
    biological_processes:
      - preferred_term: oxygen transport
        term:
          id: GO:0015671
          label: oxygen transport
    evidence:
      - reference: PMID:24868988
        supports: SUPPORT
        snippet: "Because the major role of iron is in hemoglobin synthesis, this review will focus on iron, iron transport, and hematopoiesis."
        explanation: Review of the molecular biology of human iron metabolism confirms that the major role of iron is in hemoglobin synthesis, supporting iron's essential function in oxygen transport.
    mic_references:
      - 1
      - 2

  - name: Energy Production
    description: |
      Iron-containing enzymes in the mitochondrial electron transport chain (cytochromes)
      are essential for ATP production. Iron-sulfur clusters are required for electron
      transfer in cellular respiration.
    biological_processes:
      - preferred_term: electron transport chain
        term:
          id: GO:0022900
          label: electron transport chain
    evidence:
      - reference: PMID:11160590
        supports: SUPPORT
        snippet: "This review focuses on the biological processes that we believe are the basis for alterations in the immune system, neural systems, and energy metabolism and exercise"
        explanation: Review of iron biology confirms iron's essential role in energy metabolism, supporting the function of cytochromes and iron-sulfur clusters in cellular respiration.
    mic_references:
      - 3
      - 4

  - name: DNA Synthesis
    description: |
      Ribonucleotide reductase is an iron-dependent enzyme essential for DNA synthesis.
      Iron is required for the activity of this enzyme, which catalyzes the formation
      of deoxyribonucleotides from ribonucleotides.
    biological_processes:
      - preferred_term: DNA replication
        term:
          id: GO:0006260
          label: DNA replication
    evidence:
      - reference: PMID:25000876
        supports: SUPPORT
        snippet: "Eukaryotic cells contain numerous iron-requiring proteins such as iron-sulfur (Fe-S) cluster proteins, hemoproteins and ribonucleotide reductases (RNRs). These proteins utilize iron as a cofactor and perform key roles in DNA replication, DNA repair, metabolic catalysis, iron regulation and cell cycle progression."
        explanation: Review confirms that ribonucleotide reductases and other iron-requiring proteins perform key roles in DNA replication, DNA repair, and cell cycle control.
    mic_references:
      - 5

deficiency:
  name: Iron Deficiency
  phenotype_term:
    preferred_term: Decreased circulating iron concentration
    term:
      id: HP:0040303
      label: Decreased circulating iron concentration
  description: |
    Iron deficiency is the most common nutritional deficiency worldwide. It results
    from inadequate iron intake, poor absorption, or increased losses. Stages include
    storage iron depletion, early functional iron deficiency (reduced transferrin
    saturation), and iron deficiency anemia (microcytic hypochromic anemia). Symptoms
    include fatigue, weakness, decreased work capacity, and impaired cognitive function.
  sequelae:
    - name: Iron deficiency anemia
      phenotype_term:
        preferred_term: iron deficiency anemia
        term:
          id: HP:0001891
          label: Iron deficiency anemia
      frequency: FREQUENT
      context: Microcytic hypochromic anemia from severe iron deficiency
      evidence:
        - reference: PMID:26926814
          supports: SUPPORT
          snippet: "Microcytic anemia due to iron deficiency is the most common type of anemia in children"
          explanation: Review confirms that microcytic anemia from iron deficiency is the most common type of anemia in children, supporting the frequent occurrence of this phenotype.
      mic_references:
        - 14

    - name: Fatigue
      phenotype_term:
        preferred_term: fatigue
        term:
          id: HP:0012378
          label: Fatigue
      frequency: FREQUENT
      context: Common symptom even before anemia develops
      mic_references:
        - 14

    - name: Cognitive impairment
      phenotype_term:
        preferred_term: cognitive impairment
        term:
          id: HP:0100543
          label: Cognitive impairment
      frequency: OCCASIONAL
      context: Especially affects children's development
      evidence:
        - reference: PMID:25419131
          supports: SUPPORT
          snippet: "Among the cognitive impairments caused by iron deficiency, those referring to attention span, intelligence, and sensory perception functions are mainly cited, as well as those associated with emotions and behavior, often directly related to the presence of iron deficiency anemia"
          explanation: Review confirms that iron deficiency causes cognitive impairments in attention span, intelligence, and sensory perception, supporting the link between iron deficiency and cognitive impairment.
      mic_references:
        - 38

  at_risk_groups:
    - name: Women of childbearing age
      description: |
        Menstrual blood loss increases iron requirements; RDA is 18 mg/day vs
        8 mg/day for men
      mic_references:
        - 25

    - name: Pregnant women
      description: |
        Expanded blood volume and fetal development increase requirements to
        27 mg/day; many women enter pregnancy with inadequate iron stores
      mic_references:
        - 25

    - name: Infants and young children
      description: |
        Rapid growth increases requirements; infants born with low stores or
        exclusively breastfed beyond 6 months are at risk
      mic_references:
        - 26

    - name: Frequent blood donors
      description: |
        Each donation removes about 200-250 mg of iron; may lead to depletion
        without supplementation
      mic_references:
        - 27

    - name: Vegetarians
      description: |
        Plant-based diets contain only nonheme iron, which is less bioavailable
        than heme iron from animal sources
      mic_references:
        - 28

  mic_references:
    - 14
    - 15
    - 16

toxicity:
  name: Iron Toxicity
  description: |
    Acute iron poisoning is rare but can be fatal, especially in children who
    accidentally ingest iron supplements. Chronic iron overload occurs in hereditary
    hemochromatosis and can cause liver damage, heart failure, and diabetes. The
    Tolerable Upper Intake Level (UL) for adults is 45 mg/day based on gastrointestinal
    side effects. Iron supplements commonly cause GI side effects including nausea,
    constipation, and dark stools.
  adverse_effects:
    - name: Gastrointestinal distress
      description: |
        Nausea, vomiting, constipation, diarrhea, and dark stools are common
        with iron supplementation
      severity: mild
    - name: Iron overload (hemochromatosis)
      description: |
        Toxic iron deposition in liver, heart, and pancreas in hereditary
        hemochromatosis or from excessive supplementation
      severity: severe
  mic_references:
    - 62
    - 63
    - 64

