drug_interactions:
  - name: Tetracyclines and Iron
    description: |
      Iron supplements reduce the absorption of tetracycline antibiotics. Doses
      should be separated by at least two hours.
    drug_term:
      preferred_term: tetracycline
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: HIGH
    mic_references:
      - 65

  - name: Bisphosphonates and Iron
    description: |
      Iron reduces the absorption of bisphosphonates used for osteoporosis.
      Doses should be separated by at least two hours.
    drug_term:
      preferred_term: bisphosphonate
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 66

  - name: Levothyroxine and Iron
    description: |
      Iron supplements may reduce the absorption of thyroid hormone replacement.
      Doses should be separated by at least four hours.
    drug_term:
      preferred_term: levothyroxine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 67

  - name: Levodopa and Iron
    description: |
      Iron may reduce the absorption of levodopa used for Parkinson's disease.
    drug_term:
      preferred_term: levodopa
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 68

nutrient_interactions:
  - name: Vitamin C and Iron
    description: |
      Vitamin C (ascorbic acid) enhances nonheme iron absorption by reducing
      ferric iron (Fe3+) to ferrous iron (Fe2+) and preventing formation of
      poorly soluble iron compounds.
    nutrient_term:
      preferred_term: vitamin C
    interaction_type: INCREASES_ABSORPTION
    mic_references:
      - 51
      - 52

  - name: Calcium and Iron
    description: |
      Calcium can inhibit both heme and nonheme iron absorption when consumed
      together, though the effect may be transient and not affect overall iron
      status in people with adequate iron intake.
    nutrient_term:
      preferred_term: calcium
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 53

  - name: Phytates and Iron
    description: |
      Phytic acid in whole grains, legumes, and nuts inhibits nonheme iron
      absorption by forming insoluble complexes.
    nutrient_term:
      preferred_term: phytate
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 54

  - name: Polyphenols and Iron
    description: |
      Polyphenols in tea, coffee, wine, and some fruits and vegetables can
      inhibit nonheme iron absorption.
    nutrient_term:
      preferred_term: polyphenols
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 55

disease_associations:
  - name: Iron Deficiency Anemia
    description: |
      Iron deficiency anemia is the most common form of anemia worldwide.
      It is characterized by small, pale red blood cells (microcytic hypochromic
      anemia) and reduced hemoglobin. Treatment involves iron supplementation
      and addressing underlying causes of iron loss.
    disease_term:
      preferred_term: iron deficiency anemia
      term:
        id: MONDO:0001356
        label: iron deficiency anemia
    relationship_type: DEFICIENCY_CAUSES
    population_context: Global public health concern
    evidence:
      - reference: PMID:20923825
        supports: SUPPORT
        snippet: "iron-deficiency anemia and iron deficiency without anemia during infancy and childhood can have long-lasting detrimental effects on neurodevelopment"
        explanation: AAP clinical report confirms that iron deficiency anemia has significant health consequences, supporting the causal relationship between iron deficiency and anemia.
    mic_references:
      - 14
      - 15

  - name: Cognitive Development in Children
    description: |
      Iron deficiency, with or without anemia, in children has been associated
      with poor cognitive development, poor school achievement, and abnormal
      behavior patterns. Early iron deficiency may have lasting effects on
      brain development.
    disease_term:
      preferred_term: developmental delay
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Children, especially during first years of life
    evidence:
      - reference: PMID:20923825
        supports: SUPPORT
        snippet: "iron-deficiency anemia and iron deficiency without anemia during infancy and childhood can have long-lasting detrimental effects on neurodevelopment"
        explanation: AAP clinical report confirms that iron deficiency during infancy and childhood has lasting detrimental effects on neurodevelopment.
    mic_references:
      - 38
      - 39

  - name: Hereditary Hemochromatosis
    description: |
      Genetic disorder causing excessive iron absorption and toxic iron
      deposition in organs. Associated with liver disease, heart failure,
      diabetes, and arthritis. Treatment involves regular phlebotomy.
    disease_term:
      preferred_term: hereditary hemochromatosis
      term:
        id: MONDO:0006507
        label: hereditary hemochromatosis
    relationship_type: MARKER
    population_context: Individuals with HFE gene mutations
    mic_references:
      - 62
      - 63

