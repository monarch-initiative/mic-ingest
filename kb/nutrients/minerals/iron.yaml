    The Tolerable Upper Intake Level (UL) for adults is 45 mg/day based on
    gastrointestinal side effects. Much of iron requirement is met through
    recycling iron from senescent red blood cells. Vegetarians may require
    1.8 times more iron due to lower bioavailability of nonheme iron.

bioavailability:
  description: |
    Iron absorption varies significantly based on iron status and dietary factors.
    Heme iron (from meat, poultry, fish) is absorbed 2-3 times more efficiently
    than nonheme iron (from plants and fortified foods). Heme iron contributes
    10-15% of dietary intake but up to 40% of absorbed iron. Absorption of nonheme
    iron is enhanced by vitamin C and meat/fish/poultry factors, and inhibited
    by phytates, polyphenols, and calcium.
  mic_references:
    - 49
    - 50

