drug_interactions:
  - name: Tetracyclines and Iron
    description: |
      Iron supplements reduce the absorption of tetracycline antibiotics. Doses
      should be separated by at least two hours.
    drug_term:
      preferred_term: tetracycline
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: HIGH
    mic_references:
      - 65

  - name: Bisphosphonates and Iron
    description: |
      Iron reduces the absorption of bisphosphonates used for osteoporosis.
      Doses should be separated by at least two hours.
    drug_term:
      preferred_term: bisphosphonate
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 66

  - name: Levothyroxine and Iron
    description: |
      Iron supplements may reduce the absorption of thyroid hormone replacement.
      Doses should be separated by at least four hours.
    drug_term:
      preferred_term: levothyroxine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 67

  - name: Levodopa and Iron
    description: |
      Iron may reduce the absorption of levodopa used for Parkinson's disease.
    drug_term:
      preferred_term: levodopa
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 68

nutrient_interactions:
  - name: Vitamin C and Iron
    description: |
      Vitamin C (ascorbic acid) enhances nonheme iron absorption by reducing
      ferric iron (Fe3+) to ferrous iron (Fe2+) and preventing formation of
      poorly soluble iron compounds.
    nutrient_term:
      preferred_term: vitamin C
    interaction_type: INCREASES_ABSORPTION
    mic_references:
      - 51
      - 52

  - name: Calcium and Iron
    description: |
      Calcium can inhibit both heme and nonheme iron absorption when consumed
      together, though the effect may be transient and not affect overall iron
      status in people with adequate iron intake.
    nutrient_term:
      preferred_term: calcium
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 53

  - name: Phytates and Iron
    description: |
      Phytic acid in whole grains, legumes, and nuts inhibits nonheme iron
      absorption by forming insoluble complexes.
    nutrient_term:
      preferred_term: phytate
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 54

  - name: Polyphenols and Iron
    description: |
      Polyphenols in tea, coffee, wine, and some fruits and vegetables can
      inhibit nonheme iron absorption.
    nutrient_term:
      preferred_term: polyphenols
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 55

disease_associations:
  - name: Cognitive Development in Children
    description: |
      Iron deficiency, with or without anemia, in children has been associated
      with poor cognitive development, poor school achievement, and abnormal
      behavior patterns. Early iron deficiency may have lasting effects on
      brain development.
    disease_term:
      preferred_term: developmental delay
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Children, especially during first years of life
    evidence:
      - reference: PMID:20923825
        supports: SUPPORT
        snippet: "iron-deficiency anemia and iron deficiency without anemia during infancy and childhood can have long-lasting detrimental effects on neurodevelopment"
        explanation: AAP clinical report confirms that iron deficiency during infancy and childhood has lasting detrimental effects on neurodevelopment.
      - reference: PMID:25512881
        supports: SUPPORT
        snippet: "Prenatal and early postnatal iron deficiency (ID) is associated with long-term neurobiological alterations and disruptions in cognitive, social, and behavioral development. Early life ID is particularly detrimental as this is a period of rapid neurodevelopment."
        explanation: Review confirms that early life iron deficiency causes long-term neurobiological alterations and disruptions in cognitive and behavioral development during rapid neurodevelopment.
      - reference: PMID:25419131
        supports: SUPPORT
        snippet: "iron deficiency without anemia may cause cognitive disturbances"
        explanation: Confirms that iron deficiency even without anemia can impair cognitive function, supporting the broad impact of iron deficiency on children's cognitive development.
    mic_references:
      - 38
      - 39

  - name: Hereditary Hemochromatosis
    description: |
      Genetic disorder causing excessive iron absorption and toxic iron
      deposition in organs. Associated with liver disease, heart failure,
      diabetes, and arthritis. Treatment involves regular phlebotomy.
    disease_term:
      preferred_term: hereditary hemochromatosis
      term:
        id: MONDO:0006507
        label: hereditary hemochromatosis
    relationship_type: MARKER
    population_context: Individuals with HFE gene mutations
    evidence:
      - reference: PMID:26975792
        supports: SUPPORT
        snippet: "Haemochromatosis is now known to be an iron-storage disease with genetic heterogeneity but with a final common metabolic pathway resulting in inappropriately low production of the hormone hepcidin. This leads to increase in intestinal absorption and deposition of excessive amounts of iron in parenchymal cells which in turn results in eventual tissue damage and organ failure."
        explanation: Lancet review confirms hemochromatosis is an iron-storage disease caused by low hepcidin production, leading to excessive intestinal iron absorption, tissue iron deposition, and organ failure.
    mic_references:
      - 62
      - 63

  - name: Colorectal Cancer and Heme Iron
    description: |
      High intake of heme iron from red and processed meat has been associated
      with increased risk of colorectal cancer. Mechanisms may involve catalytic
      formation of N-nitroso compounds and cytotoxic aldehydes from lipoperoxidation.
    disease_term:
      preferred_term: colorectal cancer
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Populations with high red/processed meat intake
    evidence:
      - reference: PMID:21209396
        supports: SUPPORT
        snippet: "The relative risk of colon cancer was 1.18 (95% CI: 1.06-1.32) for subjects in the highest category of heme iron intake compared with those in the lowest category"
        explanation: Meta-analysis of prospective cohort studies found a statistically significant 18% increased risk of colon cancer with high heme iron intake.
      - reference: PMID:24243555
        supports: SUPPORT
        snippet: "a higher intake of heme iron has shown a tendency toward a positive association with cancer risk"
        explanation: Systematic review and meta-analysis confirms the positive association between heme iron intake and cancer risk, particularly for colorectal cancer.
    mic_references:
      - 96
      - 97

  - name: Coronary Heart Disease
    description: |
      The relationship between iron and coronary heart disease is complex.
      Heme iron intake is positively associated with CHD incidence, while
      total iron intake and serum iron markers show inverse associations.
    disease_term:
      preferred_term: coronary heart disease
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: General population; heme iron specific
    evidence:
      - reference: PMID:24401818
        supports: SUPPORT
        snippet: "Heme iron was found to be positively associated with CHD incidence (RR: 1.57; 95% CI: 1.28, 1.94), whereas total iron was inversely associated (RR: 0.85; 95% CI: 0.73, 0.999)"
        explanation: Meta-analysis of 21 prospective cohort studies found heme iron positively associated with 57% increased CHD incidence, while total iron was inversely associated.
    mic_references:
      - 103

  - name: Type 2 Diabetes
    description: |
      Elevated body iron stores, as measured by serum ferritin and transferrin
      saturation, are associated with increased risk of type 2 diabetes. Iron
      may impair insulin signaling and beta cell function through oxidative stress.
    disease_term:
      preferred_term: type 2 diabetes mellitus
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: General population
    evidence:
      - reference: PMID:24327370
        supports: SUPPORT
        snippet: "Ferritin and clinically elevated transferrin saturation were strongly associated with an increased risk of T2D, overall and in prospective studies"
        explanation: Meta-analysis of 46 observational studies found strong association between elevated ferritin and transferrin saturation with increased type 2 diabetes risk.
    mic_references:
      - 105
      - 106

  - name: Pregnancy Anemia
    description: |
      Iron supplementation during pregnancy reduces the risk of maternal
      anaemia and iron deficiency at term. Iron and folic acid supplementation
      is standard antenatal care to support expanded blood volume and fetal
      development.
    disease_term:
      preferred_term: anemia of pregnancy
    relationship_type: RISK_FACTOR
    population_context: Pregnant women
    evidence:
      - reference: PMID:26198451
        supports: SUPPORT
        snippet: "Preventive iron supplementation reduced maternal anaemia at term by 70% (risk ratio (RR) 0.30; 95% confidence interval (CI) 0.19 to 0.46, 14 trials, 2199 women, low quality evidence), iron-deficiency anaemia at term (RR 0.33; 95% CI 0.16 to 0.69, six trials, 1088 women)"
        explanation: Cochrane review of 61 trials found iron supplementation reduced maternal anemia at term by 70% and iron-deficiency anemia at term by 67%, confirming iron deficiency as a major cause of pregnancy anemia.
    mic_references:
      - 64
      - 66
  - name: Alzheimer Disease
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: RISK_FACTOR
    direction: INCREASED
    description: |
      Dysregulation of iron homeostasis and abnormal brain iron accumulation are
      observed in Alzheimer's disease. This accumulation does not appear to
      result from increased dietary iron but from disrupted cellular iron
      regulation, involving proteins such as amyloid precursor protein (APP) and
      tau. Excess brain iron promotes oxidative damage. A meta-analysis found
      significantly lower serum iron levels in AD patients, suggesting altered
      peripheral-to-brain iron distribution rather than systemic iron excess.
    population_context: Brain iron accumulation in neurodegeneration; not related to dietary iron intake
    mic_references:
      - 11
      - 12
      - 115
      - 116
      - 117
    evidence:
      - reference: PMID:26545340
        supports: SUPPORT
        snippet: "Dysregulation of iron metabolism associated with cellular damage and oxidative stress is reported as a common event in several neurodegenerative disorders such as Alzheimer's, Parkinson's, and Huntington's diseases"
        explanation: Review establishing that iron metabolism dysregulation and associated oxidative stress is a common event in Alzheimer's and other neurodegenerative diseases
      - reference: PMID:24795635
        supports: SUPPORT
        snippet: "proteins directly implicated in the most prevalent neurodegenerative diseases, such as amyloid-β precursor protein, tau, α-synuclein, prion protein and huntingtin, have been connected to neuronal iron homeostatic control"
        explanation: Review showing that key AD-related proteins (APP, tau) are involved in neuronal iron homeostasis, and their disruption may contribute to iron-mediated neurodegeneration
      - reference: PMID:28966592
        supports: SUPPORT
        snippet: "Serum iron levels were significantly lower in AD patients than in healthy controls after excluded two studies [MD = -13.01, 95% CI (-20.75, -5.27); p = 0.001]"
        explanation: Meta-analysis showing significantly lower serum iron in AD patients, consistent with altered iron distribution rather than systemic iron excess

