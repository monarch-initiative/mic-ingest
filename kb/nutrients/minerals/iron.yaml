  rda:
    - population: Infants 0-6 months
      amount: "0.27 mg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "11 mg/day"
      source: Institute of Medicine
    - population: Children 1-3 years
      amount: "7 mg/day"
      source: Institute of Medicine
    - population: Children 4-8 years
      amount: "10 mg/day"
      source: Institute of Medicine
    - population: Children 9-13 years
      amount: "8 mg/day"
      source: Institute of Medicine
    - population: Males 14-18 years
      amount: "11 mg/day"
      source: Institute of Medicine
    - population: Females 14-18 years
      amount: "15 mg/day"
      source: Institute of Medicine
    - population: Males 19+ years
      amount: "8 mg/day"
      source: Institute of Medicine
    - population: Females 19-50 years
      amount: "18 mg/day"
      source: Institute of Medicine
    - population: Females 51+ years
      amount: "8 mg/day"
      source: Institute of Medicine
    - population: Pregnancy
      amount: "27 mg/day"
      source: Institute of Medicine
    - population: Breastfeeding (under 18)
      amount: "10 mg/day"
      source: Institute of Medicine
    - population: Breastfeeding (19+)
      amount: "9 mg/day"
      source: Institute of Medicine
  notes: |
    The Tolerable Upper Intake Level (UL) for adults is 45 mg/day based on
    gastrointestinal side effects. Much of iron requirement is met through
    recycling iron from senescent red blood cells. Vegetarians may require
    1.8 times more iron due to lower bioavailability of nonheme iron.

bioavailability:
  description: |
    Iron absorption varies significantly based on iron status and dietary factors.
    Heme iron (from meat, poultry, fish) is absorbed 2-3 times more efficiently
    than nonheme iron (from plants and fortified foods). Heme iron contributes
    10-15% of dietary intake but up to 40% of absorbed iron. Absorption of nonheme
    iron is enhanced by vitamin C and meat/fish/poultry factors, and inhibited
    by phytates, polyphenols, and calcium.
  mic_references:
    - 49
    - 50

references:
  - reference: PMID:20923825
    title: "Diagnosis and prevention of iron deficiency and iron-deficiency anemia in infants and young children (0-3 years of age)"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Iron. Iron deficiency is the most common nutritional
  deficiency worldwide. The MIC reference numbers (mic_references) correspond to
  the numbered citations on the source page.
