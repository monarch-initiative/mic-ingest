      notes: Adequate Intake (AI)
  notes: |
    The AI values are based on median intakes in generally healthy populations. No
    Tolerable Upper Intake Level (UL) has been established because healthy kidneys
    efficiently excrete excess potassium. Average dietary intakes in the US are
    2,408 mg/day for women and 3,172 mg/day for men, below the AI. Because underconsumption
    is linked to adverse health effects, potassium is recognized as a "nutrient of
    public health concern."

bioavailability:
  description: |
    Potassium is efficiently absorbed from the gastrointestinal tract. In healthy
    individuals, the kidneys adjust urinary potassium excretion to match intake,
    maintaining potassium homeostasis. This regulatory mechanism can be overwhelmed
    in kidney disease or with certain medications.
  mic_references:
    - 9

references: []

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Potassium. Potassium is recognized as a "nutrient of
  public health concern" due to underconsumption and its association with hypertension
  and cardiovascular disease. The MIC reference numbers (mic_references) correspond
  to the numbered citations on the source page. The page contains approximately 55
  references.
