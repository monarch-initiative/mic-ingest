name: Potassium
nutrient_term:
  preferred_term: potassium
  term:
    id: CHEBI:26216
    label: potassium atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/potassium
alternate_names:
  - K
description: |
  Potassium is considered a "nutrient of public health concern" because its underconsumption
  in the US population is associated with adverse health effects, particularly hypertension
  and cardiovascular disease. Normal body function depends on tight regulation of potassium
  concentrations both inside and outside cells. Potassium is the principal cation inside
  cells, and the concentration gradient with sodium creates the membrane potential essential
  for nerve impulse transmission, muscle contraction, and heart function.

functions:
  - name: Membrane Potential Maintenance
    description: |
      Potassium is the principal positively charged ion (cation) in the fluid inside cells,
      while sodium is the principal cation in extracellular fluid. Potassium concentrations
      are about 30 times higher inside than outside cells. The concentration differences
      across cell membranes create an electrochemical gradient known as the membrane
      potential, maintained by Na+/K+-ATPase pumps. This activity accounts for 20-40%
      of resting energy expenditure and is critical for nerve impulse transmission,
      muscle contraction, and heart function.
    biological_processes:
      - preferred_term: ion transport
        term:
          id: GO:0006811
          label: monoatomic ion transport
    mic_references:
      - 2
      - 3
      - 4

  - name: Cofactor for Enzymes
    description: |
      A limited number of enzymes require the presence of potassium for their activity.
      The activation of Na+/K+-ATPase requires the presence of sodium and potassium.
      Potassium is also required for the activity of pyruvate kinase, an important
      enzyme in carbohydrate metabolism.
    biological_processes:
      - preferred_term: carbohydrate metabolism
        term:
          id: GO:0005975
          label: carbohydrate metabolic process
    mic_references:
      - 5

deficiency:
  name: Potassium Deficiency (Hypokalemia)
  description: |
    Abnormally low plasma potassium concentration (hypokalemia) is most commonly a result
    of excessive loss of potassium from prolonged vomiting or diarrhea, use of diuretics,
    kidney disease, or metabolic disturbances. Symptoms include fatigue, muscle weakness
    and cramps, intestinal paralysis leading to bloating and constipation, and abdominal
    pain. Severe hypokalemia may result in muscular paralysis or abnormal heart rhythms
    (cardiac arrhythmias) that can be fatal. Low dietary potassium alone does not generally
    result in hypokalemia but can precipitate it in patients at risk.
  phenotypes:
    - name: Muscle weakness
      phenotype_term:
        preferred_term: muscle weakness
        term:
          id: HP:0001324
          label: Muscle weakness
      frequency: FREQUENT
      context: Related to alterations in membrane potential and cellular metabolism
      mic_references:
        - 1
        - 6

    - name: Cardiac arrhythmia
      phenotype_term:
        preferred_term: cardiac arrhythmia
        term:
          id: HP:0011675
          label: Arrhythmia
      frequency: OCCASIONAL
      context: Severe hypokalemia; can be fatal
      mic_references:
        - 1
        - 6

    - name: Constipation
      phenotype_term:
        preferred_term: constipation
        term:
          id: HP:0002019
          label: Constipation
      frequency: FREQUENT
      context: Intestinal paralysis from hypokalemia
      mic_references:
        - 1

  at_risk_groups:
    - name: Users of potassium-wasting diuretics
      description: |
        Thiazide diuretics and furosemide increase urinary potassium excretion
      mic_references:
        - 1

    - name: Individuals with prolonged vomiting or diarrhea
      description: |
        Excessive loss of potassium through GI tract
      mic_references:
        - 1

    - name: People with kidney disease
      description: |
        Nephropathies can cause excessive potassium loss
      mic_references:
        - 1

    - name: People with magnesium depletion
      description: |
        Magnesium depletion increases risk of hypokalemia
      mic_references:
        - 1

  mic_references:
    - 1
    - 6

toxicity:
  name: Potassium Toxicity (Hyperkalemia)
  description: |
    Abnormally elevated serum potassium concentrations (hyperkalemia) occur when potassium
    intake exceeds the kidneys' capacity to eliminate it. Causes include kidney failure,
    use of potassium-sparing diuretics, insufficient aldosterone secretion, or oral doses
    of potassium >18 g at one time. Hyperkalemia may also result from hemolysis or tissue
    damage. Symptoms include tingling of hands and feet, muscular weakness, and temporary
    paralysis. The most serious complication is cardiac arrhythmia, which can lead to
    cardiac arrest. In healthy people, the kidneys efficiently adjust urinary potassium
    excretion to intake.
  adverse_effects:
    - name: Cardiac arrhythmia
      description: |
        Most serious complication of hyperkalemia; can lead to cardiac arrest
      severity: severe
    - name: Muscular weakness
      description: |
        Can progress to temporary paralysis with severe hyperkalemia
      severity: moderate
  mic_references:
    - 6
    - 50
    - 51

