drug_interactions:
  - name: ACE Inhibitors and Potassium
    description: |
      ACE inhibitors (e.g., captopril, enalapril) can increase the risk of hyperkalemia
      when used with potassium supplements.
    drug_term:
      preferred_term: ACE inhibitor
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    mic_references:
      - 50
      - 51
      - 54

  - name: Potassium-Sparing Diuretics and Potassium
    description: |
      Potassium-sparing diuretics (e.g., spironolactone, triamterene, amiloride)
      decrease urinary potassium excretion and can cause hyperkalemia.
    drug_term:
      preferred_term: potassium-sparing diuretic
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    mic_references:
      - 50
      - 51
      - 54

  - name: Loop and Thiazide Diuretics and Potassium
    description: |
      Loop diuretics (furosemide) and thiazide diuretics increase urinary potassium
      excretion and can cause hypokalemia.
    drug_term:
      preferred_term: diuretic
    interaction_type: INCREASES_EXCRETION
    clinical_significance: HIGH
    mic_references:
      - 55

  - name: Angiotensin Receptor Blockers and Potassium
    description: |
      ARBs (e.g., losartan, valsartan) can increase the risk of hyperkalemia when
      used with potassium supplements.
    drug_term:
      preferred_term: angiotensin receptor blocker
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    mic_references:
      - 50
      - 51
      - 54

nutrient_interactions:
  - name: Sodium and Potassium
    description: |
      Potassium and sodium have opposing effects on blood pressure. Modern diets high
      in sodium and low in potassium contribute to the high prevalence of hypertension.
      The sodium-to-potassium ratio is an important determinant of cardiovascular risk.
    nutrient_term:
      preferred_term: sodium
    interaction_type: ANTAGONISTIC
    mic_references:
      - 12
      - 14
      - 15
      - 37

  - name: Magnesium and Potassium
    description: |
      Magnesium depletion can increase the risk of hypokalemia.
    nutrient_term:
      preferred_term: magnesium
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 1

disease_associations:
  - name: Stroke
    description: |
      Several prospective cohort studies have found an inverse association between
      potassium intake and risk of stroke. A meta-analysis showed that daily potassium
      intakes of 3,510-4,680 mg were associated with 30% reduced risk of stroke.
      The lowest risk corresponds to intakes around 3,500 mg/day. The effect appears
      to be on ischemic stroke rather than hemorrhagic stroke.
    disease_term:
      preferred_term: stroke
      term:
        id: MONDO:0005098
        label: stroke
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: General population
    mic_references:
      - 12
      - 16
      - 17

  - name: Hypertension
    description: |
      Chronic hypertension damages the heart, blood vessels, and kidneys. Increasing
      dietary potassium may help lower blood pressure in both normotensive and
      hypertensive individuals. The DASH diet, high in potassium (4,100 mg/day),
      lowered blood pressure significantly. Meta-analyses show supplemental potassium
      (2,340-2,535 mg/day) reduces systolic BP by 4.7 mm Hg and diastolic BP by 3.5 mm Hg,
      with greater effects in hypertensive individuals.
    disease_term:
      preferred_term: hypertension
      term:
        id: MONDO:0001134
        label: essential hypertension
    relationship_type: THERAPEUTIC
    population_context: General population, especially those with hypertension
    mic_references:
      - 33
      - 34
      - 38
      - 39
      - 41
      - 42
      - 43

  - name: Kidney Stones
    description: |
      Chronic hypokalemia is associated with kidney stone formation. Higher dietary
      potassium intakes have been associated with lower risk of kidney stones in
      observational studies.
    disease_term:
      preferred_term: kidney stones
      term:
        id: MONDO:0001248
        label: nephrolithiasis
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: General population
    mic_references:
      - 1

