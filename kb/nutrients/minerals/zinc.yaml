name: Zinc
nutrient_term:
  preferred_term: zinc
  term:
    id: CHEBI:27363
    label: zinc atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/zinc
alternate_names:
  - Zn
description: |
  Zinc is a nutritionally essential mineral needed for catalytic, structural, and regulatory
  functions in the body. Over 3,000 proteins in humans have functional zinc-binding sites.
  Zinc plays important roles in growth and development, immune function, neurotransmission,
  vision, reproduction, and intestinal ion transport. Severe zinc deficiency is rare and
  caused by an inherited condition called acrodermatitis enteropathica. Dietary zinc
  deficiency is quite common in the developing world, affecting an estimated 2 billion
  people, primarily due to consumption of phytate-rich diets lacking animal-source foods.

functions:
  - name: Catalytic Role
    description: |
      Over 50 different enzymes depend on zinc for their ability to catalyze vital chemical
      reactions. Zinc-dependent enzymes can be found in all six classes of enzymes. During
      enzymatic reactions, zinc may have either a direct catalytic role or a structural role
      (stabilizing the structure of catalytic enzymes).
    biological_processes:
      - preferred_term: enzyme activity
    evidence:
      - reference: PMID:16396512
        supports: SUPPORT
        snippet: "it can be proposed that ca. 2800 human proteins are potentially zinc-binding in vivo, corresponding to 10% of the human proteome, with an uncertainty of 400 sequences"
        explanation: Bioinformatic analysis confirming that approximately 2800 human proteins (10% of the proteome) are zinc-binding, underscoring zinc's vast catalytic and structural importance.
    mic_references:
      - 7
      - 8
      - 9

  - name: Structural Role
    description: |
      Zinc plays an essential role in the folding of some proteins. A finger-like structure,
      known as a zinc finger motif, stabilizes the structure of several proteins including
      nuclear receptors that bind steroids, thyroid hormones, vitamin D, and vitamin A.
      Zinc finger motifs allow nuclear receptors to bind to DNA and act as transcription
      factors. Metallothioneins are proteins with a zinc-binding motif that regulate free
      zinc concentrations and provide defense against oxidative stress.
    biological_processes:
      - preferred_term: protein folding
        term:
          id: GO:0006457
          label: protein folding
    mic_references:
      - 6
      - 10
      - 11
      - 12

  - name: Regulatory Role
    description: |
      Zinc finger proteins regulate gene expression by acting as transcription factors.
      Zinc also plays a role in cell signaling via the metal-response element (MRE)-binding
      transcription factor 1 (MTF1). Extracellular zinc can stimulate a zinc-sensing receptor
      that triggers the release of intracellular calcium. Zinc has been found to influence
      hormone release and nerve impulse transmission.
    biological_processes:
      - preferred_term: regulation of gene expression
        term:
          id: GO:0010468
          label: regulation of gene expression
    mic_references:
      - 6
      - 14
      - 15
      - 16

deficiency:
  name: Zinc Deficiency
  description: |
    Severe zinc deficiency was first characterized through the study of individuals with
    acrodermatitis enteropathica, a genetic disorder of impaired zinc uptake and transport.
    Symptoms include growth retardation, delayed sexual maturation, skin rashes, chronic
    diarrhea, immune deficiencies, impaired wound healing, diminished appetite, impaired
    taste, night blindness, and behavioral disturbances. Acquired zinc deficiency affects
    an estimated 2 billion people worldwide, primarily in developing countries due to
    phytate-rich diets lacking animal-source foods. Even milder zinc deficiency contributes
    to impaired growth and development and increased susceptibility to infections.
  sequelae:
    - name: Growth retardation
      phenotype_term:
        preferred_term: growth retardation
        term:
          id: HP:0001510
          label: Growth delay
      frequency: FREQUENT
      context: Common feature of mild zinc deficiency in children
      evidence:
        - reference: PMID:29558383
          supports: SUPPORT
          snippet: "Zinc supplementation after birth increased height (WMD = 0.23 cm, 95%CI: 0.09-0.38), weight (WMD = 0.14 kg, 95%CI: 0.07-0.21), and weight-for-age Z-score (WMD = 0.04, 95%CI: 0.001-0.087)"
          explanation: Meta-analysis of 78 trials (34,352 children under 5) showing zinc supplementation after birth significantly increases height and weight, with stronger effects when supplementation starts at age 2 years or older.
        - reference: PMID:21501440
          supports: SUPPORT
          snippet: "The final effect size after pooling all the data sets (zinc +/- iron etc) showed a significant positive effect of zinc supplementation on linear growth [Effect size: 0.13 (95% CI 0.04, 0.21), random model] in the developing countries"
          explanation: Meta-analysis of 36 studies in developing countries showing zinc supplementation has a significant positive effect on linear growth, with greater effect when zinc is given without iron.
      mic_references:
        - 46
        - 47

    - name: Skin rash (dermatitis)
      phenotype_term:
        preferred_term: dermatitis
        term:
          id: HP:0000964
          label: Eczematoid dermatitis
      frequency: FREQUENT
      context: Characteristic feature of severe zinc deficiency
      mic_references:
        - 33

    - name: Diarrhea
      phenotype_term:
        preferred_term: chronic diarrhea
        term:
          id: HP:0002028
          label: Chronic diarrhea
      frequency: FREQUENT
      context: Severe zinc deficiency
      mic_references:
        - 33
        - 66

    - name: Immune dysfunction
      phenotype_term:
        preferred_term: increased susceptibility to infections
        term:
          id: HP:0002719
          label: Recurrent infections
      frequency: FREQUENT
      context: Zinc-deficient individuals experience increased susceptibility to infections
      evidence:
        - reference: PMID:27021581
          supports: SUPPORT
          snippet: "Zinc deficiency affects immune cells, resulting in altered host defense, increased risk of inflammation, and even death"
          explanation: Review confirming that zinc deficiency impairs both innate and adaptive immune cells, leading to increased susceptibility to infections.
        - reference: PMID:9701160
          supports: SUPPORT
          snippet: "Zinc is crucial for normal development and function of cells mediating nonspecific immunity such as neutrophils and natural killer cells. Zinc deficiency also affects development of acquired immunity by preventing both the outgrowth and certain functions of T lymphocytes such as activation, Th1 cytokine production, and B lymphocyte help"
          explanation: Comprehensive review establishing the biological basis for how zinc deficiency impairs both innate (neutrophils, NK cells) and adaptive (T and B lymphocytes) immunity.
        - reference: PMID:26817502
          supports: SUPPORT
          snippet: "Zinc supplementation also significantly increased anti-CD3/CD28 and phytohemagglutinin-stimulated T cell proliferation, and the number of peripheral T cells (P < 0.05)"
          explanation: RCT in zinc-deficient nursing home elderly showing that 30 mg/day zinc supplementation for 3 months significantly increased serum zinc, T cell numbers, and T cell proliferation.
      mic_references:
        - 63
        - 66

  at_risk_groups:
    - name: Children in developing countries
      description: |
        Estimated 2 billion people worldwide affected by dietary zinc deficiency, primarily
        due to diets high in phytate and lacking animal-source foods
      mic_references:
        - 3
        - 35

    - name: Individuals with acrodermatitis enteropathica
      description: |
        Genetic disorder resulting from impaired uptake and transport of zinc; requires
        lifelong oral zinc therapy
      mic_references:
        - 33
        - 34

    - name: Individuals with malabsorption syndromes
      description: |
        Conditions affecting nutrient absorption can lead to acquired zinc deficiency
      mic_references:
        - 36

    - name: Chronic alcoholics
      description: |
        At risk for severe zinc deficiency
      mic_references:
        - 36

  mic_references:
    - 3
    - 33
    - 34
    - 35
    - 36

toxicity:
  name: Zinc Toxicity
  description: |
    Acute zinc toxicity can occur from consumption of food or beverages contaminated with
    zinc from galvanized containers. Single doses of 225-450 mg usually induce vomiting.
    The major consequence of long-term excessive zinc intake is copper deficiency; total
    zinc intakes of 60 mg/day for up to 10 weeks have resulted in signs of copper deficiency.
    The Tolerable Upper Intake Level (UL) for adults is 40 mg/day. Intranasal zinc is known
    to cause anosmia (loss of smell) which may be irreversible.
  adverse_effects:
    - name: Copper deficiency
      description: |
        Major consequence of long-term excessive zinc consumption; can occur at intakes
        of 50-60 mg/day
      severity: moderate
    - name: Gastrointestinal distress
      description: |
        Nausea, vomiting, abdominal pain, and diarrhea with acute toxicity
      severity: mild
    - name: Anosmia
      description: |
        Loss of sense of smell from intranasal zinc; may be irreversible
      severity: moderate
  mic_references:
    - 6
    - 29
    - 127
    - 177
    - 178

