notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Zinc. Zinc is essential for over 3,000 proteins in humans.
  Dietary zinc deficiency is common in developing countries, affecting an estimated
  2 billion people. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. The page contains approximately 180 references.
