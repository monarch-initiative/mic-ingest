  notes: |
    The RDA is based on a number of different indicators of zinc nutritional status. The
    Tolerable Upper Intake Level (UL) for adults is 40 mg/day, established to prevent
    copper deficiency. Average dietary zinc intake in US adults is about 12.3 mg/day,
    with about 12% of the adult population at risk for inadequate intake.

bioavailability:
  description: |
    Zinc bioavailability is relatively high in meat, eggs, and seafood due to the relative
    absence of compounds that inhibit zinc absorption and the presence of sulfur-containing
    amino acids (cysteine and methionine) that improve zinc absorption. Zinc in whole-grain
    products and plant proteins is less bioavailable due to their high phytate content,
    which inhibits zinc absorption. Leavened breads have more bioavailable zinc than
    unleavened breads because yeast reduces phytate levels.
  mic_references:
    - 174

