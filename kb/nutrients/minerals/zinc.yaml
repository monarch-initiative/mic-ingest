drug_interactions:
  - name: Penicillamine and Zinc
    description: |
      Zinc supplements decrease the absorption of penicillamine (Cuprimine, Depen), a
      metal-chelating agent used to treat copper overload in Wilson's disease. Therapeutic
      use of penicillamine has also resulted in severe zinc deficiency.
    drug_term:
      preferred_term: penicillamine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: HIGH
    mic_references:
      - 179

  - name: Tetracycline and Quinolone Antibiotics and Zinc
    description: |
      Concomitant administration of zinc supplements with tetracycline and quinolone
      antibiotics may decrease the absorption of both zinc and the medications. Taking
      zinc supplements and these medications at least two hours apart should prevent
      this interaction.
    drug_term:
      preferred_term: tetracycline antibiotic
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 179

  - name: Anticonvulsants and Zinc
    description: |
      Anticonvulsant drugs, especially sodium valproate, may precipitate zinc deficiency.
    drug_term:
      preferred_term: anticonvulsant
    interaction_type: INCREASES_EXCRETION
    clinical_significance: MODERATE
    mic_references:
      - 179

  - name: Diuretics and Zinc
    description: |
      Prolonged use of diuretics may increase urinary zinc excretion, resulting in
      increased loss of zinc.
    drug_term:
      preferred_term: diuretic
    interaction_type: INCREASES_EXCRETION
    clinical_significance: MODERATE
    mic_references:
      - 179

nutrient_interactions:
  - name: Copper and Zinc
    description: |
      Taking large quantities of zinc (50 mg/day or more) over weeks can interfere with
      copper bioavailability. High zinc intake induces intestinal synthesis of metallothionein,
      which traps copper within intestinal cells and prevents its systemic absorption.
    nutrient_term:
      preferred_term: copper
    interaction_type: ANTAGONISTIC
    mic_references:
      - 17

  - name: Iron and Zinc
    description: |
      Iron and zinc compete for absorptive pathways. Supplemental (38-65 mg/day of elemental
      iron) but not dietary levels of iron may decrease zinc absorption. This interaction
      has led some experts to recommend zinc supplementation for pregnant and lactating
      women taking iron supplements.
    nutrient_term:
      preferred_term: iron
    interaction_type: ANTAGONISTIC
    mic_references:
      - 18
      - 19
      - 20
      - 21

  - name: Calcium and Zinc
    description: |
      High levels of dietary calcium may impair zinc absorption, though results in humans
      are inconsistent. Calcium in combination with phytate might affect zinc absorption.
    nutrient_term:
      preferred_term: calcium
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 17
      - 26
      - 27
      - 28

disease_associations:
  - name: Infectious Diseases in Children
    description: |
      Zinc deficiency increases susceptibility to infectious diseases. Diarrheal diseases,
      pneumonia, and malaria are major causes of childhood mortality in developing countries
      where zinc deficiency is prevalent. Zinc supplementation reduces the duration and
      severity of acute and persistent childhood diarrhea. WHO and UNICEF recommend zinc
      supplementation (10-20 mg/day) as part of treatment for acute diarrheal episodes.
    disease_term:
      preferred_term: infectious disease
      term:
        id: MONDO:0005550
        label: infectious disease
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Children with zinc deficiency, especially in developing countries
    evidence:
      - reference: PMID:15189121
        supports: SUPPORT
        snippet: "Zinc supplementation has been shown to have a positive effect on the incidence of diarrhea (18% reduction, 95% CI: 7-28%) and pneumonia (41% reduction, 95% CI: 17-59%), and might lead to a decrease in the incidence of malaria"
        explanation: Review of zinc supplementation trials showing significant reductions in childhood diarrhea and pneumonia incidence.
      - reference: PMID:27996088
        supports: SUPPORT
        snippet: "In children older than six months of age, zinc supplementation may shorten the average duration of diarrhoea by around half a day (MD -11.46 hours, 95% CI -19.72 to -3.19; 2581 children, 9 trials, low certainty evidence), and probably reduces the number of children whose diarrhoea persists until day seven (RR 0.73, 95% CI 0.61 to 0.88; 3865 children, 6 trials, moderate certainty evidence)"
        explanation: Cochrane systematic review of 33 trials (10,841 children) confirming zinc supplementation shortens diarrhea duration in children over 6 months, with greater effect in malnourished children.
      - reference: PMID:27915460
        supports: SUPPORT
        snippet: "zinc supplementation reduced the incidence of pneumonia by 13% (fixed-effect risk ratio (RR) 0.87; 95% confidence interval (CI) 0.81 to 0.94, six studies, low-quality evidence) and prevalence of pneumonia by 41% (random-effects RR 0.59; 95% CI 0.35 to 0.99, one study, n = 609, low-quality evidence)"
        explanation: Cochrane review of 6 studies (5,193 children) demonstrating that zinc supplementation reduces the incidence and prevalence of pneumonia in children aged 2-59 months.
    mic_references:
      - 66
      - 70
      - 71
      - 72

  - name: Type 2 Diabetes Mellitus
    description: |
      Zinc is involved in insulin synthesis, storage, and release from pancreatic beta-cells.
      Zinc also stimulates glucose uptake by insulin-sensitive tissues. Some prospective
      studies have found lower risk of type 2 diabetes with higher dietary zinc intake.
      Short-term trials suggest zinc supplementation may improve glucose handling in
      subjects with prediabetes.
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: General population; evidence mixed across studies
    evidence:
      - reference: PMID:29373583
        supports: SUPPORT
        snippet: "Zinc acts as an insulin mimetic, activating key molecules implicated in cell signaling to maintain glucose homeostasis in mouse and human skeletal muscle cells"
        explanation: Mechanistic evidence that zinc mimics insulin signaling, supporting the biological plausibility of zinc's role in glucose metabolism and T2D risk.
      - reference: PMID:19171718
        supports: SUPPORT
        snippet: "After adjustment of lifestyle and dietary risk factors, the relative risks (RRs) (95% CI) of type 2 diabetes comparing the highest with the lowest quintiles were 0.90 (0.82-0.99) (P(trend) = 0.04) for total zinc intake and 0.92 (0.84-1.00) (P(trend) = 0.009) for dietary zinc intake from food sources, respectively"
        explanation: Prospective study of 82,297 women from the Nurses' Health Study over 24 years showing that higher zinc intake is associated with modestly lower risk of type 2 diabetes.
    mic_references:
      - 15
      - 94
      - 97
      - 98
      - 104
      - 105

  - name: Age-Related Macular Degeneration
    description: |
      Zinc supplementation, often in combination with antioxidants, has been studied for
      the management of age-related macular degeneration (AMD). The AREDS trials showed
      benefit of zinc-containing supplements in reducing progression to advanced AMD.
    disease_term:
      preferred_term: age-related macular degeneration
      term:
        id: MONDO:0005150
        label: age-related macular degeneration
    relationship_type: THERAPEUTIC
    population_context: Individuals with intermediate AMD
    evidence:
      - reference: PMID:11594942
        supports: SUPPORT
        snippet: "Comparison with placebo demonstrated a statistically significant odds reduction for the development of advanced AMD with antioxidants plus zinc (odds ratio [OR], 0.72; 99% confidence interval [CI], 0.52-0.98). The ORs for zinc alone and antioxidants alone are 0.75 (99% CI, 0.55-1.03) and 0.80 (99% CI, 0.59-1.09), respectively"
        explanation: Landmark AREDS trial (3,640 participants, 6.3 years follow-up) showing that zinc alone or combined with antioxidants reduced progression to advanced AMD in high-risk individuals.
      - reference: PMID:28756618
        supports: SUPPORT
        snippet: "People taking zinc supplements may be less likely to progress to late AMD (OR 0.83, 95% CI 0.70 to 0.98; 3790 participants; 3 RCTs; low-certainty evidence), neovascular AMD (OR 0.76, 95% CI 0.62 to 0.93; 2442 participants; 1 RCT; moderate-certainty evidence)"
        explanation: Cochrane review of 19 studies confirming that zinc supplementation reduces progression to late AMD and neovascular AMD.
    mic_references:
      - 1

  - name: Common Cold
    description: |
      Supplementation with doses of zinc in excess of the UL has been shown effective
      in reducing the duration of common cold symptoms. The use of zinc at daily doses
      of 50-180 mg for one to two weeks has not resulted in serious side effects.
    disease_term:
      preferred_term: common cold
      term:
        id: MONDO:0005709
        label: common cold
    relationship_type: THERAPEUTIC
    population_context: General population with cold symptoms
    evidence:
      - reference: PMID:22566526
        supports: SUPPORT
        snippet: "Compared with patients given placebo, those receiving zinc had a shorter duration of cold symptoms (mean difference -1.65 days, 95% confidence interval [CI] -2.50 to -0.81)"
        explanation: Systematic review and meta-analysis of 17 RCTs (2,121 participants) showing zinc shortens cold duration by about 1.65 days, though significant heterogeneity across studies.
      - reference: PMID:28515951
        supports: SUPPORT
        snippet: "The mean common cold duration was 33% (95% CI 21% to 45%) shorter for the zinc groups of the seven included trials"
        explanation: Meta-analysis of 7 RCTs with zinc lozenges at doses above 75 mg/day showing a 33% reduction in cold duration, with no significant difference between zinc acetate and zinc gluconate formulations.
    mic_references:
      - 1

