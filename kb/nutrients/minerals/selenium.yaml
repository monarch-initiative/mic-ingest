name: Selenium
nutrient_term:
  preferred_term: selenium
  term:
    id: CHEBI:27568
    label: selenium atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/selenium
alternate_names:
  - Se
description: |
  Selenium exerts various biological functions mainly as part of the amino acid
  selenocysteine, which is found in at least 25 selenoproteins in humans. These include
  five glutathione peroxidases, three thioredoxin reductases, and three iodothyronine
  deiodinases. Impaired antioxidant protection in selenium-deficient individuals may
  affect physiological responses to stress. Keshan cardiomyopathy and Kashin-Beck
  osteoarthropathy are diseases occurring specifically in areas of selenium deficiency
  in Asia. Most Americans have adequate selenium status.

functions:
  - name: Glutathione Peroxidase Activity
    description: |
      Five selenium-containing glutathione peroxidases (GPx1-4 and GPx6) are antioxidant
      enzymes that reduce potentially damaging reactive oxygen species, such as hydrogen
      peroxide and lipid hydroperoxides, to harmless products like water and alcohols.
      GPx4 is critical for spermatogenesis and male fertility by protecting immature
      spermatozoa against oxidative stress.
    biological_processes:
      - preferred_term: response to oxidative stress
        term:
          id: GO:0006979
          label: response to oxidative stress
    evidence:
      - reference: PMID:19856162
        supports: SUPPORT
        snippet: "Selenium is essential for normal spermatogenesis of mammals and its critical role is mainly mediated by two selenoproteins, namely phospholipid hydroperoxide glutathione peroxidase (PHGPx/GPx4) and Selenoprotein P."
        explanation: Confirms GPx4 is the major selenoprotein in germ cells and the pivotal link between selenium, sperm quality and male fertility.
    mic_references:
      - 6
      - 7

  - name: Thioredoxin Reductase Activity
    description: |
      Three selenocysteine-containing thioredoxin reductases (TXNRD1, TXNRD2, TXNRD3)
      catalyze the reduction of thioredoxin and serve as electron donors for regeneration
      of small antioxidants, including vitamin C, alpha-lipoic acid, vitamin E, and
      coenzyme Q10 from their oxidized forms. TXNRD1 is one of the major antioxidant
      enzymes and redox regulators in mammalian cells.
    biological_processes:
      - preferred_term: thioredoxin reduction
    evidence:
      - reference: PMID:19364476
        supports: SUPPORT
        snippet: "Mammalian thioredoxin reductases are selenium-containing flavoprotein oxidoreductases, dependent upon a selenocysteine residue for reduction of the active site disulfide in thioredoxins."
        explanation: Confirms the three mammalian thioredoxin reductases (TXNRD1, TXNRD2, TXNRD3) are selenoproteins essential for thioredoxin system function and redox regulation.
    mic_references:
      - 8
      - 9

  - name: Thyroid Hormone Activation
    description: |
      Three selenium-dependent iodothyronine deiodinases (DIO types 1, 2, and 3) are
      required for the conversion of thyroxine (T4) to the biologically active thyroid
      hormone triiodothyronine (T3). DIO type 3 can convert both T3 and T4 to inactive
      metabolites. DIOs are important for normal development, growth, and metabolism.
    biological_processes:
      - preferred_term: thyroid hormone activation
        term:
          id: GO:0006590
          label: thyroid hormone generation
    evidence:
      - reference: PMID:22009156
        supports: SUPPORT
        snippet: "Among the well-characterized selenoproteins are the iodothyronine deiodinases, glutathione peroxidases and thioredoxin reductases, enzymes involved in thyroid hormone metabolism, regulation of redox state and protection from oxidative damage."
        explanation: Review confirms iodothyronine deiodinases are well-characterized selenoproteins involved in thyroid hormone metabolism.
    mic_references:
      - 10
      - 11

deficiency:
  name: Selenium Deficiency
  description: |
    Insufficient selenium intake may negatively affect the activity of several
    selenium-responsive enzymes. Even when severe, isolated selenium deficiency does not
    usually result in obvious clinical illness. However, selenium-deficient individuals
    may be more susceptible to additional physiological stresses. Prolonged selenium
    deficiency may contribute to Keshan disease (fatal dilated cardiomyopathy) and
    Kashin-Beck disease (osteoarthropathy), which occur in selenium-deficient regions
    of Asia. Selenium supplementation can prevent Keshan disease but cannot reverse
    heart damage once it has occurred.
  phenotypes:
    - name: Cardiomyopathy (Keshan disease)
      phenotype_term:
        preferred_term: dilated cardiomyopathy
        term:
          id: HP:0001644
          label: Dilated cardiomyopathy
      frequency: OCCASIONAL
      context: Fatal form in selenium-deficient regions of China
      mic_references:
        - 52
        - 54

    - name: Kashin-Beck disease
      phenotype_term:
        preferred_term: osteoarthropathy
        term:
          id: HP:0005743
          label: Avascular necrosis of the capital femoral epiphysis
      frequency: OCCASIONAL
      context: Osteoarthropathy in selenium-deficient regions of Asia
      evidence:
        - reference: PMID:31548049
          supports: SUPPORT
          snippet: "Multivariate regression analysis suggested that etiology of the KBD was food-related factors such as fungal contamination of grains, selenium deficiency, imbalance of protein intake, etc."
          explanation: Comprehensive epidemiological review confirms selenium deficiency as a key etiological factor in Kashin-Beck disease, with national incidence declining from 22.1% in 1990 to 0.18% in 2015 following preventive measures.
      mic_references:
        - 48

  at_risk_groups:
    - name: Individuals in selenium-deficient regions
      description: |
        Areas with low soil selenium content in China and other parts of Asia
      mic_references:
        - 48
        - 52

  mic_references:
    - 48
    - 52
    - 54

toxicity:
  name: Selenium Toxicity (Selenosis)
  description: |
    Acute and fatal toxicities have occurred with accidental or suicidal ingestion
    of gram quantities of selenium. Chronic selenium toxicity (selenosis) may occur
    with smaller doses over long periods. The most common symptoms are hair and nail
    brittleness and loss. Other symptoms include gastrointestinal disturbances, skin
    rashes, garlic breath odor, fatigue, irritability, and neurological disorders.
    The Tolerable Upper Intake Level (UL) for adults is 400 mcg/day.
  adverse_effects:
    - name: Hair and nail brittleness/loss
      description: |
        Most common symptoms of selenosis; basis for establishing the UL
      severity: mild
    - name: Neurological disorders
      description: |
        Can occur with severe chronic selenosis
      severity: moderate
    - name: Gastrointestinal disturbances
      description: |
        Nausea, diarrhea, and abdominal pain
      severity: mild
  mic_references:
    - 65
    - 142

