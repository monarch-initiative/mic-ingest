drug_interactions:
  - name: Penicillamine and Copper
    description: |
      Penicillamine is a copper chelator used to treat Wilson disease by promoting
      urinary copper excretion. It may cause copper deficiency in non-Wilson disease
      patients if used long-term.
    drug_term:
      preferred_term: penicillamine
    interaction_type: INCREASES_EXCRETION
    clinical_significance: HIGH
    mic_references:
      - 167

  - name: Antacids and Copper
    description: |
      Antacids may reduce copper absorption by raising gastric pH or by containing
      aluminum or magnesium that may bind copper.
    drug_term:
      preferred_term: antacid
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 168

nutrient_interactions:
  - name: Zinc and Copper
    description: |
      High zinc intake can interfere with copper absorption by inducing the synthesis
      of metallothionein in intestinal cells. Metallothionein binds copper with high
      affinity and prevents its systemic absorption. Supplemental zinc at 50 mg/day
      or more may lead to copper deficiency over time.
    nutrient_term:
      preferred_term: zinc
    interaction_type: ANTAGONISTIC
    mic_references:
      - 61
      - 62
      - 63

  - name: Iron and Copper
    description: |
      Copper and iron interact in iron metabolism. Ceruloplasmin, a copper-containing
      enzyme, is required for iron transport. Copper deficiency can lead to secondary
      iron deficiency.
    nutrient_term:
      preferred_term: iron
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 4
      - 9

  - name: Vitamin C and Copper
    description: |
      High-dose vitamin C supplementation has been reported to decrease ceruloplasmin
      oxidase activity. However, whether this significantly impacts copper status or
      function is uncertain.
    nutrient_term:
      preferred_term: vitamin C
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 64
      - 65

disease_associations:
  - name: Cardiovascular Disease
    description: |
      Both copper deficiency and excess have been linked to cardiovascular disease risk.
      Copper is required for antioxidant enzyme function and proper lipid metabolism.
      Low copper status may impair these functions and contribute to atherogenesis.
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disorder
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Both deficiency and excess may increase risk
    mic_references:
      - 67
      - 68
      - 69
      - 70
    evidence:
      - reference: PMID:9451822
        supports: SUPPORT
        snippet: "Copper is an essential trace element and has profound influence on cardiac myopathy and heart metabolism"
        explanation: Demonstrates copper's essential role in cardiac metabolism, with deficiency causing cardiomyopathy
      - reference: PMID:27350652
        supports: SUPPORT
        snippet: "There are more than eighty anatomical, chemical and physiological similarities between animals deficient in Cu and individuals with IHD"
        explanation: Provides extensive evidence linking copper deficiency to ischemic heart disease through multiple physiological parallels

  - name: Osteoporosis
    description: |
      Copper is required for lysyl oxidase activity, which is essential for collagen
      and elastin cross-linking in bone. Copper deficiency may contribute to bone
      demineralization and osteoporosis.
    disease_term:
      preferred_term: osteoporosis
      term:
        id: MONDO:0005298
        label: osteoporosis
    relationship_type: DEFICIENCY_CAUSES
    population_context: Copper deficiency may increase risk
    mic_references:
      - 100
      - 101
      - 102

  - name: Wilson Disease
    description: |
      Wilson disease is an autosomal recessive disorder caused by mutations in the
      ATP7B gene, leading to toxic copper accumulation initially in the liver and
      subsequently in the brain and other tissues. Treatment involves copper chelation
      therapy and zinc supplementation to reduce copper absorption.
    disease_term:
      preferred_term: Wilson disease
      term:
        id: MONDO:0010200
        label: Wilson disease
    relationship_type: MARKER
    population_context: Inherited disorder of copper metabolism
    mic_references:
      - 82
      - 83
      - 84
    evidence:
      - reference: PMID:18568852
        supports: SUPPORT
        snippet: "Wilson's disease is an autosomal recessive disorder of copper metabolism. The culprit gene is ATP7B"
        explanation: Comprehensive diagnostic review confirming Wilson disease genetics and copper metabolism basis
      - reference: PMID:32279718
        supports: SUPPORT
        snippet: "This disease is caused by copper overload caused by reduced copper excretion secondary to genetic mutations in the ATP7B gene"
        explanation: Confirms Wilson disease mechanism of copper overload from impaired excretion due to ATP7B mutations

  - name: Menkes Disease
    description: |
      Menkes disease is an X-linked recessive disorder caused by mutations in the
      ATP7A gene, leading to severe systemic copper deficiency. The disorder is
      characterized by developmental delay, hypotonia, seizures, and kinky hair.
    disease_term:
      preferred_term: Menkes disease
      term:
        id: MONDO:0010651
        label: Menkes disease
    relationship_type: DEFICIENCY_CAUSES
    population_context: Inherited disorder of copper metabolism
    mic_references:
      - 50
      - 51
      - 52
    evidence:
      - reference: PMID:23281160
        supports: SUPPORT
        snippet: "Menkes disease (MD) is a lethal multisystemic disorder of copper metabolism. Progressive neurodegeneration and connective tissue disturbances, together with the peculiar \"kinky\" hair, are the main manifestations"
        explanation: Comprehensive review confirming Menkes disease features including neurodegeneration, connective tissue defects, and characteristic hair abnormalities

  - name: Alzheimer Disease
    description: |
      Copper dyshomeostasis has been implicated in Alzheimer disease pathogenesis.
      Both elevated and decreased copper levels have been reported in AD patients.
      Copper may interact with amyloid-beta peptides and contribute to oxidative stress.
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: RISK_FACTOR
    population_context: Role is complex; both deficiency and excess may be relevant
    mic_references:
      - 110
      - 111
      - 112
      - 113
    evidence:
      - reference: PMID:34219710
        supports: SUPPORT
        snippet: "Cu imbalance is strongly associated with neurodegeneration in dementia"
        explanation: Comprehensive review establishing the association between copper imbalance and neurodegeneration in Alzheimer disease
      - reference: PMID:12920183
        supports: SUPPORT
        snippet: "the addition of trace amounts of copper (0.12 ppm) to water given to cholesterol-fed rabbits can induce beta-amyloid (Abeta) accumulation, including senile plaque-like structures in the hippocampus and temporal lobe"
        explanation: Experimental evidence that trace copper exposure combined with high cholesterol induces amyloid-beta accumulation in an animal model

recommendations:
  rda:
    - population: Infants 0-6 months
      amount: "200 mcg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "220 mcg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-3 years
      amount: "340 mcg/day"
      source: Institute of Medicine
    - population: Children 4-8 years
      amount: "440 mcg/day"
      source: Institute of Medicine
    - population: Children 9-13 years
      amount: "700 mcg/day"
      source: Institute of Medicine
    - population: Adolescents 14-18 years
      amount: "890 mcg/day"
      source: Institute of Medicine
    - population: Adults 19+ years
      amount: "900 mcg/day"
      source: Institute of Medicine
    - population: Pregnancy
      amount: "1,000 mcg/day"
      source: Institute of Medicine
    - population: Breastfeeding
      amount: "1,300 mcg/day"
      source: Institute of Medicine
  notes: |
    Mean dietary copper intakes in the US are 1.1 mg/day for adult women and 1.3 mg/day
    for adult men, which exceed the RDA of 900 mcg/day. Tolerable Upper Intake Level (UL)
    for adults is 10 mg/day (10,000 mcg/day). Individuals with genetic disorders of copper
    metabolism may be at risk for adverse effects at significantly lower intake levels.

bioavailability:
  description: |
    Copper absorption occurs primarily in the small intestine. The efficiency of absorption
    can vary based on copper status and dietary factors. High zinc intake interferes with
    copper absorption by inducing metallothionein. Accurately assessing dietary copper
    intake is difficult since copper content of many foods has not been firmly established.
  mic_references:
    - 2
    - 61

references:
  - reference: PMID:8615367
    title: Copper biochemistry and molecular biology
    findings:
      - statement: Copper is vital for many enzymes and metabolic processes
        supporting_text: "The metabolism of copper and its importance for the functions of a roster of vital enzymes is detailed"
  - reference: PMID:9587135
    title: Essentiality of copper in humans
    findings:
      - statement: Copper deficiency causes anemia, neutropenia, and bone abnormalities
        supporting_text: "The most frequent clinical manifestations of copper deficiency are anemia, neutropenia, and bone abnormalities"
  - reference: PMID:22332037
    title: Impact of copper limitation on expression and function of multicopper oxidases (ferroxidases)
    findings:
      - statement: Copper limitation impairs ferroxidase activity and iron flux
        supporting_text: "Limitation in available copper appears to limit function of the MCO group exhibited as impaired iron flux due to the copper requirement of MCO for their ferroxidase activity"
  - reference: PMID:23807651
    title: Multi-copper oxidases and human iron metabolism
    findings:
      - statement: Multi-copper oxidases have ferroxidase activity associated with ferroportin for iron export
        supporting_text: "Each of these enzymes has a high specificity towards iron with the resulting ferroxidase activity being associated with ferroportin, the only known iron exporter protein in humans"
  - reference: PMID:34112357
    title: Copper nutrition and biochemistry and human (patho)physiology
    findings:
      - statement: Copper homeostasis disruption may underlie connective tissue and neurodegenerative disorders
        supporting_text: "Disruption of copper homeostasis may underlie the development of ischemic heart disease, and connective tissue and neurodegenerative disorders"
  - reference: PMID:22389498
    title: Copper homeostasis at the host-pathogen interface
    findings:
      - statement: Macrophage phagosomes accumulate copper during bacterial infection as a killing mechanism
        supporting_text: "Recent studies suggest that the macrophage phagosome accumulates copper during bacterial infection, which may constitute an important mechanism of killing"
  - reference: PMID:9451822
    title: Copper deficiency and heart disease - molecular basis, recent advances and current concepts
    findings:
      - statement: Copper has profound influence on cardiac function and deficiency causes cardiomyopathy
        supporting_text: "Copper is an essential trace element and has profound influence on cardiac myopathy and heart metabolism"
  - reference: PMID:27350652
    title: IHD from copper deficiency - a unified theory
    findings:
      - statement: Extensive parallels exist between copper-deficient animals and individuals with IHD
        supporting_text: "There are more than eighty anatomical, chemical and physiological similarities between animals deficient in Cu and individuals with IHD"
  - reference: PMID:23281160
    title: An overview and update of ATP7A mutations leading to Menkes disease and occipital horn syndrome
    findings:
      - statement: Menkes disease is a lethal multisystemic copper metabolism disorder
        supporting_text: "Menkes disease (MD) is a lethal multisystemic disorder of copper metabolism. Progressive neurodegeneration and connective tissue disturbances, together with the peculiar \"kinky\" hair, are the main manifestations"
  - reference: PMID:18568852
    title: Diagnosis of Wilson's disease - a comprehensive review
    findings:
      - statement: Wilson disease is an autosomal recessive disorder with ATP7B as the causative gene
        supporting_text: "Wilson's disease is an autosomal recessive disorder of copper metabolism. The culprit gene is ATP7B"
  - reference: PMID:32279718
    title: Wilson Disease - An Overview and Approach to Management
    findings:
      - statement: Wilson disease results from copper overload due to reduced excretion from ATP7B mutations
        supporting_text: "This disease is caused by copper overload caused by reduced copper excretion secondary to genetic mutations in the ATP7B gene"
  - reference: PMID:34219710
    title: Copper imbalance in Alzheimer's disease and its link with the amyloid hypothesis
    findings:
      - statement: Copper imbalance is strongly associated with neurodegeneration in dementia
        supporting_text: "Cu imbalance is strongly associated with neurodegeneration in dementia"
  - reference: PMID:12920183
    title: Trace amounts of copper in water induce beta-amyloid plaques and learning deficits in a rabbit model
    findings:
      - statement: Trace copper in water induces amyloid-beta accumulation in cholesterol-fed rabbits
        supporting_text: "the addition of trace amounts of copper (0.12 ppm) to water given to cholesterol-fed rabbits can induce beta-amyloid (Abeta) accumulation, including senile plaque-like structures in the hippocampus and temporal lobe"
  - reference: PMID:31209935
    title: Copper Deficiency - Causes, Manifestations, and Treatment
    findings:
      - statement: Copper deficiency affects hematologic and neurologic systems
        supporting_text: "Clinical manifestations are nonspecific but affect all organs and systems, particularly the hematologic (anemia) and the neurologic (myeloneuropathy) systems"
  - reference: PMID:27049134
    title: Dietary copper and human health - Current evidence and unresolved issues
    findings:
      - statement: Limited evidence exists for impaired immune function with very low copper intake
        supporting_text: "limited evidence exists for impaired immune function in healthy subjects with a very low (0.38 mg/day) Cu intake"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Copper. Evidence items include exact quotes from
  PubMed abstracts. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. The page contains 174 references.
