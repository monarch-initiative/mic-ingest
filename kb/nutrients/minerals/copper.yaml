name: Copper
nutrient_term:
  preferred_term: copper
  term:
    id: CHEBI:28694
    label: copper atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/copper
alternate_names:
  - Cu
description: |
  Copper is an essential cofactor for oxidase enzymes that catalyze oxidation-reduction
  reactions in various metabolic pathways. These copper-dependent enzymes (cuproenzymes)
  participate in energy (ATP) production, iron metabolism, connective tissue formation,
  melanin biosynthesis, and neurotransmission. Dietary copper insufficiency is relatively
  uncommon, but copper depletion may occur due to intestinal defects, high supplemental
  zinc intake, or in genetic conditions such as Menkes disease. Copper imbalance increases
  risks of bone demineralization, fatty liver disease, and cardiovascular and neurodegenerative
  diseases.

functions:
  - name: Energy Production
    description: |
      Copper is a required cofactor for cytochrome c oxidase, the terminal enzyme in the
      mitochondrial electron transport chain. This enzyme catalyzes the reduction of
      molecular oxygen to water, generating an electrical gradient used to synthesize ATP.
    biological_processes:
      - preferred_term: oxidative phosphorylation
        term:
          id: GO:0006119
          label: oxidative phosphorylation
    mic_references:
      - 1
      - 8

  - name: Iron Metabolism
    description: |
      Several cuproenzymes, including ceruloplasmin and hephaestin, are required for iron
      metabolism. Ceruloplasmin (ferroxidase I) oxidizes ferrous iron (Fe2+) to ferric iron
      (Fe3+), allowing iron to bind to transferrin for transport. Copper deficiency can
      lead to secondary iron deficiency and anemia.
    biological_processes:
      - preferred_term: iron ion homeostasis
        term:
          id: GO:0055072
          label: iron ion homeostasis
    mic_references:
      - 4
      - 9
      - 10

  - name: Connective Tissue Formation
    description: |
      Lysyl oxidase is a copper-dependent enzyme required for the cross-linking of collagen
      and elastin, which are essential for the formation and maintenance of connective tissue.
      Copper deficiency leads to defective connective tissue and bone abnormalities.
    biological_processes:
      - preferred_term: collagen fibril organization
        term:
          id: GO:0030199
          label: collagen fibril organization
    mic_references:
      - 2
      - 8

  - name: Central Nervous System Function
    description: |
      Copper is required for the function of enzymes involved in neurotransmitter synthesis.
      Dopamine beta-hydroxylase catalyzes the conversion of dopamine to norepinephrine, and
      peptidylglycine alpha-amidating monooxygenase is essential for processing neuropeptides.
    biological_processes:
      - preferred_term: neurotransmitter metabolic process
        term:
          id: GO:0042133
          label: neurotransmitter metabolic process
    mic_references:
      - 1
      - 2

  - name: Melanin Biosynthesis
    description: |
      Tyrosinase is a copper-containing enzyme that catalyzes the first step in the
      formation of melanin, the pigment responsible for the color of hair, skin, and eyes.
      Copper deficiency can lead to depigmentation.
    biological_processes:
      - preferred_term: melanin biosynthetic process
        term:
          id: GO:0042438
          label: melanin biosynthetic process
    mic_references:
      - 1
      - 2

  - name: Antioxidant Function
    description: |
      Copper/zinc superoxide dismutase (SOD1) is one of the body's primary antioxidant
      enzymes. It catalyzes the conversion of superoxide radicals to hydrogen peroxide,
      which can then be reduced to water by other antioxidant enzymes.
    biological_processes:
      - preferred_term: response to oxidative stress
        term:
          id: GO:0006979
          label: response to oxidative stress
    mic_references:
      - 16
    evidence:
      - reference: PMID:8615367
        supports: SUPPORT
        snippet: "Its potential toxicology is also addressed"
        explanation: Discusses copper's role in enzymes including antioxidant functions

deficiency:
  name: Copper Deficiency
  description: |
    Clinically evident dietary copper deficiency is relatively uncommon. Serum copper and
    ceruloplasmin levels may fall to 30% of normal in severe deficiency. One of the most
    common clinical signs is an anemia that is unresponsive to iron therapy but is corrected
    by copper supplementation. Copper deficiency may also lead to neutropenia, increasing
    susceptibility to infection. Other features include osteoporosis and other bone
    abnormalities, impaired growth, depigmentation, and neurological pathologies.
  phenotypes:
    - name: Anemia
      phenotype_term:
        preferred_term: anemia
        term:
          id: HP:0001903
          label: Anemia
      frequency: FREQUENT
      context: Unresponsive to iron therapy; corrected by copper supplementation
      mic_references:
        - 4
        - 33

    - name: Neutropenia
      phenotype_term:
        preferred_term: neutropenia
        term:
          id: HP:0001875
          label: Neutropenia
      frequency: FREQUENT
      context: Increases susceptibility to infection
      mic_references:
        - 37
        - 38

    - name: Osteoporosis
      phenotype_term:
        preferred_term: osteoporosis
        term:
          id: HP:0000939
          label: Osteoporosis
      frequency: OCCASIONAL
      context: Especially in low-birth-weight infants and young children
      mic_references:
        - 2
        - 8

  at_risk_groups:
    - name: Infants with Menkes disease
      description: |
        Genetic disorder with severely impaired intestinal copper absorption
        leading to systemic copper deficiency
      mic_references:
        - 50
        - 51

    - name: People taking high-dose zinc supplements
      description: |
        High zinc intake can interfere with copper absorption by inducing
        metallothionein in intestinal cells
      mic_references:
        - 61
        - 62

    - name: Patients with gastrointestinal surgery
      description: |
        Gastric bypass surgery and other GI procedures may impair copper absorption
      mic_references:
        - 44

  mic_references:
    - 2
    - 8
    - 33

  evidence:
    - reference: PMID:9587135
      supports: SUPPORT
      snippet: "The most frequent clinical manifestations of copper deficiency are anemia, neutropenia, and bone abnormalities"
      explanation: Confirms key symptoms of copper deficiency

toxicity:
  name: Copper Toxicity
  description: |
    Copper toxicity is rare in the general population. Acute copper poisoning can occur
    from storing beverages in copper-containing containers or from contaminated water.
    Symptoms include abdominal pain, nausea, vomiting, and diarrhea. Severe cases can
    cause liver damage, kidney failure, coma, and death. Chronic exposure to lower doses
    generally does not cause liver damage at intakes up to 10 mg/day in healthy adults.
    The Tolerable Upper Intake Level (UL) for adults is 10 mg/day. Individuals with
    Wilson disease or other genetic disorders of copper metabolism may experience
    toxicity at significantly lower intake levels.
  adverse_effects:
    - name: Liver damage
      description: |
        Severe copper toxicity can cause liver damage. Wilson disease causes toxic
        copper accumulation initially in the liver.
      severity: severe
  mic_references:
    - 24
    - 171
    - 172
    - 173
    - 174

