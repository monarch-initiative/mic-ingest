drug_interactions:
  - name: Acetaminophen and Molybdenum
    description: |
      High doses of molybdenum have been found to inhibit the metabolism of
      acetaminophen in rats; however, it is not known whether this occurs at
      clinically relevant doses in humans.
    drug_term:
      preferred_term: acetaminophen
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: THEORETICAL
    mic_references:
      - 64

nutrient_interactions:
  - name: Copper and Molybdenum
    description: |
      An early study reported that molybdenum intakes of 500-1,500 mcg/day increased
      urinary copper excretion. However, a more recent controlled study found that
      very high dietary molybdenum intakes (up to 1,500 mcg/day) did not adversely
      affect copper nutritional status. In ruminants, the interaction of molybdenum
      with sulfur forms thiomolybdates that can complex with copper and cause fatal
      copper deficiency.
    nutrient_term:
      preferred_term: copper
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 2
      - 15

disease_associations:
  - name: Esophageal Cancer
    description: |
      The soil in regions with high esophageal cancer incidence (e.g., Linxian, China)
      is low in molybdenum. Studies show hair and nail molybdenum content is lower in
      inhabitants of high-risk regions. However, a placebo-controlled trial found that
      supplementation with molybdenum and vitamin C did not decrease esophageal cancer
      incidence or mortality.
    disease_term:
      preferred_term: esophageal cancer
      term:
        id: MONDO:0007576
        label: esophageal cancer
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Populations in molybdenum-deficient soil regions; evidence mixed
    evidence:
      - reference: PMID:18588371
        supports: SUPPORT
        snippet: "Both molybdenum and Zinc were significantly (P<0.01) lower in the Sari control group (molybdenum: 0.472 ppm, zinc: 173.0 ppm) compared with the Tehran control group (molybdenum: 0.740 ppm, zinc: 251.5 ppm)."
        explanation: Case-control study showing significantly lower nail molybdenum content in a moderate-risk esophageal cancer region compared to a low-risk region, and even lower levels in cancer patients.
    mic_references:
      - 50
      - 51
      - 52
      - 53
      - 54

recommendations:
  rda:
    - population: Infants 0-6 months
      amount: "2 mcg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "3 mcg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-3 years
      amount: "17 mcg/day"
      source: Institute of Medicine
    - population: Children 4-8 years
      amount: "22 mcg/day"
      source: Institute of Medicine
    - population: Children 9-13 years
      amount: "34 mcg/day"
      source: Institute of Medicine
    - population: Adolescents 14-18 years
      amount: "43 mcg/day"
      source: Institute of Medicine
    - population: Adults 19+ years
      amount: "45 mcg/day"
      source: Institute of Medicine
    - population: Pregnancy
      amount: "50 mcg/day"
      source: Institute of Medicine
    - population: Breastfeeding
      amount: "50 mcg/day"
      source: Institute of Medicine
  notes: |
    Usual molybdenum intakes are well above the RDA. The Total Diet Study indicates
    dietary intake averages 76 mcg/day for women and 109 mcg/day for men. The
    Tolerable Upper Intake Level (UL) for adults is 2,000 mcg/day (2 mg/day).
    Because molybdenum content of plants depends on soil content and environmental
    conditions, the molybdenum content of foods can vary considerably.

bioavailability:
  description: |
    The biological form of molybdenum is the molybdenum cofactor (Moco), which is
    present in the active site of molybdoenzymes. Moco is synthesized de novo by
    a multistep metabolic pathway. The molybdenum content of foods depends on soil
    molybdenum content and can vary considerably.
  mic_references:
    - 2
    - 51
    - 57

references:
  - reference: PMID:21031595
    title: "Molybdenum cofactor deficiency: Mutations in GPHN, MOCS1, and MOCS2"
    findings:
      - statement: MoCo deficiency mutations cause progressive neurological damage
        supporting_text: "Mutations in the genes encoding the biosynthetic MoCo pathway enzymes abrogate the activities of all molybdoenzymes and result in the \"combined\" form of MoCo deficiency"
  - reference: PMID:18588371
    title: "Nail molybdenum and zinc contents in populations with low and moderate incidence of esophageal cancer"
    findings:
      - statement: Lower molybdenum levels found in populations at higher risk for esophageal cancer
        supporting_text: "Both molybdenum and Zinc were significantly (P<0.01) lower in the Sari control group (molybdenum: 0.472 ppm, zinc: 173.0 ppm) compared with the Tehran control group (molybdenum: 0.740 ppm, zinc: 251.5 ppm)."

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Molybdenum. Molybdenum deficiency is extremely rare
  but inherited molybdenum cofactor deficiency causes severe disease. The MIC
  reference numbers (mic_references) correspond to the numbered citations on
  the source page. The page contains approximately 65 references.
