name: Molybdenum
nutrient_term:
  preferred_term: molybdenum
  term:
    id: CHEBI:28685
    label: molybdenum atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/molybdenum
alternate_names:
  - Mo
description: |
  Molybdenum is a trace mineral that functions as part of the molybdenum cofactor
  in the active site of four enzymes in humans: sulfite oxidase, xanthine oxidase,
  aldehyde oxidase, and mitochondrial amidoxime reducing component. Of these,
  sulfite oxidase is crucial for human health. Molybdenum deficiency is extremely
  rare in healthy individuals, but inherited molybdenum cofactor deficiency causes
  severe neurological dysfunction. The toxicity of molybdenum compounds is relatively
  low in humans.

functions:
  - name: Sulfite Oxidase Activity
    description: |
      Sulfite oxidase catalyzes the transformation of sulfite to sulfate, a reaction
      necessary for the metabolism of sulfur-containing amino acids (methionine and
      cysteine). Sulfite oxidase is crucial for human health. Recent evidence also
      indicates a role in the reduction of nitrite to nitric oxide.
    biological_processes:
      - preferred_term: sulfite oxidation
        term:
          id: GO:0019418
          label: sulfide oxidation
    mic_references:
      - 3
      - 4
      - 12

  - name: Xanthine Oxidase Activity
    description: |
      Xanthine oxidase catalyzes the breakdown of nucleotides (precursors to DNA
      and RNA) to form uric acid, which contributes to the plasma antioxidant
      capacity of the blood. Xanthine oxidase also plays a role in the metabolism
      of drugs and toxins.
    biological_processes:
      - preferred_term: purine catabolism
        term:
          id: GO:0006145
          label: purine nucleobase catabolic process
    mic_references:
      - 3
      - 5

  - name: Aldehyde Oxidase Activity
    description: |
      Aldehyde oxidase catalyzes hydroxylation reactions involving a number of
      different molecules with similar chemical structures. It plays a role in
      the metabolism of drugs and toxins.
    biological_processes:
      - preferred_term: drug metabolism
        term:
          id: GO:0006805
          label: xenobiotic metabolic process
    mic_references:
      - 5

  - name: Mitochondrial Amidoxime Reducing Component
    description: |
      mARC forms a three-component enzyme system that catalyzes the detoxification
      of mutagenic N-hydroxylated bases. It reduces various N-hydroxylated compounds
      and plays an important role in prodrug metabolism. Recent studies have found
      a separate function: the reduction of nitrite to nitric oxide.
    mic_references:
      - 6
      - 7
      - 8
      - 9
      - 10
      - 11

deficiency:
  name: Molybdenum Deficiency
  description: |
    Acquired molybdenum deficiency is extremely rare. Only one documented case occurred
    in a patient with Crohn's disease on long-term total parenteral nutrition without
    molybdenum. The patient developed rapid heart and respiratory rates, headaches,
    night blindness, and ultimately became comatose. Symptoms resolved with molybdenum
    supplementation. Inherited molybdenum cofactor deficiency (MocoD) is a rare genetic
    disorder causing severe neurological dysfunction including cerebral atrophy, mental
    retardation, intractable seizures, and dislocation of ocular lenses.
  sequelae:
    - name: Seizures
      phenotype_term:
        preferred_term: seizures
        term:
          id: HP:0001250
          label: Seizure
      frequency: FREQUENT
      context: Intractable seizures in inherited molybdenum cofactor deficiency
      mic_references:
        - 28
      evidence:
        - reference: PMID:34870926
          supports: SUPPORT
          snippet: "Individuals with early-onset MoCD typically present in the first days of life with severe encephalopathy, including refractory seizures"
          explanation: GeneReviews entry on molybdenum cofactor deficiency confirms that refractory seizures are a hallmark feature of the early-onset form

    - name: Intellectual disability
      phenotype_term:
        preferred_term: intellectual disability
        term:
          id: HP:0001249
          label: Intellectual disability
      frequency: FREQUENT
      context: Mental retardation in inherited molybdenum cofactor deficiency
      mic_references:
        - 28
      evidence:
        - reference: PMID:34870926
          supports: SUPPORT
          snippet: "Standard treatment for seizures, developmental delay / intellectual disability, spasticity/dystonia, and ectopia lentis"
          explanation: GeneReviews entry on molybdenum cofactor deficiency identifies developmental delay/intellectual disability as a clinical feature requiring management

    - name: Lens dislocation
      phenotype_term:
        preferred_term: ectopia lentis
        term:
          id: HP:0001083
          label: Ectopia lentis
      frequency: FREQUENT
      context: Dislocation of ocular lenses in MocoD and ISOD
      mic_references:
        - 28
      evidence:
        - reference: PMID:34870926
          supports: SUPPORT
          snippet: "Standard treatment for seizures, developmental delay / intellectual disability, spasticity/dystonia, and ectopia lentis"
          explanation: GeneReviews entry on molybdenum cofactor deficiency identifies ectopia lentis (lens dislocation) as a clinical feature requiring management

  at_risk_groups:
    - name: Patients on total parenteral nutrition
      description: |
        Long-term TPN without molybdenum supplementation can lead to acquired deficiency
      mic_references:
        - 27

  mic_references:
    - 27
    - 28
    - 30
    - 31

toxicity:
  name: Molybdenum Toxicity
  description: |
    The toxicity of molybdenum compounds appears to be relatively low in humans.
    Increased serum concentrations of uric acid and ceruloplasmin have been reported
    in occupationally exposed workers. Gout-like symptoms have been reported in a
    population consuming 10-15 mg of molybdenum from food daily. One case of acute
    toxicity involved acute psychosis with hallucinations and seizures after taking
    300-800 mcg/day for 18 days. However, a controlled study found molybdenum intakes
    up to 1,490 mcg/day for 24 days did not cause serious adverse effects. The
    Tolerable Upper Intake Level (UL) for adults is 2,000 mcg/day (2 mg/day).
  adverse_effects:
    - name: Gout-like symptoms
      description: |
        High serum uric acid and gout-like symptoms reported with very high intake
        (10-15 mg/day from food)
      severity: mild
    - name: Neurological symptoms
      description: |
        One case report of acute psychosis with hallucinations and seizures after
        high-dose supplementation
      severity: moderate
  mic_references:
    - 2
    - 47
    - 61
    - 62
    - 63

