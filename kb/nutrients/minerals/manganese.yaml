  notes: |
    Manganese recommendations are expressed as Adequate Intake (AI) rather than RDA
    because there was insufficient information on manganese requirements. The AI values
    are based on average dietary intakes. The Tolerable Upper Intake Level (UL) for
    adults is 11 mg/day. US estimated average intakes range from 2.1-2.3 mg/day for
    men and 1.6-1.8 mg/day for women. Vegetarians may have intakes up to 7.0 mg/day.

bioavailability:
  description: |
    Manganese absorption can vary based on iron status and dietary factors. Foods high
    in phytic acid (beans, seeds, nuts, whole grains) or oxalic acid (cabbage, spinach,
    sweet potatoes) may slightly inhibit manganese absorption. Tannins in tea may
    moderately reduce absorption. Intakes of other minerals including iron, calcium,
    and phosphorus have been found to limit retention of manganese.
  mic_references:
    - 4
    - 18

references:
  - reference: PMID:29971528
    title: "Dietary manganese and type 2 diabetes mellitus: two prospective cohort studies in China"
    findings:
      - statement: Dietary manganese inversely associated with type 2 diabetes incidence
        supporting_text: "Dietary Mn was inversely associated with type 2 diabetes incidence and HbAlc concentration in both cohorts (ptrend < 0.01 and <0.01 for type 2 diabetes, and ptrend < 0.01 and =0.02 for HbAlc, respectively, in each cohort) independent of TAC"
  - reference: PMID:22341971
    title: "Mutations in SLC30A10 cause parkinsonism and dystonia with hypermanganesemia, polycythemia, and chronic liver disease"
    findings:
      - statement: SLC30A10 mutations cause manganese overload syndrome
        supporting_text: "SLC30A10 mutations cause a treatable recessive disease with pleomorphic phenotype, and provide compelling evidence that SLC30A10 plays a pivotal role in manganese transport."

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Manganese. Manganese is both nutritionally essential
  and potentially toxic. The MIC reference numbers (mic_references) correspond to
  the numbered citations on the source page. The page contains approximately 80
  references.
