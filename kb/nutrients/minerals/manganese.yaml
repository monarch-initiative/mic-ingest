drug_interactions:
  - name: Magnesium-Containing Antacids and Manganese
    description: |
      Magnesium-containing antacids and laxatives may decrease the absorption of
      manganese if taken together with manganese-containing foods or supplements.
    drug_term:
      preferred_term: magnesium antacid
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: LOW
    mic_references:
      - 53

  - name: Tetracycline and Manganese
    description: |
      The antibiotic medication tetracycline may decrease the absorption of manganese
      if taken together with manganese-containing foods or supplements.
    drug_term:
      preferred_term: tetracycline
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: LOW
    mic_references:
      - 53

nutrient_interactions:
  - name: Iron and Manganese
    description: |
      Iron and manganese share common absorption and transport proteins. Absorption
      of manganese from a meal decreases as the meal's iron content increases. Iron
      supplementation (60 mg/day for four months) has been associated with decreased
      blood manganese concentrations. Intestinal absorption of manganese is increased
      during iron deficiency and decreased when iron stores are elevated.
    nutrient_term:
      preferred_term: iron
    interaction_type: ANTAGONISTIC
    mic_references:
      - 7
      - 10
      - 11
      - 12

  - name: Calcium and Manganese
    description: |
      Calcium intake has been found to limit retention of manganese.
    nutrient_term:
      preferred_term: calcium
    interaction_type: ANTAGONISTIC
    mic_references:
      - 4

  - name: Magnesium and Manganese
    description: |
      Magnesium intake may affect manganese retention.
    nutrient_term:
      preferred_term: magnesium
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 4

disease_associations:
  - name: Type 2 Diabetes Mellitus
    description: |
      In animal models, manganese deficiency results in impaired insulin secretion
      and glucose intolerance similar to diabetes mellitus. Several prospective cohort
      studies have found higher dietary intakes of manganese to be associated with
      lower risk of type 2 diabetes. However, studies using blood or urinary manganese
      as biomarkers have reported mixed results. Although manganese appears to play
      a role in glucose metabolism, it is not clear whether higher manganese status
      improves glucose tolerance.
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Observational data; mechanism unclear
    evidence:
      - reference: PMID:29971528
        supports: SUPPORT
        snippet: "Dietary Mn was inversely associated with type 2 diabetes incidence and HbAlc concentration in both cohorts (ptrend < 0.01 and <0.01 for type 2 diabetes, and ptrend < 0.01 and =0.02 for HbAlc, respectively, in each cohort) independent of TAC"
        explanation: Two prospective cohort studies in Chinese adults (3,350 and 7,133 participants) demonstrating inverse association between dietary manganese and type 2 diabetes incidence, mediated by reduced oxidative stress.
    mic_references:
      - 30
      - 31
      - 32
      - 33

  - name: Manganese Overload Disorders
    description: |
      Autosomal recessive mutations in the SLC30A10 gene cause a manganese overload
      syndrome with hypermanganesemia, dystonia parkinsonism, and hepatic dysfunction.
      Mutations in SLC39A14 cause similar neurological phenotype without liver disease.
      Chelation therapy is important to treat these inherited disorders.
    disease_term:
      preferred_term: manganese overload
    relationship_type: MARKER
    population_context: Inherited disorders of manganese metabolism
    evidence:
      - reference: PMID:22341971
        supports: SUPPORT
        snippet: "SLC30A10 mutations cause a treatable recessive disease with pleomorphic phenotype, and provide compelling evidence that SLC30A10 plays a pivotal role in manganese transport."
        explanation: Identification of SLC30A10 mutations as the cause of a manganese overload syndrome with juvenile-onset dystonia, adult-onset parkinsonism, hypermanganesemia, and chronic liver disease.
    mic_references:
      - 56
      - 57
      - 58
      - 59

