name: Manganese
nutrient_term:
  preferred_term: manganese
  term:
    id: CHEBI:18291
    label: manganese atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/manganese
alternate_names:
  - Mn
description: |
  Manganese is a mineral element that is both nutritionally essential and potentially
  toxic. It plays an important role in a number of physiologic processes as a constituent
  of multiple enzymes and an activator of other enzymes. Manganese deficiency is rare in
  humans, and there is more concern for toxicity related to manganese overexposure,
  particularly from inhaled manganese in occupational settings.

functions:
  - name: Antioxidant Function
    description: |
      Manganese superoxide dismutase (MnSOD) is the principal antioxidant enzyme in
      the mitochondria. Because mitochondria consume over 90% of the oxygen used by
      cells, they are especially vulnerable to oxidative stress. MnSOD catalyzes the
      conversion of superoxide radicals to hydrogen peroxide, which can be reduced
      to water by other antioxidant enzymes.
    biological_processes:
      - preferred_term: response to oxidative stress
        term:
          id: GO:0006979
          label: response to oxidative stress
    mic_references:
      - 3

  - name: Metabolism
    description: |
      A number of manganese-activated enzymes play important roles in the metabolism
      of carbohydrates, amino acids, and cholesterol. Pyruvate carboxylase (manganese-
      containing) and phosphoenolpyruvate carboxykinase (manganese-activated) are
      critical in gluconeogenesis. Arginase, another manganese-containing enzyme, is
      required by the liver for the urea cycle. In the brain, glutamine synthetase
      converts the amino acid glutamate to glutamine.
    biological_processes:
      - preferred_term: gluconeogenesis
        term:
          id: GO:0006094
          label: gluconeogenesis
    mic_references:
      - 3
      - 4
      - 5
      - 6

  - name: Bone and Cartilage Formation
    description: |
      Manganese deficiency results in abnormal skeletal development in many animal
      species. Manganese is the preferred cofactor of enzymes called glycosyltransferases,
      which are required for the synthesis of proteoglycans needed for the formation
      of healthy cartilage and bone.
    biological_processes:
      - preferred_term: proteoglycan biosynthesis
        term:
          id: GO:0030166
          label: proteoglycan biosynthetic process
    mic_references:
      - 7

  - name: Wound Healing
    description: |
      Wound healing is a complex process that requires increased production of collagen.
      Manganese is required for the activation of prolidase, an enzyme that functions
      to provide the amino acid proline for collagen formation in human skin cells.
      Glycosaminoglycan synthesis, which requires manganese-activated glycosyltransferases,
      may also play an important role in wound healing.
    biological_processes:
      - preferred_term: wound healing
        term:
          id: GO:0042060
          label: wound healing
    mic_references:
      - 7
      - 8
      - 9

deficiency:
  name: Manganese Deficiency
  description: |
    Manganese deficiency is quite rare in humans. Signs of manganese deficiency vary
    among animal species and may include impaired growth, impaired reproductive function,
    skeletal abnormalities, impaired glucose tolerance, and altered carbohydrate and
    lipid metabolism. In humans, a child on long-term total parenteral nutrition lacking
    manganese developed bone demineralization and impaired growth that were corrected
    by manganese supplementation. Young men fed a low-manganese diet developed decreased
    serum cholesterol and transient skin rash. Young women fed a manganese-poor diet
    developed mildly abnormal glucose tolerance.
  phenotypes:
    - name: Impaired glucose tolerance
      phenotype_term:
        preferred_term: impaired glucose tolerance
        term:
          id: HP:0004904
          label: Maturity-onset diabetes of the young
      frequency: OCCASIONAL
      context: Observed in young women fed manganese-poor diet
      mic_references:
        - 19

    - name: Skeletal abnormalities
      phenotype_term:
        preferred_term: skeletal abnormalities
        term:
          id: HP:0000924
          label: Abnormality of the skeletal system
      frequency: OCCASIONAL
      context: Bone demineralization observed in TPN patient lacking manganese
      mic_references:
        - 23

  at_risk_groups:
    - name: Patients on total parenteral nutrition
      description: |
        Long-term TPN lacking manganese can lead to bone demineralization and
        impaired growth
      mic_references:
        - 23

  mic_references:
    - 2
    - 7
    - 19
    - 23
    - 24

toxicity:
  name: Manganese Toxicity
  description: |
    Manganese toxicity may result in multiple neurologic problems and is a well-recognized
    health hazard for people who inhale manganese dust (welders, miners, smelters).
    Unlike ingested manganese, inhaled manganese is transported directly to the brain
    before it can be metabolized in the liver. In its worst form, manganese toxicity can
    result in a permanent neurological disorder with symptoms similar to Parkinson's
    disease (manganism), including tremors, difficulty walking, and facial muscle spasms.
    This syndrome is sometimes preceded by psychiatric symptoms. Limited evidence suggests
    high manganese in drinking water may also be associated with neurological symptoms.
    The Tolerable Upper Intake Level (UL) for adults is 11 mg/day. Manganese toxicity
    from food alone has not been reported in humans.
  adverse_effects:
    - name: Manganism
      description: |
        Permanent neurological disorder with Parkinson-like symptoms including tremors,
        difficulty walking, facial muscle spasms; associated with inhaled manganese
      severity: severe
    - name: Psychiatric symptoms
      description: |
        Irritability, aggressiveness, hallucinations may precede neurological symptoms
      severity: moderate
    - name: Respiratory effects
      description: |
        Inhalation can cause inflammatory response in lungs, cough, acute bronchitis,
        and decreased lung function
      severity: moderate
  mic_references:
    - 1
    - 4
    - 60
    - 61
    - 62
    - 63
    - 64
    - 65

