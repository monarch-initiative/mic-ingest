name: Sodium
nutrient_term:
  preferred_term: sodium
  term:
    id: CHEBI:26708
    label: sodium atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/sodium
alternate_names:
  - Na
  - Salt (as sodium chloride)
description: |
  Sodium and chloride are the principal ions in the extracellular fluid and work together
  to control extracellular volume and blood pressure. Sodium is a nutrient of public
  health concern for overconsumption in the US, as excess dietary sodium is a major
  contributor to hypertension, which is a leading preventable risk factor for cardiovascular
  disease. Most sodium in the diet comes from processed foods rather than added at the
  table. The National Academy of Medicine established a chronic disease risk reduction
  intake (CDRR) of 2.3 g/day for adults.

functions:
  - name: Membrane Potential Maintenance
    description: |
      Sodium is the principal cation in extracellular fluid, while potassium is the
      principal cation inside cells. The concentration differences create an electrochemical
      gradient known as the membrane potential, maintained by Na+/K+ ATPase pumps. This
      activity accounts for 20-40% of resting energy expenditure and is critical for
      nerve impulse transmission, muscle contraction, and cardiac function.
    biological_processes:
      - preferred_term: ion transport
        term:
          id: GO:0006811
          label: monoatomic ion transport
    mic_references:
      - 2
      - 3
      - 4

  - name: Blood Volume and Pressure Maintenance
    description: |
      Sodium and chloride work together to control extracellular volume and blood pressure.
      Various mechanisms act on the kidney to ensure that the amount of sodium excreted
      compensates for the amount consumed, thereby maintaining sodium homeostasis.
    biological_processes:
      - preferred_term: blood pressure regulation
        term:
          id: GO:0008217
          label: regulation of blood pressure
    mic_references:
      - 1

  - name: Nutrient Absorption and Transport
    description: |
      Sodium is involved in the absorption of chloride, amino acids, glucose, and water.
      Similar mechanisms are involved in the reabsorption of these nutrients after
      filtration from blood by the kidneys.
    mic_references:
      - 1

deficiency:
  name: Sodium Deficiency (Hyponatremia)
  phenotype_term:
    preferred_term: Hyponatremia
    term:
      id: HP:0002902
      label: Hyponatremia
  description: |
    Hyponatremia (serum sodium <136 mmol/L) may result from increased fluid retention
    or increased sodium loss. Inadequate sodium intake alone rarely causes hyponatremia
    because kidneys increase water excretion to maintain electrolyte balance. Hyponatremia
    is common among older adults and in those with hypertension, kidney disease, and
    heart disease. Up to 30% of hospitalized patients have hyponatremia. Acute severe
    hyponatremia can cause brain edema, seizures, coma, and death. Mild chronic
    hyponatremia has been associated with attention deficits, gait instability, falls,
    bone loss, fractures, and increased cardiovascular mortality.
  sequelae:
    - name: Cerebral edema
      phenotype_term:
        preferred_term: cerebral edema
        term:
          id: HP:0002181
          label: Cerebral edema
      frequency: OCCASIONAL
      context: Severe and rapidly developing hyponatremia
      mic_references:
        - 13
      evidence:
        - reference: PMID:32097927
          supports: SUPPORT
          snippet: "In hypotonic hyponatremia, which is the most common form of hyponatremia, clinical manifestations are largely due to brain swelling caused by entry of water into the cells"
          explanation: Review of hyponatremia morbidity and mortality establishing that brain swelling (cerebral edema) is the principal mechanism of clinical manifestations in hyponatremia.

    - name: Seizures
      phenotype_term:
        preferred_term: seizures
        term:
          id: HP:0001250
          label: Seizure
      frequency: OCCASIONAL
      context: Severe hyponatremia
      mic_references:
        - 13
      evidence:
        - reference: PMID:32097927
          supports: SUPPORT
          snippet: "In acute and severe hyponatremia, dramatic symptoms, such as seizures, acute psychosis, permanent brain damage, brain-stem herniation, leading to coma and death may occur"
          explanation: Review of hyponatremia morbidity establishing seizures as a dramatic symptom of acute severe hyponatremia.

    - name: Muscle cramps
      phenotype_term:
        preferred_term: muscle cramps
        term:
          id: HP:0003394
          label: Muscle spasm
      frequency: FREQUENT
      context: Symptoms of hyponatremia
      mic_references:
        - 13
      evidence:
        - reference: PMID:32097927
          supports: SUPPORT
          snippet: "In chronic hyponatremia, symptoms are generally less dramatic and may include headache, nausea, vomiting, gait alterations, muscle cramps, restlessness, and disorientation"
          explanation: Review of hyponatremia morbidity establishing muscle cramps as a recognized clinical symptom of chronic hyponatremia.

  at_risk_groups:
    - name: Older adults
      description: |
        Prevalence of hyponatremia is 3.1% in those aged 65-84 years
      mic_references:
        - 10

    - name: Hospitalized patients
      description: |
        15-30% have mild hyponatremia, up to 7% have moderate-to-severe
      mic_references:
        - 11

    - name: Individuals with chronic diseases
      description: |
        Higher prevalence in those with hypertension, diabetes, coronary heart disease,
        stroke, COPD, cancer, and psychiatric disorders
      mic_references:
        - 10

  mic_references:
    - 10
    - 11
    - 13

toxicity:
  name: Sodium Toxicity (Hypernatremia)
  description: |
    Excessive sodium chloride intake leads to increased extracellular fluid volume as
    water is pulled from cells. Normally functioning kidneys can excrete excess sodium.
    Hypernatremia (serum sodium >145 mmol/L) is much less common than hyponatremia and
    is rarely caused by excessive sodium intake, but rather by excess water loss or
    reduced water intake. Symptoms include dizziness, low blood pressure, diminished
    urine production. Severe hypernatremia may cause altered mental status, seizures,
    and coma. No Tolerable Upper Intake Level (UL) has been established due to
    insufficient evidence of toxicological adverse effects.
  adverse_effects:
    - name: Hypertension
      description: |
        Excess dietary sodium is a major contributor to hypertension, affecting about
        one-third of US adults
      severity: moderate
    - name: Hypernatremia symptoms
      description: |
        Severe hypernatremia (>158 mmol/L) may cause altered mental status, seizures,
        coma, and intracranial hemorrhage
      severity: severe
  mic_references:
    - 25
    - 26

