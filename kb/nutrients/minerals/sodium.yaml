drug_interactions: []

nutrient_interactions:
  - name: Potassium and Sodium
    description: |
      Sodium and potassium have opposing effects on blood pressure. Modern diets high
      in sodium and low in potassium contribute to the high prevalence of hypertension.
      Increasing potassium intake while reducing sodium intake can help lower blood
      pressure.
    nutrient_term:
      preferred_term: potassium
    interaction_type: ANTAGONISTIC
    mic_references:
      - 1

  - name: Calcium and Sodium
    description: |
      High sodium intake increases urinary calcium excretion. Elevated sodium intake
      may be detrimental to bone health through increased calcium losses.
    nutrient_term:
      preferred_term: calcium
    interaction_type: INCREASES_EXCRETION
    mic_references:
      - 1

disease_associations:
  - name: Hypertension
    description: |
      About one-third of US adults have hypertension (blood pressure ≥140/90 mm Hg).
      Salt intake has been significantly correlated with left ventricular hypertrophy.
      Observational studies like INTERSALT have associated excess sodium intake with
      progressive increase in blood pressure with age. Clinical trials (TONE, TOHP,
      DASH-sodium) have demonstrated that dietary sodium reduction can effectively
      prevent or improve hypertension. About 26% of normotensive and 51% of hypertensive
      individuals are salt sensitive.
    disease_term:
      preferred_term: hypertension
      term:
        id: MONDO:0001134
        label: essential hypertension
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: General population, especially salt-sensitive individuals
    evidence:
      - reference: PMID:20226955
        supports: SUPPORT
        snippet: "There is overwhelming evidence that dietary salt is the major cause of raised blood pressure and that a reduction in salt intake lowers blood pressure, thereby, reducing blood pressure-related diseases"
        explanation: Comprehensive review confirming causal relationship between dietary salt and hypertension.
    mic_references:
      - 27
      - 28
      - 29
      - 30
      - 31
      - 35

  - name: Cardiovascular Disease
    description: |
      Chronic hypertension damages the heart, blood vessels, and kidneys, increasing
      the risk of heart disease, stroke, and hypertensive kidney disease. Salt
      sensitivity is an independent risk factor for cardiovascular disease. Mild
      chronic hyponatremia has been associated with increased cardiovascular morbidity
      and mortality.
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disorder
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Those with excess sodium intake or salt sensitivity
    evidence:
      - reference: PMID:26298426
        supports: SUPPORT
        snippet: "Mild hyponatremia even within the normal sodium range and hypernatremia are both associated with increased total mortality and major CVD events in older men without CVD which is not explained by known adverse CV risk factors"
        explanation: Prospective cohort study demonstrating a U-shaped relationship between serum sodium and cardiovascular events.
    mic_references:
      - 16
      - 38

  - name: Gastric Cancer
    description: |
      Excessive sodium intake has been linked to increased risk of gastric cancer.
    disease_term:
      preferred_term: gastric cancer
      term:
        id: MONDO:0001056
        label: gastric cancer
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Populations with high salt intake
    mic_references:
      - 1

  - name: Osteoporosis
    description: |
      High sodium intake increases urinary calcium excretion, which may be detrimental
      to bone health.
    disease_term:
      preferred_term: osteoporosis
      term:
        id: MONDO:0005298
        label: osteoporosis
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Through increased calcium losses
    mic_references:
      - 1

  - name: Kidney Stones
    description: |
      High sodium intake has been linked to increased risk of kidney stone formation.
    disease_term:
      preferred_term: kidney stones
      term:
        id: MONDO:0008171
        label: nephrolithiasis
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Through increased urinary calcium excretion
    mic_references:
      - 1

recommendations:
  rda:
    - population: Infants 0-6 months
      amount: "110 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "370 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-3 years
      amount: "800 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI); CDRR is 1,200 mg/day
    - population: Children 4-8 years
      amount: "1,000 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI); CDRR is 1,500 mg/day
    - population: Children 9-13 years
      amount: "1,200 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI); CDRR is 1,800 mg/day
    - population: Adolescents 14-18 years
      amount: "1,500 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI); CDRR is 2,300 mg/day
    - population: Adults 19+ years
      amount: "1,500 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI); CDRR is 2,300 mg/day
    - population: Pregnancy
      amount: "1,500 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI)
    - population: Breastfeeding
      amount: "1,500 mg/day"
      source: National Academy of Medicine
      notes: Adequate Intake (AI)
  notes: |
    The AI for sodium is 1.5 g/day for adults, equivalent to 3.8 g/day of sodium chloride
    (salt). The Chronic Disease Risk Reduction Intake (CDRR) is 2.3 g/day for adults,
    meaning intakes should be reduced to at least this level to lower chronic disease risk.
    No Tolerable Upper Intake Level (UL) was established. Current US adult intakes average
    3.8 g/day for men and 3.1 g/day for women, well above the CDRR. Sodium is identified
    as a nutrient of public health concern for overconsumption.

bioavailability:
  description: |
    Sodium is efficiently absorbed from the gastrointestinal tract. About 75% of dietary
    sodium comes from salt added during food processing, rather than salt added at the
    table or during cooking. The kidneys regulate sodium balance by adjusting urinary
    excretion based on intake.
  mic_references:
    - 21
    - 22

references:
  - reference: PMID:20226955
    title: "Reducing population salt intake worldwide: from evidence to implementation"
  - reference: PMID:26298426
    title: "Mild hyponatremia, hypernatremia and incident cardiovascular disease and mortality in older men"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Sodium. Sodium is a nutrient of public health concern
  due to overconsumption and its role in hypertension and cardiovascular disease.
  The MIC reference numbers (mic_references) correspond to the numbered citations
  on the source page. The page contains approximately 95 references.
