drug_interactions:
  - name: Amiodarone and Iodine
    description: |
      Amiodarone is an iodine-rich antiarrhythmic drug that can cause thyroid
      dysfunction (both hypo- and hyperthyroidism) due to its high iodine content.
    drug_term:
      preferred_term: amiodarone
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: HIGH
    mic_references:
      - 53

  - name: Lithium and Iodine
    description: |
      Lithium can inhibit thyroid hormone release. Combined with iodine excess,
      it may increase the risk of hypothyroidism.
    drug_term:
      preferred_term: lithium
    interaction_type: SYNERGISTIC
    clinical_significance: MODERATE
    mic_references:
      - 54

nutrient_interactions:
  - name: Selenium and Iodine
    description: |
      Selenium is required for the activity of deiodinases that convert T4 to active
      T3, and for glutathione peroxidases that protect the thyroid from oxidative
      damage. Combined deficiency of iodine and selenium may worsen thyroid function
      more than iodine deficiency alone.
    nutrient_term:
      preferred_term: selenium
    interaction_type: SYNERGISTIC
    mic_references:
      - 49
      - 50

  - name: Goitrogens and Iodine
    description: |
      Goitrogens in cruciferous vegetables, soy, and cassava can interfere with
      thyroid hormone production, but this is only clinically significant in the
      context of iodine deficiency.
    nutrient_term:
      preferred_term: goitrogens
    interaction_type: ANTAGONISTIC
    mic_references:
      - 51
      - 52

disease_associations:
  - name: Thyroid Cancer Prevention
    description: |
      Thyroid accumulation of radioactive iodine (I-131) increases thyroid cancer
      risk, especially in children. In radiation emergencies, potassium iodide
      can saturate the thyroid and reduce uptake of radioactive iodine.
    disease_term:
      preferred_term: thyroid cancer
      term:
        id: MONDO:0015075
        label: thyroid gland carcinoma
    relationship_type: PROTECTIVE
    population_context: In radiation emergencies; potassium iodide prophylaxis
    mic_references:
      - 30
      - 31

  - name: Cognitive Development
    description: |
      Adequate maternal iodine status during pregnancy and lactation is critical
      for fetal and infant brain development. Even mild-to-moderate iodine
      deficiency during pregnancy may impair offspring cognitive development.
    disease_term:
      preferred_term: developmental delay
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Pregnant and breastfeeding women; their offspring
    evidence:
      - reference: PMID:22742605
        supports: SUPPORT
        snippet: "Two meta-analyses have estimated that iodine-deficient populations experience a mean reduction in IQ of 12-13.5 points."
        explanation: Review establishing that iodine deficiency causes substantial cognitive impairment, with meta-analyses showing a 12-13.5 point IQ reduction in deficient populations.
    mic_references:
      - 11
      - 12
      - 13
      - 14

recommendations:
  rda:
    - population: Infants 0-6 months
      amount: "110 mcg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "130 mcg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-8 years
      amount: "90 mcg/day"
      source: Institute of Medicine
    - population: Children 9-13 years
      amount: "120 mcg/day"
      source: Institute of Medicine
    - population: Adolescents and Adults 14+ years
      amount: "150 mcg/day"
      source: Institute of Medicine
    - population: Pregnancy
      amount: "220 mcg/day"
      source: Institute of Medicine
    - population: Breastfeeding
      amount: "290 mcg/day"
      source: Institute of Medicine
  notes: |
    The Tolerable Upper Intake Level (UL) for adults is 1,100 mcg/day. The WHO,
    UNICEF, and Iodine Global Network recommend 250 mcg/day for pregnant and
    breastfeeding women. Iodized salt (1/4 teaspoon) provides approximately 71 mcg
    iodine. Seafood and dairy are also good sources.

bioavailability:
  description: |
    Iodine is efficiently absorbed from the gastrointestinal tract. The thyroid gland
    concentrates iodine from the blood via the sodium-iodide symporter. The thyroid
    of a healthy adult contains 70-80% of total body iodine (15-20 mg) and uses about
    80 mcg daily for hormone synthesis.
  mic_references:
    - 1

references:
  - reference: PMID:22742605
    title: "The effects of iodine deficiency in pregnancy and infancy"
    findings:
      - statement: Iodine deficiency causes substantial cognitive impairment
        supporting_text: "Two meta-analyses have estimated that iodine-deficient populations experience a mean reduction in IQ of 12-13.5 points."
  - reference: PMID:22378324
    title: "Global iodine status in 2011 and trends over the past decade"
    findings:
      - statement: Nearly one-third of school-age children globally have insufficient iodine intake
        supporting_text: "globally, 29.8% (95% CI = 29.4, 30.1) of SAC (241 million) are estimated to have insufficient iodine intakes."

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Iodine. Iodine deficiency remains a major global
  public health concern despite widespread salt iodization programs. The MIC
  reference numbers (mic_references) correspond to the numbered citations on
  the source page.
