name: Iodine
nutrient_term:
  preferred_term: iodide
  term:
    id: CHEBI:16382
    label: iodide
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/iodine
alternate_names:
  - I
  - Iodide
description: |
  Iodine is a key component of thyroid hormones (T3 and T4), which are required
  throughout life for normal growth, neurological development, and metabolism.
  Insufficient iodine intake impairs thyroid hormone production, leading to
  hypothyroidism. Iodine deficiency is recognized as the most common cause of
  preventable brain damage in the world. Major international efforts using iodized
  salt have dramatically improved iodine status globally, with an estimated 89%
  of households worldwide now having access to iodized salt.

functions:
  - name: Thyroid Hormone Synthesis
    description: |
      Iodine is an essential component of the thyroid hormones thyroxine (T4) and
      triiodothyronine (T3). The thyroid gland concentrates iodine from the blood
      and uses it to synthesize these hormones, which regulate metabolism, growth,
      and development throughout the body.
    biological_processes:
      - preferred_term: thyroid hormone generation
        term:
          id: GO:0006590
          label: thyroid hormone generation
    mic_references:
      - 1
      - 2
      - 3

deficiency:
  name: Iodine Deficiency
  description: |
    Iodine deficiency disorders include goiter (thyroid enlargement), hypothyroidism,
    intellectual impairment, and cretinism. Nearly 30% of the world's population has
    insufficient iodine intake. Iodine deficiency is the most common cause of
    preventable brain damage. Maternal iodine deficiency during pregnancy can result
    in miscarriage, preterm birth, and neurological impairments in offspring.
  sequelae:
    - name: Goiter
      phenotype_term:
        preferred_term: goiter
        term:
          id: HP:0000853
          label: Goiter
      frequency: FREQUENT
      context: Thyroid enlargement due to increased TSH stimulation
      mic_references:
        - 4

    - name: Hypothyroidism
      phenotype_term:
        preferred_term: hypothyroidism
        term:
          id: HP:0000821
          label: Hypothyroidism
      frequency: FREQUENT
      context: Result of impaired thyroid hormone synthesis
      mic_references:
        - 4
      evidence:
        - reference: PMID:22742605
          supports: SUPPORT
          snippet: "Iodine deficiency during pregnancy can cause maternal and fetal hypothyroidism and impair neurological development of the fetus."
          explanation: Authoritative review establishes iodine deficiency as a cause of hypothyroidism.

    - name: Intellectual disability
      phenotype_term:
        preferred_term: intellectual disability
        term:
          id: HP:0001249
          label: Intellectual disability
      frequency: OCCASIONAL
      context: Cretinism in severe deficiency during development
      mic_references:
        - 4
        - 11
      evidence:
        - reference: PMID:22742605
          supports: SUPPORT
          snippet: "The consequences depend upon the timing and severity of the hypothyroidism; the most severe manifestation is cretinism."
          explanation: Authoritative review identifies cretinism (a syndrome including intellectual disability) as the most severe manifestation of iodine deficiency-related hypothyroidism during development.
        - reference: PMID:22742605
          supports: SUPPORT
          snippet: "Two meta-analyses have estimated that iodine-deficient populations experience a mean reduction in IQ of 12-13.5 points."
          explanation: Meta-analytic evidence demonstrates iodine deficiency causes substantial reductions in IQ at the population level.

  at_risk_groups:
    - name: Pregnant women
      description: |
        Increased iodine requirements during pregnancy; fetus depends on maternal
        iodine for thyroid hormone synthesis
      mic_references:
        - 10
        - 22

    - name: Breastfeeding women
      description: |
        Infants rely entirely on iodine in breast milk for thyroid hormone production
      mic_references:
        - 10

    - name: People in iodine-deficient regions
      description: |
        Areas without iodized salt or with iodine-poor soil; about 30% of world
        population has insufficient intake
      mic_references:
        - 5
        - 9

  mic_references:
    - 4
    - 5
    - 6
    - 7

toxicity:
  name: Iodine Toxicity
  description: |
    In iodine-deficient populations, rapid increases in iodine intake may precipitate
    iodine-induced hyperthyroidism, especially in older people with multinodular goiter.
    In iodine-sufficient adults, long-term intake above the UL of 1,100 mcg/day may
    increase the risk of thyroid disorders including goiter and hypothyroidism. Most
    people tolerate excess iodine well due to thyroid autoregulation, but susceptible
    individuals may develop thyroid dysfunction.
  adverse_effects:
    - name: Iodine-induced hyperthyroidism
      description: |
        Can occur in iodine-deficient individuals suddenly exposed to high iodine;
        more common in elderly with nodular goiter
      severity: moderate
    - name: Iodine-induced hypothyroidism
      description: |
        Chronic high iodine intake can cause hypothyroidism in susceptible individuals,
        including those with autoimmune thyroid disease
      severity: moderate
  mic_references:
    - 55
    - 56
    - 57

