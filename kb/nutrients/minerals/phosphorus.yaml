name: Phosphorus
nutrient_term:
  preferred_term: phosphorus
  term:
    id: CHEBI:28659
    label: phosphorus atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/phosphorus
alternate_names:
  - P
  - Phosphate
description: |
  Phosphorus is an essential structural component of cell membranes and nucleic acids
  and is involved in several biological processes, including bone mineralization, energy
  production, cell signaling through phosphorylation reactions, and regulation of acid-base
  homeostasis. Dietary phosphorus deficiency is uncommon because phosphorus is widespread
  in food. High serum phosphorus concentrations have been associated with increased
  cardiovascular disease risk, particularly in individuals with kidney disease.

functions:
  - name: Bone Mineralization
    description: |
      Phosphorus is a major structural component of bone in the form of a calcium
      phosphate salt called hydroxyapatite. Along with calcium, phosphorus provides
      the structural framework of the skeleton.
    biological_processes:
      - preferred_term: bone mineralization
        term:
          id: GO:0030282
          label: bone mineralization
    mic_references:
      - 1

  - name: Energy Production and Storage
    description: |
      All energy production and storage are dependent on phosphorylated compounds,
      such as adenosine triphosphate (ATP) and creatine phosphate. Phosphorus-containing
      molecules are essential for capturing, storing, and transferring metabolic energy.
    biological_processes:
      - preferred_term: ATP metabolism
        term:
          id: GO:0046034
          label: ATP metabolic process
    mic_references:
      - 1

  - name: Cell Membrane Structure
    description: |
      Phospholipids (e.g., phosphatidylcholine) are major structural components of
      cell membranes. These phosphorus-containing molecules form the lipid bilayer
      that defines cell boundaries and organelles.
    biological_processes:
      - preferred_term: phospholipid biosynthesis
        term:
          id: GO:0008654
          label: phospholipid biosynthetic process
    mic_references:
      - 1

  - name: Nucleic Acid Structure
    description: |
      Nucleic acids (DNA and RNA), which are responsible for the storage and transmission
      of genetic information, are long chains of phosphate-containing molecules. The
      phosphate backbone is essential for nucleic acid structure and function.
    mic_references:
      - 1

  - name: Cell Signaling
    description: |
      A number of enzymes, hormones, and cell-signaling molecules depend on phosphorylation
      for their activation. Protein phosphorylation is a fundamental regulatory mechanism
      in cells.
    biological_processes:
      - preferred_term: protein phosphorylation
        term:
          id: GO:0006468
          label: protein phosphorylation
    mic_references:
      - 1

  - name: Oxygen Delivery Regulation
    description: |
      The phosphorus-containing molecule 2,3-diphosphoglycerate (2,3-DPG) binds to
      hemoglobin in red blood cells and regulates oxygen delivery to the tissues
      of the body.
    mic_references:
      - 1

deficiency:
  name: Phosphorus Deficiency
  description: |
    Inadequate phosphorus intake rarely results in abnormally low serum phosphorus
    levels (hypophosphatemia) because renal reabsorption of phosphorus increases to
    compensate for decreased intake. Dietary phosphorus deficiency is usually seen
    only in cases of near-total starvation. Effects of hypophosphatemia include loss
    of appetite, anemia, muscle weakness, bone pain, rickets (in children), osteomalacia
    (in adults), increased susceptibility to infection, numbness and tingling of
    extremities, difficulty walking, and respiratory failure. Severe hypophosphatemia
    may be life threatening.
  phenotypes:
    - name: Muscle weakness
      phenotype_term:
        preferred_term: muscle weakness
        term:
          id: HP:0001324
          label: Muscle weakness
      frequency: FREQUENT
      context: Moderate to severe hypophosphatemia
      mic_references:
        - 4

    - name: Rickets
      phenotype_term:
        preferred_term: rickets
        term:
          id: HP:0002748
          label: Rickets
      frequency: OCCASIONAL
      context: In children with phosphorus deficiency
      mic_references:
        - 4

    - name: Osteomalacia
      phenotype_term:
        preferred_term: osteomalacia
        term:
          id: HP:0002749
          label: Osteomalacia
      frequency: OCCASIONAL
      context: In adults with phosphorus deficiency
      mic_references:
        - 4

  at_risk_groups:
    - name: Patients with near-total starvation
      description: |
        Dietary phosphorus deficiency is usually seen only in cases of near-total
        starvation or anorexia
      mic_references:
        - 4

    - name: Recovering diabetic ketoacidosis patients
      description: |
        Diabetics recovering from an episode of diabetic ketoacidosis are at risk
      mic_references:
        - 4

    - name: Chronic alcoholics
      description: |
        Alcoholics are at risk for hypophosphatemia
      mic_references:
        - 4

    - name: Patients on refeeding regimens
      description: |
        Starving or anorexic patients on refeeding regimens that are high in calories
        but too low in phosphorus
      mic_references:
        - 4

    - name: Inherited phosphorus wasting disorders
      description: |
        Hypophosphatemia caused by inherited disorders of phosphorus homeostasis linked
        to elevated urinary excretion or impaired renal reabsorption
      mic_references:
        - 5

  mic_references:
    - 4
    - 5

toxicity:
  name: Phosphorus Toxicity
  description: |
    Hyperphosphatemia (elevated serum phosphorus) is most often associated with
    excretion failure in patients with chronic kidney disease. When kidney function
    is only 20% of normal, even normal phosphorus intakes may lead to hyperphosphatemia.
    High serum phosphorus concentrations have been associated with increased rates
    of cardiovascular disease and mortality in subjects with or without kidney disease.
    Abnormal deposition of calcium phosphate in soft tissues may predispose individuals
    to vascular dysfunction. The Tolerable Upper Intake Level (UL) for adults is
    4,000 mg/day, though daily intakes above the RDA have been linked to increased
    all-cause mortality risk.
  adverse_effects:
    - name: Vascular calcification
      description: |
        Abnormal deposition of calcium phosphate in soft tissues may predispose
        to vascular dysfunction and cardiovascular disease
      severity: moderate
    - name: Cardiovascular disease risk
      description: |
        High serum phosphorus within the normal range has been associated with
        increased cardiovascular disease risk
      severity: moderate
  mic_references:
    - 1
    - 9
    - 14
    - 15

