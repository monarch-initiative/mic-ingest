drug_interactions:
  - name: Aluminum-Containing Antacids and Phosphorus
    description: |
      Aluminum-containing antacids reduce the absorption of dietary phosphorus by
      forming aluminum phosphate, which is unabsorbable. When consumed in high doses,
      they can produce hypophosphatemia and aggravate phosphorus deficiency.
    drug_term:
      preferred_term: aluminum antacid
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 37

  - name: Potassium Supplements and Phosphorus
    description: |
      Potassium supplements or potassium-sparing diuretics taken together with
      phosphorus supplements may result in high blood levels of potassium
      (hyperkalemia), which can cause life-threatening heart rhythm abnormalities.
    drug_term:
      preferred_term: potassium supplement
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    mic_references:
      - 37

  - name: Vitamin D and Phosphorus
    description: |
      Excessively high doses of 1,25-dihydroxyvitamin D, the active form of vitamin D,
      or its analogs, may result in hyperphosphatemia.
    drug_term:
      preferred_term: vitamin D analog
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 6

nutrient_interactions:
  - name: Calcium and Phosphorus
    description: |
      A low calcium-to-phosphorus intake ratio may be detrimental to bone health.
      High serum phosphorus can impair synthesis of active vitamin D, reduce blood
      calcium, and lead to increased PTH release. When dietary calcium is adequate,
      phosphorus-rich diets do not appear to adversely affect bone.
    nutrient_term:
      preferred_term: calcium
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 8
      - 33
      - 34

disease_associations:
  - name: Cardiovascular Disease
    description: |
      High serum phosphorus within the normal range (2.5-4.5 mg/dL) has been associated
      with increased incidence of cardiovascular disease in individuals with normal
      kidney function. High-normal serum phosphorus (3.5 mg/dL or above) has been
      linked to greater cardiovascular risk, heart failure, and left ventricular
      hypertrophy. Vascular calcification is thought to contribute to this association.
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disease
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Both general population and those with kidney disease
    mic_references:
      - 16
      - 17
      - 19
      - 20
      - 21

  - name: Chronic Kidney Disease Progression
    description: |
      Serum phosphorus concentrations equal to or above 4 mg/dL were associated with
      doubling of risk of developing incident CKD and end-stage renal disease in
      individuals free of renal disease at study inception. Hyperphosphatemia is
      common in individuals with impaired kidney function.
    disease_term:
      preferred_term: chronic kidney disease
      term:
        id: MONDO:0005300
        label: chronic kidney disease
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: General population; accelerated progression in those with CKD
    mic_references:
      - 9
      - 15
      - 18
      - 23

  - name: Osteoporosis
    description: |
      A low calcium-to-phosphorus intake ratio may be detrimental to bone health,
      especially in women at increased risk for osteoporosis. Substitution of
      phosphate-containing soft drinks for milk and calcium-rich foods may represent
      a serious risk to bone health.
    disease_term:
      preferred_term: osteoporosis
      term:
        id: MONDO:0005298
        label: osteoporosis
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: When calcium-to-phosphorus ratio is low
    mic_references:
      - 33
      - 35
      - 36

