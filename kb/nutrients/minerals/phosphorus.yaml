    - population: Breastfeeding (18 and younger)
      amount: "1,250 mg/day"
      source: Institute of Medicine
    - population: Breastfeeding (19+)
      amount: "700 mg/day"
      source: Institute of Medicine
  notes: |
    The RDA for phosphorus is meant to sustain serum phosphorus concentrations within
    the physiologic range of 2.5 to 4.5 mg/dL. The Tolerable Upper Intake Level (UL)
    for adults is 4,000 mg/day. Average daily intakes in the US are 1,602 mg in men
    and 1,128 mg in women, well above the RDA. Dietary phosphorus from food additives
    is not always included in databases, so total intake may be underestimated by
    more than 20%.

bioavailability:
  description: |
    The bioavailability of phosphorus from food is usually very high, with the exception
    of phytate phosphorus in plant sources such as grains, legumes, and seeds, which
    is poorly digested. Phosphorus from animal sources is more bioavailable than from
    plant sources. Phosphorus from food additives is highly bioavailable.
  mic_references:
    - 7
    - 8

references: []

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Phosphorus. Phosphorus is found in most foods and
  deficiency is rare. High serum phosphorus is associated with cardiovascular
  disease risk. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. The page contains approximately 40
  references.
