name: Calcium
nutrient_term:
  preferred_term: calcium
  term:
    id: CHEBI:22984
    label: calcium atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/calcium
alternate_names:
  - Ca
description: |
  Calcium is the most abundant mineral in the body, with over 99% found in bones and teeth
  where it provides structural support. The remaining calcium is critical for vascular
  contraction and vasodilation, muscle function, nerve transmission, intracellular signaling,
  and hormonal secretion. Blood calcium levels are tightly regulated by parathyroid hormone
  (PTH) and vitamin D, with the skeleton serving as a calcium reservoir. Adequate calcium
  intake throughout life is essential for maintaining bone health and preventing osteoporosis.

functions:
  - name: Structural Component of Bone and Teeth
    description: |
      Calcium is a major structural element in bones and teeth. The mineral component of bone
      consists mainly of hydroxyapatite crystals [Ca10(PO4)6(OH)2], which contain large amounts
      of calcium, phosphorus, and oxygen. Bone is a dynamic tissue that is remodeled throughout
      life. Osteoclasts begin the process of remodeling by dissolving or resorbing bone, then
      osteoblasts synthesize new bone to replace the bone that was resorbed.
    biological_processes:
      - preferred_term: bone mineralization
        term:
          id: GO:0030282
          label: bone mineralization
    mic_references:
      - 1
    evidence:
      - reference: PMID:22609892
        supports: SUPPORT
        snippet: "Calcium intake influences skeletal calcium retention during growth and thus affects peak bone mass achieved in early adulthood"
        explanation: Confirms calcium's role in bone structure and development

  - name: Calcium Homeostasis
    description: |
      Calcium concentrations in blood and extracellular fluid are tightly controlled to preserve
      normal physiological function. A drop in blood calcium is sensed by the parathyroid glands,
      resulting in increased PTH secretion. PTH stimulates vitamin D activation in kidneys,
      decreases urinary calcium excretion, and stimulates bone resorption to release calcium.
      When calcium rises, calcitonin inhibits PTH and bone resorption while increasing urinary
      calcium excretion.
    biological_processes:
      - preferred_term: calcium ion homeostasis
        term:
          id: GO:0055074
          label: calcium ion homeostasis
    mic_references:
      - 1
      - 2

  - name: Cell Signaling
    description: |
      Calcium plays a role in mediating vasoconstriction and vasodilation, nerve impulse
      transmission, muscle contraction, and hormonal secretion. Excitable cells contain
      voltage-dependent calcium channels that allow rapid changes in calcium concentrations.
      The binding of calcium to proteins like troponin-c initiates muscle contraction, while
      calcium binding to calmodulin activates enzymes that provide energy for contraction.
    biological_processes:
      - preferred_term: signal transduction
        term:
          id: GO:0007165
          label: signal transduction
      - preferred_term: muscle contraction
        term:
          id: GO:0006936
          label: muscle contraction
    mic_references:
      - 1
      - 3
    evidence:
      - reference: PMID:18083096
        supports: SUPPORT
        snippet: "Calcium ions (Ca(2+)) impact nearly every aspect of cellular life"
        explanation: Confirms calcium's broad role in cellular signaling and function

deficiency:
  name: Calcium Deficiency
  description: |
    Low blood calcium (hypocalcemia) usually implies abnormal parathyroid function since the
    skeleton provides a large calcium reserve for maintaining normal blood levels. Other causes
    include chronic kidney failure, vitamin D deficiency, and low blood magnesium levels.
    Chronically low calcium intakes in growing individuals may prevent optimal peak bone mass
    attainment. Inadequate calcium intake may contribute to accelerated bone loss and
    development of osteoporosis.
  phenotypes:
    - name: Hypocalcemia
      phenotype_term:
        preferred_term: hypocalcemia
        term:
          id: HP:0002901
          label: Hypocalcemia
      frequency: FREQUENT
      context: Usually due to abnormal parathyroid function rather than dietary deficiency
      mic_references:
        - 1

    - name: Osteoporosis
      phenotype_term:
        preferred_term: osteoporosis
        term:
          id: HP:0000939
          label: Osteoporosis
      frequency: FREQUENT
      context: Long-term consequence of chronically inadequate calcium intake
      mic_references:
        - 1

  at_risk_groups:
    - name: Postmenopausal women
      description: |
        Estrogen withdrawal significantly impairs intestinal absorption and renal reabsorption
        of calcium, increasing calcium requirements
      mic_references:
        - 28

    - name: Individuals with vitamin D deficiency
      description: Vitamin D is essential for calcium absorption
      mic_references:
        - 1

    - name: People with lactose intolerance
      description: May avoid dairy products which are primary dietary calcium sources
      mic_references:
        - 121

    - name: Adolescents
      description: |
        Tend to replace milk with soft drinks during the critical period for peak bone mass
        development
      mic_references:
        - 122

  mic_references:
    - 1

toxicity:
  name: Calcium Toxicity
  description: |
    Hypercalcemia is usually due to malignancy or primary hyperparathyroidism, not excessive
    dietary intake. However, consumption of large quantities of calcium supplements with
    antacids can cause calcium-alkali syndrome (formerly milk-alkali syndrome). Those at
    greater risk include postmenopausal women, pregnant women, transplant recipients, and
    patients on dialysis. Calcium supplementation (0.6-2 g/day) has been associated with
    gastrointestinal side effects like constipation, cramping, bloating, and diarrhea.

    Tolerable Upper Intake Level (UL): 2,500 mg/day for adults 19-50 years; 2,000 mg/day
    for adults 51+ years.
  adverse_effects:
    - name: Calcium-alkali syndrome
      description: |
        Hypercalcemia associated with consumption of large amounts of calcium supplements
        and absorbable alkali. May result in loss of appetite, nausea, vomiting, constipation,
        abdominal pain, fatigue, frequent urination, and hypertension. Severe cases can
        result in confusion, delirium, coma, and death if untreated.
      severity: severe
  mic_references:
    - 9
    - 132
    - 133
    - 134

