drug_interactions:
  - name: Thiazide Diuretics and Calcium
    description: |
      Taking calcium supplements with thiazide diuretics increases the risk of developing
      hypercalcemia due to increased reabsorption of calcium in the kidneys.
    drug_term:
      preferred_term: thiazide diuretic
    interaction_type: REDUCES_EXCRETION
    clinical_significance: HIGH
    mic_references:
      - 172

  - name: Digoxin and Calcium
    description: |
      High doses of supplemental calcium could increase the likelihood of abnormal heart
      rhythms in people taking digoxin for heart failure.
    drug_term:
      preferred_term: digoxin
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    mic_references:
      - 172

  - name: Tetracycline and Calcium
    description: |
      Calcium may decrease the absorption of tetracycline antibiotics. Doses should be
      separated by two hours before calcium or four-to-six hours after calcium.
    drug_term:
      preferred_term: tetracycline
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 175

  - name: Bisphosphonates and Calcium
    description: |
      Calcium may decrease the absorption of bisphosphonates. Doses should be separated
      by two hours before calcium or four-to-six hours after calcium.
    drug_term:
      preferred_term: bisphosphonate
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 175

  - name: Levothyroxine and Calcium
    description: |
      Calcium may decrease the absorption of levothyroxine. Doses should be separated
      by two hours before calcium or four-to-six hours after calcium.
    drug_term:
      preferred_term: levothyroxine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 175

  - name: Proton Pump Inhibitors and Calcium
    description: |
      H2 blockers and proton-pump inhibitors may decrease the absorption of calcium
      carbonate and calcium phosphate.
    drug_term:
      preferred_term: proton pump inhibitor
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 176
      - 177

nutrient_interactions:
  - name: Vitamin D and Calcium
    description: |
      The active form of vitamin D (1,25-dihydroxyvitamin D) stimulates calcium absorption
      by promoting the synthesis of calcium-binding proteins in the intestine. Vitamin D
      insufficiency can lead to secondary hyperparathyroidism and increased osteoporosis risk.
    nutrient_term:
      preferred_term: vitamin D
    interaction_type: INCREASES_ABSORPTION
    mic_references:
      - 9
      - 36
      - 37

  - name: Sodium and Calcium
    description: |
      High sodium intake increases urinary calcium excretion. Each 2.3 g increment of sodium
      excreted by the kidneys draws about 24-40 mg of calcium into the urine. This may
      contribute to bone loss over time.
    nutrient_term:
      preferred_term: sodium
    interaction_type: INCREASES_EXCRETION
    mic_references:
      - 4
      - 5
      - 6

  - name: Protein and Calcium
    description: |
      Higher protein diets are associated with increased urinary calcium. However, high
      protein intake also increases intestinal calcium absorption, and meta-analyses suggest
      dietary protein may have a modest benefit for bone health.
    nutrient_term:
      preferred_term: protein
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 10
      - 11
      - 12
      - 13
      - 14

  - name: Phosphorus and Calcium
    description: |
      Low calcium:phosphorus dietary ratios may adversely affect calcium metabolism and
      bone health. Low calcium intake combined with high phosphorus intake can increase
      serum PTH concentrations.
    nutrient_term:
      preferred_term: phosphorus
    interaction_type: ANTAGONISTIC
    mic_references:
      - 15
      - 16
      - 17
      - 18

  - name: Oxalate and Calcium
    description: |
      Oxalic acid is a potent inhibitor of calcium absorption and is found at high
      concentrations in spinach and rhubarb. However, adequate calcium intake reduces
      absorption of dietary oxalate, potentially lowering kidney stone risk.
    nutrient_term:
      preferred_term: oxalate
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 51
      - 52
      - 123

  - name: Magnesium and Calcium
    description: |
      Magnesium deficiency can impair PTH secretion and lower the responsiveness of
      osteoclasts to PTH. Magnesium supplementation may be required to correct hypocalcemia
      in people with low serum magnesium concentrations.
    nutrient_term:
      preferred_term: magnesium
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 1

disease_associations:
  - name: Osteoporosis Prevention
    description: |
      Osteoporosis is a skeletal disorder in which bone mass and strength are compromised,
      resulting in increased fracture risk. Calcium and vitamin D supplementation can reduce
      bone loss and fracture risk, particularly in institutionalized older adults. The
      National Osteoporosis Foundation advises adequate intake of calcium (1,000-1,200 mg/day)
      and vitamin D (800-1,000 IU/day) for middle-aged and older adults.
    disease_term:
      preferred_term: osteoporosis
      term:
        id: MONDO:0005298
        label: osteoporosis
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Postmenopausal women and men over 50
    mic_references:
      - 23
      - 24
      - 25
      - 26
      - 31
      - 32
      - 34
      - 35
    evidence:
      - reference: PMID:22609892
        supports: SUPPORT
        snippet: "Meta-analyses report that calcium supplementation reduce bone loss by 0.5-1.2% and the risk of fracture of all types by at least 10% in older people"
        explanation: Supports calcium's role in reducing bone loss and fracture risk

  - name: Kidney Stones Prevention
    description: |
      Paradoxically, higher dietary calcium intake is associated with reduced kidney stone
      risk. Adequate calcium intake reduces absorption of dietary oxalate, thereby reducing
      urinary oxalate and calcium oxalate stone formation. However, calcium supplements
      taken separately from meals may increase stone risk.
    disease_term:
      preferred_term: nephrolithiasis
      term:
        id: MONDO:0008171
        label: nephrolithiasis
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: General population consuming adequate dietary calcium with meals
    mic_references:
      - 44
      - 45
      - 46
      - 47
      - 48
      - 49
      - 50

  - name: Preeclampsia Prevention
    description: |
      Calcium supplementation during pregnancy significantly reduces the risk of preeclampsia,
      particularly in women with low dietary calcium intake. The WHO recommends 1.5-2 g/day
      of calcium from the 20th week of pregnancy for women in areas of low calcium intake.
      Calcium supplementation also reduces risk of preterm birth.
    disease_term:
      preferred_term: preeclampsia
      term:
        id: MONDO:0005081
        label: preeclampsia
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Pregnant women, especially those with low calcium intake
    mic_references:
      - 60
      - 61
      - 62
      - 65
      - 66
    evidence:
      - reference: PMID:24960615
        supports: SUPPORT
        snippet: "There was also a significant reduction in the risk of pre-eclampsia associated with calcium supplementation (13 trials, 15,730 women: RR 0.45, 95% CI 0.31 to 0.65)"
        explanation: Cochrane review confirming calcium reduces preeclampsia risk by 55%

  - name: Colorectal Cancer Prevention
    description: |
      Prospective cohort studies consistently report an inverse association between higher
      calcium intakes and colorectal cancer risk. The EPIC study found that the highest
      versus lowest quintile of dairy calcium intake was associated with a 25% lower CRC
      risk. However, randomized trials have not shown significant effects of calcium
      supplementation on CRC incidence.
    disease_term:
      preferred_term: colorectal cancer
      term:
        id: MONDO:0005575
        label: colorectal cancer
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: General population; observational evidence is stronger than trial evidence
    mic_references:
      - 71
      - 72
      - 73
      - 74
      - 75
      - 76
      - 77
      - 78
    evidence:
      - reference: PMID:24023767
        supports: SUPPORT
        snippet: "Dietary calcium was inversely associated with colorectal cancer risk (HR per 200 mg/day 0.95, 95% CI: 0.91-0.99)"
        explanation: EPIC study shows inverse association between calcium and CRC risk

  - name: Premenstrual Syndrome Treatment
    description: |
      Calcium supplementation (1,200 mg/day) is an effective treatment for premenstrual
      syndrome. A multicenter trial showed a 48% reduction in total symptom scores with
      calcium compared to 30% with placebo. All four symptom factors (negative affect,
      water retention, food cravings, and pain) were significantly reduced.
    disease_term:
      preferred_term: premenstrual syndrome
    relationship_type: THERAPEUTIC
    population_context: Women with moderate-to-severe premenstrual symptoms
    mic_references:
      - 100
      - 101
      - 102
      - 103
      - 104
      - 105
      - 111
    evidence:
      - reference: PMID:9731851
        supports: SUPPORT
        snippet: "By the third treatment cycle calcium effectively resulted in an overall 48% reduction in total symptom scores from baseline compared with a 30% reduction in placebo"
        explanation: Large RCT demonstrating calcium's efficacy for PMS

  - name: Hypertension
    description: |
      The DASH diet, which is rich in low-fat dairy products (calcium) and fruits and
      vegetables (potassium), significantly lowers blood pressure. Meta-analyses of
      randomized trials suggest calcium supplementation may produce modest reductions
      in blood pressure, though effects are small.
    disease_term:
      preferred_term: hypertension
    relationship_type: THERAPEUTIC
    population_context: Individuals with elevated blood pressure
    mic_references:
      - 113
      - 114
      - 115
      - 116
      - 117
      - 118
      - 119
    evidence:
      - reference: PMID:9099655
        supports: SUPPORT
        snippet: "A diet rich in fruits, vegetables, and low-fat dairy foods and with reduced saturated and total fat can substantially lower blood pressure. This diet offers an additional nutritional approach to preventing and treating hypertension"
        explanation: The DASH trial showed that a calcium-rich dietary pattern with low-fat dairy substantially lowers blood pressure

  - name: Lead Toxicity
    description: |
      Adequate calcium intake may reduce lead absorption and toxicity. Calcium supplementation
      during pregnancy and lactation has been shown to reduce blood lead levels and lead in
      breast milk, protecting both mother and infant.
    disease_term:
      preferred_term: lead poisoning
    relationship_type: PROTECTIVE
    population_context: Pregnant and lactating women at risk of lead exposure
    mic_references:
      - 81
      - 82
      - 83
      - 84
      - 85
    evidence:
      - reference: PMID:19165383
        supports: SUPPORT
        snippet: "Calcium supplementation was associated with modest reductions in blood lead when administered during pregnancy and may constitute an important secondary prevention effort to reduce circulating maternal lead and, consequently, fetal exposure"
        explanation: RCT demonstrating calcium supplementation reduces blood lead levels during pregnancy
      - reference: PMID:12606887
        supports: SUPPORT
        snippet: "Among lactating women with relatively high lead burden, calcium supplementation was associated with a modest reduction in blood lead levels"
        explanation: RCT showing calcium supplements lower blood lead in lactating women with high bone lead stores

  - name: Prostate Cancer Risk
    description: |
      Several observational studies have raised concern that high dairy and calcium intakes
      are associated with modestly increased risk of prostate cancer. A meta-analysis of 32
      prospective cohort studies found that high intakes of total dairy products, milk, cheese,
      and dietary calcium were associated with modest increases in total prostate cancer risk.
      However, nondairy calcium and supplemental calcium were not associated with increased risk.
      A randomized clinical trial of calcium supplementation (1,200 mg/day for 4 years) found no
      increase in prostate cancer risk during 10.3 years of follow-up, and some suggestion of
      a protective effect in the first 6 years.
    disease_term:
      preferred_term: prostate cancer
      term:
        id: MONDO:0008315
        label: prostate cancer
    relationship_type: RISK_FACTOR
    direction: INCREASED
    population_context: Men with high dairy calcium intakes; not seen with supplemental calcium
    mic_references:
      - 136
      - 137
      - 138
      - 139
      - 140
      - 141
      - 142
      - 150
      - 151
      - 152
    evidence:
      - reference: PMID:25527754
        supports: PARTIAL
        snippet: "High intakes of dairy products, milk, low-fat milk, cheese, and total, dietary, and dairy calcium, but not supplemental or nondairy calcium, may increase total prostate cancer risk. The diverging results for types of dairy products and sources of calcium suggest that other components of dairy rather than fat and calcium may increase prostate cancer risk"
        explanation: Meta-analysis of 32 cohort studies shows dairy calcium modestly increases prostate cancer risk, but supplemental calcium does not, suggesting non-calcium dairy components may be responsible
      - reference: PMID:15767334
        supports: REFUTE
        snippet: "In this randomized controlled clinical trial, there was no increase in prostate cancer risk associated with calcium supplementation and some suggestion of a protective effect"
        explanation: RCT of 1,200 mg/day calcium for 4 years found no increased prostate cancer risk and possible protection during the treatment period

  - name: Cardiovascular Disease Risk from Supplements
    description: |
      Whether calcium supplements increase cardiovascular disease (CVD) risk has been
      debated. The Auckland Calcium Study found calcium supplementation in postmenopausal
      women was associated with increased myocardial infarction risk. A re-analysis of the
      WHI trial also suggested increased cardiovascular risk. However, larger meta-analyses
      including the Lewis collaborative meta-analysis of 63,563 postmenopausal women found
      no increased risk for coronary heart disease or all-cause mortality. The National
      Osteoporosis Foundation and American Society for Preventive Cardiology concluded that
      calcium intake within tolerable upper limits is safe from a cardiovascular standpoint.
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disorder
    relationship_type: RISK_FACTOR
    population_context: Generally healthy adults taking calcium supplements within tolerable upper intake levels
    mic_references:
      - 153
      - 154
      - 155
      - 156
      - 157
      - 158
      - 160
      - 161
      - 162
      - 169
      - 170
      - 171
    evidence:
      - reference: PMID:18198394
        supports: SUPPORT
        snippet: "Calcium supplementation in healthy postmenopausal women is associated with upward trends in cardiovascular event rates. This potentially detrimental effect should be balanced against the likely benefits of calcium on bone"
        explanation: Auckland study found calcium supplementation associated with increased myocardial infarction risk in postmenopausal women
      - reference: PMID:21505219
        supports: SUPPORT
        snippet: "Calcium supplements with or without vitamin D modestly increase the risk of cardiovascular events, especially myocardial infarction, a finding obscured in the WHI CaD Study by the widespread use of personal calcium supplements"
        explanation: WHI re-analysis and meta-analysis found calcium supplements modestly increase MI and stroke risk
      - reference: PMID:25042841
        supports: REFUTE
        snippet: "current evidence does not support the hypothesis that calcium supplementation with or without vitamin D increases coronary heart disease or all-cause mortality risk in elderly women"
        explanation: Collaborative meta-analysis of 18 RCTs with 63,563 participants found no increased CHD or mortality risk
      - reference: PMID:27776363
        supports: REFUTE
        snippet: "Calcium intake within tolerable upper intake levels (2000 to 2500 mg/d) is not associated with CVD risk in generally healthy adults"
        explanation: Updated systematic review and meta-analysis found no association between calcium intake within UL and CVD risk

