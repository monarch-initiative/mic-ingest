    75% of the calcium in the American diet. Calcium-rich vegetables in the kale family
    (broccoli, bok choy, cabbage) have bioavailability comparable to dairy, while spinach
    and rhubarb have poor calcium bioavailability due to high oxalate content.

bioavailability:
  description: |
    Dairy products represent rich and absorbable sources of calcium. The calcium in
    kale-family vegetables (broccoli, bok choy, cabbage, mustard, turnip greens) is as
    bioavailable as that in milk. However, oxalic acid in spinach and rhubarb and phytic
    acid in wheat bran and dried beans inhibit calcium absorption. Fermentation (as in
    bread making) can reduce phytate content.
  mic_references:
    - 123

references:
  - reference: PMID:18083096
    title: Calcium signaling
    findings:
      - statement: Calcium ions impact nearly every aspect of cellular life
        supporting_text: "Calcium ions (Ca(2+)) impact nearly every aspect of cellular life"
  - reference: PMID:22609892
    title: Calcium and bone
    findings:
      - statement: Calcium supplementation reduces bone loss and fracture risk
        supporting_text: "Meta-analyses report that calcium supplementation reduce bone loss by 0.5-1.2% and the risk of fracture of all types by at least 10% in older people"
  - reference: PMID:24960615
    title: Calcium supplementation during pregnancy for preventing hypertensive disorders
    findings:
      - statement: Calcium supplementation significantly reduces preeclampsia risk
        supporting_text: "There was also a significant reduction in the risk of pre-eclampsia associated with calcium supplementation"
  - reference: PMID:24023767
    title: Consumption of dairy products and colorectal cancer in EPIC
    findings:
      - statement: Dietary calcium inversely associated with colorectal cancer risk
        supporting_text: "Dietary calcium was inversely associated with colorectal cancer risk (HR per 200 mg/day 0.95, 95% CI: 0.91-0.99)"
  - reference: PMID:9731851
    title: Calcium carbonate and premenstrual syndrome
    findings:
      - statement: Calcium supplementation is effective for PMS treatment
        supporting_text: "By the third treatment cycle calcium effectively resulted in an overall 48% reduction in total symptom scores"
  - reference: PMID:25527754
    title: Dairy products, calcium, and prostate cancer risk - a systematic review and meta-analysis of cohort studies
    findings:
      - statement: High dairy calcium but not supplemental calcium associated with increased prostate cancer risk
        supporting_text: "High intakes of dairy products, milk, low-fat milk, cheese, and total, dietary, and dairy calcium, but not supplemental or nondairy calcium, may increase total prostate cancer risk"
  - reference: PMID:15767334
    title: Risk of prostate cancer in a randomized clinical trial of calcium supplementation
    findings:
      - statement: Calcium supplementation did not increase prostate cancer risk in RCT
        supporting_text: "In this randomized controlled clinical trial, there was no increase in prostate cancer risk associated with calcium supplementation and some suggestion of a protective effect"
  - reference: PMID:18198394
    title: Vascular events in healthy older women receiving calcium supplementation
    findings:
      - statement: Auckland study found calcium supplements associated with increased cardiovascular events
        supporting_text: "Calcium supplementation in healthy postmenopausal women is associated with upward trends in cardiovascular event rates"
  - reference: PMID:21505219
    title: Calcium supplements with or without vitamin D and risk of cardiovascular events - reanalysis of the WHI
    findings:
      - statement: WHI re-analysis suggests calcium supplements increase cardiovascular events
        supporting_text: "Calcium supplements with or without vitamin D modestly increase the risk of cardiovascular events, especially myocardial infarction"
  - reference: PMID:25042841
    title: The effects of calcium supplementation on verified coronary heart disease hospitalization and death in postmenopausal women
    findings:
      - statement: Meta-analysis of 18 RCTs found no increased CHD or mortality risk from calcium supplements
        supporting_text: "current evidence does not support the hypothesis that calcium supplementation with or without vitamin D increases coronary heart disease or all-cause mortality risk in elderly women"
  - reference: PMID:27776363
    title: Calcium Intake and Cardiovascular Disease Risk - An Updated Systematic Review and Meta-analysis
    findings:
      - statement: Calcium within tolerable upper intake levels not associated with CVD risk
        supporting_text: "Calcium intake within tolerable upper intake levels (2000 to 2500 mg/d) is not associated with CVD risk in generally healthy adults"
  - reference: PMID:17507729
    title: Calcium supplementation in clinical practice - a review of forms, doses, and indications
    findings:
      - statement: Calcium carbonate and citrate are the most common supplement forms with different absorption characteristics
        supporting_text: "Calcium carbonate, the most cost-effective form, should be taken with a meal to ensure optimal absorption. Calcium citrate can be taken without food and is the supplement of choice for individuals with achlorhydria"
  - reference: PMID:19165383
    title: Effect of calcium supplementation on blood lead levels in pregnancy
    findings:
      - statement: Calcium supplementation during pregnancy reduces maternal blood lead levels
        supporting_text: "Calcium supplementation was associated with modest reductions in blood lead when administered during pregnancy and may constitute an important secondary prevention effort to reduce circulating maternal lead"
  - reference: PMID:12606887
    title: Dietary calcium supplements to lower blood lead levels in lactating women
    findings:
      - statement: Calcium supplements reduce blood lead in lactating women with high lead burden
        supporting_text: "Among lactating women with relatively high lead burden, calcium supplementation was associated with a modest reduction in blood lead levels"
  - reference: PMID:9099655
    title: A clinical trial of the effects of dietary patterns on blood pressure (DASH trial)
    findings:
      - statement: DASH diet rich in low-fat dairy substantially lowers blood pressure
        supporting_text: "A diet rich in fruits, vegetables, and low-fat dairy foods and with reduced saturated and total fat can substantially lower blood pressure"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Calcium. Evidence items include exact quotes from
  PubMed abstracts. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. The page contains 177 references.

  Potential safety concerns: High calcium intake from supplements (not food) has been
  associated in some studies with increased risk of cardiovascular events and prostate
  cancer, though evidence is mixed and current recommendations remain at 1,000-1,200 mg/day
  from all sources combined.
