notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Magnesium. Magnesium is involved in more than 300
  essential metabolic reactions. The MIC reference numbers (mic_references) correspond
  to the numbered citations on the source page. The page contains approximately
  215 references.
