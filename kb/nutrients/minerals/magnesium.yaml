drug_interactions:
  - name: Bisphosphonates and Magnesium
    description: |
      Magnesium can inhibit the absorption of bisphosphonates used for osteoporosis.
      Doses should be separated by at least two hours.
    drug_term:
      preferred_term: bisphosphonate
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 212
      - 213

  - name: Tetracycline Antibiotics and Magnesium
    description: |
      Magnesium has been found to reduce the efficacy of tetracycline class antibiotics.
    drug_term:
      preferred_term: tetracycline
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 212
      - 213

  - name: Quinolone Antibiotics and Magnesium
    description: |
      Magnesium has been found to reduce the efficacy of quinolone class antibiotics.
    drug_term:
      preferred_term: quinolone
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 212
      - 213

  - name: Proton-Pump Inhibitors and Magnesium
    description: |
      Long-term use (three months or longer) of proton-pump inhibitors may increase
      the risk of hypomagnesemia.
    drug_term:
      preferred_term: proton pump inhibitor
    interaction_type: INCREASES_EXCRETION
    clinical_significance: MODERATE
    mic_references:
      - 214
      - 215

  - name: Loop and Thiazide Diuretics and Magnesium
    description: |
      High doses of furosemide (Lasix) and some thiazide diuretics, if taken for
      extended periods, may interfere with magnesium reabsorption in the kidneys
      and result in magnesium depletion.
    drug_term:
      preferred_term: diuretic
    interaction_type: INCREASES_EXCRETION
    clinical_significance: MODERATE
    mic_references:
      - 213

nutrient_interactions:
  - name: Zinc and Magnesium
    description: |
      High doses of supplemental zinc (142 mg/day, well above the UL of 40 mg/day)
      may interfere with magnesium absorption and disrupt magnesium balance.
    nutrient_term:
      preferred_term: zinc
    interaction_type: ANTAGONISTIC
    mic_references:
      - 4

  - name: Fiber and Magnesium
    description: |
      Large increases in dietary fiber intake have been found to decrease magnesium
      utilization in experimental studies, though the extent of this effect in
      individuals with varied diets is unclear.
    nutrient_term:
      preferred_term: dietary fiber
    interaction_type: REDUCES_ABSORPTION
    mic_references:
      - 2
      - 3

  - name: Calcium and Magnesium
    description: |
      Magnesium is needed for calcium homeostasis. Severe magnesium deficiency can
      disrupt vitamin D and calcium homeostasis, leading to hypocalcemia.
    nutrient_term:
      preferred_term: calcium
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 3

disease_associations:
  - name: Type 2 Diabetes Mellitus
    description: |
      Higher magnesium intakes have been associated with lower risk of type 2 diabetes
      mellitus in multiple large prospective cohort studies. Meta-analyses show a 17-22%
      lower risk in those with highest versus lowest magnesium intakes, with 6-8% risk
      reduction per 100 mg/day increment. Magnesium supplementation has been shown to
      improve insulin sensitivity in individuals at risk for type 2 diabetes.
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Adults with inadequate dietary magnesium intake
    mic_references:
      - 52
      - 74
      - 76
      - 78
    evidence:
      - reference: PMID:27869762
        supports: SUPPORT
        snippet: "Compared with the lowest magnesium consumption group in the population, the risk of T2D was reduced by 17% across all the studies; 19% in women and 16% in men"
        explanation: Meta-analysis of 25 prospective cohort studies confirms 17% reduction in T2D risk with highest vs lowest magnesium intake
      - reference: PMID:21205110
        supports: SUPPORT
        snippet: "Mg supplementation resulted in a significant improvement of fasting plasma glucose and some insulin sensitivity indices (ISIs) compared to placebo"
        explanation: Double-blind RCT showing oral magnesium supplementation improves insulin sensitivity even in normomagnesemic overweight non-diabetic subjects
      - reference: PMID:21241290
        supports: SUPPORT
        snippet: "MgCl(2) 2.5 g daily improves the ability of beta-cells to compensate for variations in insulin sensitivity in non-diabetic individuals with significant hypomagnesaemia"
        explanation: Randomized double-blind clinical trial demonstrating magnesium chloride supplementation improves pancreatic beta-cell function in hypomagnesemic individuals
      - reference: PMID:34836329
        supports: SUPPORT
        snippet: "Mg supplementation may improve insulin-sensitivity parameters in those at high risk of diabetes"
        explanation: Systematic review and meta-analysis of double-blind RCTs confirming magnesium supplementation improves glucose parameters in people with diabetes and insulin sensitivity in those at high risk

  - name: Hypertension
    description: |
      Large prospective cohort studies have found that higher dietary magnesium intakes
      are associated with an 8% lower risk of hypertension. Higher urinary magnesium
      has been associated with 25% reduction in hypertension risk. Improving diet
      quality or using magnesium supplements may play a role in prevention.
    disease_term:
      preferred_term: hypertension
      term:
        id: MONDO:0001134
        label: essential hypertension
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Adults with inadequate dietary magnesium intake
    mic_references:
      - 26
      - 27
      - 28
      - 29
      - 30
    evidence:
      - reference: PMID:28476161
        supports: SUPPORT
        snippet: "A 100 mg/day increment in magnesium intake was associated with a 5% reduction in the risk of hypertension"
        explanation: Dose-response meta-analysis of prospective cohort studies confirms inverse relationship between dietary magnesium and hypertension risk
      - reference: PMID:33435187
        supports: SUPPORT
        snippet: "oral magnesium (≥240 mg/day) safely lowers BP in Uncontrolled Hypertensive patients taking antihypertensive medications, while >600 mg/day magnesium is required to safely lower BP in Untreated Hypertensives"
        explanation: Categorized systematic review of 49 clinical trials showing that oral magnesium supplementation effectively lowers blood pressure in uncontrolled hypertensives at doses of 240 mg/day or more

  - name: Osteoporosis
    description: |
      Around 60% of total body magnesium is stored in the skeleton and influences
      bone matrix and mineral metabolism. Higher dietary magnesium intakes have been
      associated with increased bone mineral density in observational studies. However,
      evidence is not yet sufficient to suggest supplemental magnesium in excess of
      the RDA is effective for osteoporosis prevention.
    disease_term:
      preferred_term: osteoporosis
      term:
        id: MONDO:0005298
        label: osteoporosis
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Postmenopausal women and older adults
    mic_references:
      - 85
      - 86
      - 91
      - 92
      - 94
    evidence:
      - reference: PMID:23912329
        supports: SUPPORT
        snippet: "Magnesium deficiency contributes to osteoporosis directly by acting on crystal formation and on bone cells and indirectly by impacting on the secretion and the activity of parathyroid hormone and by promoting low grade inflammation"
        explanation: Review confirms mechanisms by which magnesium deficiency contributes to osteoporosis
      - reference: PMID:24500155
        supports: SUPPORT
        snippet: "Baseline hip BMD was 3% higher (P < 0.001), and whole-body BMD was 2% higher (P < 0.001), in women who consumed >422.5 compared with <206.5 mg Mg/d"
        explanation: Women's Health Initiative Observational Study of 73,684 postmenopausal women showing higher magnesium intake is associated with significantly higher hip and whole-body bone mineral density

  - name: Preeclampsia and Eclampsia
    description: |
      Intravenous magnesium sulfate is commonly used in obstetric care for the prevention
      of seizures in pregnant people with preeclampsia or eclampsia and to protect the
      brains of premature infants. The landmark Magpie Trial demonstrated that magnesium
      sulfate halves the risk of eclampsia in women with preeclampsia.
    disease_term:
      preferred_term: preeclampsia
    relationship_type: THERAPEUTIC
    population_context: Pregnant women with preeclampsia or eclampsia
    mic_references:
      - 2
      - 118
    evidence:
      - reference: PMID:12057549
        supports: SUPPORT
        snippet: "Women allocated magnesium sulphate had a 58% lower risk of eclampsia (95% CI 40-71) than those allocated placebo (40, 0.8%, vs 96, 1.9%; 11 fewer women with eclampsia per 1000 women)"
        explanation: The Magpie Trial, a landmark randomized placebo-controlled trial of 10,141 women with preeclampsia in 33 countries, demonstrated that magnesium sulfate halves the risk of eclampsia

  - name: Cardiovascular Disease
    description: |
      Higher dietary magnesium intakes have been associated with reduced risk of
      coronary heart disease, cardiovascular events, and coronary artery calcification
      in large prospective cohort studies. A meta-analysis of 16 prospective studies
      reported a 22% lower risk of ischemic heart disease per 200 mg/day increment
      in dietary magnesium and a 30% lower risk of cardiovascular disease per 0.2 mmol/L
      increment in circulating magnesium. Cross-sectional analyses from the Framingham
      Heart Study found significantly lower odds of coronary artery calcification with
      higher magnesium intake.
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disorder
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Adults in prospective cohort studies
    mic_references:
      - 47
      - 48
      - 42
      - 53
    evidence:
      - reference: PMID:23719551
        supports: SUPPORT
        snippet: "Dietary magnesium (per 200-mg/d increment) was not significantly associated with CVD (RR: 0.89; 95% CI: 0.75, 1.05) but was associated with a 22% lower risk of IHD (RR: 0.78; 95% CI: 0.67, 0.92)"
        explanation: Systematic review and meta-analysis of 16 prospective studies with 313,041 individuals showing dietary magnesium is inversely associated with ischemic heart disease risk
      - reference: PMID:24290571
        supports: SUPPORT
        snippet: "the odds of having any CAC were 58% lower (p trend: <0.001) and any AAC were 34% lower (p trend: 0.01), in those with the highest compared to those with the lowest magnesium intake"
        explanation: Framingham Heart Study cross-sectional analysis of 2,695 participants showing magnesium intake is inversely associated with coronary artery and abdominal aortic calcification

  - name: Stroke
    description: |
      Multiple meta-analyses of prospective cohort studies have found that higher
      dietary magnesium intakes are associated with reduced risk of stroke. Pooled
      analyses show an 11% lower risk of total stroke and a 12% lower risk of ischemic
      stroke with higher versus lower magnesium intakes.
    disease_term:
      preferred_term: stroke
      term:
        id: MONDO:0005098
        label: stroke disorder
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Adults in prospective cohort studies
    mic_references:
      - 50
      - 51
      - 52
    evidence:
      - reference: PMID:32198298
        supports: SUPPORT
        snippet: "The magnitude of the risk was significantly reduced by 22% for T2D (RR 0.78 (95% CI 0.75 to 0.81); p<0.001; AR reduction 0.120%), 11% for total stroke (RR 0.89 (95% CI 0.83 to 0.94); p<0.001; AR reduction 0.281%) and 12% for ischaemic stroke (RR 0.88 (95% CI 0.81 to 0.95); p=0.001; AR reduction 0.246%) when comparing the highest magnesium intake to the lowest"
        explanation: Updated systematic review and meta-analysis of 41 prospective cohort studies confirming a significant 11% reduction in total stroke risk with higher magnesium intake

  - name: Migraine Headaches
    description: |
      Lower intracellular magnesium concentrations have been reported in individuals
      who suffer from recurrent migraine headaches. Oral magnesium supplementation
      at 600 mg/day has demonstrated modest decreases in migraine frequency in
      placebo-controlled trials. Magnesium oxide at 500 mg/day has shown comparable
      efficacy to sodium valproate for reducing migraine frequency and duration.
    disease_term:
      preferred_term: migraine disorder
      term:
        id: MONDO:0005277
        label: migraine disorder
    relationship_type: THERAPEUTIC
    population_context: Individuals with recurrent migraine headaches
    mic_references:
      - 189
      - 191
      - 192
      - 194
    evidence:
      - reference: PMID:8792038
        supports: SUPPORT
        snippet: "In weeks 9-12 the attack frequency was reduced by 41.6% in the magnesium group and by 15.8% in the placebo group compared to the baseline (p < 0.05)"
        explanation: Prospective multi-center placebo-controlled double-blind RCT of 81 migraine patients showing 600 mg/day oral magnesium significantly reduced migraine attack frequency by 41.6%

