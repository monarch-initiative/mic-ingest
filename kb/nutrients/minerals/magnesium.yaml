name: Magnesium
nutrient_term:
  preferred_term: magnesium
  term:
    id: CHEBI:25107
    label: magnesium atom
category: mineral
source_url: https://lpi.oregonstate.edu/mic/minerals/magnesium
alternate_names:
  - Mg
description: |
  Magnesium is an essential mineral that serves as a cofactor for hundreds of enzymes.
  It is needed for a wide range of physiologic pathways, including energy production,
  nucleic acid and protein synthesis, ion transport, cell signaling, and has structural
  functions in bone and cell membranes. Severe magnesium deficiency can disrupt vitamin D
  and calcium homeostasis. Over half of US adults have inadequate dietary magnesium intake,
  though the long-term consequences of this remain unclear.

functions:
  - name: Energy Production
    description: |
      The metabolism of carbohydrates and fats to produce energy requires numerous
      magnesium-dependent chemical reactions. Magnesium is required for the ATP synthase
      protein in mitochondria. ATP, the molecule that provides energy for almost all
      metabolic processes, exists primarily as a complex with magnesium (MgATP).
    biological_processes:
      - preferred_term: ATP synthesis
        term:
          id: GO:0042776
          label: proton motive force-driven mitochondrial ATP synthesis
    mic_references:
      - 3

  - name: Essential Molecule Synthesis
    description: |
      Magnesium is required for a number of steps during synthesis of DNA, RNA, and
      proteins. Several enzymes participating in the synthesis of carbohydrates and
      lipids require magnesium for their activity. Glutathione, an important antioxidant,
      requires magnesium for its synthesis.
    biological_processes:
      - preferred_term: nucleic acid synthesis
        term:
          id: GO:0090592
          label: DNA synthesis involved in DNA replication
    mic_references:
      - 3

  - name: Structural Roles
    description: |
      Magnesium plays a structural role in bone, cell membranes, and chromosomes.
      Around 60% of total body magnesium is stored in the skeleton and is known to
      influence both bone matrix and bone mineral metabolism.
    mic_references:
      - 3

  - name: Ion Transport
    description: |
      Magnesium is required for the active transport of ions like potassium and calcium
      across cell membranes. This function is necessary for nerve impulse conduction,
      muscle contraction, and normal heart rhythm.
    biological_processes:
      - preferred_term: ion transport
        term:
          id: GO:0006811
          label: monoatomic ion transport
    mic_references:
      - 3

  - name: Cell Signaling
    description: |
      Cell signaling processes require MgATP for protein phosphorylation and the
      formation of cyclic adenosine monophosphate (cAMP), an important cell-signaling
      molecule involved in many physiological processes, including the secretion of
      parathyroid hormone (PTH) from the parathyroid glands.
    biological_processes:
      - preferred_term: cell signaling
        term:
          id: GO:0007165
          label: signal transduction
    mic_references:
      - 3

deficiency:
  name: Magnesium Deficiency
  description: |
    Magnesium deficiency is rare in healthy individuals consuming a balanced diet,
    because magnesium is abundant in both plant and animal foods and kidneys can limit
    urinary excretion when intake is low. However, certain conditions increase risk:
    gastrointestinal disorders, renal disorders, endocrine/metabolic disorders,
    alcoholism, and older age. Severe deficiency causes hypocalcemia despite adequate
    calcium intake, hypokalemia, sodium retention, neurological and muscular symptoms
    (tremor, muscle spasms, tetany), loss of appetite, nausea, and personality changes.
  sequelae:
    - name: Hypocalcemia
      phenotype_term:
        preferred_term: hypocalcemia
        term:
          id: HP:0002901
          label: Hypocalcemia
      frequency: FREQUENT
      context: Serum calcium decreases as magnesium deficiency progresses
      mic_references:
        - 3

    - name: Hypokalemia
      phenotype_term:
        preferred_term: hypokalemia
        term:
          id: HP:0002900
          label: Hypokalemia
      frequency: OCCASIONAL
      context: Low serum potassium concentrations in severe deficiency
      mic_references:
        - 3

    - name: Muscle spasm
      phenotype_term:
        preferred_term: muscle spasm
        term:
          id: HP:0003394
          label: Muscle spasm
      frequency: OCCASIONAL
      context: Neurological and muscular symptoms in severe deficiency
      mic_references:
        - 3

  at_risk_groups:
    - name: Individuals with gastrointestinal disorders
      description: |
        Prolonged diarrhea, Crohn's disease, malabsorption syndromes, celiac disease,
        surgical removal of parts of the small intestine, and radiation-induced
        intestinal inflammation can lead to magnesium depletion.
      mic_references:
        - 7

    - name: Individuals with renal disorders
      description: |
        Diabetes mellitus and long-term use of certain diuretics may result in
        increased urinary loss of magnesium.
      mic_references:
        - 3

    - name: Individuals with chronic alcoholism
      description: |
        Poor dietary intake, gastrointestinal problems, and increased urinary loss
        of magnesium may all contribute to magnesium depletion.
      mic_references:
        - 7

    - name: Older adults
      description: |
        Older individuals (>50 years) have relatively low dietary intakes of magnesium.
        Intestinal absorption tends to decrease with age, and urinary excretion tends
        to increase with age.
      mic_references:
        - 2
        - 8
        - 9

  mic_references:
    - 1
    - 3
    - 7

toxicity:
  name: Magnesium Toxicity
  description: |
    Adverse effects have not been identified from magnesium occurring naturally in food.
    However, adverse effects from excessive supplemental magnesium have been observed.
    The initial symptom of excess magnesium supplementation is diarrhea. Individuals with
    impaired kidney function are at higher risk for adverse effects. Hypermagnesemia may
    cause hypotension, lethargy, confusion, cardiac rhythm disturbances, muscle weakness,
    difficulty breathing, and in severe cases cardiac arrest. The Tolerable Upper Intake
    Level (UL) for supplemental magnesium is 350 mg/day for adults, based on risk of
    diarrhea and GI disturbance.
  adverse_effects:
    - name: Diarrhea
      description: |
        Initial symptom of excess magnesium supplementation; well-known side effect
        used therapeutically as a laxative
      severity: mild
    - name: Cardiac disturbances
      description: |
        Severe hypermagnesemia can cause disturbances in normal cardiac rhythm
        and potentially cardiac arrest
      severity: severe
  mic_references:
    - 2
    - 3
    - 6

