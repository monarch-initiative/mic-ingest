  notes: |
    The Tolerable Upper Intake Level (UL) for supplemental magnesium is 350 mg/day
    for adults and adolescents 9 years and older. This UL applies specifically to
    supplemental magnesium, not magnesium from food. National surveys indicate that
    over half of US adults have inadequate dietary magnesium intake. Good dietary
    sources include green leafy vegetables, unrefined grains, legumes, beans, and nuts.

bioavailability:
  description: |
    Magnesium is absorbed primarily in the small intestine. Absorption efficiency can
    vary based on magnesium status and dietary factors. The kidneys can limit urinary
    excretion when intake is low. Around 60% of total body magnesium is stored in the
    skeleton and is available for dynamic exchange with blood.
  mic_references:
    - 2

references:
