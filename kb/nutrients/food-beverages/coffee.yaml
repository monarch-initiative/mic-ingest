name: Coffee
nutrient_term:
  preferred_term: coffee
  description: A brewed beverage made from roasted coffee beans containing caffeine and chlorogenic acids
category: food_beverage
source_url: https://lpi.oregonstate.edu/mic/food-beverages/coffee
alternate_names:
  - Caffea
description: |
  Coffee is a complex mixture of chemicals that provides significant amounts of
  chlorogenic acid and caffeine. It is one of the most widely consumed beverages
  worldwide. The bioactive compounds in coffee include chlorogenic acids, caffeine,
  diterpenes (cafestol and kahweol), and trigonelline.

disease_associations:
  - name: Coffee and Type 2 Diabetes
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: PROTECTIVE
    direction: DECREASED
    description: |
      The results of observational studies suggest that coffee consumption is
      associated with lower risk of type 2 diabetes mellitus. Both caffeinated
      and decaffeinated coffee have been associated with reduced risk.
    population_context: general adult population
    evidence:
      - reference: PMID:15998896
        supports: SUPPORT
        snippet: "This systematic review supports the hypothesis that habitual coffee consumption is associated with a substantially lower risk of type 2 diabetes."
        explanation: Meta-analysis of 9 cohort studies with 193,473 participants found RR of 0.65 for highest coffee consumption category vs lowest for type 2 diabetes risk.
    mic_references:
      - 22
      - 23
      - 24

  - name: Coffee and Parkinson's Disease
    disease_term:
      preferred_term: Parkinson's disease
      term:
        id: MONDO:0005180
        label: Parkinson disease
    relationship_type: PROTECTIVE
    direction: DECREASED
    description: |
      Observational studies suggest that coffee consumption is associated with
      lower risk of Parkinson's disease. The protective effect appears to be
      related to caffeine content.
    population_context: general adult population
    evidence:
      - reference: PMID:22927157
        supports: SUPPORT
        snippet: "Findings from this large, prospective study of men and women are consistent with a protective effect of caffeine intake on PD incidence, with an attenuating influence of HRT in women."
        explanation: Prospective study in CPS II Nutrition Cohort found RR of 0.43 for highest vs lowest caffeine quintile in men and 0.61 in women for Parkinson's disease risk.
    mic_references:
      - 29
      - 30

  - name: Coffee and Liver Disease
    disease_term:
      preferred_term: liver cirrhosis
      term:
        id: MONDO:0005155
        label: cirrhosis of liver
    relationship_type: PROTECTIVE
    direction: DECREASED
    description: |
      Coffee consumption has been associated with lower risks of cirrhosis,
      cirrhosis-related mortality, and liver cancer.
    population_context: general adult population
    mic_references:
      - 33
      - 34
      - 35

  - name: Coffee and Liver Cancer
    disease_term:
      preferred_term: liver cancer
      term:
        id: MONDO:0002691
        label: liver cancer
    relationship_type: PROTECTIVE
    direction: DECREASED
    description: |
      Coffee consumption is inversely associated with risk of hepatocellular
      carcinoma (primary liver cancer).
    population_context: general adult population
    mic_references:
      - 35
      - 36

  - name: Coffee and All-Cause Mortality
    disease_term:
      preferred_term: mortality
    relationship_type: PROTECTIVE
    direction: DECREASED
    description: |
      Moderate coffee consumption is associated with reduced all-cause mortality
      in observational studies.
    population_context: general adult population
    mic_references:
      - 47
      - 48

toxicity:
  name: Coffee Safety
  description: |
    Current evidence from dose-response meta-analyses of observational studies does
    not exclude that moderate maternal coffee consumption could adversely affect fetal
    growth during pregnancy. Limiting intakes of caffeinated coffee to ≤1 cup/day
    during pregnancy and 2-3 cups/day during breast-feeding is recommended.
  mic_references:
    - 70
    - 71

recommendations:
  notes: |
    Overall, there is little evidence of health risks and some evidence of health
    benefits for adults consuming moderate amounts of filtered coffee (3-4 cups/day
    providing ~300-400 mg/day of caffeine). Ensuring adequate calcium and vitamin D
    intakes and limiting coffee consumption to 3 cups/day (~300 mg/day of caffeine)
    are unlikely to cause any adverse effects on calcium absorption and bone health.
  ai:
    - population: Adults
      amount: 3-4 cups/day (300-400 mg caffeine)
      source: MIC recommendation

references:
  - reference: PMID:15998896
    title: "Coffee consumption and risk of type 2 diabetes: a systematic review"
  - reference: PMID:22927157
    title: "Caffeine and risk of Parkinson's disease in a large cohort of men and women"

notes: |
  Unfiltered coffee is a significant source of diterpenes (mainly cafestol and kahweol)
  that appear to raise serum total and LDL-cholesterol concentrations in humans.
  Filtered coffee removes most of these compounds. Despite evidence from clinical trials
  that caffeine in coffee can increase blood pressure, most prospective cohort studies
  have not found moderate coffee consumption to be associated with increased risk of
  cardiovascular disease.
