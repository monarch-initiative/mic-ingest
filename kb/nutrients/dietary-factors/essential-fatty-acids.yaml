name: Essential Fatty Acids
nutrient_term:
  preferred_term: essential fatty acid
  term:
    id: CHEBI:59549
    label: essential fatty acid
category: dietary_factor
source_url: https://lpi.oregonstate.edu/mic/other-nutrients/essential-fatty-acids
alternate_names:
  - EFAs
  - Polyunsaturated fatty acids
  - PUFAs
description: |
  Essential fatty acids are polyunsaturated fatty acids that cannot be synthesized
  de novo by humans and must be obtained from the diet. The two essential fatty acids
  are linoleic acid (LA, an omega-6 fatty acid) and alpha-linolenic acid (ALA, an
  omega-3 fatty acid). These serve as precursors for longer-chain polyunsaturated
  fatty acids including arachidonic acid (AA), eicosapentaenoic acid (EPA), and
  docosahexaenoic acid (DHA), which have important roles in inflammation,
  cell membrane structure, and neural function.

functions:
  - name: Cell Membrane Structure
    description: |
      Essential fatty acids and their long-chain derivatives are important structural
      components of cell membranes. DHA is particularly concentrated in retinal and
      brain tissue, where it affects membrane fluidity and function.
    mic_references:
      - 15
      - 20
      - 21

  - name: Eicosanoid Precursors
    description: |
      Omega-6 and omega-3 fatty acids serve as precursors for eicosanoids, which
      are bioactive lipid mediators including prostaglandins, thromboxanes, and
      leukotrienes. These regulate inflammation, blood clotting, and immune responses.
    biological_processes:
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
    mic_references:
      - 16
      - 17
    evidence:
      - reference: PMID:23668691
        supports: SUPPORT
        snippet: "Fatty acid-induced modifications in membrane order and in the availability of substrates for eicosanoid synthesis are long-standing mechanisms that are considered important in explaining the effects observed"
        explanation: Confirms role of fatty acids as eicosanoid precursors

  - name: Resolution of Inflammation
    description: |
      EPA and DHA serve as precursors for specialized pro-resolving lipid mediators
      (SPMs) including resolvins and protectins, which actively promote the resolution
      of inflammation.
    biological_processes:
      - preferred_term: resolution of inflammation
        term:
          id: GO:0050727
          label: regulation of inflammatory response
    mic_references:
      - 28
      - 29
    evidence:
      - reference: PMID:23668691
        supports: SUPPORT
        snippet: "the description of an entirely new family of lipid mediators, resolvins and protectins that have anti-inflammatory actions and are critical to the resolution of inflammation"
        explanation: Confirms EPA and DHA as precursors for pro-resolving mediators

  - name: Neural Development and Function
    description: |
      DHA is essential for normal brain and retinal development. It accumulates
      in the brain during fetal development and early infancy and is critical for
      neurodevelopment and visual function.
    biological_processes:
      - preferred_term: neuron development
        term:
          id: GO:0048666
          label: neuron development
    mic_references:
      - 22
      - 24
    evidence:
      - reference: PMID:18789910
        supports: SUPPORT
        snippet: "Inadequate intakes of omega-3 fatty acids decrease DHA and increase omega-6 fatty acids in the brain. Decreased DHA in the developing brain leads to deficits in neurogenesis, neurotransmitter metabolism, and altered learning and visual function in animals."
        explanation: Confirms that DHA is critical for brain development and that inadequate omega-3 intake impairs neurogenesis and neural function
      - reference: PMID:20478353
        supports: SUPPORT
        snippet: "The accretion of docosahexaenoic acid (DHA) in membranes of the central nervous system is required for the optimum development of retina and brain functions."
        explanation: Confirms DHA accretion in CNS membranes is required for optimal retinal and brain development

  - name: Gene Expression Regulation
    description: |
      Omega-3 fatty acids regulate gene expression through effects on transcription
      factors, including sterol regulatory element binding proteins (SREBPs) and
      peroxisome proliferator-activated receptors (PPARs).
    mic_references:
      - 14
      - 31
      - 33

deficiency:
  name: Essential Fatty Acid Deficiency
  description: |
    Essential fatty acid deficiency is rare in healthy individuals but can occur
    in patients receiving fat-free parenteral nutrition, those with severe fat
    malabsorption, or in cases of malnutrition. A plasma triene:tetraene ratio
    (eicosatrienoic acid to arachidonic acid) greater than 0.2 indicates deficiency.
  phenotypes:
    - name: Dermatitis
      phenotype_term:
        preferred_term: eczematoid dermatitis
        term:
          id: HP:0000964
          label: Eczematoid dermatitis
      frequency: VERY_FREQUENT
      mic_references:
        - 35
      evidence:
        - reference: PMID:9665106
          supports: SUPPORT
          snippet: "Home parenteral nutrition (HPN), initiated in patients with severe malabsorption or decreased oral intake, may exhaust stores of essential fatty acids and cause clinical manifestations, mainly dermatitis"
          explanation: Confirms dermatitis as primary clinical manifestation of EFA deficiency
    - name: Growth retardation
      phenotype_term:
        preferred_term: growth retardation
        term:
          id: HP:0001510
          label: Growth delay
      frequency: FREQUENT
      mic_references:
        - 36
    - name: Poor wound healing
      phenotype_term:
        preferred_term: impaired wound healing
        term:
          id: HP:0001058
          label: Poor wound healing
      frequency: FREQUENT
      mic_references:
        - 35
    - name: Increased susceptibility to infection
      phenotype_term:
        preferred_term: recurrent infections
        term:
          id: HP:0002719
          label: Recurrent infections
      frequency: FREQUENT
      mic_references:
        - 35
  at_risk_groups:
    - name: Patients on parenteral nutrition
      description: |
        Patients receiving long-term fat-free parenteral nutrition are at high
        risk for EFA deficiency.
      mic_references:
        - 35
        - 37
    - name: Patients with fat malabsorption
      description: |
        Conditions causing fat malabsorption (cystic fibrosis, short bowel syndrome,
        cholestatic liver disease) increase risk of EFA deficiency.
      mic_references:
        - 39
        - 40
    - name: Infants and children with malnutrition
      description: |
        Severely malnourished infants and children may develop EFA deficiency.
      mic_references:
        - 36

