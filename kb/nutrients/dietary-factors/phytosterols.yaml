name: Phytosterols
nutrient_term:
  preferred_term: sitosterol
  term:
    id: CHEBI:27693
    label: sitosterol
category: dietary_factor
source_url: https://lpi.oregonstate.edu/mic/dietary-factors/phytochemicals/phytosterols
alternate_names:
  - Plant sterols
  - Plant stanols
  - Beta-sitosterol
  - Campesterol
  - Stigmasterol
description: |
  Phytosterols are plant-derived compounds structurally similar to cholesterol.
  They include plant sterols (β-sitosterol, campesterol, stigmasterol) with a
  double bond and plant stanols without. They interfere with cholesterol
  absorption and facilitate fecal cholesterol excretion. Unlike cholesterol,
  humans cannot synthesize phytosterols and absorb less than 5% of dietary intake.

functions:
  - name: Cholesterol absorption inhibition
    description: |
      Phytosterols displace cholesterol from intestinal micelles and promote
      fecal excretion of biliary cholesterol, reducing serum LDL-cholesterol.
      Daily consumption of 2 g/day lowers LDL-cholesterol by 8-10%.
    mic_references:
      - 4
      - 5
      - 6

  - name: ABCG5/G8 transporter interaction
    description: |
      The ABCG5/G8 heterodimer actively excretes absorbed phytosterols back
      into the intestinal lumen, maintaining low blood concentrations. Less
      than 5% of plant sterols and 0.5% of plant stanols are absorbed.
    mic_references:
      - 11
      - 12

deficiency:
  name: Phytosterol deficiency
  description: |
    Phytosterols are not essential nutrients, and no deficiency syndrome
    has been identified.
  notes: Early human diets may have provided up to 1 g/day; modern Western diets provide 150-450 mg/day.

toxicity:
  name: Phytosterol toxicity
  description: |
    Phytosterols added to food products are generally recognized as safe
    (GRAS) by the FDA. No significant adverse effects have been observed
    at intakes up to 8.6 g/day for 3-4 weeks or 1.6-2.6 g/day for one year.
    However, individuals with sitosterolemia (rare ABCG5/G8 mutations)
    must avoid phytosterol-enriched foods.
  mic_references:
    - 67
    - 68

