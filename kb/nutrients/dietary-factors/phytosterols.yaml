nutrient_interactions:
  - name: Carotenoid absorption
    nutrient_term:
      preferred_term: carotenoid
    interaction_type: REDUCES_ABSORPTION
    description: |
      Phytosterol consumption reduces plasma hydrocarbon carotenoid levels
      by 5-20%. Consuming 5+ servings of carotenoid-rich fruits and
      vegetables daily can counteract this effect.
    mic_references:
      - 74
      - 75
      - 76

disease_associations:
  - name: Cardiovascular disease
    disease_term:
      preferred_term: cardiovascular disease
    relationship_type: PROTECTIVE
    direction: DECREASED
    description: |
      Phytosterols reliably reduce LDL-cholesterol by 8-10% at 2 g/day,
      with dose-dependent responses up to 12.4% reduction at 3.3 g/day.
      However, the effect of long-term use on cardiovascular events
      has not been established in clinical endpoint trials.
    evidence:
      - reference: PMID:10357732
        supports: SUPPORT
        snippet: "LDL-cholesterol concentrations on day 30 had decreased by 8.9% (P < 0.01) and 24.4% (P < 0.001) with the control and phytosterol-enriched diets, respectively"
        explanation: Controlled trial in hypercholesterolemic men showed phytosterol-enriched diet reduced LDL-cholesterol significantly more than control diet.
    mic_references:
      - 22
      - 23
      - 32
    notes: "LDL reduction established; clinical event reduction unproven"

  - name: Benign prostatic hyperplasia
    disease_term:
      preferred_term: benign prostatic hyperplasia
    relationship_type: THERAPEUTIC
    description: |
      Clinical trials suggest β-sitosterol supplementation at 60-130 mg/day
      can improve urinary tract symptoms related to BPH, including peak
      urinary flow and post-void residual urine volume.
    evidence:
      - reference: PMID:7540705
        supports: SUPPORT
        snippet: "Significant improvement in symptoms and urinary flow parameters show the effectiveness of beta-sitosterol in the treatment of benign prostatic hyperplasia"
        explanation: Randomized placebo-controlled trial of 200 BPH patients showed beta-sitosterol significantly improved symptom scores and urinary flow.
    mic_references:
      - 58
      - 59
    notes: "Further research needed to confirm efficacy"

drug_interactions:
  - name: Statins
    drug_term:
      preferred_term: statin
    interaction_type: SYNERGISTIC
    clinical_significance: MODERATE
    description: |
      Phytosterols demonstrate additive LDL-lowering effects with statins.
      A meta-analysis found 2-3 g/day plant sterols/stanols with statin
      therapy lowered LDL an additional 0.30 mmol/L (11.6 mg/dL).
    mic_references:
      - 36

  - name: Ezetimibe
    drug_term:
      preferred_term: ezetimibe
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      Ezetimibe may interfere with phytosterol absorption, significantly
      reducing blood phytosterol concentrations.
    mic_references:
      - 82

recommendations:
  notes: |
    FDA authorizes health claims for foods providing ≥1.3 g plant sterol
    esters or ≥3.4 g stanol esters daily in two servings as part of a
    low-saturated-fat diet. The European Committee recommends intake not
    exceed 3 g/day. Phytosterol-enriched foods are not recommended for
    pregnant or breastfeeding women due to lack of safety data.

references:
  - reference: PMID:10357732
    title: "Cholesterol-lowering efficacy of a sitostanol-containing phytosterol mixture with a prudent diet in hyperlipidemic men"
  - reference: PMID:7540705
    title: "Randomised, placebo-controlled, double-blind clinical trial of beta-sitosterol in patients with benign prostatic hyperplasia"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Phytosterols. While LDL-cholesterol reduction is
  well established, clinical cardiovascular event reduction remains unproven.
