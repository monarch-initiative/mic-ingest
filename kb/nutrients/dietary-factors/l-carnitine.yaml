nutrient_interactions:
  - name: Vitamin C and Carnitine Synthesis
    nutrient_term:
      preferred_term: ascorbic acid
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
    interaction_type: SYNERGISTIC
    description: |
      Vitamin C (ascorbic acid) is a cofactor for two enzymes involved in
      carnitine biosynthesis. Vitamin C deficiency can impair carnitine synthesis.
    mic_references:
      - 7

recommendations:
  notes: |
    No dietary reference intake (DRI) has been established for carnitine because
    healthy individuals synthesize adequate amounts. Omnivorous diets provide
    23-135 mg/day, while vegetarian diets provide approximately 1 mg/day.
    Supplemental doses of 0.5-2 g/day have been used in clinical studies.

toxicity:
  name: L-Carnitine Safety
  description: |
    L-carnitine is generally well tolerated. Gastrointestinal symptoms may occur
    at high doses. Concerns have been raised about gut microbiota conversion of
    carnitine to trimethylamine-N-oxide (TMAO), which has been associated with
    cardiovascular risk in some studies.
  adverse_effects:
    - name: Gastrointestinal symptoms
      description: Nausea, vomiting, abdominal cramps, and diarrhea at high doses
    - name: Fishy body odor
      description: May occur with high doses due to trimethylamine production

references:
  - reference: PMID:15591001
    title: "Kinetics, pharmacokinetics, and regulation of L-carnitine and acetyl-L-carnitine metabolism"
