name: L-Carnitine
nutrient_term:
  preferred_term: L-carnitine
  term:
    id: CHEBI:17126
    label: carnitine
category: dietary_factor
source_url: https://lpi.oregonstate.edu/mic/dietary-factors/L-carnitine
alternate_names:
  - Carnitine
  - Levocarnitine
  - Acetyl-L-carnitine (ALCAR)
description: |
  L-carnitine is a quaternary ammonium compound that plays an essential role in
  energy metabolism by transporting long-chain fatty acids into mitochondria for
  beta-oxidation. Healthy individuals synthesize sufficient L-carnitine from the
  amino acids lysine and methionine (approximately 0.16-0.48 mg/kg body weight/day).
  Dietary sources include meat, poultry, fish, and dairy products. Vegetarians
  consume significantly less dietary carnitine but generally maintain adequate
  plasma levels through endogenous synthesis.

functions:
  - name: Fatty Acid Transport into Mitochondria
    description: |
      L-carnitine is essential for transporting long-chain fatty acids across the
      inner mitochondrial membrane for beta-oxidation. It forms acylcarnitine esters
      via carnitine palmitoyltransferase I (CPT I), which are then transported by
      carnitine-acylcarnitine translocase and regenerated by CPT II.
    biological_processes:
      - preferred_term: fatty acid beta-oxidation
        term:
          id: GO:0006635
          label: fatty acid beta-oxidation
    mic_references:
      - 5
      - 6
    evidence:
      - reference: PMID:15591001
        supports: SUPPORT
        snippet: "In mammals, the carnitine pool consists of nonesterified L-carnitine and many acylcarnitine esters. Of these esters, acetyl-L-carnitine is quantitatively and functionally the most significant"
        explanation: Confirms central role of carnitine in fatty acid metabolism

  - name: Acetyl Group Buffer
    description: |
      Carnitine helps maintain the ratio of acetyl-CoA to free CoA by forming
      acetyl-L-carnitine. This buffering function is important for maintaining
      normal mitochondrial function, especially in tissues with high energy demands.
    mic_references:
      - 5

  - name: Antioxidant Activity
    description: |
      L-carnitine and acetyl-L-carnitine have been shown to have antioxidant
      properties in vitro, potentially protecting mitochondrial membranes from
      oxidative damage.
    mic_references:
      - 15

deficiency:
  name: L-Carnitine Deficiency
  description: |
    Nutritional carnitine deficiency is rare in healthy individuals because of
    efficient endogenous synthesis and renal reabsorption. However, primary
    systemic carnitine deficiency (a genetic disorder affecting the carnitine
    transporter OCTN2) causes severe symptoms. Secondary deficiency can occur
    with certain metabolic disorders, chronic kidney disease requiring dialysis,
    and some medications.
  sequelae:
    - name: Cardiomyopathy
      phenotype_term:
        preferred_term: cardiomyopathy
        term:
          id: HP:0001638
          label: Cardiomyopathy
      frequency: VERY_FREQUENT
      context: In primary systemic carnitine deficiency
      mic_references:
        - 34
    - name: Skeletal myopathy
      phenotype_term:
        preferred_term: myopathy
        term:
          id: HP:0003198
          label: Myopathy
      frequency: VERY_FREQUENT
      context: In primary systemic carnitine deficiency
      mic_references:
        - 34
    - name: Hypoketotic hypoglycemia
      phenotype_term:
        preferred_term: hypoketotic hypoglycemia
        term:
          id: HP:0001985
          label: Hypoketotic hypoglycemia
      frequency: FREQUENT
      context: In primary systemic carnitine deficiency
      mic_references:
        - 34
    - name: Hepatomegaly
      phenotype_term:
        preferred_term: hepatomegaly
        term:
          id: HP:0002240
          label: Hepatomegaly
      frequency: FREQUENT
      context: In primary systemic carnitine deficiency
      mic_references:
        - 34
  at_risk_groups:
    - name: Primary systemic carnitine deficiency
      description: |
        Genetic disorder caused by mutations in SLC22A5 (OCTN2) affecting
        carnitine transport. Requires lifelong carnitine supplementation.
      mic_references:
        - 33
        - 34
    - name: Patients on hemodialysis
      description: |
        Chronic kidney disease patients on hemodialysis often develop carnitine
        deficiency due to dialytic losses.
      mic_references:
        - 38
    - name: Strict vegetarians
      description: |
        Vegetarians have lower dietary carnitine intake but generally maintain
        adequate plasma levels through endogenous synthesis and efficient
        renal reabsorption.
      mic_references:
        - 9

disease_associations:
  - name: Heart Failure
    disease_term:
      preferred_term: heart failure
      term:
        id: MONDO:0005252
        label: heart failure
    relationship_type: THERAPEUTIC
    description: |
      L-carnitine and propionyl-L-carnitine supplementation may improve exercise
      tolerance and symptoms in patients with heart failure, though results are
      mixed across trials.
    mic_references:
      - 44
      - 45
      - 46

  - name: Myocardial Infarction
    disease_term:
      preferred_term: myocardial infarction
      term:
        id: MONDO:0005068
        label: myocardial infarction
    relationship_type: THERAPEUTIC
    description: |
      Meta-analyses suggest L-carnitine supplementation after acute myocardial
      infarction may reduce mortality and ventricular arrhythmias.
    mic_references:
      - 41
      - 42

  - name: Peripheral Arterial Disease
    disease_term:
      preferred_term: peripheral arterial disease
      term:
        id: MONDO:0005294
        label: peripheral vascular disease
    relationship_type: THERAPEUTIC
    description: |
      Propionyl-L-carnitine supplementation has been shown to improve walking
      distance and symptoms in patients with intermittent claudication.
    mic_references:
      - 51
      - 52
  - name: Alzheimer Disease
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: THERAPEUTIC
    description: |
      Serum acetyl-L-carnitine levels progressively decrease along the continuum
      from cognitively healthy subjects to those with Alzheimer's disease. Clinical
      trials of acetyl-L-carnitine (ALCAR, 1-3 g/day) in AD patients have shown
      mixed results: early smaller trials suggested benefit, while later larger
      trials found little effect. However, meta-analyses of 16-21 trials found
      ALCAR was superior to placebo on clinical global impression at 12 and 24
      weeks, and showed advantages on several psychometric tests assessing global
      functioning, attention, and memory.
    population_context: Patients with mild cognitive impairment or mild Alzheimer disease
    mic_references:
      - 97
      - 98
      - 99
      - 100
      - 101
      - 102
      - 103
      - 104
      - 105
    evidence:
      - reference: PMID:27196316
        supports: SUPPORT
        snippet: "The concentrations of acetyl-L-carnitine progressively decreased passing from healthy subjects group (mean±SD, 5.6±1.3 μmol/L) to subjective memory complaint (4.3±0.9 μmol/L), mild cognitive impairment (4.0±0.53 μmol/L), up to Alzheimer's disease (3.5±0.6 μmol/L) group (p<0.001)"
        explanation: Study showing progressive decline in serum acetyl-L-carnitine across the cognitive impairment continuum to Alzheimer's disease
      - reference: PMID:12598816
        supports: SUPPORT
        snippet: "The beneficial effects were seen on both the clinical scales and the psychometric tests. The advantage for Alcar was seen by the time of the first assessment at 3 months and increased over time."
        explanation: Meta-analysis of 21 double-blind RCTs showing ALCAR significantly outperformed placebo on integrated clinical and psychometric measures in mild cognitive impairment and mild AD
      - reference: PMID:12804452
        supports: PARTIAL
        snippet: "There is evidence for benefit of ALC on clinical global impression, but there was no evidence using objective assessments in any other area of outcome."
        explanation: Cochrane review of 11 trials found benefit on Clinical Global Impression at 12 and 24 weeks but no evidence of benefit on objective cognitive assessments

