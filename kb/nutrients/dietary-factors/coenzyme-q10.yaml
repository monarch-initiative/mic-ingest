recommendations:
  notes: |
    No dietary reference intake has been established for CoQ10 because it is
    synthesized endogenously. Average dietary intake is 3-6 mg/day. Supplemental
    doses in clinical studies typically range from 100-300 mg/day for general use,
    and higher doses (5-50 mg/kg/day) for primary CoQ10 deficiency.

toxicity:
  name: Coenzyme Q10 Safety
  description: |
    CoQ10 appears to be very safe with no significant adverse effects reported
    at doses up to 3,000 mg/day. Gastrointestinal symptoms may occur at doses
    above 200 mg/day. CoQ10 may reduce the effectiveness of warfarin.
  adverse_effects:
    - name: Gastrointestinal symptoms
      description: Nausea, diarrhea, and appetite suppression with high doses
    - name: Drug interaction with warfarin
      description: May reduce anticoagulant effect due to structural similarity to vitamin K

references:
  - reference: PMID:11771674
    title: "Biochemical functions of coenzyme Q10"
