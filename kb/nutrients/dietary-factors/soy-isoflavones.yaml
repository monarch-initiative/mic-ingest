name: Soy Isoflavones
nutrient_term:
  preferred_term: isoflavones
  term:
    id: CHEBI:38757
    label: isoflavones
category: dietary_factor
source_url: https://lpi.oregonstate.edu/mic/dietary-factors/phytochemicals/soy-isoflavones
alternate_names:
  - Genistein
  - Daidzein
  - Glycitein
  - Phytoestrogens
description: |
  Soy isoflavones are phytoestrogens—plant compounds structurally similar to
  estrogen. They exist as glycosides in raw soybeans and convert to aglycones
  (genistein, daidzein, glycitein) during digestion. These compounds have dual
  activity: they can mimic estrogen in some tissues while blocking it in others,
  depending on which estrogen receptor they activate.

functions:
  - name: Estrogenic and anti-estrogenic activity
    description: |
      Soy isoflavones preferentially bind estrogen receptor beta (ERβ),
      producing tissue-selective effects. They can act as estrogen agonists
      in some tissues and antagonists in others, depending on receptor
      distribution and endogenous estrogen levels.
    mic_references:
      - 8
      - 9

  - name: Equol production
    description: |
      The intestinal bacteria of some individuals convert daidzein to equol,
      a metabolite with greater estrogenic activity. Approximately 25-30%
      of Western adults produce equol versus 50-60% in Asian populations.
    mic_references:
      - 16
      - 17

deficiency:
  name: Soy isoflavone deficiency
  description: |
    Soy isoflavones are not essential nutrients, and no deficiency syndrome
    has been identified.
  notes: Average intake in Asia is 25-50 mg/day versus under 1 mg/day in Western countries.

toxicity:
  name: Soy isoflavone toxicity
  description: |
    Moderate consumption of whole soy foods appears safe. Soy-based infant
    formula shows no convincing evidence of adverse effects compared to
    cow's milk formula. Current evidence suggests breast cancer survivors
    should not be discouraged from consuming soy foods in moderation.
  mic_references:
    - 104
    - 105

