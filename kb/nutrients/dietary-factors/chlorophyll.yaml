disease_associations:
  - name: Aflatoxin-associated hepatocellular carcinoma
    disease_term:
      preferred_term: hepatocellular carcinoma
      term:
        id: MONDO:0007256
        label: hepatocellular carcinoma
    relationship_type: PROTECTIVE
    direction: DECREASED
    population_context: populations with high dietary aflatoxin exposure
    description: |
      In a randomized, placebo-controlled trial in a high-risk Chinese population,
      supplementation with 100 mg SCC three times daily before meals reduced urinary
      levels of AFB1-N7-guanine (a biomarker of aflatoxin-induced DNA damage) by 55%
      after 16 weeks. Animal studies have shown that chlorophyllin inhibits
      aflatoxin-induced liver cancer in trout and rats.
    mic_references:
      - 26
      - 27
      - 28
      - 29
      - 32
    evidence:
      - reference: PMID:19952359
        supports: SUPPORT
        snippet: "CHL reduced excretion of aflatoxin B(1) (AFB(1))-DNA repair products in Chinese unavoidably exposed to dietary AFB(1)"
        explanation: Human evidence showing chlorophyllin reduces aflatoxin biomarker damage
    notes: |
      It is not yet known whether chlorophyll or chlorophyllin will be useful in
      cancer prevention for people not exposed to significant levels of dietary
      aflatoxin (such as most people in the US).

nutrient_interactions:
  - name: Metal absorption
    nutrient_term:
      preferred_term: minerals
    interaction_type: AFFECTS_METABOLISM
    description: |
      Some concern exists that chlorophyllin may bind essential dietary minerals
      such as iron and reduce their absorption. One human study with sodium iron
      chlorophyllin found no negative effects on iron status, but more research
      is needed on potential effects of long-term chlorophyllin supplementation
      on mineral absorption.
    mic_references:
      - 23
      - 24
      - 25

recommendations:
  notes: |
    No recommended dietary allowance exists for chlorophyll. Chlorophyllin supplements
    (100-300 mg/day) have been used in clinical studies. Consuming green vegetables
    provides natural chlorophyll along with other beneficial nutrients.

references:
  - reference: PMID:19952359
    title: Effects of chlorophyll and chlorophyllin on low-dose aflatoxin B(1) pharmacokinetics in human volunteers
    findings:
      - statement: Chlorophyll and chlorophyllin reduce aflatoxin absorption in humans
        supporting_text: "Chla and CHL treatment each significantly impeded AFB(1) absorption and reduced Cmax and AUCs"
  - reference: PMID:11767414
    title: Scavenging of reactive oxygen species by chlorophyllin
    findings:
      - statement: Chlorophyllin scavenges various reactive oxygen species
        supporting_text: "CHL has potent antioxidant ability involving scavenging of various physiologically important ROS"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Chlorophyll and Metallo-Chlorophyll Derivatives.
  The MIC page focuses particularly on sodium copper chlorophyllin (SCC) and its
  potential role in cancer prevention through binding dietary carcinogens.
