name: Chlorophyll and Metallo-Chlorophyll Derivatives
nutrient_term:
  preferred_term: chlorophyll
  term:
    id: CHEBI:28966
    label: chlorophyll
category: dietary_factor
source_url: https://lpi.oregonstate.edu/mic/dietary-factors/phytochemicals/chlorophyll-metallo-chlorophyll-derivatives
alternate_names:
  - Chlorophyll a
  - Chlorophyll b
  - Sodium copper chlorophyllin
  - Chlorophyllin
  - SCC
description: |
  Chlorophyll is the pigment that gives plants and algae their green color. Plants use
  chlorophyll to trap light needed for photosynthesis. The basic structure of chlorophyll
  is a porphyrin ring similar to heme in hemoglobin, with magnesium as the central atom.
  Chlorophyll a and chlorophyll b represent about 99% of the chlorophyll species found
  in edible plants. Sodium copper chlorophyllin (SCC) is a semi-synthetic mixture of
  water-soluble sodium copper salts derived from chlorophyll, which has been used
  clinically as an internal deodorant and in wound healing for over 50 years.

functions:
  - name: Complex formation with carcinogens
    description: |
      Chlorophyll and sodium copper chlorophyllin can form tight molecular complexes
      with certain chemicals known or suspected to cause cancer, including polyaromatic
      hydrocarbons found in tobacco smoke, some heterocyclic amines found in cooked
      meat, and aflatoxin-B1. This binding may interfere with gastrointestinal
      absorption of potential carcinogens.
    mic_references:
      - 8
      - 9
      - 10
      - 11
      - 12
    evidence:
      - reference: PMID:19952359
        supports: SUPPORT
        snippet: "Chla and CHL treatment each significantly impeded AFB(1) absorption and reduced Cmax and AUCs (plasma and urine) in one or more subjects"
        explanation: Demonstrates that chlorophyll and chlorophyllin reduce aflatoxin absorption in humans

  - name: Antioxidant activity
    description: |
      Sodium copper chlorophyllin can neutralize several physically relevant oxidants
      in vitro. Chlorophyllin has been shown to scavenge reactive oxygen species
      including hydroxyl radicals, singlet oxygen, and hydrogen peroxide. The
      relevance of these findings to humans is not fully established.
    biological_processes:
      - preferred_term: response to oxidative stress
        term:
          id: GO:0006979
          label: response to oxidative stress
    mic_references:
      - 13
      - 14
      - 15
      - 19
    evidence:
      - reference: PMID:11767414
        supports: SUPPORT
        snippet: "CHL has potent antioxidant ability involving scavenging of various physiologically important ROS"
        explanation: Demonstrates chlorophyllin's ability to scavenge reactive oxygen species

  - name: Modification of carcinogen metabolism
    description: |
      Chlorophyllin may modulate the metabolism of carcinogens by inhibiting
      cytochrome P450 enzymes involved in pro-carcinogen activation, though
      this has primarily been demonstrated in cell culture studies.
    mic_references:
      - 20
      - 21

deficiency:
  name: Chlorophyll deficiency
  description: |
    Chlorophyll is not considered an essential nutrient, and no deficiency
    syndrome has been identified. Dietary chlorophyll intake depends on
    consumption of green vegetables.
  notes: |
    Chlorophyll is not an essential nutrient for humans. The health benefits
    associated with chlorophyll consumption are likely related to its
    biological activities rather than prevention of deficiency.

toxicity:
  name: Chlorophyll toxicity
  description: |
    Natural chlorophylls are not known to be toxic, and no toxic effects have been
    attributed to chlorophyllin despite more than 50 years of clinical use in humans.
    Minor side effects may include green discoloration of urine or feces, yellow or
    black discoloration of the tongue, and occasional diarrhea. Safety has not been
    tested in pregnant or lactating women.
  mic_references:
    - 11
    - 33
    - 39
    - 55
    - 56
    - 57

