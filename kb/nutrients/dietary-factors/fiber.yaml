recommendations:
  ai:
    - population: men 19-50 years
      amount: "38 g/day"
    - population: women 19-50 years
      amount: "25 g/day"
    - population: men 51+ years
      amount: "30 g/day"
    - population: women 51+ years
      amount: "21 g/day"
    - population: pregnancy
      amount: "28 g/day"
    - population: lactation
      amount: "29 g/day"
  notes: |
    The Adequate Intake is based on 14 g fiber per 1,000 kcal, derived from
    research demonstrating protection against coronary heart disease. The mean
    intake in the United States is only 17 g/day, with only 5% of the population
    meeting the AI.

toxicity:
  name: Fiber Safety
  description: |
    Dietary fiber from food sources is generally safe. Abrupt increases in fiber
    intake may cause gastrointestinal symptoms including cramping, bloating, and
    gas. Gradual increases with adequate fluid intake are recommended.
  adverse_effects:
    - name: Gastrointestinal discomfort
      description: Bloating, cramping, and gas with rapid fiber increases
    - name: Intestinal obstruction
      description: Rare cases with very high wheat bran intake, mainly in those with impaired motility

references:
  - reference: PMID:26514720
    title: "Position of the Academy of Nutrition and Dietetics: Health Implications of Dietary Fiber"
  - reference: PMID:10359388
    title: "Long-term intake of dietary fiber and decreased risk of coronary heart disease among women"
