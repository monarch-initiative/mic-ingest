drug_interactions:
  - name: Proton-Pump Inhibitors
    drug_term:
      preferred_term: omeprazole
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: |
      Proton-pump inhibitors decrease stomach acid secretion required for
      release of vitamin B12 from food (but not from supplements). Long-term
      use can decrease blood vitamin B12 concentrations.
    mic_references:
      - 137
      - 138
      - 139
      - 140

  - name: Metformin
    drug_term:
      preferred_term: metformin
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: |
      Metformin may decrease vitamin B12 absorption by affecting calcium-dependent
      uptake of the intrinsic factor-B12 complex. Long-term use can reduce
      serum cobalamin concentrations.
    mic_references:
      - 143
      - 144
      - 146

  - name: H2-Receptor Antagonists
    drug_term:
      preferred_term: cimetidine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: LOW
    description: |
      H2-receptor antagonists decrease absorption of vitamin B12 from food
      by reducing gastric acid secretion.
    mic_references:
      - 141
      - 142

  - name: Nitrous Oxide
    drug_term:
      preferred_term: nitrous oxide
    interaction_type: ANTAGONISTIC
    clinical_significance: HIGH
    description: |
      Nitrous oxide oxidizes and inactivates vitamin B12, inhibiting both
      vitamin B12-dependent enzymes. Can produce megaloblastic anemia and
      neuropathy, particularly in chronic recreational users.
    mic_references:
      - 7
      - 18

toxicity:
  name: Vitamin B12 Toxicity
  description: |
    No toxic effects have been associated with large intakes of vitamin B12
    from food or supplements in healthy individuals. The Food and Nutrition
    Board did not establish a tolerable upper intake level (UL) for vitamin B12
    because of its low potential for toxicity.
  mic_references:
    - 21

recommendations:
  rda:
    - population: Infants 0-6 months
      amount: "0.4 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "0.5 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-3 years
      amount: "0.9 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Children 4-8 years
      amount: "1.2 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Children 9-13 years
      amount: "1.8 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Adolescents 14-18 years
      amount: "2.4 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Adults 19+ years
      amount: "2.4 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
      notes: Adults over 50 should get vitamin B12 from supplements or fortified foods
    - population: Pregnancy
      amount: "2.6 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Lactation
      amount: "2.8 mcg/day"
      source: Food and Nutrition Board, Institute of Medicine

notes: |
  Only bacteria and archaea can synthesize vitamin B12. Animal products are the
  primary dietary source. The average dietary intake in the US is 5.9 mcg/day
  for adult men and 3.8 mcg/day for adult women. Older adults and vegans should
  use vitamin B12 fortified foods and supplements. Folic acid supplementation
  can mask vitamin B12 deficiency by correcting anemia while neurological
  damage progresses.
