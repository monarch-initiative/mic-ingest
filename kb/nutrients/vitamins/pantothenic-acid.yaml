nutrient_interactions:
  - name: Biotin Competition for Absorption
    description: |
      Biotin and pantothenic acid share the same intestinal transporter, the human
      sodium-dependent multivitamin transporter (hSMVT), and may compete for absorption.
    nutrient_term:
      preferred_term: biotin
      term:
        id: CHEBI:15956
        label: biotin
    interaction_type: COMPETES_FOR_TRANSPORT
    mic_references:
      - 39
      - 40
      - 50

drug_interactions: []

disease_associations:
  - name: Pantothenate Kinase-Associated Neurodegeneration (PKAN)
    description: |
      Autosomal recessive mutations in the PANK2 gene result in impaired synthesis of
      4'-phosphopantetheine and coenzyme A. This rare disorder is associated with iron
      accumulation in the brain and characterized by visual and intellectual impairments,
      dystonia, speech abnormalities, behavioral difficulties, and personality disorders.
      Two forms exist: classic PKAN with onset before age 10, and atypical PKAN with
      onset after age 10.
    disease_term:
      preferred_term: pantothenate kinase-associated neurodegeneration
      term:
        id: MONDO:0009319
        label: pantothenate kinase-associated neurodegeneration
    relationship_type: DEFICIENCY_CAUSES
    population_context: Individuals with PANK2 mutations
    mic_references:
      - 16
      - 17
      - 18
      - 19
    evidence:
      - reference: PMID:24209433
        supports: SUPPORT
        snippet: "PKAN and PLAN are autosomal recessive NBIA disorders due to mutations in PANK2 and PLA2G6, respectively"
        explanation: Confirms PKAN is caused by PANK2 mutations

  - name: Wound Healing
    description: |
      Calcium D-pantothenate and pantothenol may accelerate wound healing. In vitro studies
      show increased cell proliferation and migration in cultured skin fibroblasts. Topical
      dexpanthenol has shown some benefit in wound healing, though evidence from human
      studies is limited and inconclusive.
    disease_term:
      preferred_term: wound healing
    relationship_type: THERAPEUTIC
    population_context: Limited evidence from small studies
    mic_references:
      - 23
      - 24
      - 25
      - 26
      - 27
      - 28
      - 29

  - name: Hypercholesterolemia
    description: |
      Pantethine, a pantothenic acid derivative, has been shown to lower serum cholesterol
      and lipid concentrations in randomized controlled trials. Treatment with 600-900 mg/day
      of pantethine significantly lowered LDL cholesterol, total cholesterol, and
      apolipoprotein B in individuals at low-to-moderate cardiovascular risk. Pantethine
      is not a vitamin and medical supervision is recommended.
    disease_term:
      preferred_term: hypercholesterolemia
    relationship_type: THERAPEUTIC
    population_context: Individuals at low-to-moderate cardiovascular risk
    mic_references:
      - 30
      - 31
      - 32
      - 33
    evidence:
      - reference: PMID:21925346
        supports: SUPPORT
        snippet: "pantethine demonstrated significant (P < .005) and sustained reductions (from baseline to week 16) in TC (6 mg/dL, 0.16 mmol/L, 3%), LDL-C (4 mg/dL, 0.10 mmol/L, 4%), and apolipoprotein B"
        explanation: Confirms pantethine reduces cholesterol in clinical trial

  - name: Alzheimer's Disease
    description: |
      Case-control studies have documented cerebral pantothenic acid deficiency in patients
      with Alzheimer's disease, suggesting a potential link between pantothenic acid
      metabolism and neurodegeneration.
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Observational evidence only
    mic_references:
      - 20

  - name: Huntington's Disease
    description: |
      Case-control studies have documented cerebral pantothenic acid deficiency in patients
      with Huntington's disease, suggesting pantothenic acid metabolism may be perturbed
      in this neurodegenerative condition.
    disease_term:
      preferred_term: Huntington disease
      term:
        id: MONDO:0007739
        label: Huntington disease
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Observational evidence only
    mic_references:
      - 21

