    Pantothenic acid recommendations are expressed as Adequate Intake (AI) rather than RDA
    because there was insufficient evidence to establish an Estimated Average Requirement.
    The AI is based on observed dietary intakes in healthy population groups. No Tolerable
    Upper Intake Level (UL) has been established due to lack of adverse event reports.

bioavailability:
  description: |
    Pantothenic acid is available in foods usually as a component of coenzyme A and
    4'-phosphopantetheine. Upon ingestion, dietary coenzyme A and phosphopantetheine
    are hydrolyzed to pantothenic acid prior to intestinal absorption. Biotin and
    pantothenic acid share the same intestinal transporter (hSMVT). Intestinal bacteria
    can synthesize pantothenic acid, though the contribution to human requirements is unclear.
  mic_references:
    - 4
    - 38
    - 39
    - 40

references:
  - reference: PMID:25110011
    title: Coenzyme A biosynthetic machinery in mammalian cells
    findings:
      - statement: CoA biosynthesis requires pantothenic acid
        supporting_text: "The biosynthesis of CoA requires pantothenic acid, cysteine and ATP, and involves five enzymatic steps"
  - reference: PMID:25053359
    title: The growing landscape of lysine acetylation links metabolism and cell signalling
    findings:
      - statement: Acetyl-CoA is required for protein acetylation
        supporting_text: "Lysine acetylation is a conserved protein post-translational modification that links acetyl-coenzyme A metabolism and cellular signalling"
  - reference: PMID:24292120
    title: The phosphopantetheinyl transferases
    findings:
      - statement: PPTases install 4'-phosphopantetheine on carrier proteins
        supporting_text: "this class of enzymes that post-translationally install a 4'-phosphopantetheine arm on various carrier proteins"
  - reference: PMID:24209433
    title: PKAN and PLAN review
    findings:
      - statement: PKAN is caused by PANK2 mutations
        supporting_text: "PKAN and PLAN are autosomal recessive NBIA disorders due to mutations in PANK2 and PLA2G6, respectively"
  - reference: PMID:21925346
    title: Pantethine favorably alters LDL cholesterol metabolism
    findings:
      - statement: Pantethine supplementation lowers cholesterol
        supporting_text: "pantethine demonstrated significant (P < .005) and sustained reductions (from baseline to week 16) in TC, LDL-C, and apolipoprotein B"

notes: |
