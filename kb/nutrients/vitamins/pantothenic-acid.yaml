    - 15

toxicity:
  name: Pantothenic Acid Toxicity
  description: |
    Pantothenic acid is not known to be toxic in humans. The only adverse effect noted was
    diarrhea resulting from very high intakes of 10 to 20 g/day of calcium D-pantothenate.
    Due to the lack of reports of adverse effects, the Food and Nutrition Board did not
    establish a tolerable upper intake level (UL) for pantothenic acid. Pantethine is
    generally well tolerated in doses up to 1,200 mg/day, though gastrointestinal side
    effects such as nausea and heartburn have been reported.
  adverse_effects:
    - name: Diarrhea
      description: Reported with very high intakes of 10 to 20 g/day
      severity: mild
    - name: Eosinophilic pleuropericardial effusion
      description: |
        One case report of life-threatening effusion in an elderly woman who took 10 mg/day
        of biotin and 300 mg/day of pantothenic acid for two months
      severity: severe
    - name: Allergic contact dermatitis
      description: Reported with topical dexpanthenol-containing ointments
      severity: mild
  mic_references:
    - 22
    - 42
    - 43
    - 44
    - 45
    - 46
    - 47
    - 48
    - 49

