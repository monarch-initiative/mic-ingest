name: Pantothenic Acid
nutrient_term:
  preferred_term: pantothenic acid
  term:
    id: CHEBI:7916
    label: pantothenic acid
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/pantothenic-acid
alternate_names:
  - Vitamin B5
  - Calcium pantothenate
  - Pantothenate
description: |
  Pantothenic acid, also known as vitamin B5, is a water-soluble B vitamin essential to all
  forms of life. It is a precursor in the biosynthesis of coenzyme A (CoA), which is an
  essential coenzyme in a variety of biochemical reactions that sustain life, including
  energy production from fats, carbohydrates, and proteins. The 4'-phosphopantetheinyl
  moiety of coenzyme A is also required for the biological activity of several proteins,
  including acyl-carrier protein involved in fatty acid synthesis. Pantothenic acid is
  ubiquitously found in foods of plant and animal origin, and dietary deficiency is very rare.

functions:
  - name: Coenzyme A Biosynthesis
    description: |
      Pantothenic acid is a precursor in the biosynthesis of coenzyme A (CoA). Pantothenic
      acid kinase 2 (PANK2) catalyzes the initial step of phosphorylation of pantothenic
      acid to 4'-phosphopantothenic acid. The subsequent reactions produce the intermediate
      4'-phosphopantetheine and ultimately coenzyme A.
    biological_processes:
      - preferred_term: coenzyme A biosynthetic process
        term:
          id: GO:0015937
          label: coenzyme A biosynthetic process
    genes:
      - preferred_term: PANK2
        description: Pantothenate kinase 2, catalyzes rate-limiting step in CoA biosynthesis
        term:
          id: hgnc:15894
          label: PANK2
    mic_references:
      - 2
      - 4
    evidence:
      - reference: PMID:25110011
        supports: SUPPORT
        snippet: "The biosynthesis of CoA requires pantothenic acid, cysteine and ATP, and involves five enzymatic steps that are highly conserved from prokaryotes to eukaryotes"
        explanation: Confirms pantothenic acid is required for CoA biosynthesis

  - name: Energy Metabolism via Coenzyme A
    description: |
      Coenzyme A reacts with acyl groups, giving rise to thioester derivatives such as
      acetyl-CoA, succinyl-CoA, malonyl-CoA, and HMG-CoA. These derivatives are required
      for reactions that generate energy from the degradation of dietary fat, carbohydrates,
      and proteins. Acetyl-CoA and succinyl-CoA are involved in the citric acid cycle.
    biological_processes:
      - preferred_term: fatty acid metabolic process
        term:
          id: GO:0006631
          label: fatty acid metabolic process
      - preferred_term: tricarboxylic acid cycle
        term:
          id: GO:0006099
          label: tricarboxylic acid cycle
    mic_references:
      - 5
    evidence:
      - reference: PMID:25110011
        supports: SUPPORT
        snippet: "CoA (coenzyme A) is an essential cofactor in all living organisms"
        explanation: Confirms CoA is essential for life and metabolism

  - name: Protein Acetylation
    description: |
      Coenzyme A, in the form of acetyl-CoA, provides acetyl groups for protein acetylation.
      Protein acetylation alters protein structure and function, regulating the activity of
      peptide hormones, signaling molecules, transcription factors, and enzymes. Histone
      acetylation plays a key role in regulating gene expression by facilitating transcription.
    biological_processes:
      - preferred_term: protein acetylation
        term:
          id: GO:0006473
          label: protein acetylation
    mic_references:
      - 6
      - 7
    evidence:
      - reference: PMID:25053359
        supports: SUPPORT
        snippet: "Lysine acetylation is a conserved protein post-translational modification that links acetyl-coenzyme A metabolism and cellular signalling"
        explanation: Confirms acetyl-CoA provides acetyl groups for protein acetylation

  - name: 4'-Phosphopantetheinylation
    description: |
      The 4'-phosphopantetheinyl moiety of coenzyme A can be transferred to enzymes in which
      4'-phosphopantetheine is an essential cofactor for their biological activities. In
      mammals, this transfer is catalyzed by a unique phosphopantetheinyl transferase. This
      modification is necessary for converting apo-enzymes into fully active holo-enzymes.
    mic_references:
      - 8
    evidence:
      - reference: PMID:24292120
        supports: SUPPORT
        snippet: "PPTases garnered wide-spread attention being classified as a distinct enzyme superfamily"
        explanation: Confirms phosphopantetheinyl transferases are a distinct enzyme class that install 4'-phosphopantetheine

  - name: Fatty Acid Synthesis via Acyl-Carrier Protein
    description: |
      Within the fatty acid synthase (FAS) complex, the acyl-carrier protein (ACP) requires
      pantothenic acid in the form of 4'-phosphopantetheine for its activity as a carrier
      protein. During fatty acid synthesis, acyl groups are transferred to the sulfhydryl
      group of the 4'-phosphopantetheinyl moiety of ACP.
    biological_processes:
      - preferred_term: fatty acid biosynthetic process
        term:
          id: GO:0006633
          label: fatty acid biosynthetic process
    mic_references:
      - 4
      - 9
    evidence:
      - reference: PMID:24292120
        supports: SUPPORT
        snippet: "this class of enzymes that post-translationally install a 4'-phosphopantetheine arm on various carrier proteins"
        explanation: Confirms 4'-phosphopantetheine is installed on carrier proteins including ACP

deficiency:
  name: Pantothenic Acid Deficiency
  description: |
    Naturally occurring pantothenic acid deficiency in humans is very rare and has been
    observed only in cases of severe malnutrition. WWII prisoners experienced numbness and
    painful burning and tingling in feet that was relieved by pantothenic acid supplementation.
    Experimentally induced deficiency causes headache, fatigue, insomnia, intestinal
    disturbances, and numbness and tingling of hands and feet.
  sequelae:
    - name: Paresthesia
      phenotype_term:
        preferred_term: paresthesia
        term:
          id: HP:0003401
          label: Paresthesia
      frequency: FREQUENT
      context: Numbness and tingling of hands and feet
      mic_references:
        - 5
        - 13

    - name: Fatigue
      phenotype_term:
        preferred_term: fatigue
        term:
          id: HP:0012378
          label: Fatigue
      frequency: FREQUENT
      mic_references:
        - 13
        - 14

    - name: Headache
      phenotype_term:
        preferred_term: headache
        term:
          id: HP:0002315
          label: Headache
      frequency: FREQUENT
      mic_references:
        - 13

    - name: Insomnia
      phenotype_term:
        preferred_term: insomnia
        term:
          id: HP:0100785
          label: Insomnia
      frequency: OCCASIONAL
      mic_references:
        - 13

  at_risk_groups:
    - name: Individuals with severe malnutrition
      description: Only observed in cases of severe malnutrition
      mic_references:
        - 5

  mic_references:
