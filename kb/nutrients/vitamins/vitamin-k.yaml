  notes: |
    The Linus Pauling Institute recommends that adults take a multivitamin/mineral
    supplement and eat at least one cup of dark green leafy vegetables daily.
    Regular consumption of green leafy vegetables should supply adequate vitamin K
    (see Food sources). No tolerable upper intake level (UL) has been established
    for vitamin K.

notes: |
  All newborn infants should receive an intramuscular injection of vitamin K (1 mg)
  at birth to prevent vitamin K deficiency bleeding (VKDB). Breast milk is low in
  vitamin K, and infants who do not receive prophylaxis are at risk for potentially
  fatal intracranial hemorrhage. Individuals taking warfarin or other vitamin K
  antagonists should maintain consistent vitamin K intake rather than avoiding
  vitamin K-rich foods.
