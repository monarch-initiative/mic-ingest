drug_interactions:
  - name: Warfarin and Vitamin K
    drug_term:
      preferred_term: warfarin
    interaction_type: ANTAGONISTIC
    clinical_significance: HIGH
    description: |
      The anticoagulant effect of warfarin and other vitamin K antagonists may be
      compromised by high dietary or supplemental vitamin K intake. Patients on
      warfarin should maintain consistent vitamin K intake and avoid large fluctuations.
    mic_references:
      - 9
      - 10
      - 132
      - 133

  - name: Cholestyramine and Vitamin K
    drug_term:
      preferred_term: cholestyramine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: Cholestyramine and other fat-binding medications may interfere with vitamin K absorption
    mic_references:
      - 137

  - name: Anticonvulsants and Vitamin K
    drug_term:
      preferred_term: anticonvulsant
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      Anticonvulsants like phenytoin may affect vitamin K status and increase
      risk of deficiency in pregnant/breastfeeding women and their infants
    mic_references:
      - 134

nutrient_interactions:
  - name: Vitamin D and Vitamin K
    nutrient_term:
      preferred_term: vitamin D
      term:
        id: CHEBI:27300
        label: vitamin D
    interaction_type: SYNERGISTIC
    description: |
      Vitamins D and K have overlapping roles in bone and cardiovascular health.
      Both are required for optimal calcium homeostasis and bone mineralization.
    mic_references:
      - 3
    evidence:
      - reference: PMID:21155624
        supports: SUPPORT
        snippet: "This review updates vitamin D and K skeletal and cardiovascular benefits and evidence for their synergy of action"
        explanation: Supports synergy between vitamin D and K
      - reference: PMID:23590754
        supports: SUPPORT
        snippet: "Dietary intake of menaquinones accounts for up to 25% of total vitamin K intake and contributes to the biological functions of vitamin K"
        explanation: Menaquinones contribute meaningfully to total vitamin K intake and biological functions, relevant to synergy with vitamin D

  - name: Vitamin E and Vitamin K
    nutrient_term:
      preferred_term: vitamin E
      term:
        id: CHEBI:33234
        label: vitamin E
    interaction_type: ANTAGONISTIC
    description: |
      High doses of vitamin E may antagonize vitamin K and increase bleeding risk,
      particularly in individuals with low vitamin K status or taking anticoagulants.
    mic_references:
      - 137

