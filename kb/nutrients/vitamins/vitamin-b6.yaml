notes: |
  Vitamin B6 is found in a variety of foods including fish, poultry, nuts,
  legumes, potatoes, and bananas. Many plant foods contain pyridoxine glucoside,
  which is only about half as bioavailable as other forms. In the US, average
  dietary intakes are 2.6 mg/day for adult males and 1.7 mg/day for adult
  females, which are above the RDA.
