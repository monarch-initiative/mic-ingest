drug_interactions:
  - name: Isoniazid (Anti-TB Drug)
    drug_term:
      preferred_term: isoniazid
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      Isoniazid and other anti-tuberculosis medications can form complexes
      with vitamin B6 and limit its bioavailability, creating functional
      deficiency.
    mic_references:
      - 7

  - name: Oral Contraceptives
    drug_term:
      preferred_term: oral contraceptive
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: LOW
    description: |
      The estrogen content of oral contraceptives may interfere with vitamin B6
      metabolism, leading to lower plasma PLP levels.
    mic_references:
      - 121

  - name: Levodopa
    drug_term:
      preferred_term: levodopa
    interaction_type: ANTAGONISTIC
    clinical_significance: MODERATE
    description: |
      Anti-parkinsonian drugs like Levodopa can form complexes with vitamin B6.
      Conversely, high doses of vitamin B6 can decrease the efficacy of L-Dopa.
    mic_references:
      - 6
      - 125

  - name: NSAIDs
    drug_term:
      preferred_term: celecoxib
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: LOW
    description: |
      Long-term use of nonsteroidal anti-inflammatory drugs may impair
      vitamin B6 metabolism.
    mic_references:
      - 127

toxicity:
  name: Vitamin B6 Toxicity (Sensory Neuropathy)
  description: |
    Long-term supplementation with very high doses of pyridoxine (typically
    over 1,000 mg/day) may result in painful sensory ataxic neuropathy, which
    can be irreversible. Symptoms include pain and numbness of extremities
    and difficulty walking. The tolerable upper intake level (UL) for adults
    is 100 mg/day.
  adverse_effects:
    - name: Sensory Ataxic Neuropathy
      description: |
        Painful neurological symptoms including numbness and tingling of
        extremities, typically from doses exceeding 1,000 mg/day over
        extended periods.
      severity: moderate
  mic_references:
    - 122
    - 123
    - 124
    - 125

