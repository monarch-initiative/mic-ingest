notes: |
  Whole-grain cereals, legumes, nuts, lean pork, and yeast are rich sources of
  thiamin. Most thiamin is lost during production of white flour and polished
  rice, so these foods are often fortified with thiamin in Western countries.
  In the US, the average dietary thiamin intake is about 2 mg/day for young
  adult men and 1.2 mg/day for young adult women.
