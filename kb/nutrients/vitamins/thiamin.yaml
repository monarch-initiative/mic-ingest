drug_interactions:
  - name: Phenytoin
    drug_term:
      preferred_term: phenytoin
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      Reduced blood concentrations of thiamin have been reported in individuals
      with epilepsy taking phenytoin for long periods of time.
    mic_references:
      - 130

  - name: 5-Fluorouracil
    drug_term:
      preferred_term: fluorouracil
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      5-Fluorouracil, a cancer chemotherapy agent, inhibits the phosphorylation
      of thiamin to TPP.
    mic_references:
      - 131

  - name: Loop Diuretics (Furosemide)
    drug_term:
      preferred_term: furosemide
    interaction_type: INCREASES_EXCRETION
    clinical_significance: MODERATE
    description: |
      Diuretics, especially furosemide, may increase the risk of thiamin
      deficiency in individuals with marginal thiamin intake due to increased
      urinary excretion.
    mic_references:
      - 29
      - 30
      - 31

toxicity:
  name: Thiamin Toxicity
  description: |
    The Food and Nutrition Board did not set a tolerable upper intake level
    (UL) for thiamin because there are no well-established toxic effects from
    consumption of excess thiamin in food or through long-term oral
    supplementation (up to 200 mg/day). A small number of life-threatening
    anaphylactic reactions have been observed with large intravenous doses
    of thiamin.
  mic_references:
    - 37

