name: Thiamin
nutrient_term:
  preferred_term: vitamin B1
  term:
    id: CHEBI:26948
    label: vitamin B1
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/thiamin
alternate_names:
  - Vitamin B1
  - Thiamine
description: |
  Thiamin is a water-soluble B vitamin essential for energy metabolism. The
  active form, thiamin pyrophosphate (TPP), is involved in several enzyme
  functions associated with the metabolism of carbohydrates, branched-chain
  amino acids, and fatty acids. Severe thiamin deficiency leads to beriberi,
  a disease that affects multiple organ systems including the central and
  peripheral nervous systems and the cardiovascular system. Wernicke's
  encephalopathy and Korsakoff's psychosis are neurological complications
  of thiamin deficiency, particularly in individuals who abuse alcohol.

functions:
  - name: Coenzyme in Carbohydrate Metabolism
    description: |
      Thiamin pyrophosphate (TPP) is required as a coenzyme for pyruvate
      dehydrogenase, alpha-ketoglutarate dehydrogenase, and other enzyme
      complexes in the citric acid cycle. These enzymes are critical for
      energy production through glucose metabolism.
    biological_processes:
      - preferred_term: carbohydrate metabolic process
        term:
          id: GO:0005975
          label: carbohydrate metabolic process
    mic_references:
      - 2
      - 4
    evidence:
      - reference: PMID:30151974
        supports: SUPPORT
        snippet: "Thiamine is an essential micronutrient that plays a key role in energy metabolism"
        explanation: Confirms thiamin's essential role in energy metabolism

  - name: Branched-Chain Amino Acid Metabolism
    description: |
      Branched-chain alpha-ketoacid dehydrogenase (BCKDH) requires TPP and
      catalyzes the metabolism of branched-chain amino acids (leucine, isoleucine,
      and valine). These amino acids are eventually degraded to acetyl-CoA and
      succinyl-CoA for the citric acid cycle.
    mic_references:
      - 2
      - 3

  - name: Pentose Phosphate Pathway (Transketolase)
    description: |
      Transketolase catalyzes critical reactions in the pentose phosphate pathway,
      which produces ribose-5-phosphate for nucleotide synthesis and NADPH for
      biosynthetic reactions. Transketolase activity in red blood cells is used
      to assess thiamin nutritional status.
    mic_references:
      - 1
      - 4
      - 5
      - 6
    evidence:
      - reference: PMID:12592403
        supports: SUPPORT
        snippet: "the lipid-soluble thiamine derivative benfotiamine can inhibit these three pathways, as well as hyperglycemia-associated NF-kappaB activation, by activating the pentose phosphate pathway enzyme transketolase, which converts glyceraldehyde-3-phosphate and fructose-6-phosphate into pentose-5-phosphates and other sugars"
        explanation: Confirms that transketolase is a thiamine-dependent pentose phosphate pathway enzyme that converts glycolytic metabolites into pentose-5-phosphates

deficiency:
  name: Beriberi
  phenotype_term:
    preferred_term: Decreased circulating vitamin B1 concentration
    term:
      id: HP:0100503
      label: Decreased circulating vitamin B1 concentration
  description: |
    Beriberi is the disease resulting from severe thiamin deficiency, affecting
    the cardiovascular, muscular, gastrointestinal, and central and peripheral
    nervous systems. Beriberi has been subdivided into dry, wet, cerebral, or
    gastrointestinal forms depending on the systems affected. Thiamin deficiency
    can result from inadequate intake, increased requirements, excessive loss,
    or consumption of anti-thiamin factors in food.
  evidence:
    - reference: PMID:30644592
      supports: SUPPORT
      snippet: "In adults, thiamin deficiency presents as encephalopathy, dry beriberi (with neurological signs and symptoms), or wet beriberi (with cardiovascular signs and symptoms)"
      explanation: Confirms the clinical presentation of thiamin deficiency as dry beriberi (neurological) and wet beriberi (cardiovascular)
    - reference: PMID:30151974
      supports: SUPPORT
      snippet: "Many populations worldwide may be at risk of clinical or subclinical thiamine deficiencies, due to famine, reliance on staple crops with low thiamine content, or food preparation practices, such as milling grains and washing milled rice"
      explanation: Supports that thiamin deficiency can result from inadequate dietary intake patterns including reliance on low-thiamin staple crops
  sequelae:
    - name: Peripheral Neuropathy (Dry Beriberi)
      phenotype_term:
        preferred_term: peripheral neuropathy
        term:
          id: HP:0009830
          label: Peripheral neuropathy
      frequency: FREQUENT
      context: Main feature of dry (paralytic/nervous) beriberi including burning feet syndrome, weakness, and diminished sensation
      mic_references:
        - 8
        - 9
      evidence:
        - reference: PMID:30644592
          supports: SUPPORT
          snippet: "In adults, thiamin deficiency presents as encephalopathy, dry beriberi (with neurological signs and symptoms), or wet beriberi (with cardiovascular signs and symptoms)"
          explanation: Confirms that dry beriberi (with peripheral neurological signs and symptoms) is a primary clinical presentation of adult thiamin deficiency.

    - name: Ataxia
      phenotype_term:
        preferred_term: ataxia
        term:
          id: HP:0001251
          label: Ataxia
      frequency: FREQUENT
      context: Stance and gait ataxia in cerebral beriberi (Wernicke's encephalopathy)
      mic_references:
        - 11
        - 12
      evidence:
        - reference: PMID:26971083
          supports: SUPPORT
          snippet: "The acute stage, WE, refers to the classical clinical presentation of mental status changes, opthalmoplegia, and gait ataxia"
          explanation: Identifies gait ataxia as one of the classical clinical features of Wernicke encephalopathy, the acute neurological manifestation of thiamine deficiency.

    - name: Cardiomegaly (Wet Beriberi)
      phenotype_term:
        preferred_term: cardiomegaly
        term:
          id: HP:0001640
          label: Cardiomegaly
      frequency: FREQUENT
      context: Enlargement of the heart in wet (cardiac) beriberi
      mic_references:
        - 10
      evidence:
        - reference: PMID:30644592
          supports: SUPPORT
          snippet: "In adults, thiamin deficiency presents as encephalopathy, dry beriberi (with neurological signs and symptoms), or wet beriberi (with cardiovascular signs and symptoms)"
          explanation: Confirms that wet beriberi with cardiovascular signs and symptoms (including cardiomegaly) is a clinical presentation of adult thiamin deficiency.

    - name: Congestive Heart Failure
      phenotype_term:
        preferred_term: congestive heart failure
        term:
          id: HP:0001635
          label: Congestive heart failure
      frequency: OCCASIONAL
      context: Ultimate consequence of untreated wet beriberi
      mic_references:
        - 10
      evidence:
        - reference: PMID:30644592
          supports: SUPPORT
          snippet: "the prevalence of thiamin deficiency was found to be increased in patients with severe burns, major surgery, septic shock, end-stage renal disease, and heart failure"
          explanation: Documents an established association between thiamin deficiency and heart failure, the cardiovascular consequence of untreated wet beriberi.

  at_risk_groups:
    - name: Chronic Alcoholics
      description: |
        Alcoholism is the primary cause of thiamin deficiency in industrialized
        countries. Chronic alcohol abuse impairs intestinal absorption and
        utilization of thiamin and increases urinary excretion.
      mic_references:
        - 1
        - 11
        - 132
        - 133
      evidence:
        - reference: PMID:20448146
          supports: SUPPORT
          snippet: "chronic alcohol feeding to rats led to a significant inhibition in carrier-mediated thiamin transport across both the jejunal brush-border membrane and basolateral membrane domains. This was associated with a significant reduction in level of expression of thiamin transporter-1 (THTR-1), but not THTR-2, at the protein and mRNA levels"
          explanation: Demonstrates the molecular mechanism by which chronic alcohol consumption inhibits intestinal thiamin absorption through reduced expression of thiamin transporters

    - name: Individuals with Malabsorption
      description: |
        Patients with bariatric surgery, gastrointestinal malignancies, and
        malabsorption syndromes are at increased risk of thiamin deficiency.
      mic_references:
        - 14
        - 15
        - 16
        - 17

    - name: Patients on Diuretic Therapy
      description: |
        Diuretics, especially furosemide, increase urinary excretion of thiamin
        and may increase the risk of deficiency in patients with marginal intake.
      mic_references:
        - 28
        - 29
        - 30
        - 31

    - name: Patients with Hyperemesis Gravidarum
      description: |
        Severe nausea and vomiting during pregnancy can lead to Wernicke's
        encephalopathy due to thiamin deficiency.
      mic_references:
        - 20
        - 21

    - name: Patients on Hemodialysis
      description: |
        Individuals with kidney failure requiring hemodialysis lose thiamin
        at an increased rate and are at risk for deficiency.
      mic_references:
        - 32

  causes:
    - name: Inadequate Dietary Intake
      description: |
        Common in low-income populations with diets high in carbohydrate and low
        in thiamin (e.g., polished rice). Breastfed infants of thiamin-deficient
        mothers are vulnerable to infantile beriberi.
      mic_references:
        - 2

    - name: Chronic Alcohol Abuse
      description: Impairs intestinal absorption and utilization of thiamin
      mic_references:
        - 1

    - name: Anti-Thiamin Factors
      description: |
        Certain foods contain thiaminases or other anti-thiamin factors that
        inactivate thiamin. These include raw fish, shellfish, betel nuts,
        tea leaves, and fermented fish.
      mic_references:
        - 34
        - 35
        - 36

  mic_references:
    - 1
    - 2
    - 8

disease_associations:
  - name: Congestive Heart Failure
    disease_term:
      preferred_term: congestive heart failure
      term:
        id: MONDO:0005009
        label: congestive heart failure
    relationship_type: THERAPEUTIC
    population_context: CHF patients on diuretic therapy
    description: |
      Loop diuretics used in CHF treatment increase thiamin excretion, potentially
      leading to deficiency. A meta-analysis found 2.5 times higher risk of
      thiamin deficiency in heart failure patients. Some studies suggest thiamin
      supplementation may improve left ventricular ejection fraction, but results
      are inconsistent.
    mic_references:
      - 76
      - 77
      - 78
      - 80
      - 82
      - 83
    evidence:
      - reference: PMID:16412860
        supports: SUPPORT
        snippet: "Thiamin deficiency was more prevalent in CHF patients (33%) compared to control subjects (12%) (p = 0.007). Thiamin deficiency was related to urine thiamin loss (p = 0.03), non-use of thiamin-containing supplements (p = 0.06), and preserved renal function (p = 0.05)"
        explanation: Demonstrates that one-third of hospitalized CHF patients were thiamin deficient, and increased urinary losses contribute to deficiency
      - reference: PMID:26497757
        supports: SUPPORT
        snippet: "TD is more common in HF patients than control subjects (odds ratio 2.53, 95% confidence interval 1.65-3.87). Diuretic use, changes in dietary habits, and altered thiamine absorption and metabolism were identified as possible mechanisms of TD in HF patients"
        explanation: Meta-analysis confirming 2.5-fold higher risk of thiamin deficiency in heart failure patients, consistent with the YAML description

  - name: Alzheimer's Disease
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: THERAPEUTIC
    population_context: Patients with mild-to-moderate AD; evidence inconclusive
    description: |
      Alzheimer's disease is associated with altered glucose metabolism and
      reduced activity of thiamin-dependent enzymes in the brain. Clinical trials
      of thiamin and benfotiamine supplementation have shown limited evidence
      of benefit. Large-scale randomized controlled trials are needed.
    mic_references:
      - 47
      - 48
      - 54
      - 55
      - 56
      - 68
      - 71
      - 72
      - 73
    evidence:
      - reference: PMID:22982063
        supports: SUPPORT
        snippet: "Thiamine-dependent processes are critical in glucose metabolism and are diminished in brains of AD patients at autopsy. Further, the reductions in thiamine-dependent processes are highly correlated to the decline in clinical dementia rating scales"
        explanation: Establishes that thiamine-dependent enzyme activity is reduced in AD brains and correlates with cognitive decline severity
      - reference: PMID:26971083
        supports: SUPPORT
        snippet: "In preclinical models, reduced thiamine can drive AD-like abnormalities, including memory deficits, neuritic plaques, and hyperphosphorylation of tau. Furthermore, excess thiamine diminishes AD-like pathologies"
        explanation: Shows that thiamine deficiency exacerbates AD-like pathology in animal models while thiamine supplementation reduces it
      - reference: PMID:33074237
        supports: PARTIAL
        snippet: "The increase in ADAS-Cog was 43% lower in the benfotiamine group than in the placebo group, indicating less cognitive decline, and this effect was nearly statistically significant (p = 0.125). Worsening in CDR was 77% lower (p = 0.034) in the benfotiamine group compared to the placebo group"
        explanation: Phase IIa RCT showed benfotiamine slowed clinical decline on CDR but the primary cognitive endpoint did not reach statistical significance, supporting the description that evidence is limited

  - name: Diabetes Mellitus and Vascular Complications
    disease_term:
      preferred_term: diabetes mellitus
      term:
        id: MONDO:0005015
        label: diabetes mellitus
    relationship_type: THERAPEUTIC
    population_context: Type 1 and type 2 diabetic patients with vascular complications
    description: |
      Patients with type 1 and type 2 diabetes have markedly reduced plasma
      thiamin concentrations due to increased renal clearance. Thiamin deficiency
      may contribute to vascular complications of diabetes. In animal models,
      benfotiamine blocks major pathways of hyperglycemic damage. A pilot RCT
      showed high-dose thiamin reduced microalbuminuria in type 2 diabetic
      patients.
    mic_references:
      - 40
      - 42
      - 45
      - 46
      - 87
      - 88
      - 89
    evidence:
      - reference: PMID:17676306
        supports: SUPPORT
        snippet: "Plasma thiamine concentration was decreased 76% in type 1 diabetic patients and 75% in type 2 diabetic patients"
        explanation: Demonstrates the high prevalence of low plasma thiamine in both type 1 and type 2 diabetes
      - reference: PMID:19057893
        supports: SUPPORT
        snippet: "In this pilot study, high-dose thiamine therapy produced a regression of UAE in type 2 diabetic patients with microalbuminuria. Thiamine supplements at high dose may provide improved therapy for early-stage diabetic nephropathy"
        explanation: Pilot RCT showing that high-dose thiamine can reduce urinary albumin excretion in type 2 diabetic patients with microalbuminuria

