drug_interactions:
  - name: Cholestyramine and Vitamin E
    drug_term:
      preferred_term: cholestyramine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: Cholestyramine interferes with fat absorption and may decrease vitamin E absorption
    mic_references:
      - 129

  - name: Orlistat and Vitamin E
    drug_term:
      preferred_term: orlistat
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: Orlistat interferes with fat absorption and may decrease vitamin E absorption
    mic_references:
      - 129

  - name: Anticonvulsants and Vitamin E
    drug_term:
      preferred_term: anticonvulsant
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      Phenobarbital, phenytoin, and carbamazepine may lower plasma vitamin E
      concentrations in individuals with epilepsy
    mic_references:
      - 129

  - name: Anticoagulants and Vitamin E
    drug_term:
      preferred_term: warfarin
    interaction_type: ANTAGONISTIC
    clinical_significance: HIGH
    description: |
      High doses of vitamin E may enhance anticoagulant effects and increase
      bleeding risk, especially in individuals taking warfarin or other
      anticoagulant medications
    mic_references:
      - 119
      - 120

nutrient_interactions:
  - name: Vitamin C and Vitamin E
    nutrient_term:
      preferred_term: vitamin C
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
    interaction_type: SYNERGISTIC
    description: |
      Vitamin C can regenerate the alpha-tocopheroxy radical back to alpha-tocopherol,
      helping to maintain vitamin E's antioxidant capacity.
    mic_references:
      - 1

  - name: Vitamin K and Vitamin E
    nutrient_term:
      preferred_term: vitamin K
      term:
        id: CHEBI:28384
        label: vitamin K
    interaction_type: ANTAGONISTIC
    description: |
      High doses of supplemental alpha-tocopherol may interfere with vitamin K
      absorption and thus increase the risk of bleeding.
    mic_references:
      - 23

