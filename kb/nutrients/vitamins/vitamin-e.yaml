name: Vitamin E
nutrient_term:
  preferred_term: vitamin E
  term:
    id: CHEBI:33234
    label: vitamin E
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/vitamin-E
alternate_names:
  - Alpha-tocopherol
  - Tocopherol
  - d-alpha-tocopherol
description: |
  Vitamin E is a fat-soluble vitamin that exists in eight naturally occurring forms:
  four tocopherols (alpha, beta, gamma, delta) and four tocotrienols. The body preferentially
  uses alpha-tocopherol, and only alpha-tocopherol supplementation can reverse vitamin E
  deficiency symptoms. Alpha-tocopherol functions primarily as a chain-breaking antioxidant,
  preventing the propagation of free radicals in membranes and plasma lipoproteins. It is also
  involved in strengthening certain aspects of cell-mediated immunity. Severe deficiency causes
  neurological symptoms including ataxia and peripheral neuropathy.

functions:
  - name: Antioxidant Activity
    description: |
      Alpha-tocopherol is a fat-soluble antioxidant that stops lipid peroxidation in cell
      membranes. It intercepts peroxyl radicals to prevent chain reactions of lipid peroxidation.
      When alpha-tocopherol neutralizes a free radical, it is oxidized to the alpha-tocopheroxy
      radical, which can be regenerated by other antioxidants such as vitamin C.
    biological_processes:
      - preferred_term: antioxidant activity
      - preferred_term: lipid peroxidation
        term:
          id: GO:0034440
          label: lipid oxidation
    mic_references:
      - 1
      - 4
      - 5
    evidence:
      - reference: PMID:24704972
        supports: SUPPORT
        snippet: "The vitamin E family consists of four tocopherols and four tocotrienols. α-Tocopherol (αT) is the predominant form of vitamin E in tissues and its deficiency leads to ataxia in humans"
        explanation: Confirms alpha-tocopherol as predominant form with antioxidant properties

  - name: Protection of LDL from Oxidation
    description: |
      Alpha-tocopherol protects the fats in low-density lipoproteins (LDLs) from oxidation.
      Oxidized LDLs have been implicated in the development of cardiovascular disease.
    biological_processes:
      - preferred_term: lipoprotein metabolism
        term:
          id: GO:0042157
          label: lipoprotein metabolic process
    mic_references:
      - 4
    evidence:
      - reference: PMID:25537066
        supports: SUPPORT
        snippet: "Oxidized low-density lipoprotein (OxLDL) plays an important role in atherogenesis by promoting an inflammatory environment and lipid deposition in the arterial wall"
        explanation: Confirms that oxidized LDL promotes atherosclerosis, supporting the importance of alpha-tocopherol's role in protecting LDL from oxidation

  - name: Cell-Mediated Immunity
    description: |
      Alpha-tocopherol enhances certain aspects of cell-mediated immunity. It can improve
      the formation of immune synapses between T lymphocytes and antigen-presenting cells,
      promoting T cell activation and proliferation.
    biological_processes:
      - preferred_term: T cell activation
        term:
          id: GO:0042110
          label: T cell activation
    mic_references:
      - 6
      - 7
    evidence:
      - reference: PMID:9134944
        supports: SUPPORT
        snippet: "Our results indicate that a level of vitamin E greater than currently recommended enhances certain clinically relevant in vivo indexes of T-cell-mediated function in healthy elderly persons"
        explanation: Clinical trial demonstrating vitamin E enhancement of T cell immunity
      - reference: PMID:17237392
        supports: SUPPORT
        snippet: "Vitamin E increased the percentage of old CD4(+) T cells capable of forming an effective immune synapse"
        explanation: Demonstrates molecular mechanism by which vitamin E restores age-related decline in T cell immune synapse formation

deficiency:
  name: Vitamin E Deficiency
  description: |
    Vitamin E deficiency can be caused by fat malabsorption disorders or by genetic
    abnormalities affecting vitamin E transport. Severe deficiency results mainly in
    neurological symptoms. The developing nervous system is especially vulnerable, and
    children with severe deficiency at birth can experience irreversible neurological
    damage if not treated promptly. Adults with gastrointestinal disorders affecting
    absorption may not develop symptoms for 10-20 years.
  phenotypes:
    - name: Spinocerebellar Ataxia
      phenotype_term:
        preferred_term: ataxia
        term:
          id: HP:0001251
          label: Ataxia
      frequency: FREQUENT
      context: Impaired balance and coordination
      mic_references:
        - 24
        - 26
      evidence:
        - reference: PMID:24704972
          supports: SUPPORT
          snippet: "α-Tocopherol (αT) is the predominant form of vitamin E in tissues and its deficiency leads to ataxia in humans"
          explanation: Confirms ataxia as consequence of vitamin E deficiency

    - name: Peripheral Neuropathy
      phenotype_term:
        preferred_term: peripheral neuropathy
        term:
          id: HP:0009830
          label: Peripheral neuropathy
      frequency: FREQUENT
      context: Injury to sensory nerves
      mic_references:
        - 24

    - name: Muscle Weakness
      phenotype_term:
        preferred_term: muscle weakness
        term:
          id: HP:0001324
          label: Muscle weakness
      frequency: FREQUENT
      context: Myopathy associated with deficiency
      mic_references:
        - 24

    - name: Retinopathy
      phenotype_term:
        preferred_term: retinopathy
        term:
          id: HP:0000488
          label: Retinopathy
      frequency: OCCASIONAL
      context: Damage to retina of the eye
      mic_references:
        - 24

  at_risk_groups:
    - name: Individuals with Fat Malabsorption
      description: |
        People with conditions affecting fat absorption, such as cystic fibrosis,
        Crohn's disease, or chronic pancreatitis, are at risk for vitamin E deficiency.
      mic_references:
        - 24
        - 25

    - name: Individuals with Genetic Defects in Alpha-TTP
      description: |
        Inherited defects in alpha-tocopherol transfer protein (alpha-TTP) cause
        Ataxia with Vitamin E Deficiency (AVED), requiring lifelong high-dose
        vitamin E supplementation (800-1,500 mg/day).
      mic_references:
        - 26

    - name: Premature Infants
      description: |
        Premature infants have lower body stores of vitamin E and may require
        supplementation to prevent deficiency.
      mic_references:
        - 122

  mic_references:
    - 3
    - 24
    - 25
    - 26

disease_associations:
  - name: Ataxia with Vitamin E Deficiency (AVED)
    disease_term:
      preferred_term: ataxia with vitamin E deficiency
      term:
        id: MONDO:0010188
        label: familial isolated deficiency of vitamin E
    relationship_type: DEFICIENCY_CAUSES
    description: |
      AVED is caused by autosomal recessive mutations in the TTPA gene encoding
      alpha-TTP. Symptoms usually manifest in childhood (ages 5-15 years).
      Lifelong high-dose vitamin E supplementation is required to prevent
      neurological deterioration.
    mic_references:
      - 26

  - name: Immune Function in Elderly
    disease_term:
      preferred_term: impaired immunity
    relationship_type: THERAPEUTIC
    description: |
      Vitamin E supplementation may enhance certain aspects of cell-mediated
      immunity in elderly individuals, potentially reducing risk of respiratory
      tract infections.
    mic_references:
      - 32
      - 33
      - 34
      - 35
      - 36
    evidence:
      - reference: PMID:9134944
        supports: SUPPORT
        snippet: "Subjects consuming 200 mg/d of vitamin E had a 65% increase in DTH and a 6-fold increase in antibody titer to hepatitis B compared with placebo"
        explanation: Shows improved immune response with vitamin E supplementation in elderly
      - reference: PMID:25244230
        supports: SUPPORT
        snippet: "vitamin E supplementation has been shown to be associated with both enhanced resistance to influenza infection in aged mice and reduced risk of acquiring upper respiratory infections in elderly human subjects"
        explanation: Review summarizing clinical evidence that vitamin E supplementation reduces infection risk in the elderly

  - name: Prostate Cancer (SELECT Trial)
    disease_term:
      preferred_term: prostate cancer
      term:
        id: MONDO:0008315
        label: prostate cancer
    relationship_type: RISK_FACTOR
    description: |
      The Selenium and Vitamin E Cancer Prevention Trial (SELECT) found that dietary
      supplementation with vitamin E (400 IU/day of all-rac-alpha-tocopheryl acetate)
      significantly increased the risk of prostate cancer by 17% among healthy men
      compared to placebo over a median of seven years of follow-up.
    mic_references:
      - 64
      - 65
      - 66
    evidence:
      - reference: PMID:21990298
        supports: SUPPORT
        snippet: "Dietary supplementation with vitamin E significantly increased the risk of prostate cancer among healthy men"
        explanation: SELECT trial showed a statistically significant 17% increase in prostate cancer risk with vitamin E supplementation (HR 1.17, 99% CI 1.004-1.36)

  - name: Cardiovascular Disease (HOPE and GISSI Trials)
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disorder
    relationship_type: RISK_FACTOR
    description: |
      Large randomized controlled trials, including the HOPE-TOO trial and the
      GISSI-Prevenzione trial, found no benefit of long-term vitamin E
      supplementation in preventing major cardiovascular events. The HOPE trial
      additionally found that vitamin E may increase the risk of heart failure,
      and the GISSI trial confirmed an increased heart failure risk in patients
      with left ventricular dysfunction.
    mic_references:
      - 47
      - 48
      - 57
      - 58
    evidence:
      - reference: PMID:15769967
        supports: SUPPORT
        snippet: "In patients with vascular disease or diabetes mellitus, long-term vitamin E supplementation does not prevent cancer or major cardiovascular events and may increase the risk for heart failure"
        explanation: HOPE-TOO trial with 7-year follow-up showed no CVD prevention benefit and a possible increased risk of heart failure with vitamin E
      - reference: PMID:16645413
        supports: SUPPORT
        snippet: "Vitamin E treatment, however, was associated with a significant 50% increase (95% confidence intervals 1.03-2.20, P = 0.034) of CHF in patients with left ventricular dysfunction (ejection fraction < 50%)"
        explanation: GISSI-Prevenzione trial found vitamin E significantly increased heart failure risk in post-MI patients with left ventricular dysfunction

  - name: Nonalcoholic Steatohepatitis (PIVENS Trial)
    disease_term:
      preferred_term: nonalcoholic steatohepatitis
      term:
        id: MONDO:0007027
        label: metabolic dysfunction-associated steatohepatitis
    relationship_type: THERAPEUTIC
    description: |
      In the PIVENS trial, vitamin E supplementation (800 IU/day) was superior
      to placebo for the treatment of nonalcoholic steatohepatitis (NASH) in
      adults without diabetes, significantly improving histological features
      including steatosis and lobular inflammation but not fibrosis.
    mic_references:
      - 97
      - 98
    evidence:
      - reference: PMID:20427778
        supports: SUPPORT
        snippet: "Vitamin E was superior to placebo for the treatment of nonalcoholic steatohepatitis in adults without diabetes"
        explanation: PIVENS trial demonstrated significant histological improvement with vitamin E (43% vs 19% improvement rate, P=0.001) in non-diabetic NASH patients

  - name: Alzheimer's Disease and Cognitive Decline
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: THERAPEUTIC
    description: |
      Vitamin E supplementation at high doses (2,000 IU/day) slowed functional
      decline in patients with mild to moderate Alzheimer's disease in the TEAM-AD
      trial. However, the PREADViSE prevention trial found that vitamin E did not
      prevent dementia in cognitively healthy older men. Patients with Alzheimer's
      disease consistently show lower plasma vitamin E levels compared to
      cognitively intact controls.
    mic_references:
      - 103
      - 104
      - 105
      - 111
      - 113
    evidence:
      - reference: PMID:24381967
        supports: SUPPORT
        snippet: "Among patients with mild to moderate AD, 2000 IU/d of alpha tocopherol compared with placebo resulted in slower functional decline"
        explanation: TEAM-AD trial showed vitamin E delayed clinical progression by 19% per year compared to placebo in mild-to-moderate Alzheimer's patients
      - reference: PMID:28319243
        supports: NO_EVIDENCE
        snippet: "Neither supplement prevented dementia. To our knowledge, this is the first study to investigate the long-term association of antioxidant supplement use and dementia incidence among asymptomatic men"
        explanation: PREADViSE trial found no effect of vitamin E supplementation on dementia prevention in cognitively healthy older men
      - reference: PMID:29439339
        supports: SUPPORT
        snippet: "Patients with AD had significantly lower plasma levels of α-carotene, β-carotene, lycopene, lutein, vitamin A, C, and E, and uric acid"
        explanation: Meta-analysis of case-control studies confirming lower plasma vitamin E levels in Alzheimer's patients compared to cognitively intact elderly

  - name: Age-Related Cataract
    disease_term:
      preferred_term: cataract
      term:
        id: MONDO:0005129
        label: cataract
    relationship_type: RISK_FACTOR
    description: |
      Meta-analysis evidence suggests dietary vitamin E intake and higher serum
      tocopherol levels are associated with reduced risk of age-related cataract,
      but supplemental vitamin E alone has not been shown to reduce cataract risk
      in intervention trials.
    mic_references:
      - 70
      - 74
      - 76
      - 77
      - 78
    evidence:
      - reference: PMID:25591715
        supports: PARTIAL
        snippet: "Dietary vitamin E intake, dietary and supplemental vitamin E intake, and high serum tocopherol levels were significantly associated with decreased risk of ARC, the pooled relative risk was 0.73 (95% CI 0.58, 0.92), 0.86 (95% CI 0.75, 0.99) and 0.77 (95% CI 0.66, 0.91), respectively. Supplemental vitamin E intake was non-significantly associated with ARC risk (relative risk=0.92; 95% CI 0.78, 1.07)"
        explanation: Meta-analysis shows dietary vitamin E and serum levels are associated with reduced cataract risk, but supplemental vitamin E alone does not show significant benefit

toxicity:
  name: Vitamin E Toxicity
  description: |
    Few side effects have been noted in adults taking supplements of less than 2,000 mg
    of alpha-tocopherol daily. The most concerning effect is impaired blood clotting,
    which increases hemorrhage risk. The tolerable upper intake level (UL) is set at
    1,000 mg/day for adults (equivalent to 1,500 IU/day of natural alpha-tocopherol or
    1,100 IU/day of synthetic). Some physicians recommend discontinuing high-dose vitamin E
    two to four weeks before elective surgery. Premature infants are especially vulnerable
    to adverse effects and should only receive supplementation under pediatric supervision.
  mic_references:
    - 2
    - 119
    - 120
    - 121
    - 122

