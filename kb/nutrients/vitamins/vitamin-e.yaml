  notes: |
    The Linus Pauling Institute recommends that healthy adults take a daily
    multivitamin/mineral supplement, which usually contains 30 IU of synthetic
    vitamin E or 15 mg of natural alpha-tocopherol. The average US dietary intake
    of alpha-tocopherol is 7.2 mg/day, well below the RDA of 15 mg/day.

notes: |
  Only alpha-tocopherol is defined as vitamin E because only this form can reverse
  deficiency symptoms. The body preferentially retains alpha-tocopherol via the
  alpha-tocopherol transfer protein (alpha-TTP) in the liver. Gamma-tocopherol is
  the major form of vitamin E in the US diet but is not preferentially retained.
  Randomized controlled trials have generally not supported a preventative effect
  of supplemental alpha-tocopherol for chronic diseases like cardiovascular disease
  and cancer.
