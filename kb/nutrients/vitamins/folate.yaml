- name: Childhood Cancers (Acute Lymphoblastic Leukemia)
  description: |
    The incidence of Wilms' tumors and certain types of brain cancers in children
    has decreased since mandatory folic acid fortification of the US grain supply
    in 1998. A meta-analysis of case-control studies found a protective association
    of maternal folic acid supplementation during pregnancy with childhood acute
    lymphoblastic leukemia (ALL; OR 0.75) but not with acute myeloid leukemia or
    childhood brain cancers. A meta-analysis of 66 case-control studies found a
    reduction in the risk of ALL with the MTHFR C677T variant, driven mainly by
    protective associations in Caucasians and Asians.
  disease_term:
    preferred_term: childhood acute lymphoblastic leukemia
