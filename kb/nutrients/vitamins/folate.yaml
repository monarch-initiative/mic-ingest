name: Folate
nutrient_term:
  preferred_term: folate
  term:
    id: CHEBI:67011
    label: folates
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/folate
alternate_names:
  - Vitamin B9
  - Folacin
  - Folic acid
  - Pteroylglutamic acid
description: |
  Folate is a water-soluble B-vitamin, also known as vitamin B9 or folacin. Naturally
  occurring folates exist in many chemical forms in food and in metabolically active
  forms in the human body. Folic acid is the major synthetic form found in fortified
  foods and vitamin supplements. Folate is critical in the metabolism of nucleic acid
  precursors and several amino acids, as well as in methylation reactions. Folate
  coenzymes act as acceptors and donors of one-carbon units in a variety of reactions
  critical to the metabolism of nucleic acids and amino acids.

functions:
  - name: One-Carbon Metabolism
    description: |
      Folate coenzymes mediate the transfer of one-carbon units in a variety of
      reactions critical to the metabolism of nucleic acids and amino acids.
      Folate coenzymes act as acceptors and donors of one-carbon units in these
      metabolic processes.
    biological_processes:
      - preferred_term: one-carbon metabolic process
        term:
          id: GO:0006730
          label: one-carbon metabolic process
    mic_references:
      - 2
      - 3
    evidence:
      - reference: PMID:10203550
        supports: SUPPORT
        snippet: "Folate functions in multiple coenzyme forms in acceptance, redox processing and transfer of one-carbon units, including nucleotides and certain amino acids."
        explanation: Directly confirms folate's role in one-carbon metabolism

  - name: Nucleic Acid Metabolism
    description: |
      Folate coenzymes play a vital role in DNA metabolism through two pathways:
      (1) The synthesis of DNA from its precursors (thymidine and purines) is
      dependent on folate coenzymes. (2) A folate coenzyme is required for the
      synthesis of methionine from homocysteine, and methionine is required for
      the synthesis of S-adenosylmethionine (SAM). SAM is a methyl group donor
      used in most biological methylation reactions, including the methylation
      of sites within DNA, RNA, proteins, and phospholipids.
    biological_processes:
      - preferred_term: DNA biosynthetic process
        term:
          id: GO:0071897
          label: DNA biosynthetic process
      - preferred_term: DNA methylation
    mic_references:
      - 2
      - 3
    evidence:
      - reference: PMID:10720158
        supports: SUPPORT
        snippet: "Folate plays a major role in the formation of S-adenosylmethionine, the universal methyl donor, as well as in the formation of purine and thymidine synthesis for DNA and RNA."
        explanation: Confirms folate's critical role in DNA/RNA synthesis and methylation
      - reference: PMID:22332098
        supports: SUPPORT
        snippet: "DNA methylation is an epigenetic modification critical to normal genome regulation and development. The vitamin folate is a key source of the one carbon group used to methylate DNA."
        explanation: Reviews the molecular mechanisms by which folate serves as the key source of one-carbon groups for DNA methylation

  - name: Amino Acid Metabolism
    description: |
      Folate coenzymes are required for the metabolism of several important amino
      acids, including methionine, cysteine, serine, glycine, and histidine. The
      synthesis of methionine from homocysteine is catalyzed by methionine synthase,
      an enzyme that requires folate (as 5-methyltetrahydrofolate) and vitamin B12.
      Folate or vitamin B12 deficiency can result in decreased synthesis of
      methionine and accumulation of homocysteine.
    biological_processes:
      - preferred_term: methionine biosynthetic process
        term:
          id: GO:0009086
          label: methionine biosynthetic process
    mic_references:
      - 3
      - 4
    evidence:
      - reference: PMID:10203550
        supports: SUPPORT
        snippet: "Folate functions in multiple coenzyme forms in acceptance, redox processing and transfer of one-carbon units, including nucleotides and certain amino acids."
        explanation: Supports folate's role in amino acid metabolism
      - reference: PMID:16210710
        supports: SUPPORT
        snippet: "Daily doses of > or =0.8 mg folic acid are typically required to achieve the maximal reduction in plasma homocysteine concentrations produced by folic acid supplementation. Doses of 0.2 and 0.4 mg are associated with 60% and 90%, respectively, of this maximal effect."
        explanation: Demonstrates dose-dependent effect of folic acid on homocysteine lowering, confirming folate's critical role in homocysteine-to-methionine conversion

deficiency:
  name: Folate Deficiency
  description: |
    Clinical folate deficiency leads to megaloblastic anemia, which is reversible
    with folic acid treatment. Rapidly dividing cells like those derived from bone
    marrow are most vulnerable to the effects of folate deficiency since DNA
    synthesis and cell division are dependent on folate coenzymes. When folate
    supply to the rapidly dividing cells of the bone marrow is inadequate, blood
    cell division is reduced, resulting in fewer but larger red blood cells.
    Individuals in the early stages of folate deficiency may not show obvious
    symptoms, but blood concentrations of homocysteine may increase.
  phenotypes:
    - name: Megaloblastic anemia
      phenotype_term:
        preferred_term: Megaloblastic anemia
        term:
          id: HP:0001889
          label: Megaloblastic anemia
      frequency: FREQUENT
      context: Characteristic manifestation of clinical folate deficiency
      mic_references:
        - 1
        - 19
      evidence:
        - reference: PMID:10203550
          supports: SUPPORT
          snippet: "Estimates of folate requirements have been based on intakes associated with maintenance of normal plasma and erythrocyte folate concentrations and functional tests that reflect abnormalities in folate-dependent reactions."
          explanation: References functional abnormalities from folate deficiency

    - name: Fatigue
      phenotype_term:
        preferred_term: Fatigue
        term:
          id: HP:0012378
          label: Fatigue
      frequency: FREQUENT
      context: Results from decreased oxygen carrying capacity due to anemia
      mic_references:
        - 1

    - name: Weakness
      phenotype_term:
        preferred_term: Muscle weakness
        term:
          id: HP:0001324
          label: Muscle weakness
      frequency: FREQUENT
      context: Accompanies anemia in clinical folate deficiency
      mic_references:
        - 1

  at_risk_groups:
    - name: Pregnant women
      description: |
        Pregnancy is a time when the folate requirement is greatly increased to
        sustain the demand for rapid cell replication and growth of fetal,
        placental, and maternal tissue.
      mic_references:
        - 18

    - name: Chronic alcohol consumers
      description: |
        Chronic, heavy alcohol consumption is associated with diminished absorption
        of folate in addition to low dietary intake, which can lead to folate
        deficiency.
      mic_references:
        - 14

    - name: Smokers
      description: |
        Smoking is associated with low folate status. Folate concentrations in
        blood were about 15% lower in smokers compared to nonsmokers.
      mic_references:
        - 15
        - 16

    - name: Individuals with malabsorptive conditions
      description: |
        Folate deficiency can result from malabsorptive conditions including
        inflammatory bowel diseases (Crohn's disease and ulcerative colitis)
        and celiac disease.
      mic_references:
        - 11
        - 19

  causes:
    - name: Inadequate dietary intake
      description: Most often caused by dietary insufficiency
      mic_references:
        - 11

    - name: Chronic alcohol consumption
      description: Diminishes folate absorption and often accompanies low dietary intake
      mic_references:
        - 14

    - name: Malabsorptive conditions
      description: Inflammatory bowel diseases and celiac disease can impair folate absorption
      mic_references:
        - 11
        - 19

  mic_references:
    - 1
    - 11
    - 14
    - 18
    - 19

toxicity:
  name: Folic Acid Safety
  description: |
    No adverse effects have been associated with the consumption of excess folate
    from food. Concerns regarding safety are limited to synthetic folic acid intake.
    There is concern that large doses of folic acid given to an individual with an
    undiagnosed vitamin B12 deficiency could correct megaloblastic anemia without
    correcting the underlying vitamin B12 deficiency, leaving the individual at
    risk of developing irreversible neurologic damage. Such cases of neurologic
    progression in vitamin B12 deficiency have been mostly seen at folic acid
    doses of 5,000 mcg (5 mg) and above.
  adverse_effects:
    - name: Masking of vitamin B12 deficiency
      description: |
        High-dose folic acid can correct megaloblastic anemia caused by vitamin B12
        deficiency without correcting the underlying deficiency, potentially leading
        to irreversible neurologic damage if vitamin B12 deficiency is not diagnosed
        and treated.
      severity: serious
      mic_references:
        - 1
        - 78

  mic_references:
    - 1
    - 78
    - 204
    - 205

