references:
  - reference: PMID:10203550
    title: Folate metabolism and requirements
    findings:
      - statement: Folate functions as coenzyme in one-carbon transfer reactions
        supporting_text: "Folate functions in multiple coenzyme forms in acceptance, redox processing and transfer of one-carbon units, including nucleotides and certain amino acids."
  - reference: PMID:10720158
    title: Folate and carcinogenesis - an integrated scheme
    findings:
      - statement: Folate status modulates cancer risk, particularly colorectal cancer
        supporting_text: "Collectively, the evidence from epidemiologic, animal and human studies strongly suggests that folate status modulates the risk of developing cancers in selected tissues, the most notable of which is the colorectum."
  - reference: PMID:1677062
    title: Prevention of neural tube defects - MRC Vitamin Study
    findings:
      - statement: Folic acid supplementation provides 72% protection against NTD recurrence
        supporting_text: "27 of these had a known neural tube defect, 6 in the folic acid groups and 21 in the two other groups, a 72% protective effect"
  - reference: PMID:1307234
    title: Prevention of first occurrence of neural-tube defects by periconceptional vitamin supplementation
    findings:
      - statement: Periconceptional vitamin use prevents first occurrence of NTDs
        supporting_text: "There were six cases of neural-tube defects in the group receiving the trace-element supplement, as compared with none in the vitamin-supplement group"
  - reference: PMID:10554704
    title: Homocysteine and atherosclerosis
    findings:
      - statement: Elevated homocysteine is an independent risk factor for atherosclerotic vascular disease
        supporting_text: "Elevated plasma total homocysteine is an independent risk factor for atherosclerotic vascular disease."
  - reference: PMID:24284617
    title: Folate deficiency and folic acid supplementation - the prevention of neural-tube defects and congenital heart defects
    findings:
      - statement: Periconceptional folic acid supplementation prevents about 90% of NTDs
        supporting_text: "periconceptional folic acid (FA)-containing multivitamin supplementation prevented the major proportion (about 90%) of neural-tube defects (NTD) as well as a certain proportion (about 40%) of congenital heart defects."
  - reference: PMID:25590678
    title: Updated estimates of neural tube defects prevented by mandatory folic acid fortification - United States, 1995-2011
    findings:
      - statement: US folic acid fortification prevents approximately 1,326 NTD-affected births annually
        supporting_text: "The number of births occurring annually without NTDs that would otherwise have been affected is approximately 1,326 (95% confidence interval = 1,122-1,531)."
  - reference: PMID:36882610
    title: Neural tube defects - a review of global prevalence, causes, and primary prevention
    findings:
      - statement: Maternal folate insufficiency is the most common preventable risk factor for NTDs
        supporting_text: "Maternal folate insufficiency before and during early pregnancy is the most common risk factor and is preventable."
  - reference: PMID:12446535
    title: Homocysteine and cardiovascular disease - evidence on causality from a meta-analysis
    findings:
      - statement: Lowering homocysteine by 3 micromol/l could reduce stroke risk by 24%
        supporting_text: "lowering homocysteine concentrations by 3 micromol/l from current levels (achievable by increasing folic acid intake) would reduce the risk of ischaemic heart disease by 16% (11% to 20%), deep vein thrombosis by 25% (8% to 38%), and stroke by 24% (15% to 33%)."
  - reference: PMID:27528407
    title: Folic acid supplementation and the risk of cardiovascular diseases - a meta-analysis of randomized controlled trials
    findings:
      - statement: Folic acid supplementation reduces stroke risk by 10% and overall CVD by 4%
        supporting_text: "Our meta-analysis indicated a 10% lower risk of stroke and a 4% lower risk of overall CVD with folic acid supplementation."
  - reference: PMID:20937919
    title: Effects of lowering homocysteine levels with B vitamins on cardiovascular disease, cancer, and cause-specific mortality
    findings:
      - statement: Folic acid supplementation had no significant effects on cardiovascular events within 5 years
        supporting_text: "Dietary supplementation with folic acid to lower homocysteine levels had no significant effects within 5 years on cardiovascular events or on overall cancer or mortality in the populations studied."
  - reference: PMID:20820900
    title: Pooled analyses of 13 prospective cohort studies on folate intake and colon cancer
    findings:
      - statement: Higher folate intake is modestly associated with reduced colon cancer risk
        supporting_text: "a 2% risk reduction (95% CI 0-3%) was estimated for every 100 μg/day increase in total folate intake."
  - reference: PMID:9096386
    title: Folate deficiency causes uracil misincorporation into human DNA and chromosome breakage
    findings:
      - statement: Folate deficiency causes massive uracil misincorporation into DNA and chromosome breaks
        supporting_text: "Folate deficiency causes massive incorporation of uracil into human DNA (4 million per cell) and chromosome breaks."
  - reference: PMID:21784352
    title: Serum homocysteine and dementia - meta-analysis of eight cohort studies
    findings:
      - statement: Elevated homocysteine is associated with increased dementia risk
        supporting_text: "the odds ratio for a 5 μmol/L increase in serum homocysteine was 1.35 (95% confidence interval, 1.02-1.79)"
  - reference: PMID:20838622
    title: Homocysteine-lowering by B vitamins slows the rate of accelerated brain atrophy in mild cognitive impairment
    findings:
      - statement: B vitamins including folic acid slow brain atrophy in mild cognitive impairment
        supporting_text: "The mean rate of brain atrophy per year was 0.76% in the active treatment group and 1.08% in the placebo group (P = 0.001)."
  - reference: PMID:29480200
    title: Homocysteine and Dementia - An International Consensus Statement
    findings:
      - statement: Elevated homocysteine is a modifiable risk factor for cognitive decline and dementia
        supporting_text: "elevated plasma total homocysteine is a modifiable risk factor for development of cognitive decline, dementia, and Alzheimer's disease in older persons."
  - reference: PMID:17202114
    title: Folate and risk of breast cancer - a meta-analysis
    findings:
      - statement: No clear overall association between folate and breast cancer, but protective effect with alcohol
        supporting_text: "Adequate folate intake may reduce the increased risk of breast cancer that has been associated with moderate or high alcohol consumption."
  - reference: PMID:16210710
    title: Dose-dependent effects of folic acid on blood concentrations of homocysteine
    findings:
      - statement: Folic acid dose-dependently lowers homocysteine with maximal effect at 0.8 mg or more
        supporting_text: "Daily doses of > or =0.8 mg folic acid are typically required to achieve the maximal reduction in plasma homocysteine concentrations produced by folic acid supplementation."
  - reference: PMID:22332098
    title: Folate and DNA methylation - a review of molecular mechanisms and the evidence for folate's role
    findings:
      - statement: Folate is the key source of one-carbon groups used for DNA methylation
        supporting_text: "DNA methylation is an epigenetic modification critical to normal genome regulation and development. The vitamin folate is a key source of the one carbon group used to methylate DNA."

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Folate. Evidence items include exact quotes from
  PubMed abstracts. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. Folate is particularly important for
  women of childbearing age due to its critical role in preventing neural tube
  defects during early pregnancy.
