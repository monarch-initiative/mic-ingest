- name: Breast Cancer
  description: |
    A meta-analysis of 39 observational studies found dietary folate intake to be
    inversely associated with breast cancer risk (OR 0.85), with data stratification
    revealing the association was evident in premenopausal women but not in
    postmenopausal women. Plasma folate levels were not correlated with breast
    cancer risk. Adequate folate intake may reduce the increased risk of breast
    cancer associated with moderate or high alcohol consumption; in a study of
    88,000 nurses, women consuming at least one alcoholic drink per day who took
    at least 600 mcg of folic acid daily had about half the risk of breast cancer.
    Polymorphisms in genes encoding thymidylate synthase, methionine synthase,
    methionine synthase reductase, and MTHFR increase breast cancer risk in
    certain ethnic populations.
  disease_term:
    preferred_term: breast carcinoma
    term:
