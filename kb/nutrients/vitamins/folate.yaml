  evidence:
  - reference: PMID:35956272
    supports: SUPPORT
    snippet: "The primary cause of CFDS is identified as the presence of serum folate
      receptor-alpha (FRα) autoantibodies impairing folate transport across the choroid
      plexus to the brain whereas, in a minority of cases, mitochondrial disorders,
      inborn errors of metabolism and loss of function mutations of the FRα (FOLR1)
      gene are identified."
    explanation: Reviews the etiology of CFD syndrome and identifies FRa 
      autoantibodies and FOLR1 mutations as primary causes

- name: Dihydrofolate Reductase (DHFR) Deficiency
  description: |
    DHFR deficiency is a rare autosomal recessive inborn error of metabolism
    characterized by megaloblastic anemia and cerebral folate deficiency causing
    intractable seizures and mental deficits. DHFR catalyzes the reduction of
    dihydrofolic acid to tetrahydrofolic acid and is also required to convert
    folic acid to dihydrofolate. Although folinic acid treatment can alleviate
    symptoms, early diagnosis is essential to prevent irreversible brain damage.
  disease_term:
    preferred_term: megaloblastic anemia
    term:
      id: MONDO:0001700
      label: megaloblastic anemia
  relationship_type: THERAPEUTIC
  population_context: Rare autosomal recessive disorder; folinic acid treatment 
    essential for early intervention
  mechanism:
  - name: Loss of DHFR enzyme activity
    description: |
      Homozygous DHFR mutations result in profound enzyme deficiency,
      impairing reduction of dihydrofolate to tetrahydrofolate and causing
      both systemic megaloblastic anemia and cerebral folate deficiency.
    genes:
    - preferred_term: DHFR
      term:
        id: hgnc:2861
        label: DHFR
  mic_references:
  - 197
  - 198
  evidence:
  - reference: PMID:21310276
    supports: SUPPORT
    snippet: "We describe three individuals from two families with a recessive inborn
      error of metabolism, characterized by megaloblastic anemia and/or pancytopenia,
      severe cerebral folate deficiency, and cerebral tetrahydrobiopterin deficiency
      due to a germline missense mutation in DHFR, resulting in profound enzyme deficiency."
    explanation: First identification and characterization of DHFR deficiency as
      an inborn error of folate metabolism

