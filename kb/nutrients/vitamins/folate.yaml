- name: Colorectal Cancer
  description: |
    A pooled analysis of prospective cohort studies revealed a modest inverse
    association between dietary and total folate intake and colon cancer risk.
    A 2% decrease in colon cancer risk was estimated for every 100 mcg/day
    increase in total folate intake. Folate deficiency causes DNA damage through
    uracil misincorporation and impairs DNA methylation, providing a mechanistic
    basis for the cancer link. The MTHFR 677TT genotype is associated with a
    12% reduced CRC risk, with greater protection under high folate intake.
    However, high doses of supplemental folic acid may accelerate tumor growth
    in cancer patients with pre-existing neoplasms. A combined analysis of three
    large adenoma prevention trials found no increase or decrease in adenoma
    recurrence with folic acid, though a secondary analysis of the B-PROOF trial
    found increased CRC risk with folic acid plus vitamin B12 in older adults.
