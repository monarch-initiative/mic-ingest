- name: Hereditary Folate Malabsorption
  description: |
    Hereditary folate malabsorption is a rare autosomal recessive disorder caused
    by loss-of-function mutations in the SLC46A1 gene encoding the proton-coupled
    folate transporter (PCFT). It affects gastrointestinal folate absorption and
    folate transport into the brain. Patients present with low to undetectable
    serum and cerebrospinal fluid folate, megaloblastic anemia or pancytopenia,
    impaired immunity, failure to thrive, and neurologic symptoms including
    developmental delays and seizures. Folinic acid administered parenterally
    or intramuscularly can improve clinical outcomes.
  disease_term:
    preferred_term: hereditary folate malabsorption
    term:
      id: MONDO:0009238
      label: hereditary folate malabsorption
  relationship_type: THERAPEUTIC
  population_context: Rare autosomal recessive disorder; folinic acid treatment
  mechanism:
  - name: Loss of PCFT function
    description: |
      Mutations in SLC46A1 result in loss of PCFT-mediated folate transport
      across intestinal epithelium and choroid plexus, leading to systemic
      and cerebral folate deficiency.
