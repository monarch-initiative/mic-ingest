    as dietary folate equivalents (DFEs). The UL applies only to synthetic folic
    acid from supplements and fortified foods, not to natural folates in food.

bioavailability:
  description: |
    Folic acid used in supplements and fortified foods is more bioavailable than
    naturally occurring food folates. Dietary folate equivalents (DFEs) were
    developed to account for this difference. Under fasting conditions, folic
    acid has nearly 100% bioavailability, while food folate is estimated to have
    only about 50% bioavailability. When folic acid is consumed with food, its
    bioavailability is approximately 85%.
  factors:
    - name: Form of folate
      description: |
        Synthetic folic acid is more bioavailable than natural food folates.
        1 mcg DFE = 1 mcg food folate = 0.6 mcg folic acid from supplements
        or fortified food consumed with food = 0.5 mcg folic acid from
        supplements taken on an empty stomach.
      effect: INCREASED
    - name: MTHFR polymorphism
      description: |
        The MTHFR 677C>T polymorphism results in a thermolabile enzyme with
        reduced activity. Individuals with the T/T genotype have lower folate
        status and higher homocysteine levels, particularly when folate intake
        is inadequate.
      effect: DECREASED
  mic_references:
    - 20
    - 21
    - 22
    - 23
