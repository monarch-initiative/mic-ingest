- name: Adverse Pregnancy Outcomes (Preterm Birth and Low Birth Weight)
  description: |
    Low birth weight is associated with increased risk of mortality during the
    first year of life. A systematic review and meta-analysis of eight RCTs found
    a positive association between folic acid supplementation and birth weight,
    with a 2% increase in birth weight for every two-fold increase in folate
    intake. No association with length of gestation was observed. Elevated blood
    homocysteine concentrations, an indicator of functional folate deficiency,
    have also been associated with increased incidence of miscarriage and pregnancy
    complications. The maternal MTHFR C677T genotype has been linked to lower
    birth weights.
  disease_term:
    preferred_term: preeclampsia
    term:
      id: MONDO:0005081
      label: preeclampsia
  relationship_type: RISK_FACTOR
  direction: DECREASED
