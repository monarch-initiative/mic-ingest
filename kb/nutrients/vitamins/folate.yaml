- name: Congenital Heart Defects
  description: |
    Congenital heart defects are a major cause of infant mortality. A registry-based
    case-control study found that periconceptional folic acid use was associated with
    an 18% reduced risk of congenital heart defects (OR 0.82). Meta-analyses of
    case-control and family-based studies have also observed positive associations
    between maternal, fetal, or paternal MTHFR C677T variant and incidence of
    congenital heart defects. The Hungarian intervention trials indicated that
    periconceptional folic acid-containing multivitamin supplementation prevented
    a certain proportion (about 40%) of congenital heart defects.
  disease_term:
    preferred_term: congenital heart disease
    term:
      id: MONDO:0005453
