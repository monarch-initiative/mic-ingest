- name: Cerebral Folate Deficiency Syndrome
  description: |
    Cerebral folate deficiency (CFD) syndrome is characterized by low levels
    of folate coenzymes in cerebrospinal fluid despite normal blood folate
    concentrations. Folate transport across the blood-brain barrier is
    compromised, linked either to autoantibodies blocking folate receptor-alpha
    (FRa) or to mutations in the FOLR1 gene encoding FRa. Neurological
    abnormalities, visual and hearing impairments, and autism spectrum disorder
    may occur. Folinic acid can enter the brain, normalize folate coenzyme
    levels, and improve social interactions, mood, behavior, and verbal
    communication in affected children.
  disease_term:
    preferred_term: cerebral folate deficiency
    term:
      id: MONDO:0100034
      label: cerebral folate deficiency
  relationship_type: THERAPEUTIC
  population_context: Children and adults with CFD; FRa autoantibodies or FOLR1 
    mutations
  mechanism:
  - name: Impaired blood-brain barrier folate transport
    description: |
      FRa autoantibodies or FOLR1 mutations impair folate receptor-mediated
      transport across the choroid plexus, leading to isolated cerebral
      folate deficiency.
