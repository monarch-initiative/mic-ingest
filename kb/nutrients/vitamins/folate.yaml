    source: Institute of Medicine
  - population: Breastfeeding (all ages)
    amount: "500 mcg/day"
    source: Institute of Medicine
  - population: Women capable of becoming pregnant
    amount: "400 mcg/day from supplements"
    source: US Public Health Service
    notes: For prevention of neural tube defects
  ul:
  - population: Children 1-3 years
    amount: "300 mcg/day"
    source: Institute of Medicine
    notes: Applies to synthetic folic acid only
  - population: Children 4-8 years
    amount: "400 mcg/day"
    source: Institute of Medicine
    notes: Applies to synthetic folic acid only
  - population: Children 9-13 years
    amount: "600 mcg/day"
    source: Institute of Medicine
    notes: Applies to synthetic folic acid only
  - population: Adolescents 14-18 years
    amount: "800 mcg/day"
    source: Institute of Medicine
    notes: Applies to synthetic folic acid only
  - population: Adults 19+ years
    amount: "1,000 mcg/day"
    source: Institute of Medicine
    notes: Applies to synthetic folic acid only; set to prevent masking of 
      vitamin B12 deficiency
  notes: |
    The RDA was based primarily on the adequacy of red blood cell folate
    concentrations at different levels of folate intake. All values are expressed
    as dietary folate equivalents (DFEs). The UL applies only to synthetic folic
    acid from supplements and fortified foods, not to natural folates in food.

bioavailability:
  description: |
    Folic acid used in supplements and fortified foods is more bioavailable than
    naturally occurring food folates. Dietary folate equivalents (DFEs) were
    developed to account for this difference. Under fasting conditions, folic
    acid has nearly 100% bioavailability, while food folate is estimated to have
    only about 50% bioavailability. When folic acid is consumed with food, its
    bioavailability is approximately 85%.
  factors:
  - name: Form of folate
    description: |
      Synthetic folic acid is more bioavailable than natural food folates.
      1 mcg DFE = 1 mcg food folate = 0.6 mcg folic acid from supplements
      or fortified food consumed with food = 0.5 mcg folic acid from
      supplements taken on an empty stomach.
    effect: INCREASED
  - name: MTHFR polymorphism
    description: |
      The MTHFR 677C>T polymorphism results in a thermolabile enzyme with
      reduced activity. Individuals with the T/T genotype have lower folate
      status and higher homocysteine levels, particularly when folate intake
      is inadequate.
    effect: DECREASED
  mic_references:
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25

references:
- reference: PMID:10203550
  title: Folate metabolism and requirements
  findings:
  - statement: Folate functions as coenzyme in one-carbon transfer reactions
    supporting_text: "Folate functions in multiple coenzyme forms in acceptance, redox
      processing and transfer of one-carbon units, including nucleotides and certain
      amino acids."
- reference: PMID:10720158
  title: Folate and carcinogenesis - an integrated scheme
  findings:
  - statement: Folate status modulates cancer risk, particularly colorectal 
      cancer
    supporting_text: "Collectively, the evidence from epidemiologic, animal and human
      studies strongly suggests that folate status modulates the risk of developing
      cancers in selected tissues, the most notable of which is the colorectum."
- reference: PMID:1677062
  title: Prevention of neural tube defects - MRC Vitamin Study
  findings:
  - statement: Folic acid supplementation provides 72% protection against NTD 
      recurrence
    supporting_text: "27 of these had a known neural tube defect, 6 in the folic acid
      groups and 21 in the two other groups, a 72% protective effect"
- reference: PMID:1307234
  title: Prevention of first occurrence of neural-tube defects by 
    periconceptional vitamin supplementation
  findings:
  - statement: Periconceptional vitamin use prevents first occurrence of NTDs
    supporting_text: "There were six cases of neural-tube defects in the group receiving
      the trace-element supplement, as compared with none in the vitamin-supplement
      group"
- reference: PMID:10554704
  title: Homocysteine and atherosclerosis
  findings:
  - statement: Elevated homocysteine is an independent risk factor for 
      atherosclerotic vascular disease
    supporting_text: "Elevated plasma total homocysteine is an independent risk factor
      for atherosclerotic vascular disease."
- reference: PMID:24284617
  title: Folate deficiency and folic acid supplementation - the prevention of 
    neural-tube defects and congenital heart defects
  findings:
  - statement: Periconceptional folic acid supplementation prevents about 90% of
      NTDs
    supporting_text: "periconceptional folic acid (FA)-containing multivitamin supplementation
      prevented the major proportion (about 90%) of neural-tube defects (NTD) as well
      as a certain proportion (about 40%) of congenital heart defects."
- reference: PMID:25590678
  title: Updated estimates of neural tube defects prevented by mandatory folic 
    acid fortification - United States, 1995-2011
  findings:
  - statement: US folic acid fortification prevents approximately 1,326 
      NTD-affected births annually
    supporting_text: "The number of births occurring annually without NTDs that would
      otherwise have been affected is approximately 1,326 (95% confidence interval
      = 1,122-1,531)."
- reference: PMID:36882610
  title: Neural tube defects - a review of global prevalence, causes, and 
    primary prevention
  findings:
  - statement: Maternal folate insufficiency is the most common preventable risk
      factor for NTDs
    supporting_text: "Maternal folate insufficiency before and during early pregnancy
      is the most common risk factor and is preventable."
- reference: PMID:12446535
  title: Homocysteine and cardiovascular disease - evidence on causality from a 
    meta-analysis
  findings:
  - statement: Lowering homocysteine by 3 micromol/l could reduce stroke risk by
      24%
    supporting_text: "lowering homocysteine concentrations by 3 micromol/l from current
      levels (achievable by increasing folic acid intake) would reduce the risk of
      ischaemic heart disease by 16% (11% to 20%), deep vein thrombosis by 25% (8%
      to 38%), and stroke by 24% (15% to 33%)."
- reference: PMID:27528407
  title: Folic acid supplementation and the risk of cardiovascular diseases - a 
    meta-analysis of randomized controlled trials
  findings:
  - statement: Folic acid supplementation reduces stroke risk by 10% and overall
      CVD by 4%
    supporting_text: "Our meta-analysis indicated a 10% lower risk of stroke and a
      4% lower risk of overall CVD with folic acid supplementation."
- reference: PMID:20937919
  title: Effects of lowering homocysteine levels with B vitamins on 
    cardiovascular disease, cancer, and cause-specific mortality
  findings:
  - statement: Folic acid supplementation had no significant effects on 
      cardiovascular events within 5 years
    supporting_text: "Dietary supplementation with folic acid to lower homocysteine
      levels had no significant effects within 5 years on cardiovascular events or
      on overall cancer or mortality in the populations studied."
- reference: PMID:20820900
  title: Pooled analyses of 13 prospective cohort studies on folate intake and 
    colon cancer
  findings:
  - statement: Higher folate intake is modestly associated with reduced colon 
      cancer risk
    supporting_text: "a 2% risk reduction (95% CI 0-3%) was estimated for every 100
      μg/day increase in total folate intake."
- reference: PMID:9096386
  title: Folate deficiency causes uracil misincorporation into human DNA and 
    chromosome breakage
  findings:
  - statement: Folate deficiency causes massive uracil misincorporation into DNA
      and chromosome breaks
    supporting_text: "Folate deficiency causes massive incorporation of uracil into
      human DNA (4 million per cell) and chromosome breaks."
- reference: PMID:21784352
  title: Serum homocysteine and dementia - meta-analysis of eight cohort studies
  findings:
  - statement: Elevated homocysteine is associated with increased dementia risk
    supporting_text: "the odds ratio for a 5 μmol/L increase in serum homocysteine
      was 1.35 (95% confidence interval, 1.02-1.79)"
- reference: PMID:20838622
  title: Homocysteine-lowering by B vitamins slows the rate of accelerated brain
    atrophy in mild cognitive impairment
  findings:
  - statement: B vitamins including folic acid slow brain atrophy in mild 
      cognitive impairment
    supporting_text: "The mean rate of brain atrophy per year was 0.76% in the active
      treatment group and 1.08% in the placebo group (P = 0.001)."
- reference: PMID:29480200
  title: Homocysteine and Dementia - An International Consensus Statement
  findings:
  - statement: Elevated homocysteine is a modifiable risk factor for cognitive 
      decline and dementia
    supporting_text: "elevated plasma total homocysteine is a modifiable risk factor
      for development of cognitive decline, dementia, and Alzheimer's disease in older
      persons."
- reference: PMID:17202114
  title: Folate and risk of breast cancer - a meta-analysis
  findings:
  - statement: No clear overall association between folate and breast cancer, 
      but protective effect with alcohol
    supporting_text: "Adequate folate intake may reduce the increased risk of breast
      cancer that has been associated with moderate or high alcohol consumption."
- reference: PMID:16210710
  title: Dose-dependent effects of folic acid on blood concentrations of 
    homocysteine
  findings:
  - statement: Folic acid dose-dependently lowers homocysteine with maximal 
      effect at 0.8 mg or more
    supporting_text: "Daily doses of > or =0.8 mg folic acid are typically required
      to achieve the maximal reduction in plasma homocysteine concentrations produced
      by folic acid supplementation."
- reference: PMID:22332098
  title: Folate and DNA methylation - a review of molecular mechanisms and the 
    evidence for folate's role
  findings:
  - statement: Folate is the key source of one-carbon groups used for DNA 
      methylation
    supporting_text: "DNA methylation is an epigenetic modification critical to normal
      genome regulation and development. The vitamin folate is a key source of the
      one carbon group used to methylate DNA."
- reference: PMID:25808073
  title: Association between MTHFR C677T polymorphism and neural tube defect 
    risks
  findings:
  - statement: MTHFR C677T polymorphism is significantly associated with NTD 
      risk in patients and mothers
    supporting_text: "allele contrast in NTD patients: OR = 1.445, 95% CI [1.186,
      1.760]; allele contrast in mothers: OR = 1.342, 95% CI [1.166, 1.544]"
- reference: PMID:36345648
  title: Global update on prevention of folic acid-preventable spina bifida and 
    anencephaly in 2020
  findings:
  - statement: Mandatory folic acid fortification prevented 61,680 NTD cases 
      globally in 2020
    supporting_text: "61,680 FAP SBA cases were prevented in the year 2020 through
      mandatory folic acid fortification of cereal grains in 58 countries, translating
      to 22% prevention"
- reference: PMID:23790957
  title: Neural tube defects - recent advances, unsolved questions, and 
    controversies
  findings:
  - statement: Genetic predisposition in folate one-carbon metabolism is a major
      NTD risk factor
    supporting_text: "Genetic predisposition accounts for most of the risk of neural
      tube defects, and genes that regulate folate one-carbon metabolism and planar
      cell polarity have been strongly implicated."
- reference: PMID:10444342
  title: A common variant in methionine synthase reductase combined with low 
    cobalamin increases risk for spina bifida
  findings:
  - statement: Combined MTHFR and MTRR mutations increase NTD risk fourfold
    supporting_text: "In the presence of combined MTHFR and MTRR homozygous mutant
      genotypes, children and mothers had a fourfold and threefold increase in risk"
- reference: PMID:21803414
  title: Effect modification by population dietary folate on MTHFR genotype, 
    homocysteine, and stroke risk
  findings:
  - statement: MTHFR-homocysteine-stroke association is modified by population 
      folate status
    supporting_text: "The effect of the MTHFR 677C→T variant on homocysteine concentration
      was larger in low folate regions (Asia; 3·12 μmol/L) than in areas with folate
      fortification (0·13 μmol/L)"
- reference: PMID:29078842
  title: Folic acid supplementation for stroke prevention in patients with 
    cardiovascular disease
  findings:
  - statement: Folic acid supplementation reduces stroke risk by 10% in CVD 
      patients
    supporting_text: "Folic acid supplementation was associated with a significant
      benefit in reducing the risk of stroke in patients with CVD (RR = 0.90; 95%
      CI: 0.84-0.97)"
- reference: PMID:34478339
  title: Folic acid supplementation and blood pressure - a GRADE-assessed 
    systematic review
  findings:
  - statement: Folic acid supplementation significantly lowers systolic blood 
      pressure
    supporting_text: "folic acid supplementation significantly decreased systolic
      BP (SBP) (WMD: -1.10 mmHg; 95% CI: -1.93 to -0.28)"
- reference: PMID:36829207
  title: Effects of folic acid supplementation on endothelial function in adults
  findings:
  - statement: Folic acid improves endothelial function by increasing 
      flow-mediated dilation
    supporting_text: "Folic acid supplementation significantly affected the percentage
      of flow-mediated dilation (FMD%) (WMD: 2.59%; 95% CI: 1.51, 3.67)"
- reference: PMID:23125859
  title: Folate intake, MTHFR polymorphisms, and the risk of colorectal cancer
  findings:
  - statement: MTHFR 677TT genotype is associated with reduced CRC risk under 
      high folate intake
    supporting_text: "The summary risk estimate for high versus low total folate for
      the 677TT genotype 0.63 (95% CI 0.41-0.97)"
- reference: PMID:21170989
  title: Folic acid and prevention of colorectal adenomas - a combined analysis 
    of RCTs
  findings:
  - statement: No clear effect of folic acid on adenoma recurrence in three 
      large trials
    supporting_text: "The RR comparing folic acid versus placebo was 0.98 (95% CI
      = 0.82-1.17) for all adenomas"
- reference: PMID:30341095
  title: Folic acid and vitamin B12 supplementation and cancer risk - B-PROOF 
    trial follow-up
  findings:
  - statement: Folic acid plus B12 supplementation increased colorectal cancer 
      risk in older adults
    supporting_text: "B vitamins were significantly associated with a higher risk
      of colorectal cancer [HR 1.77; 95% CI, 1.08-2.90]"
- reference: PMID:23690582
  title: Preventing Alzheimer's disease-related gray matter atrophy by B-vitamin
    treatment
  findings:
  - statement: B vitamins reduce atrophy of AD-vulnerable gray matter regions by
      up to sevenfold
    supporting_text: "B-vitamin treatment reduces, by as much as seven fold, the cerebral
      atrophy in those gray matter (GM) regions specifically vulnerable to the AD
      process"
- reference: PMID:34432056
  title: B vitamins and prevention of cognitive decline and incident dementia
  findings:
  - statement: Higher dietary folate intake reduces dementia risk by 39%
    supporting_text: "the risk of incident dementia was significantly decreased among
      individuals with higher intake of folate (HR, 0.61, 95%CI 0.47 to 0.78)"
- reference: PMID:26508298
  title: Effects of 6-month folic acid supplementation on cognitive function in 
    Chinese MCI patients
  findings:
  - statement: Folic acid supplementation improves cognitive function in mild 
      cognitive impairment
    supporting_text: "Folic acid supplementation improved Full Scale IQ (p = .031),
      Digit Span (p = .009), and Block Design (p = .036) scores at 6 months"
- reference: PMID:33146633
  title: Association of folate intake and plasma folate level with the risk of 
    breast cancer
  findings:
  - statement: Folate intake is inversely correlated with breast cancer risk, 
      especially in premenopausal women
    supporting_text: "Folate intake was inversely correlated with the breast cancer
      risk (OR = 0.85, 95% CI = 0.79-0.92)"
- reference: PMID:31390683
  title: Protective effect of maternal folic acid supplementation on childhood 
    cancer
  findings:
  - statement: Maternal folic acid supplementation reduces childhood ALL risk by
      25%
    supporting_text: "pooled odds ratios showed a protective association between maternal
      folic acid supplementation and childhood acute lymphoblastic leukaemia (OR,
      0.75; 95% CI 0.66 to 0.86)"
- reference: PMID:19952004
  title: Protective effect of periconceptional folic acid supplements on 
    congenital heart defects
  findings:
  - statement: Periconceptional folic acid use reduces congenital heart defect 
      risk by 18%
    supporting_text: "Periconceptional folic acid use revealed an odds ratio (OR)
      of 0.82 (95% CI 0.68-0.98) for all types of CHD"
- reference: PMID:33118705
  title: Folate intake, markers of folate status and oral clefts
  findings:
  - statement: Folic acid supplementation reduces cleft lip with/without palate 
      risk by 40%
    supporting_text: "There was an inverse association between folic acid-containing
      supplement use before or during pregnancy and CL/P (OR 0.60, 95% CI 0.51-0.69)"
- reference: PMID:17133404
  title: Folic acid-containing supplement consumption during pregnancy and risk 
    for oral clefts
  findings:
  - statement: Periconceptional folic acid supplementation reduces oral cleft 
      risk
    supporting_text: "combined relative risks of 0.51 (95% CI: 0.32, 0.95) for CLP
      from prospective studies"
- reference: PMID:28534456
  title: Effects of folic acid fortification on orofacial clefts prevalence
  findings:
  - statement: Folic acid fortification reduces non-syndromic cleft lip 
      prevalence by 12%
    supporting_text: "We found a significant effect of FA fortification only on non-syndromic
      CL/P (RR=0·88; 95 % CI 0·81, 0·96)"
- reference: PMID:22992251
  title: Effect of folate intake on health outcomes in pregnancy
  findings:
  - statement: Folate intake has a dose-response relationship with birth weight
    supporting_text: "We found significant dose-response relationship between folate
      intake and birth weight (P=0.001)"
- reference: PMID:10799405
  title: Folic acid - influence on the outcome of pregnancy
  findings:
  - statement: Low folate is associated with preterm delivery, low birth weight,
      and fetal growth retardation
    supporting_text: "During pregnancy, low concentrations of dietary and circulating
      folate are associated with increased risks of preterm delivery, infant low birth
      weight, and fetal growth retardation."
- reference: PMID:23395424
  title: MTHFR C677T polymorphism and risk of preeclampsia - updated 
    meta-analysis
  findings:
  - statement: MTHFR C677T polymorphism is associated with preeclampsia risk
    supporting_text: "Significant associations were detected between MTHFR C677T polymorphism
      and risk of PE in the overall population for TT vs. CC (OR = 1.280)"
- reference: PMID:29978414
  title: Folic acid supplementation in pregnancy and preeclampsia risk
  findings:
  - statement: Multivitamin plus folic acid supplementation reduces preeclampsia
      risk
    supporting_text: "folic acid supplementation during pregnancy could significantly
      reduce the risk of preeclampsia"
- reference: PMID:30209050
  title: Effect of high dose folic acid supplementation on pre-eclampsia (FACT 
    trial)
  findings:
  - statement: High-dose folic acid did not prevent preeclampsia in high-risk 
      women
    supporting_text: "Supplementation with 4.0 mg/day folic acid beyond the first
      trimester does not prevent pre-eclampsia in women at high risk"
- reference: PMID:34440744
  title: Folic acid and autism - a systematic review
  findings:
  - statement: Mixed evidence for prenatal folic acid and autism spectrum 
      disorder risk
    supporting_text: "Studies have pointed out a potential beneficial effect of prenatal
      folic acid maternal supplementation (600 µg) on the risk of autism spectrum
      disorder onset, but opposite results have been reported"
- reference: PMID:24004895
  title: Prenatal folic acid and risk of asthma in children
  findings:
  - statement: No association between periconceptional folic acid and childhood 
      asthma
    supporting_text: "no evidence of an association between maternal folic acid supplement
      use and asthma in childhood (summary risk estimate: 1.01)"
- reference: PMID:17446347
  title: Spectrum of mutations in the PCFT gene causing hereditary folate 
    malabsorption
  findings:
  - statement: PCFT/SLC46A1 mutations cause hereditary folate malabsorption
    supporting_text: "Hereditary folate malabsorption (HFM) is a rare autosomal recessive
      disorder caused by impaired intestinal folate absorption and impaired folate
      transport into the central nervous system."
- reference: PMID:35956272
  title: Cerebral folate deficiency syndrome - early diagnosis, intervention and
    treatment strategies
  findings:
  - statement: FRa autoantibodies are the primary cause of cerebral folate 
      deficiency syndrome
    supporting_text: "The primary cause of CFDS is identified as the presence of serum
      folate receptor-alpha (FRα) autoantibodies impairing folate transport across
      the choroid plexus to the brain"
- reference: PMID:21310276
  title: Identification and characterization of inborn error caused by 
    dihydrofolate reductase deficiency
  findings:
  - statement: DHFR deficiency causes megaloblastic anemia and cerebral folate 
      deficiency treatable with folinic acid
    supporting_text: "three individuals from two families with a recessive inborn
      error of metabolism, characterized by megaloblastic anemia and/or pancytopenia,
      severe cerebral folate deficiency"
- reference: PMID:25733468
  title: Unmetabolized folic acid detected in nearly all US serum samples
  findings:
  - statement: Unmetabolized folic acid is nearly ubiquitous in the US 
      population
    supporting_text: "UMFA detection was nearly ubiquitous, and concentrations >1
      nmol/L were largely but not entirely explained by fasting status and by total
      folic acid intake"
- reference: PMID:21967158
  title: Oral contraceptive use - impact on folate, vitamin B6, and vitamin B12 
    status
  findings:
  - statement: Current low-dose oral contraceptives do not negatively impact 
      folate status
    supporting_text: "The presently available data do not support a conclusion that
      currently used OCs negatively impact folate status."
- reference: PMID:22954694
  title: The human proton-coupled folate transporter - biology and therapeutic 
    applications to cancer
  findings:
  - statement: PCFT is the primary transporter for intestinal absorption of 
      dietary folates
    supporting_text: "PCFT was identified in 2006 as the primary transporter for intestinal
      absorption of dietary folates, as mutations in PCFT are causal in hereditary
      folate malabsorption (HFM) syndrome."

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Folate. Evidence items include exact quotes from
  PubMed abstracts. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. Folate is particularly important for
  women of childbearing age due to its critical role in preventing neural tube
  defects during early pregnancy.
