drug_interactions:
  - name: NSAIDs (high dose)
    description: |
      When nonsteroidal anti-inflammatory drugs (NSAIDs) such as aspirin or
      ibuprofen are taken in very large therapeutic dosages (i.e., to treat
      severe arthritis), they may interfere with folate metabolism. Routine
      use of NSAIDs has not been found to adversely affect folate status.
    drug_term:
      preferred_term: NSAID
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 200

  - name: Anticonvulsants
    description: |
      Phenytoin has been shown to inhibit the intestinal absorption of folate,
      and several studies have associated decreased folate status with long-term
      use of the anticonvulsants phenytoin, phenobarbital, and primidone.
    drug_term:
      preferred_term: anticonvulsant
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 214

  - name: Cholestyramine and Colestipol
    description: |
      Taking folic acid at the same time as the cholesterol-lowering agents
      cholestyramine and colestipol may decrease the absorption of folic acid.
    drug_term:
      preferred_term: bile acid sequestrant
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 200

  - name: Methotrexate
    description: |
      Methotrexate is a folic acid antagonist used to treat cancer, rheumatoid
      arthritis, and psoriasis. Some of the side effects of methotrexate are
      similar to those of severe folate deficiency, and supplementation with
      folic or folinic acid is used to reduce antifolate toxicity.
    drug_term:
      preferred_term: methotrexate
    interaction_type: ANTAGONISTIC
    clinical_significance: HIGH
    mic_references:
      - 11
      - 115

nutrient_interactions:
  - name: Vitamin B12
    description: |
      Folate and vitamin B12 are metabolically interrelated. The synthesis of
      methionine from homocysteine requires both folate (as 5-methyltetrahydrofolate)
      and vitamin B12. Deficiency of either vitamin can result in elevated
      homocysteine. Importantly, high-dose folic acid supplementation can mask
      vitamin B12 deficiency by correcting the associated anemia while allowing
      neurological damage to progress.
    nutrient_term:
      preferred_term: vitamin B12
      term:
        id: CHEBI:30411
        label: cobalamin
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    mic_references:
      - 3
      - 4

  - name: Riboflavin (Vitamin B2)
    description: |
      Riboflavin is required as a cofactor for MTHFR, the enzyme that converts
      5,10-methylenetetrahydrofolate to 5-methyltetrahydrofolate. Riboflavin
      deficiency can affect folate metabolism and homocysteine levels,
      particularly in individuals with the MTHFR 677C>T polymorphism.
    nutrient_term:
      preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
    interaction_type: SYNERGISTIC
    clinical_significance: MODERATE
    mic_references:
      - 6
      - 7
      - 8
      - 9

disease_associations:
  - name: Neural Tube Defects
    description: |
      Neural tube defects arise from failure of embryonic neural tube closure
      between the 21st and 28th days after conception. Results of randomized
      trials have demonstrated 60% to 100% reductions in NTD cases when women
      consumed folic acid supplements during the periconceptional period (about
      one month before and at least one month after conception). The US Public
      Health Service recommends that all persons capable of becoming pregnant
      consume 400 mcg of folic acid daily to prevent NTDs.
    disease_term:
      preferred_term: neural tube defect
      term:
        id: MONDO:0018075
        label: neural tube defect
    relationship_type: PROTECTIVE
    direction: DECREASED
    population_context: Women of childbearing age, periconceptional period
    mic_references:
      - 28
      - 29
      - 30
      - 31
      - 32
      - 35
    evidence:
      - reference: PMID:1677062
        supports: SUPPORT
        snippet: "A total of 1817 women at high risk of having a pregnancy with a neural tube defect, because of a previous affected pregnancy, were allocated at random to one of four groups--namely, folic acid, other vitamins, both, or neither. 1195 had a completed pregnancy in which the fetus or infant was known to have or not have a neural tube defect; 27 of these had a known neural tube defect, 6 in the folic acid groups and 21 in the two other groups, a 72% protective effect"
        explanation: MRC Vitamin Study demonstrated 72% reduction in NTD recurrence with folic acid
      - reference: PMID:1307234
        supports: SUPPORT
        snippet: "There were six cases of neural-tube defects in the group receiving the trace-element supplement, as compared with none in the vitamin-supplement group (P = 0.029)."
        explanation: Czeizel study showed periconceptional vitamin supplementation prevents first occurrence of NTDs
      - reference: PMID:24284617
        supports: SUPPORT
        snippet: "The findings of the Hungarian intervention (randomized double-blind and cohort controlled) trials indicated that periconceptional folic acid (FA)-containing multivitamin supplementation prevented the major proportion (about 90%) of neural-tube defects (NTD) as well as a certain proportion (about 40%) of congenital heart defects."
        explanation: Hungarian trials showed periconceptional folic acid supplementation prevented about 90% of NTDs
      - reference: PMID:25590678
        supports: SUPPORT
        snippet: "The number of births occurring annually without NTDs that would otherwise have been affected is approximately 1,326 (95% confidence interval = 1,122-1,531). Mandatory folic acid fortification remains an effective public health intervention."
        explanation: US folic acid fortification prevents approximately 1,326 NTD-affected births annually
      - reference: PMID:36882610
        supports: SUPPORT
        snippet: "Maternal folate insufficiency before and during early pregnancy is the most common risk factor and is preventable. Folic acid (vitamin B9) is required for formation of the neural tube early in pregnancy, around 28 days after conception, when most women are unaware of their pregnancies."
        explanation: Confirms maternal folate insufficiency as the most common preventable risk factor for NTDs

  - name: Cardiovascular Disease and Stroke
    description: |
      Elevated concentrations of homocysteine in the blood are associated with
      increased risk of cardiovascular disease. Although folic acid supplementation
      has been proven effective to control circulating homocysteine concentrations,
      homocysteine lowering has not affected the incidence of cardiovascular disease
      in supplementation trials. However, supplementation with folic acid and other
      B vitamins does appear to lower the risk of stroke.
    disease_term:
      preferred_term: stroke
      term:
        id: MONDO:0005098
        label: stroke disorder
    relationship_type: PROTECTIVE
    direction: DECREASED
    population_context: Individuals with elevated homocysteine; supplementation studies show stroke risk reduction
    mic_references:
      - 4
      - 83
      - 84
      - 85
      - 86
      - 87
    evidence:
      - reference: PMID:10554704
        supports: SUPPORT
        snippet: "Elevated plasma total homocysteine is an independent risk factor for atherosclerotic vascular disease. Risk rises continuously across the spectrum of homocysteine concentrations and may become appreciable at levels greater than 10 mumol/l."
        explanation: Confirms association between homocysteine and cardiovascular disease risk
      - reference: PMID:12446535
        supports: SUPPORT
        snippet: "lowering homocysteine concentrations by 3 micromol/l from current levels (achievable by increasing folic acid intake) would reduce the risk of ischaemic heart disease by 16% (11% to 20%), deep vein thrombosis by 25% (8% to 38%), and stroke by 24% (15% to 33%)."
        explanation: Mendelian randomization meta-analysis provides strong evidence that homocysteine-CVD association is causal and that folic acid could reduce stroke risk by 24%
      - reference: PMID:27528407
        supports: SUPPORT
        snippet: "Our meta-analysis indicated a 10% lower risk of stroke and a 4% lower risk of overall CVD with folic acid supplementation. A greater benefit for CVD was observed among participants with lower plasma folate levels and without preexisting CVD and in studies with larger decreases in homocysteine levels."
        explanation: Meta-analysis of 30 RCTs with 82,334 participants confirmed folic acid supplementation reduces stroke risk by 10% and overall CVD by 4%
      - reference: PMID:20937919
        supports: PARTIAL
        snippet: "Dietary supplementation with folic acid to lower homocysteine levels had no significant effects within 5 years on cardiovascular events or on overall cancer or mortality in the populations studied."
        explanation: Large meta-analysis of 8 RCTs found no significant effect of folic acid on major vascular events, though included primarily populations with preexisting CVD

  - name: Colorectal Cancer
    description: |
      A pooled analysis of prospective cohort studies revealed a modest inverse
      association between dietary and total folate intake and colon cancer risk.
      A 2% decrease in colon cancer risk was estimated for every 100 mcg/day
      increase in total folate intake. However, high doses of supplemental folic
      acid may accelerate tumor growth in cancer patients with pre-existing
      neoplasms.
    disease_term:
      preferred_term: colorectal cancer
      term:
        id: MONDO:0005575
        label: colorectal cancer
    relationship_type: PROTECTIVE
    direction: DECREASED
    population_context: Protective at adequate dietary levels; high-dose supplements may be harmful in those with pre-existing neoplasms
    mic_references:
      - 123
      - 124
      - 125
      - 127
      - 129
    evidence:
      - reference: PMID:10720158
        supports: SUPPORT
        snippet: "Collectively, the evidence from epidemiologic, animal and human studies strongly suggests that folate status modulates the risk of developing cancers in selected tissues, the most notable of which is the colorectum. Folate depletion appears to enhance carcinogenesis whereas folate supplementation above what is presently considered to be the basal requirement appears to convey a protective effect."
        explanation: Supports protective role of adequate folate status against colorectal cancer
      - reference: PMID:20820900
        supports: SUPPORT
        snippet: "When analyzed as a continuous variable, a 2% risk reduction (95% CI 0-3%) was estimated for every 100 μg/day increase in total folate intake."
        explanation: Pooled analysis of 13 prospective cohort studies with 725,134 participants showed modest inverse association between folate intake and colon cancer risk
      - reference: PMID:9096386
        supports: SUPPORT
        snippet: "Folate deficiency causes massive incorporation of uracil into human DNA (4 million per cell) and chromosome breaks. The likely mechanism is the deficient methylation of dUMP to dTMP and subsequent incorporation of uracil into DNA by DNA polymerase."
        explanation: Provides mechanistic basis for folate-cancer link through DNA damage from uracil misincorporation under folate deficiency

  - name: Cognitive Decline and Dementia
    description: |
      Folate is essential for brain development and function. Low folate status
      and/or high homocysteine concentrations are associated with cognitive
      dysfunction in aging, from mild impairments to dementia. However, whether
      supplemental folic acid confers long-term benefits in maintaining cognitive
      health is not yet established.
    disease_term:
      preferred_term: dementia
      term:
        id: MONDO:0001627
        label: dementia
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Observational association; intervention trials show mixed results
    mic_references:
      - 170
      - 171
      - 173
      - 174
      - 175
      - 176
    evidence:
      - reference: PMID:21784352
        supports: SUPPORT
        snippet: "The odds ratio for a 5 μmol/L increase in serum homocysteine was 1.35 (95% confidence interval, 1.02-1.79) or 1.50 (1.13-2.00) adjusted for regression dilution bias. The odds ratio for a 3 μmol/L decrease in serum homocysteine (the average reduction expected using folic acid and B12) was 0.78 (0.66-0.93)."
        explanation: Meta-analysis of 8 cohort studies with 8,669 participants shows positive association between homocysteine and dementia, estimating 20% risk reduction from B vitamin treatment
      - reference: PMID:20838622
        supports: SUPPORT
        snippet: "The mean rate of brain atrophy per year was 0.76% [95% CI, 0.63-0.90] in the active treatment group and 1.08% [0.94-1.22] in the placebo group (P = 0.001). The treatment response was related to baseline homocysteine levels: the rate of atrophy in participants with homocysteine >13 µmol/L was 53% lower in the active treatment group (P = 0.001)."
        explanation: VITACOG RCT demonstrated that B vitamins including folic acid slowed brain atrophy by 30% overall and 53% in those with elevated homocysteine
      - reference: PMID:29480200
        supports: SUPPORT
        snippet: "elevated plasma total homocysteine is a modifiable risk factor for development of cognitive decline, dementia, and Alzheimer's disease in older persons. In a variety of clinical studies, the relative risk of dementia in elderly people for moderately raised homocysteine (within the normal range) ranges from 1.15 to 2.5, and the Population Attributable risk ranges from 4.3 to 31%."
        explanation: International consensus statement concluding that elevated homocysteine is a modifiable risk factor for dementia with population attributable risk up to 31%

  - name: Breast Cancer
    description: |
      A meta-analysis of prospective and case-control studies found no clear overall
      relationship between folate intake or blood folate levels and breast cancer risk.
      However, adequate folate intake may reduce the increased risk of breast cancer
      associated with moderate or high alcohol consumption. Several studies suggest that
      folate may counteract the adverse effects of alcohol on one-carbon metabolism and
      DNA methylation in breast tissue.
    disease_term:
      preferred_term: breast carcinoma
      term:
        id: MONDO:0007254
        label: breast cancer
    relationship_type: PROTECTIVE
    direction: DECREASED
    population_context: Primarily in women with moderate to high alcohol consumption; no clear overall association
    mic_references:
      - 143
      - 144
      - 145
      - 146
    evidence:
      - reference: PMID:17202114
        supports: PARTIAL
        snippet: "Adequate folate intake may reduce the increased risk of breast cancer that has been associated with moderate or high alcohol consumption."
        explanation: Meta-analysis found no clear overall association between folate and breast cancer, but suggests protective effect specifically among women with moderate or high alcohol intake

