drug_interactions:
  - name: Statins and Rhabdomyolysis Risk
    drug_term:
      preferred_term: HMG-CoA reductase inhibitors
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    description: |
      Co-administration of nicotinic acid with statins enhances the risk of
      rhabdomyolysis, a condition in which muscle cells are broken down, releasing
      enzymes and electrolytes into the blood, sometimes resulting in kidney failure.
    mic_references:
      - 131
      - 132
      - 134

  - name: Antioxidant Vitamins
    drug_term:
      preferred_term: antioxidant vitamins
    interaction_type: ANTAGONISTIC
    clinical_significance: MODERATE
    description: |
      Concurrent therapy with antioxidants (vitamin C, vitamin E, selenium, beta-carotene)
      may diminish the protective effects of simvastatin-nicotinic acid combination
      therapy on cardiovascular outcomes.
    mic_references:
      - 136
      - 137

  - name: Bile Acid Sequestrants
    drug_term:
      preferred_term: bile acid sequestrants
    interaction_type: SYNERGISTIC
    clinical_significance: MODERATE
    description: |
      The risk of myopathy may be increased in those taking nicotinic acid along with
      bile acid sequestrants (cholestyramine, colestipol) or gemfibrozil.
    mic_references:
      - 35

toxicity:
  name: Niacin Toxicity
  description: |
    Adverse effects of niacin are primarily associated with pharmacologic doses of
    nicotinic acid. The most common side effect is flushing of the skin (primarily
    face, arms, and chest), which may occur at doses as low as 30 mg/day. Other
    effects include pruritus, skin rashes, gastrointestinal disturbances,
    hepatotoxicity, impaired glucose tolerance, and elevated uric acid levels.
    Nicotinamide is generally better tolerated and does not cause flushing.
  adverse_effects:
    - name: Skin Flushing
      description: |
        Flushing primarily on face, arms, and chest is the most common side effect
        of nicotinic acid. Can occur at doses as low as 30 mg/day. Mediated by
        prostaglandin release.
      mic_references:
        - 41
        - 127

    - name: Hepatotoxicity
      description: |
        Liver cell damage including elevated liver enzymes and jaundice has been
        observed at intakes as low as 750 mg/day. Extended-release formulations
        may be more hepatotoxic at equivalent doses.
      mic_references:
        - 41
        - 126
        - 128

    - name: Impaired Glucose Tolerance
      description: |
        Large doses of nicotinic acid can impair glucose tolerance, likely due to
        decreased insulin sensitivity. May result in elevated blood glucose in
        susceptible (pre-diabetic) individuals.
      mic_references:
        - 95

    - name: Hyperuricemia
      description: |
        Elevated blood uric acid concentrations, occasionally resulting in gout
        attacks in susceptible individuals.
      mic_references:
        - 126

