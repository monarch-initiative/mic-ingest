notes: |
  Niacin equivalents (NE) are used because niacin can be synthesized from tryptophan:
  1 mg NE = 1 mg niacin = 60 mg tryptophan. The tolerable upper intake level (UL)
  applies to nicotinic acid and nicotinamide from supplements and fortified foods,
  not to niacin naturally occurring in foods. Pharmacologic doses of nicotinic acid
  (1-3 g/day) used for lipid modification are distinct from nutritional requirements.
