drug_interactions:
  - name: Cholestyramine and Vitamin D
    drug_term:
      preferred_term: cholestyramine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: Cholestyramine decreases intestinal absorption of vitamin D
    mic_references:
      - 365
      - 366

  - name: Orlistat and Vitamin D
    drug_term:
      preferred_term: orlistat
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: Orlistat reduces absorption of fat-soluble vitamins including vitamin D
    mic_references:
      - 365
      - 366

  - name: Anticonvulsants and Vitamin D
    drug_term:
      preferred_term: anticonvulsant
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: |
      Phenytoin, phenobarbital, and carbamazepine increase vitamin D metabolism
      and may decrease serum 25-hydroxyvitamin D concentrations
    mic_references:
      - 6

  - name: Glucocorticoids and Vitamin D
    drug_term:
      preferred_term: glucocorticoid
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    description: Glucocorticoids increase catabolism of 25-hydroxyvitamin D
    mic_references:
      - 40

nutrient_interactions:
  - name: Calcium and Vitamin D
    nutrient_term:
      preferred_term: calcium
      term:
        id: CHEBI:22984
        label: calcium atom
    interaction_type: SYNERGISTIC
    description: |
      Vitamin D enhances intestinal calcium absorption and is essential for
      maintaining calcium homeostasis. Adequate vitamin D status is required
      for optimal calcium utilization.
    mic_references:
      - 7
      - 8

  - name: Magnesium and Vitamin D
    nutrient_term:
      preferred_term: magnesium
      term:
        id: CHEBI:25107
        label: magnesium atom
    interaction_type: SYNERGISTIC
    description: |
      Magnesium is required for vitamin D metabolism. Low magnesium status
      may impair vitamin D activation and function.
    mic_references:
      - 48

recommendations:
  rda:
    - population: Infants 0-12 months
      amount: "400 IU (10 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-18 years
      amount: "600 IU (15 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Adults 19-70 years
      amount: "600 IU (15 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Adults 71+ years
      amount: "800 IU (20 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Pregnancy
      amount: "600 IU (15 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Lactation
      amount: "600 IU (15 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
  ul:
    - population: Infants 0-6 months
      amount: "1,000 IU (25 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Infants 6-12 months
      amount: "1,500 IU (37.5 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Children 1-3 years
      amount: "2,500 IU (62.5 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Children 4-8 years
      amount: "3,000 IU (75 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
    - population: Children 9-18 years and Adults
      amount: "4,000 IU (100 mcg)/day"
      source: Food and Nutrition Board, Institute of Medicine
  notes: |
    The Linus Pauling Institute recommends that generally healthy adults take
    2,000 IU (50 mcg) of supplemental vitamin D daily. The LPI recommends aiming for
    a serum 25-hydroxyvitamin D concentration of at least 30 ng/mL (75 nmol/L). For
    older adults (>50 years), daily supplementation with 2,000 IU is especially important
    because aging is associated with reduced capacity to synthesize vitamin D in skin.

notes: |
  Vitamin D can be synthesized in skin upon exposure to UVB light from sunlight, but
  synthesis is affected by latitude, season, time of day, skin pigmentation, sunscreen
  use, and age. At latitudes above 33 degrees north or below 33 degrees south, little
  or no vitamin D synthesis occurs during winter months. Serum 25-hydroxyvitamin D is
  the best indicator of vitamin D status. Concentrations below 20 ng/mL are considered
  deficient, 20-29 ng/mL are considered insufficient, and 30-100 ng/mL are considered
  sufficient by most experts.
