name: Vitamin D
nutrient_term:
  preferred_term: vitamin D
  term:
    id: CHEBI:27300
    label: vitamin D
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/vitamin-D
alternate_names:
  - Cholecalciferol
  - Vitamin D3
  - Ergocalciferol
  - Vitamin D2
  - Calciferol
  - Sunshine vitamin
description: |
  Vitamin D is a fat-soluble vitamin that can be synthesized in the skin upon exposure to
  ultraviolet B (UVB) light from sunlight. It is metabolized in the liver to 25-hydroxyvitamin D
  and then in the kidneys to the metabolically active form, 1,25-dihydroxyvitamin D (calcitriol).
  Through binding to the vitamin D receptor (VDR), calcitriol regulates the expression of
  hundreds of genes involved in skeletal and other biological functions. Vitamin D is essential
  for maintenance of bone mineralization through regulation of calcium and phosphorus homeostasis,
  and also exhibits important roles in immune function, cell differentiation, and cardiovascular health.

functions:
  - name: Calcium and Phosphorus Homeostasis
    description: |
      Vitamin D is essential for the regulation of calcium and phosphorus metabolism.
      1,25-dihydroxyvitamin D increases intestinal absorption of calcium and phosphorus,
      promotes renal reabsorption of calcium, and mobilizes calcium from bone when
      dietary intake is insufficient.
    biological_processes:
      - preferred_term: calcium homeostasis
        term:
          id: GO:0055074
          label: calcium ion homeostasis
      - preferred_term: phosphorus homeostasis
        term:
          id: GO:0055062
          label: phosphate ion homeostasis
    mic_references:
      - 2
      - 7
      - 8
    evidence:
      - reference: PMID:24529992
        supports: SUPPORT
        snippet: "Vitamin D3 is made in the skin from 7-dehydrocholesterol under the influence of UV light"
        explanation: Describes vitamin D synthesis and metabolism pathway
      - reference: PMID:14985208
        supports: SUPPORT
        snippet: "Vitamin D deficiency is prevalent in infants who are solely breastfed and who do not receive vitamin D supplementation and in adults of all ages who have increased skin pigmentation or who always wear sun protection or limit their outdoor activities"
        explanation: Holick review describing widespread vitamin D deficiency and risk factors affecting calcium and phosphorus homeostasis

  - name: Bone Mineralization
    description: |
      Vitamin D is required for normal bone development and maintenance. It regulates
      the mineralization of bone matrix by ensuring adequate calcium and phosphorus
      availability. Severe deficiency leads to rickets in children and osteomalacia in adults.
    biological_processes:
      - preferred_term: bone mineralization
        term:
          id: GO:0030282
          label: bone mineralization
    mic_references:
      - 19
      - 21
    evidence:
      - reference: PMID:21984863
        supports: SUPPORT
        snippet: "A disruption in any part of the vitamin D physiological pathway can result in vitamin D deficiency, which may lead to bone pain, muscle weakness, falls, low bone mass, and fractures"
        explanation: Demonstrates vitamin D's role in bone health and consequences of deficiency

  - name: Immune System Regulation
    description: |
      Vitamin D modulates both innate and adaptive immune responses. The vitamin D
      receptor is expressed on immune cells including B cells, T cells, and
      antigen-presenting cells, allowing vitamin D to act in an autocrine manner
      in the local immunologic environment.
    biological_processes:
      - preferred_term: immune system regulation
        term:
          id: GO:0002682
          label: regulation of immune system process
    mic_references:
      - 10
      - 11
      - 12
    evidence:
      - reference: PMID:21527855
        supports: SUPPORT
        snippet: "As the vitamin D receptor is expressed on immune cells (B cells, T cells, and antigen-presenting cells), and these immunologic cells are all capable of synthesizing the active vitamin D metabolite, vitamin D has the capability of acting in an autocrine manner in a local immunologic milieu"
        explanation: Directly supports vitamin D's role in immune regulation

  - name: Gene Expression Regulation
    description: |
      Through binding to the vitamin D receptor (VDR), 1,25-dihydroxyvitamin D
      regulates the transcription of hundreds of genes. The VDR-ligand complex
      binds to vitamin D response elements (VDREs) in DNA to control gene expression.
    biological_processes:
      - preferred_term: gene expression regulation
        term:
          id: GO:0010468
          label: regulation of gene expression
    genes:
      - preferred_term: VDR
        description: Vitamin D receptor
        term:
          id: HGNC:12679
          label: VDR
    mic_references:
      - 2
      - 9
    evidence:
      - reference: PMID:24529992
        supports: SUPPORT
        snippet: "1,25(OH)2D is the ligand for the vitamin D receptor (VDR), a transcription factor, binding to sites in the DNA called vitamin D response elements (VDREs). There are thousands of these binding sites regulating hundreds of genes in a cell-specific fashion"
        explanation: Describes VDR-mediated gene regulation mechanism

deficiency:
  name: Vitamin D Deficiency
  description: |
    Vitamin D deficiency results from inadequate sun exposure, insufficient dietary intake,
    or impaired metabolism. Severe deficiency causes rickets in children (failure of bone
    mineralization with bowed limbs) and osteomalacia in adults (bone softening with pain
    and increased fracture risk). Muscle weakness and pain are also prominent symptoms.
    Risk factors include limited sun exposure, dark skin pigmentation, obesity, older age,
    malabsorption disorders, and certain medications.
  sequelae:
    - name: Rickets
      phenotype_term:
        preferred_term: rickets
        term:
          id: HP:0002748
          label: Rickets
      frequency: FREQUENT
      context: children with severe deficiency
      mic_references:
        - 19
        - 20
      evidence:
        - reference: PMID:18977996
          supports: SUPPORT
          snippet: "Rickets in infants attributable to inadequate vitamin D intake and decreased exposure to sunlight continues to be reported in the United States"
          explanation: Confirms rickets as manifestation of vitamin D deficiency in children

    - name: Osteomalacia
      phenotype_term:
        preferred_term: osteomalacia
        term:
          id: HP:0002749
          label: Osteomalacia
      frequency: FREQUENT
      context: adults with severe deficiency
      mic_references:
        - 21
      evidence:
        - reference: PMID:21984863
          supports: SUPPORT
          snippet: "Physicians should suspect osteomalacia in patients who have prolonged vitamin D deficiency, a low serum calcium level, or a low serum phosphorus level"
          explanation: Establishes osteomalacia as consequence of prolonged vitamin D deficiency

    - name: Muscle weakness
      phenotype_term:
        preferred_term: muscle weakness
        term:
          id: HP:0001324
          label: Muscle weakness
      frequency: FREQUENT
      mic_references:
        - 22
        - 24
      evidence:
        - reference: PMID:21984863
          supports: SUPPORT
          snippet: "A disruption in any part of the vitamin D physiological pathway can result in vitamin D deficiency, which may lead to bone pain, muscle weakness, falls, low bone mass, and fractures"
          explanation: Lists muscle weakness as manifestation of vitamin D deficiency

    - name: Musculoskeletal pain
      phenotype_term:
        preferred_term: musculoskeletal pain
      frequency: FREQUENT
      mic_references:
        - 22
        - 23
      evidence:
        - reference: PMID:14661675
          supports: SUPPORT
          snippet: "Of all patients, 93% (140/ 150) had deficient levels of vitamin D (mean, 12.08 ng/mL; 95% confidence interval, 11.18-12.99 ng/mL)"
          explanation: High prevalence of vitamin D deficiency in patients with nonspecific musculoskeletal pain

  at_risk_groups:
    - name: Exclusively breastfed infants
      description: Breast milk is low in vitamin D, placing exclusively breastfed infants at risk unless supplemented
      mic_references:
        - 31
        - 32
        - 33

    - name: Older adults
      description: Aging decreases the skin's capacity to synthesize vitamin D and may impair renal conversion to active form
      mic_references:
        - 41
        - 42

    - name: People with dark skin
      description: Higher melanin content reduces cutaneous vitamin D synthesis
      mic_references:
        - 34

    - name: People with limited sun exposure
      description: Those who are homebound, wear extensive clothing, or live at high latitudes
      mic_references:
        - 27
        - 28
        - 29

    - name: People with malabsorption disorders
      description: Conditions affecting fat absorption impair vitamin D absorption
      mic_references:
        - 44
        - 45

    - name: Obese individuals
      description: Vitamin D is sequestered in adipose tissue, reducing bioavailability
      mic_references:
        - 46
        - 47

  mic_references:
    - 19
    - 20
    - 21
    - 22
    - 23

disease_associations:
  - name: Osteoporosis Prevention
    disease_term:
      preferred_term: osteoporosis
      term:
        id: MONDO:0005298
        label: osteoporosis
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Vitamin D insufficiency leads to secondary hyperparathyroidism which increases
      bone turnover and can precipitate osteoporosis. Supplementation with adequate
      vitamin D (at least 800 IU/day) may reduce fracture risk in older adults.
    mic_references:
      - 21
      - 24
    evidence:
      - reference: PMID:22762317
        supports: SUPPORT
        snippet: "By quartiles of actual intake, reduction in the risk of fracture was shown only at the highest intake level (median, 800 IU daily; range, 792 to 2000), with a 30% reduction in the risk of hip fracture (hazard ratio, 0.70; 95% CI, 0.58 to 0.86) and a 14% reduction in the risk of any nonvertebral fracture (hazard ratio, 0.86; 95% CI, 0.76 to 0.96)"
        explanation: Pooled analysis of 31,022 persons showing high-dose vitamin D supplementation reduces hip and nonvertebral fracture risk

  - name: Autoimmune Disease Susceptibility
    disease_term:
      preferred_term: autoimmune disease
      term:
        id: MONDO:0007179
        label: autoimmune disease
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Observational studies have reported inverse associations between vitamin D status
      and susceptibility to autoimmune diseases including type 1 diabetes, multiple sclerosis,
      rheumatoid arthritis, and systemic lupus erythematosus.
    mic_references:
      - 12
      - 26
    evidence:
      - reference: PMID:21527855
        supports: SUPPORT
        snippet: "Deficiency in vitamin D is associated with increased autoimmunity and an increased susceptibility to infection"
        explanation: Directly links vitamin D deficiency with increased autoimmunity
      - reference: PMID:11705562
        supports: SUPPORT
        snippet: "Dietary vitamin D supplementation is associated with reduced risk of type 1 diabetes. Ensuring adequate vitamin D supplementation for infants could help to reverse the increasing trend in the incidence of type 1 diabetes"
        explanation: Birth-cohort study of over 10,000 Finnish children showing vitamin D supplementation in infancy reduces type 1 diabetes risk
      - reference: PMID:26305103
        supports: SUPPORT
        snippet: "A genetically lowered 25OHD level is strongly associated with increased susceptibility to MS"
        explanation: Mendelian randomization study providing causal evidence that genetically lowered vitamin D increases multiple sclerosis risk

  - name: Multiple Sclerosis Risk
    disease_term:
      preferred_term: multiple sclerosis
      term:
        id: MONDO:0005301
        label: multiple sclerosis
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Multiple prospective studies and Mendelian randomization analyses support an
      inverse association between vitamin D status and risk of multiple sclerosis.
      Higher serum 25-hydroxyvitamin D levels are associated with lower MS risk,
      particularly when measured before age 20.
    mic_references:
      - 145
      - 149
      - 150
    evidence:
      - reference: PMID:17179460
        supports: SUPPORT
        snippet: "The results of our study suggest that high circulating levels of vitamin D are associated with a lower risk of multiple sclerosis"
        explanation: Prospective nested case-control study among over 7 million US military personnel showing higher serum 25(OH)D associated with lower MS risk

  - name: Colorectal Cancer Risk
    disease_term:
      preferred_term: colorectal cancer
      term:
        id: MONDO:0005575
        label: colorectal cancer
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Multiple meta-analyses of prospective studies have found an inverse association
      between vitamin D intake, blood 25(OH)D levels, and the risk of colorectal cancer.
      Higher circulating 25(OH)D levels are associated with a significant reduction in
      colorectal cancer risk.
    mic_references:
      - 97
      - 98
      - 99
      - 100
    evidence:
      - reference: PMID:21876081
        supports: SUPPORT
        snippet: "The pooled RRs of colorectal cancer for the highest versus lowest categories of vitamin D intake and blood 25(OH)D levels were 0.88 (95% CI, 0.80 to 0.96) and 0.67 (95% CI, 0.54 to 0.80), respectively"
        explanation: Systematic review of approximately 1,000,000 participants showing inverse association between vitamin D and colorectal cancer risk

  - name: Cardiovascular Disease Risk
    disease_term:
      preferred_term: cardiovascular disease
      term:
        id: MONDO:0004995
        label: cardiovascular disorder
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Observational studies have found that vitamin D deficiency is associated with
      increased risk of cardiovascular disease. Vitamin D receptors are expressed
      on vascular smooth muscle, endothelium, and cardiomyocytes. However, Mendelian
      randomization studies have not confirmed a causal relationship, and supplementation
      trials have shown limited benefit.
    mic_references:
      - 191
      - 200
      - 201
      - 206
    evidence:
      - reference: PMID:18180395
        supports: SUPPORT
        snippet: "Individuals with 25-OH D < 15 ng/mL had a multivariable-adjusted hazard ratio of 1.62 (95% confidence interval 1.11 to 2.36, P=0.01) for incident cardiovascular events compared with those with 25-OH D > or = 15 ng/mL"
        explanation: Framingham Offspring Study showing vitamin D deficiency is prospectively associated with incident cardiovascular disease

  - name: Breast Cancer Risk
    disease_term:
      preferred_term: breast cancer
      term:
        id: MONDO:0007254
        label: breast cancer
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Meta-analyses of prospective studies suggest a weak inverse association between
      vitamin D status and breast cancer incidence but a strong association between
      higher 25(OH)D levels and better breast cancer survival.
    mic_references:
      - 111
      - 112
      - 113
    evidence:
      - reference: PMID:24714744
        supports: SUPPORT
        snippet: "Among breast cancer patients, high blood 25(OH)D levels were significantly associated with lower breast cancer mortality (pooled RR=0.58, 95% CI: 0.40-0.85) and overall mortality (pooled RR=0.61, 95% CI: 0.48-0.79)"
        explanation: Meta-analysis of 30 prospective studies showing high vitamin D status is strongly associated with better breast cancer survival

  - name: Acute Respiratory Tract Infection
    disease_term:
      preferred_term: acute respiratory tract infection
      term:
        id: MONDO:0004867
        label: upper respiratory tract disorder
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Vitamin D modulates innate immunity and enhances antimicrobial peptide production.
      Meta-analyses of individual participant data from randomized controlled trials
      demonstrate that vitamin D supplementation reduces the risk of acute respiratory
      tract infections, particularly in those with baseline deficiency.
    mic_references:
      - 276
      - 281
    evidence:
      - reference: PMID:28202713
        supports: SUPPORT
        snippet: "Vitamin D supplementation reduced the risk of acute respiratory tract infection among all participants (adjusted odds ratio 0.88, 95% confidence interval 0.81 to 0.96; P for heterogeneity <0.001)"
        explanation: Systematic review and meta-analysis of individual participant data from 25 RCTs showing vitamin D supplementation protects against acute respiratory tract infections
      - reference: PMID:19237723
        supports: SUPPORT
        snippet: "Serum 25(OH)D levels are inversely associated with recent URTI. This association may be stronger in those with respiratory tract diseases"
        explanation: NHANES III analysis of 18,883 participants showing serum 25(OH)D levels are inversely associated with recent upper respiratory tract infection

  - name: All-Cause Mortality
    disease_term:
      preferred_term: mortality
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Observational studies consistently show that low circulating 25-hydroxyvitamin D
      levels are associated with increased all-cause mortality. Meta-analyses of
      randomized controlled trials suggest that vitamin D3 supplementation may reduce
      overall mortality, though the optimal dose and duration remain under investigation.
    mic_references:
      - 60
      - 61
      - 62
      - 65
    evidence:
      - reference: PMID:24690623
        supports: SUPPORT
        snippet: "In randomised controlled trials, relative risks for all cause mortality were 0.89 (0.80 to 0.99) for vitamin D3 supplementation and 1.04 (0.97 to 1.11) for vitamin D2 supplementation"
        explanation: Systematic review and meta-analysis of 73 cohort studies and 22 RCTs showing vitamin D3 supplementation significantly reduces overall mortality

toxicity:
  name: Vitamin D Toxicity
  description: |
    Vitamin D toxicity (hypervitaminosis D) does not occur from sun exposure but can result
    from excessive supplementation. Toxicity causes hypercalcemia, which can lead to bone loss,
    kidney stones, and calcification of soft tissues including heart and kidneys. Hypercalcemia
    has been observed with daily doses exceeding 50,000 IU. The tolerable upper intake level (UL)
    is 4,000 IU/day (100 mcg/day) for adults, though toxicity is unlikely below 10,000 IU/day
    in healthy individuals. Certain conditions including primary hyperparathyroidism, sarcoidosis,
    tuberculosis, and lymphoma increase susceptibility to hypercalcemia from vitamin D.
  mic_references:
    - 3
    - 361
    - 362
    - 363
    - 364

