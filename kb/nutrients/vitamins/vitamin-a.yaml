notes: |
  Vitamin A is measured in micrograms of Retinol Activity Equivalents (mcg RAE)
  to account for different bioavailabilities of preformed vitamin A versus
  provitamin A carotenoids. 1 mcg RAE = 1 mcg retinol = 12 mcg beta-carotene =
  24 mcg alpha-carotene or beta-cryptoxanthin. Provitamin A carotenoids do not
  cause vitamin A toxicity. Animal food sources rich in preformed vitamin A
  include dairy products, fortified cereals, liver, and fish oils. Rich sources
  of provitamin A carotenoids include orange and green vegetables.
