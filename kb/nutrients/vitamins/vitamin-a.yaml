drug_interactions:
  - name: Oral Contraceptives
    drug_term:
      preferred_term: oral contraceptive
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: LOW
    description: |
      Oral contraceptives containing estrogen and progestin increase retinol
      binding protein synthesis by the liver, increasing export of retinol
      to circulation.
    mic_references:
      - 98

  - name: Cholesterol-Lowering Medications
    drug_term:
      preferred_term: cholestyramine
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    description: |
      Cholestyramine, colestipol, orlistat, and mineral oil interfere with
      fat absorption and may reduce absorption of fat-soluble vitamins
      including vitamin A.
    mic_references:
      - 98

  - name: Retinoid Medications
    drug_term:
      preferred_term: isotretinoin
    interaction_type: SYNERGISTIC
    clinical_significance: HIGH
    description: |
      Retinoids and retinoid analogs (acitretin, isotretinoin, etretinate,
      bexarotene) should not be combined with vitamin A supplements due to
      increased risk of vitamin A toxicity.
    mic_references:
      - 98

toxicity:
  name: Hypervitaminosis A
  description: |
    Vitamin A toxicity is caused by overconsumption of preformed vitamin A, not
    carotenoids. Acute toxicity symptoms include nausea, headache, fatigue, dry
    skin, and cerebral edema. Chronic toxicity includes dry itchy skin, anorexia,
    weight loss, enlarged liver and spleen, anemia, and bone pain. Toxicity is
    especially contraindicated during pregnancy due to severe birth defects.
    The tolerable upper intake level (UL) for adults is 3,000 mcg RAE/day.
  adverse_effects:
    - name: Teratogenicity
      description: |
        High doses of preformed vitamin A during pregnancy can cause severe birth
        defects. Pregnant women should not exceed 3,000 mcg RAE/day.
      severity: severe
  mic_references:
    - 60
    - 99
    - 100

