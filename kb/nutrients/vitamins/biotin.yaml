name: Biotin
nutrient_term:
  preferred_term: biotin
  term:
    id: CHEBI:15956
    label: biotin
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/biotin
alternate_names:
  - Vitamin B7
  - Vitamin H
description: |
  Biotin is a water-soluble B-complex vitamin essential for all organisms. It serves as
  a covalently bound cofactor for five mammalian carboxylases that catalyze critical
  steps in intermediary metabolism. Biotin also plays important roles in cell signaling,
  epigenetic regulation of gene expression through histone biotinylation, and chromatin
  structure. Dietary biotin requirements are typically met through a varied diet, and
  overt deficiency is rare in healthy individuals consuming a normal diet.

functions:
  - name: Cofactor for Carboxylases
    description: |
      Biotin serves as a covalently bound cofactor for five mammalian carboxylases that
      catalyze essential metabolic reactions involving carbon dioxide transfer. These
      include acetyl-CoA carboxylase 1 and 2 (ACC1, ACC2), pyruvate carboxylase,
      methylcrotonyl-CoA carboxylase, and propionyl-CoA carboxylase.
    biological_processes:
      - preferred_term: fatty acid biosynthetic process
        term:
          id: GO:0006633
          label: fatty acid biosynthetic process
      - preferred_term: gluconeogenesis
        term:
          id: GO:0006094
          label: gluconeogenesis
    mic_references:
      - 3
      - 4
      - 5
    evidence:
      - reference: PMID:21871906
        supports: SUPPORT
        snippet: "Biotin serves as a covalently bound coenzyme in five human carboxylases"
        explanation: Directly confirms biotin's role as cofactor for carboxylases
      - reference: PMID:18598135
        supports: SUPPORT
        snippet: "Malonyl-CoA can be formed within the mitochondria, peroxisomes, and cytosol of mammalian cells. Besides being an intermediate in the pathways of de novo fatty acid biosynthesis and fatty acid elongation, malonyl-CoA has an important signaling function"
        explanation: Confirms role of acetyl-CoA carboxylase products in fatty acid metabolism

  - name: Fatty Acid Synthesis
    description: |
      Acetyl-CoA carboxylase 1 (ACC1) is located in the cytosol and catalyzes the
      conversion of acetyl-CoA to malonyl-CoA, which is a rate-limiting substrate
      for fatty acid synthesis. ACC1 is particularly active in lipogenic tissues
      including liver, white adipose tissue, and mammary gland.
    biological_processes:
      - preferred_term: fatty acid biosynthetic process
        term:
          id: GO:0006633
          label: fatty acid biosynthetic process
    mic_references:
      - 4
    evidence:
      - reference: PMID:18598135
        supports: SUPPORT
        snippet: "the activities of acetyl-CoA carboxylase and malonyl-CoA decarboxylase are important determinants of its cytosolic concentration"
        explanation: Confirms ACC role in malonyl-CoA production for fatty acid synthesis

  - name: Fatty Acid Oxidation Regulation
    description: |
      Acetyl-CoA carboxylase 2 (ACC2) is located on the outer mitochondrial membrane.
      The malonyl-CoA generated by ACC2 inhibits carnitine palmitoyltransferase 1 (CPT1),
      thereby regulating fatty acid entry into mitochondria for beta-oxidation.
    mic_references:
      - 4
    evidence:
      - reference: PMID:18598135
        supports: SUPPORT
        snippet: "malonyl-CoA has an important signaling function through its allosteric inhibition of carnitine palmitoyltransferase 1, the enzyme that normally exerts flux control over mitochondrial beta-oxidation"
        explanation: Confirms malonyl-CoA regulation of fatty acid oxidation via CPT1 inhibition

  - name: Gluconeogenesis
    description: |
      Pyruvate carboxylase is a critical enzyme in gluconeogenesis. It catalyzes the
      ATP-dependent incorporation of bicarbonate into pyruvate, producing oxaloacetate,
      which can be converted to phosphoenolpyruvate and eventually to glucose.
    biological_processes:
      - preferred_term: gluconeogenesis
        term:
          id: GO:0006094
          label: gluconeogenesis
    mic_references:
      - 5

  - name: Histone Biotinylation and Epigenetic Regulation
    description: |
      Biotin is attached to histones H2A, H3, and H4 through the action of
      holocarboxylase synthetase. While the abundance of biotinylated histones is low,
      histone biotinylation affects chromatin structure and gene expression regulation.
      Biotin deficiency can cause de-repression of long terminal repeats, contributing
      to genome instability.
    mic_references:
      - 3
      - 6
      - 7
    evidence:
      - reference: PMID:21871906
        supports: SUPPORT
        snippet: "biotin is also attached to histones H2A, H3, and H4, although the abundance of biotinylated histones is low. Biotinylation of both carboxylases and histones is catalyzed by holocarboxylase synthetase"
        explanation: Confirms histone biotinylation and holocarboxylase synthetase role
      - reference: PMID:21871906
        supports: SUPPORT
        snippet: "Recent studies suggest that biotin deficiency causes de-repression of long terminal repeats, thereby causing genome instability"
        explanation: Supports role of biotin in maintaining genome stability through epigenetic mechanisms

deficiency:
  name: Biotin Deficiency
  phenotype_term:
    preferred_term: Decreased circulating biotin concentration
    term:
      id: HP:0034599
      label: Decreased circulating biotin concentration
  disease_term:
    preferred_term: nutritional biotin deficiency
    term:
      id: MONDO:0000461
      label: nutritional biotin deficiency
  description: |
    Overt biotin deficiency is rare in healthy individuals consuming a normal diet.
    Signs of deficiency include hair loss (alopecia), scaly red rash around the eyes,
    nose, mouth, and genital area, and neurological symptoms. Individuals with
    hereditary disorders of biotin metabolism often have similar physical findings,
    impaired immune function, and increased susceptibility to bacterial and fungal
    infections.
  sequelae:
    - name: Alopecia
      phenotype_term:
        preferred_term: alopecia
        term:
          id: HP:0001596
          label: Alopecia
      frequency: FREQUENT
      mic_references:
        - 1
        - 9
        - 10
      evidence:
        - reference: PMID:3196050
          supports: SUPPORT
          snippet: "Clinical findings at presentation varied with dermatological signs (dermatitis and alopecia), neurological abnormalities (fits, hypotonia, and ataxia), and recurrent infections being the most common features"
          explanation: Case series of 10 biotinidase deficiency patients identifies alopecia as a common dermatological presentation of biotin deficiency.

    - name: Dermatitis
      phenotype_term:
        preferred_term: eczematoid dermatitis
        term:
          id: HP:0000964
          label: Eczematoid dermatitis
      frequency: FREQUENT
      context: Scaly red rash around eyes, nose, mouth, and genital area; termed "biotin deficient facies"
      mic_references:
        - 1
      evidence:
        - reference: PMID:3196050
          supports: SUPPORT
          snippet: "Clinical findings at presentation varied with dermatological signs (dermatitis and alopecia), neurological abnormalities (fits, hypotonia, and ataxia), and recurrent infections being the most common features"
          explanation: Case series of 10 biotinidase deficiency patients identifies dermatitis as a common dermatological presentation of biotin deficiency.

    - name: Depression
      phenotype_term:
        preferred_term: depression
        term:
          id: HP:0000716
          label: Depression
      frequency: OCCASIONAL
      context: Neurologic symptom in adults
      mic_references:
        - 1

    - name: Ataxia
      phenotype_term:
        preferred_term: ataxia
        term:
          id: HP:0001251
          label: Ataxia
      frequency: OCCASIONAL
      context: Neurologic symptom in adults
      mic_references:
        - 1
      evidence:
        - reference: PMID:3196050
          supports: SUPPORT
          snippet: "Clinical findings at presentation varied with dermatological signs (dermatitis and alopecia), neurological abnormalities (fits, hypotonia, and ataxia), and recurrent infections being the most common features"
          explanation: Case series of 10 biotinidase deficiency patients identifies ataxia among the common neurological abnormalities of biotin deficiency.

    - name: Seizures
      phenotype_term:
        preferred_term: seizures
        term:
          id: HP:0001250
          label: Seizure
      frequency: OCCASIONAL
      context: Neurologic symptom in severe deficiency
      mic_references:
        - 1
      evidence:
        - reference: PMID:3196050
          supports: SUPPORT
          snippet: "Clinical findings at presentation varied with dermatological signs (dermatitis and alopecia), neurological abnormalities (fits, hypotonia, and ataxia), and recurrent infections being the most common features"
          explanation: Case series of 10 biotinidase deficiency patients identifies fits (seizures) among the common neurological abnormalities of biotin deficiency.

  at_risk_groups:
    - name: Pregnant women
      description: |
        A substantial number of women develop marginal or subclinical biotin deficiency
        during normal pregnancy. The rapidly dividing cells of the developing fetus
        require biotin for synthesis of essential carboxylases and for histone
        biotinylation.
      mic_references:
        - 8
        - 12
        - 13
      evidence:
        - reference: PMID:19056637
          supports: SUPPORT
          snippet: "In a recent pilot study, activity of PCC in peripheral blood lymphocytes was decreased in 18 of 22 pregnant women"
          explanation: Demonstrates high prevalence of marginal biotin deficiency in pregnancy

    - name: Smokers
      description: Smoking has been associated with increased biotin catabolism
      mic_references:
        - 11

    - name: Individuals on total parenteral nutrition
      description: TPN without biotin supplementation can lead to deficiency
      mic_references:
        - 1

    - name: Consumers of raw egg whites
      description: |
        Prolonged consumption of raw egg whites can cause biotin deficiency because
        avidin in egg whites binds biotin and prevents absorption
      mic_references:
        - 1

    - name: Patients on anticonvulsant therapy
      description: |
        Anticonvulsant medications reduce biotin concentrations through inhibition
        of intestinal absorption, reduced renal reabsorption, and increased catabolism
      mic_references:
        - 5
        - 73
        - 74
        - 75
        - 76
        - 77

    - name: Patients with liver disease
      description: |
        Certain types of liver disease may decrease biotinidase activity, potentially
        increasing biotin requirements
      mic_references:
        - 14

  mic_references:
    - 1
    - 9
    - 10

toxicity:
  name: Biotin Toxicity
  description: |
    Biotin is not known to be toxic. Doses of up to 5 mg/day for two years were not
    associated with adverse effects in people without disorders of biotin metabolism.
    Oral biotin supplementation has been well tolerated in doses up to 200 mg/day
    (nearly 7,000 times the AI) in people with hereditary disorders of biotin metabolism.
    Daily supplementation with highly concentrated biotin (100-600 mg) for several months
    was also well tolerated in individuals with progressive multiple sclerosis. Due to
    lack of adverse event reports, the Food and Nutrition Board did not establish a
    tolerable upper intake level (UL) for biotin. Note: High-dose biotin supplementation
    can interfere with streptavidin-biotin immunoassays, causing falsely high or falsely
    low results for various laboratory tests including thyroid hormones, reproductive
    hormones, and cardiac troponin.
  adverse_effects:
    - name: Eosinophilic pleuropericardial effusion
      description: |
        One case report of life-threatening eosinophilic pleuropericardial effusion
        in an elderly woman who took 10 mg/day of biotin with 300 mg/day of pantothenic
        acid for two months. This appears to be an isolated case when combined with
        high-dose pantothenic acid.
      severity: severe
  mic_references:
    - 1
    - 36
    - 66
    - 67
    - 68
    - 78
    - 79
    - 80
    - 81
    - 82

