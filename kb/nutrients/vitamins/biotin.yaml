drug_interactions:
  - name: Anticonvulsants and Biotin
    description: |
      Long-term anticonvulsant therapy with primidone, phenytoin, and carbamazepine
      is associated with reduced blood biotin concentrations and increased urinary
      excretion of organic acids indicating decreased carboxylase activity. Mechanisms
      include inhibition of intestinal absorption, reduced renal reabsorption, and
      increased biotin catabolism.
    drug_term:
      preferred_term: anticonvulsant
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: MODERATE
    mic_references:
      - 5
      - 73
      - 74
      - 75
      - 76
      - 77

  - name: Valproic Acid and Biotin
    description: |
      Use of valproic acid in children has resulted in hair loss that can be reversed
      by biotin supplementation.
    drug_term:
      preferred_term: valproic acid
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 74
      - 75
      - 76
      - 77

  - name: Antibiotics
    description: |
      Long-term treatment with antibacterial sulfonamide drugs or other antibiotics
      may decrease bacterial synthesis of biotin. However, the extent to which bacterial
      synthesis contributes to biotin intake in humans is not known.
    drug_term:
      preferred_term: antibiotic
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: THEORETICAL
    mic_references:
      - 73

nutrient_interactions:
  - name: Pantothenic Acid Competition
    description: |
      Pantothenic acid (vitamin B5) may compete with biotin for intestinal absorption
      via the human sodium-dependent multivitamin transporter (hSMVT).
    nutrient_term:
      preferred_term: pantothenic acid
    interaction_type: COMPETES_FOR_TRANSPORT
    mic_references:
      - 69
      - 70
      - 71

  - name: Lipoic Acid Competition
    description: |
      Lipoic acid shares the same sodium-dependent multivitamin transporter (hSMVT)
      with biotin and may reduce biotin-dependent carboxylase activities.
    nutrient_term:
      preferred_term: lipoic acid
    interaction_type: COMPETES_FOR_TRANSPORT
    mic_references:
      - 71
      - 72

disease_associations:
  - name: Biotinidase Deficiency
    description: |
      An autosomal recessive disorder that impairs biotin absorption and recycling.
      Without treatment, affected individuals develop neurological and cutaneous symptoms.
      The prognosis is characteristically good when biotin therapy is introduced in
      infancy. Treatment involves supplemental biotin at 5-20 mg daily.
    disease_term:
      preferred_term: biotinidase deficiency
      term:
        id: MONDO:0009665
        label: biotinidase deficiency
    relationship_type: THERAPEUTIC
    population_context: Individuals with inherited biotinidase deficiency
    mic_references:
      - 9
      - 10
      - 18
      - 19
      - 20
      - 21

  - name: Multiple Sclerosis
    description: |
      High-dose biotin (300 mg/day) has been investigated for treatment of progressive
      multiple sclerosis based on its roles in energy production and fatty acid synthesis
      required for myelin formation. Results from randomized controlled trials remain
      inconclusive. A meta-analysis found no overall benefit on MS-related disability,
      but moderate evidence suggested potential benefit for walk time in progressive
      MS subgroups.
    disease_term:
      preferred_term: multiple sclerosis
      term:
        id: MONDO:0005301
        label: multiple sclerosis
    relationship_type: THERAPEUTIC
    population_context: Patients with progressive multiple sclerosis; results inconclusive
    mic_references:
      - 35
      - 36
      - 37
      - 38
      - 39
      - 40

  - name: Type 2 Diabetes Mellitus
    description: |
      Evidence for biotin's effect on glucose control in type 2 diabetes is mixed.
      Some studies showed decreased fasting blood glucose with biotin supplementation,
      while others found no effect. Co-supplementation with biotin and chromium picolinate
      may be beneficial as adjunct therapy, but results are not conclusive.
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: THERAPEUTIC
    population_context: Evidence is mixed and inconclusive
    mic_references:
      - 41
      - 42
      - 43
      - 44
      - 45
      - 46
      - 47
      - 48

  - name: Congenital Anomalies Prevention
    description: |
      Marginal biotin deficiency during pregnancy is teratogenic in animal models,
      causing cleft palate and limb hypoplasia. While analogous effects have not been
      confirmed in humans, ensuring adequate biotin intake throughout pregnancy is
      prudent given that at least one-third of women develop marginal biotin deficiency
      during pregnancy.
    disease_term:
      preferred_term: congenital anomaly
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Pregnant women
    mic_references:
      - 8
      - 13
      - 26
      - 27
      - 28
      - 29
      - 30
    evidence:
      - reference: PMID:19056637
        supports: SUPPORT
        snippet: "In mice, degrees of biotin deficiency that are metabolically similar to those seen in pregnant women are very teratogenic"
        explanation: Animal evidence supports concern about marginal biotin deficiency and birth defects

  - name: Brittle Fingernails
    description: |
      Preliminary evidence from small trials suggests biotin supplementation (2.5 mg/day)
      may increase nail plate thickness in individuals with brittle nails. However,
      larger controlled trials are needed to confirm effectiveness.
    disease_term:
      preferred_term: brittle nails
    relationship_type: THERAPEUTIC
    population_context: Individuals with brittle fingernails; preliminary evidence
    mic_references:
      - 54
      - 55
      - 57

