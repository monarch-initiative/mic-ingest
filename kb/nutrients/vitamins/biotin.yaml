  notes: |
    Biotin recommendations are expressed as Adequate Intake (AI) rather than RDA because
    there is insufficient evidence to establish an Estimated Average Requirement. Dietary
    intakes of generally healthy adults have been estimated to be 40 to 60 micrograms daily.
    No Tolerable Upper Intake Level (UL) has been established due to lack of adverse event reports.

bioavailability:
  description: |
    Biotin is found in foods either as free biotin that is directly absorbed by enterocytes
    or as biotin bound to dietary proteins. Protein-bound biotin must be released by
    digestive proteases and biotinidase before absorption. Intestinal bacteria also
    synthesize biotin, although the extent to which this contributes to human biotin
    status is unclear.
  mic_references:
    - 63
    - 64

references:
  - reference: PMID:21871906
    title: Biotin requirements for DNA damage prevention
    findings:
      - statement: Biotin serves as cofactor for five human carboxylases and is attached to histones
        supporting_text: "Biotin serves as a covalently bound coenzyme in five human carboxylases; biotin is also attached to histones H2A, H3, and H4"
  - reference: PMID:18598135
    title: Malonyl-CoA, a key signaling molecule in mammalian cells
    findings:
      - statement: Malonyl-CoA regulates fatty acid metabolism and beta-oxidation
        supporting_text: "malonyl-CoA has an important signaling function through its allosteric inhibition of carnitine palmitoyltransferase 1"
  - reference: PMID:19056637
    title: Marginal biotin deficiency is common in normal human pregnancy and is highly teratogenic in mice
    findings:
      - statement: Substantial proportion of pregnant women are marginally biotin deficient
        supporting_text: "In a recent pilot study, activity of PCC in peripheral blood lymphocytes was decreased in 18 of 22 pregnant women"
  - reference: PMID:3196050
    title: "Biotinidase deficiency: a survey of 10 cases"
    findings:
      - statement: Biotinidase deficiency presents with dermatological signs (dermatitis and alopecia) and neurological abnormalities (fits, hypotonia, ataxia)
        supporting_text: "Clinical findings at presentation varied with dermatological signs (dermatitis and alopecia), neurological abnormalities (fits, hypotonia, and ataxia), and recurrent infections being the most common features"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Biotin. Evidence items include exact quotes from
  PubMed abstracts. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. The page contains 82 references.
