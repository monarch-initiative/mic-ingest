    findings:
      - statement: Vitamin C serves as a cofactor for numerous enzymatic reactions
        supporting_text: "Review of the biochemical functions of ascorbic acid"
  - reference: PMID:29099763
    title: Vitamin C and Immune Function
    findings:
      - statement: Vitamin C contributes to immune defense through multiple mechanisms
        supporting_text: "Vitamin C contributes to immune defense by supporting various cellular functions of both the innate and adaptive immune system."
  - reference: PMID:26846695
    title: The epigenetic role of vitamin C in health and disease
    findings:
      - statement: Vitamin C functions as a cofactor for DNA and histone demethylases
        supporting_text: "Ascorbate was discovered as a cofactor for methylcytosine dioxygenases that are responsible for DNA demethylation"
  - reference: PMID:36156315
    title: History of scurvy and use of vitamin C in critical illness
    findings:
      - statement: Scurvy is a severe vitamin C deficiency disease
        supporting_text: "Lind was interested in scurvy, a severe vitamin C deficiency which caused the death of thousands of British seamen."
  - reference: PMID:22492364
    title: Effects of vitamin C supplementation on blood pressure - a meta-analysis
    findings:
      - statement: Vitamin C supplementation reduces blood pressure
        supporting_text: "The pooled changes in SBP and DBP were -3.84 mm Hg (95% CI: -5.29, -2.38 mm Hg; P < 0.01) and -1.48 mm Hg (95% CI: -2.86, -0.10 mm Hg; P = 0.04)"
  - reference: PMID:11604276
    title: Scurvy identified in the emergency department - a case report
    findings:
      - statement: Scurvy presents with hemorrhagic manifestations and affects at-risk populations
        supporting_text: "Patients most at risk for developing scurvy include food faddists, the isolated elderly, and the mentally ill."
  - reference: PMID:11533373
    title: An orange a day keeps the doctor away - scurvy in the year 2000
    findings:
      - statement: Scurvy in children presents with characteristic symptoms
        supporting_text: "The condition is characterized by perifollicular petechiae and bruising, gingival inflammation and bleeding"
  - reference: PMID:15585762
    title: Antioxidant vitamins and coronary heart disease risk - pooled analysis of 9 cohorts
    findings:
      - statement: Supplemental vitamin C intake reduces CHD risk
        supporting_text: "those who took >700 mg supplemental vitamin C/d had a relative risk of CHD incidence of 0.75"
  - reference: PMID:30475962
    title: Dietary intake and blood concentrations of antioxidants and the risk of cardiovascular disease
    findings:
      - statement: Dietary vitamin C inversely associated with CHD risk
        supporting_text: "The summary RR per 100-mg/d increment of dietary vitamin C intake was 0.88 for coronary heart disease"
  - reference: PMID:11022052
    title: Serum vitamin C concentration inversely associated with 20-year stroke incidence - Shibata study
    findings:
      - statement: Higher serum vitamin C associated with lower stroke risk
        supporting_text: "Strong inverse associations were observed between serum vitamin C concentration and all stroke"
  - reference: PMID:18175738
    title: Plasma vitamin C concentrations predict risk of incident stroke - EPIC-Norfolk study
    findings:
      - statement: High plasma vitamin C associated with 42% lower stroke risk
        supporting_text: "persons in the top quartiles of baseline plasma vitamin C concentrations had a 42% lower risk"
  - reference: PMID:24284213
    title: Vitamin C intake, circulating vitamin C and risk of stroke - meta-analysis
    findings:
      - statement: Meta-analysis confirms inverse relationship between vitamin C and stroke
        supporting_text: "The summary RR for the high-versus-low categories was 0.81 for dietary vitamin C intake"
  - reference: PMID:18663161
    title: Plasma vitamin C level and risk of new-onset type 2 diabetes - EPIC-Norfolk study
    findings:
      - statement: High plasma vitamin C associated with reduced diabetes risk
        supporting_text: "The odds ratio of diabetes in the top quintile of plasma vitamin C was 0.38"
  - reference: PMID:27271663
    title: Marginal Ascorbate Status Results in an Attenuated Response to Vitamin C Supplementation
    findings:
