bioavailability:
  description: |
    Plasma vitamin C concentration is tightly controlled by three primary mechanisms:
    intestinal absorption, tissue transport, and renal reabsorption. Plasma concentrations
    of ascorbate reach steady-state at concentrations between 60 and 80 micromoles/L,
    typically observed at doses between 200 to 400 mg/day in healthy young adults.
    One hundred percent absorption efficiency is observed when ingesting vitamin C
    at doses up to 200 mg at a time. Higher doses (>500 mg) result in fractionally
    less vitamin C being absorbed as the dose increases.
  evidence:
    - reference: PMID:27271663
      supports: SUPPORT
      snippet: "Participants who consumed 200 mg/day vitamin C typically reached saturating concentrations (>65 μmol/L) within one week, while those with hypovitaminosis C required two weeks to reach saturation."
      explanation: Demonstrates dose-response relationship and individual variation in vitamin C absorption
  factors:
    - name: Dose-dependent absorption
      description: |
        Absorption efficiency decreases as dose increases above 200 mg. Higher doses
        (>500 mg) result in fractionally less vitamin C being absorbed.
      effect: DECREASED
      evidence:
        - reference: PMID:27271663
          supports: SUPPORT
          snippet: "supplementation with 50 mg/day vitamin C, which resulted in a total dietary vitamin C intake of 75 mg/day, was insufficient to achieve adequate plasma ascorbate concentrations in individuals with hypovitaminosis C"
          explanation: Lower doses may be insufficient, highlighting dose-dependent response
    - name: Intravenous administration
      description: |
        Intravenous administration of vitamin C bypasses absorptive control in the
        intestine such that very high concentrations can be achieved in the plasma.
      effect: INCREASED
    - name: Genetic variation
      description: |
        Individuals who carry certain polymorphisms in genes involved in vitamin C
        transport and detoxification mechanisms may have lower plasma vitamin C
        concentrations even with high vitamin C intakes.
      effect: DECREASED
  mic_references:
    - 22
    - 23
    - 24
    - 25
    - 26
    - 27
    - 28

