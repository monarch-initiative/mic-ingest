drug_interactions:
  - name: Calcium channel blockers
    description: |
      Dihydropyridine calcium channel blockers (e.g., nicardipine, nifedipine) can
      inhibit vitamin C uptake by intestinal cells in vitro. However, a reduction
      in blood vitamin C concentrations with these drugs has not been reported in humans.
    drug_term:
      preferred_term: calcium channel blocker
    interaction_type: REDUCES_ABSORPTION
    clinical_significance: THEORETICAL
    mic_references:
      - 244
  - name: Aspirin
    description: |
      Aspirin can impair vitamin C status if taken frequently.
    drug_term:
      preferred_term: aspirin
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 245
  - name: Warfarin
    description: |
      Large doses of vitamin C may block the action of warfarin and thus lower its
      effectiveness. Individuals taking anticoagulant medications should limit their
      vitamin C intake to <1 g/day and have their prothrombin time monitored.
    drug_term:
      preferred_term: warfarin
    interaction_type: ANTAGONISTIC
    clinical_significance: HIGH
    mic_references:
      - 244
  - name: Aluminum-containing compounds
    description: |
      Vitamin C may bind aluminum in the gut and increase the absorption of
      aluminum-containing compounds (e.g., aluminum-containing antacids, phosphate binders).
      People with impaired kidney function may be at risk for aluminum toxicity when
      supplemental vitamin C is taken at the same time as these compounds.
    drug_term:
      preferred_term: aluminum compound
    interaction_type: INCREASES_ABSORPTION
    clinical_significance: HIGH
    mic_references:
      - 244
      - 245
  - name: Oral contraceptives and hormone replacement therapy
    description: |
      Supplemental vitamin C may increase blood estrogen concentrations in women
      using oral contraceptives or hormone replacement therapy.
    drug_term:
      preferred_term: estrogen
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 244

disease_associations:
  - name: Hypertension
    description: |
      Studies have consistently indicated an inverse relationship between plasma
      vitamin C concentration and blood pressure in both men and women. A meta-analysis
      of 29 randomized controlled trials found that daily supplementation with vitamin C
      reduced systolic blood pressure by 3.84 mm Hg and diastolic blood pressure by
      1.48 mm Hg. However, long-term trials are needed to examine whether this effect
      is sustained and results in reduced cardiovascular events.
    disease_term:
      preferred_term: hypertension
      term:
        id: MONDO:0001134
        label: essential hypertension
    relationship_type: PROTECTIVE
    direction: DECREASED
    mic_references:
      - 47
      - 48
      - 49
      - 50
      - 51
      - 52
      - 53
      - 54
    evidence:
      - reference: PMID:22492364
        supports: SUPPORT
        snippet: "The pooled changes in SBP and DBP were -3.84 mm Hg (95% CI: -5.29, -2.38 mm Hg; P < 0.01) and -1.48 mm Hg (95% CI: -2.86, -0.10 mm Hg; P = 0.04), respectively."
        explanation: Meta-analysis demonstrates significant blood pressure reduction with vitamin C supplementation

  - name: Coronary Heart Disease
    description: |
      Prospective cohort studies indicate an overall inverse association between
      higher vitamin C intakes and CHD risk. A meta-analysis found a 12% lower risk
      of CHD with each 100 mg/day incremental increase in dietary vitamin C. Higher
      blood concentrations of vitamin C were also associated with lower CHD risk.
    disease_term:
      preferred_term: coronary artery disease
      term:
        id: MONDO:0005010
        label: coronary artery disorder
    relationship_type: PROTECTIVE
    direction: DECREASED
    mic_references:
      - 55
      - 56
      - 57
      - 58
    evidence:
      - reference: PMID:15585762
        supports: SUPPORT
        snippet: "Subjects with higher supplemental vitamin C intake had a lower CHD incidence. Compared with subjects who did not take supplemental vitamin C, those who took >700 mg supplemental vitamin C/d had a relative risk of CHD incidence of 0.75 (0.60, 0.93; P for trend <0.001)."
        explanation: Pooled analysis of 9 cohorts shows reduced CHD risk with high supplemental vitamin C
      - reference: PMID:30475962
        supports: SUPPORT
        snippet: "The summary RR per 100-mg/d increment of dietary vitamin C intake was 0.88 (95% CI: 0.79, 0.98, I2 = 65%, n = 11) for coronary heart disease"
        explanation: Dose-response meta-analysis confirms 12% lower CHD risk per 100mg/day vitamin C

  - name: Stroke
    description: |
      Prospective cohort studies found that individuals with higher plasma vitamin C
      concentrations had significantly lower risk of stroke. A meta-analysis reported
      a 19% lower risk of stroke with highest versus lowest dietary vitamin C intakes
      and a 38% lower risk with highest versus lowest circulating vitamin C concentrations.
    disease_term:
      preferred_term: stroke
      term:
        id: MONDO:0005098
        label: stroke disorder
    relationship_type: PROTECTIVE
    direction: DECREASED
    mic_references:
      - 66
      - 67
      - 68
      - 69
    evidence:
      - reference: PMID:11022052
        supports: SUPPORT
        snippet: "Strong inverse associations were observed between serum vitamin C concentration and all stroke (sex- and age-adjusted hazard ratios were 0.93, 0.72, and 0.59, respectively, for the second, third, and fourth quartiles compared with the first quartile; P for trend=0.002)"
        explanation: 20-year Shibata study shows 41% lower stroke risk in highest vitamin C quartile
      - reference: PMID:18175738
        supports: SUPPORT
        snippet: "persons in the top quartiles of baseline plasma vitamin C concentrations had a 42% lower risk (relative risk: 0.58; 95% CI: 0.43, 0.78) than did those in the bottom quartile"
        explanation: EPIC-Norfolk study confirms 42% lower stroke risk with high plasma vitamin C
      - reference: PMID:24284213
        supports: SUPPORT
        snippet: "The summary RR for the high-versus-low categories was 0.81 (95% CI: 0.74 to 0.90) for dietary vitamin C intake (11 studies), and 0.62 (95% CI: 0.49 to 0.79) for circulating vitamin C (6 studies)."
        explanation: Meta-analysis confirms 19% lower stroke risk with dietary vitamin C and 38% lower with circulating vitamin C

  - name: Type 2 Diabetes Mellitus
    description: |
      In the EPIC-Norfolk study, high plasma vitamin C was found to be strongly
      associated with a reduced risk of diabetes. Cross-sectional studies reported
      inverse associations between circulating vitamin C concentrations and markers
      of insulin resistance or glucose intolerance. However, short-term randomized
      controlled studies have found no effect of vitamin C supplementation on glycemic
      markers in healthy individuals.
    disease_term:
      preferred_term: type 2 diabetes mellitus
      term:
        id: MONDO:0005148
        label: type 2 diabetes mellitus
    relationship_type: PROTECTIVE
    direction: DECREASED
    population_context: Observational association; intervention trials show mixed results
    mic_references:
      - 97
      - 98
      - 99
      - 100
      - 101
    evidence:
      - reference: PMID:18663161
        supports: SUPPORT
        snippet: "A strong inverse association was found between plasma vitamin C level and diabetes risk. The odds ratio of diabetes in the top quintile of plasma vitamin C was 0.38 (95% confidence interval, 0.28-0.52)"
        explanation: EPIC-Norfolk study shows 62% lower diabetes risk in highest plasma vitamin C quintile
  - name: Alzheimer Disease
    disease_term:
      preferred_term: Alzheimer disease
      term:
        id: MONDO:0004975
        label: Alzheimer disease
    relationship_type: RISK_FACTOR
    direction: DECREASED
    description: |
      Meta-analyses show significantly lower plasma vitamin C concentrations in
      Alzheimer's disease patients compared to healthy controls. Vitamin C is
      actively concentrated in the brain, and a higher CSF-to-plasma vitamin C
      ratio predicts slower cognitive decline in AD. However, intervention trials
      combining vitamin C with other antioxidants in AD patients have reduced
      CSF oxidative stress biomarkers but have not demonstrated clinical benefit
      and may even accelerate cognitive decline.
    population_context: Observational evidence; supplementation trials in AD patients show no clinical benefit
    mic_references:
      - 113
      - 114
      - 115
      - 117
      - 119
      - 121
      - 122
      - 123
    evidence:
      - reference: PMID:36158537
        supports: SUPPORT
        snippet: "The results show that there is a significant decrease in the plasma vitamin C levels of AD patients as compared to healthy controls (pooled SMD with random-effect model: -1.164, with 95%CI: -1.720 to -0.608, Z = -4.102, p = 0.00)"
        explanation: Meta-analysis of 12 studies (n=1,100) confirming significantly lower plasma vitamin C in AD patients versus healthy controls
      - reference: PMID:19158425
        supports: SUPPORT
        snippet: "CSF: plasma AA ratio predicts rate of decline in AD. This relationship may indicate that the CSF: plasma AA ratio is an index of AA availability to the brain or may be an artifact of a relationship between blood-brain barrier impairment and neurodegeneration"
        explanation: Longitudinal study showing higher CSF-to-plasma vitamin C ratio at baseline predicted slower cognitive decline at one year in AD patients
      - reference: PMID:22431837
        supports: REFUTE
        snippet: "accelerated decline in Mini-Mental State Examination scores occurred in the E/C/ALA group, a potential safety concern"
        explanation: RCT of vitamin C plus vitamin E plus alpha-lipoic acid in mild-to-moderate AD found reduced CSF oxidative stress but faster cognitive decline, raising a safety concern about antioxidant supplementation in AD

