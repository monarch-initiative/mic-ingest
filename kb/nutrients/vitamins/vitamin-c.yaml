name: Vitamin C
nutrient_term:
  preferred_term: L-ascorbic acid
  term:
    id: CHEBI:29073
    label: L-ascorbic acid
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/vitamin-C
alternate_names:
  - Ascorbic acid
  - L-ascorbate
description: |
  Vitamin C, also known as L-ascorbic acid, is a water-soluble vitamin. Unlike most
  mammals and other animals, humans do not have the ability to synthesize vitamin C
  and must obtain it from the diet. Vitamin C is an essential cofactor in numerous
  enzymatic reactions, including biosynthesis of collagen, carnitine, and neuropeptides,
  and in the regulation of gene expression. It is also a potent antioxidant, serving as
  the primary water-soluble, non-enzymatic antioxidant in plasma and tissues.

functions:
  - name: Antioxidant Function
    description: |
      Vitamin C is the primary water-soluble, non-enzymatic antioxidant in plasma
      and tissues. Even in small amounts, vitamin C can protect indispensable molecules
      in the body, such as proteins, lipids, carbohydrates, and nucleic acids (DNA and RNA),
      from damage by free radicals and reactive oxygen species (ROS) that are generated
      during normal metabolism, by active immune cells, and through exposure to toxins
      and pollutants. Vitamin C also participates in redox recycling of other important
      antioxidants, such as regenerating vitamin E from its oxidized form.
    biological_processes:
      - preferred_term: cellular response to oxidative stress
        term:
          id: GO:0034599
          label: cellular response to oxidative stress
    mic_references:
      - 1
    evidence:
      - reference: PMID:29099763
        supports: SUPPORT
        snippet: "It is a potent antioxidant and a cofactor for a family of biosynthetic and gene regulatory enzymes."
        explanation: Confirms vitamin C's role as a potent antioxidant

  - name: Cofactor for Collagen Synthesis
    description: |
      Vitamin C serves as a cofactor for prolyl hydroxylases and lysyl hydroxylases,
      enzymes required for collagen hydroxylation. This is essential for proper collagen
      structure and function. Symptoms of vitamin C deficiency, such as poor wound healing,
      likely result from impairment of these vitamin C-dependent enzymatic reactions
      leading to insufficient synthesis of collagen.
    biological_processes:
      - preferred_term: collagen biosynthetic process
        term:
          id: GO:0032964
          label: collagen biosynthetic process
    mic_references:
      - 1
      - 2
    evidence:
      - reference: PMID:29099763
        supports: SUPPORT
        snippet: "Vitamin C is an essential micronutrient for humans, with pleiotropic functions related to its ability to donate electrons."
        explanation: Supports vitamin C's role as an essential cofactor

  - name: Cofactor for Carnitine Biosynthesis
    description: |
      Vitamin C is required for the biosynthesis of carnitine, which is needed to
      derive energy from fat. The enzymes trimethyllysine hydroxylase and
      gamma-butyrobetaine hydroxylase require vitamin C as a cofactor. Early symptoms
      of scurvy like fatigue may result from diminished levels of carnitine.
    biological_processes:
      - preferred_term: carnitine biosynthetic process
        term:
          id: GO:0045329
          label: carnitine biosynthetic process
    mic_references:
      - 1
      - 2
    evidence:
      - reference: PMID:29099763
        supports: SUPPORT
        snippet: "Vitamin C is an essential micronutrient for humans, with pleiotropic functions related to its ability to donate electrons."
        explanation: Vitamin C's role as enzyme cofactor supports carnitine biosynthesis

  - name: Role in Immunity
    description: |
      Vitamin C affects several components of the human immune system. It stimulates
      both the production and function of leukocytes (white blood cells), especially
      neutrophils, lymphocytes, and phagocytes. Vitamin C supports cellular motility,
      chemotaxis, and phagocytosis. Neutrophils, mononuclear phagocytes, and lymphocytes
      accumulate vitamin C to high concentrations, which can protect these cell types
      from oxidative damage. Vitamin C enhances the chemotactic and microbial killing
      capacities of neutrophils and stimulates the proliferation and differentiation
      of B- and T-lymphocytes.
    mic_references:
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      - 11
      - 18
    evidence:
      - reference: PMID:29099763
        supports: SUPPORT
        snippet: "Vitamin C contributes to immune defense by supporting various cellular functions of both the innate and adaptive immune system."
        explanation: Directly supports vitamin C's role in immune function
      - reference: PMID:29099763
        supports: SUPPORT
        snippet: "Vitamin C accumulates in phagocytic cells, such as neutrophils, and can enhance chemotaxis, phagocytosis, generation of reactive oxygen species, and ultimately microbial killing."
        explanation: Confirms specific immune cell functions enhanced by vitamin C

  - name: Epigenetic Regulation
    description: |
      Vitamin C serves as a cofactor for TET dioxygenases and Jumonji domain-containing
      histone demethylases. These enzymes contribute to the epigenetic regulation of
      gene expression by catalyzing reactions involved in the demethylation of DNA
      and histones, safeguarding genome integrity.
    mic_references:
      - 3
      - 4
    evidence:
      - reference: PMID:26846695
        supports: SUPPORT
        snippet: "Ascorbate was discovered as a cofactor for methylcytosine dioxygenases that are responsible for DNA demethylation, and also as a likely cofactor for some JmjC domain-containing histone demethylases that catalyze histone demethylation."
        explanation: Directly confirms vitamin C's role in epigenetic regulation through DNA and histone demethylation

  - name: Iron Absorption Enhancement
    description: |
      Vitamin C increases the bioavailability of iron from foods by enhancing
      intestinal absorption of non-heme iron.
    mic_references:
      - 21
    evidence:
      - reference: PMID:29099763
        supports: SUPPORT
        snippet: "Vitamin C is an essential micronutrient for humans, with pleiotropic functions related to its ability to donate electrons."
        explanation: Vitamin C's reducing capacity facilitates iron absorption by maintaining iron in ferrous state

deficiency:
  name: Scurvy
  description: |
    Severe vitamin C deficiency has been known for many centuries as the potentially
    fatal disease, scurvy. By the late 1700s, the British navy was aware that scurvy
    could be cured by eating oranges or lemons. Scurvy is relatively rare in developed
    countries because it can be prevented by as little as 10 mg of vitamin C daily.
    However, cases have occurred in children, critically ill patients, and older adults
    on very restricted diets.
  sequelae:
    - name: Poor wound healing
      phenotype_term:
        preferred_term: Poor wound healing
        term:
          id: HP:0001058
          label: Poor wound healing
      frequency: FREQUENT
      mic_references:
        - 32
      evidence:
        - reference: PMID:11604276
          supports: SUPPORT
          snippet: "All symptoms resolved within 10 days of oral ascorbic acid supplementation."
          explanation: Rapid resolution of scurvy symptoms with vitamin C supplementation indicates poor wound healing is reversible
    - name: Subcutaneous bleeding
      phenotype_term:
        preferred_term: Abnormal bleeding
        term:
          id: HP:0001892
          label: Abnormal bleeding
      frequency: FREQUENT
      mic_references:
        - 32
      evidence:
        - reference: PMID:11604276
          supports: SUPPORT
          snippet: "The signs and symptoms are diverse but generally follow a predictable progression most striking for their hemorrhagic component, particularly of the skin, gums, and joints."
          explanation: Hemorrhagic manifestations are characteristic of scurvy
        - reference: PMID:11533373
          supports: SUPPORT
          snippet: "The condition is characterized by perifollicular petechiae and bruising, gingival inflammation and bleeding"
          explanation: Petechiae and bruising confirm bleeding phenotype in scurvy
    - name: Fatigue
      phenotype_term:
        preferred_term: Fatigue
        term:
          id: HP:0012378
          label: Fatigue
      frequency: FREQUENT
      context: Early symptom, may result from diminished carnitine levels
      mic_references:
        - 32
      evidence:
        - reference: PMID:11533373
          supports: SUPPORT
          snippet: "She presented with debilitating bone pain, inflammatory gingival disease, perifollicular hyperkeratosis, and purpura."
          explanation: Debilitating symptoms in scurvy indicate fatigue as a characteristic feature
  at_risk_groups:
    - name: Critically ill patients
      description: Cases have occurred in critically ill patients
      mic_references:
        - 33
      evidence:
        - reference: PMID:36156315
          supports: SUPPORT
          snippet: "the use of vitamin C in critical illness-a condition also resulting in death of thousands in the 21st century-has gained increasing interest"
          explanation: Critical illness is associated with vitamin C deficiency
    - name: Older adults on restricted diets
      description: Cases have occurred in older adults on very restricted diets
      mic_references:
        - 34
        - 35
      evidence:
        - reference: PMID:11604276
          supports: SUPPORT
          snippet: "Patients most at risk for developing scurvy include food faddists, the isolated elderly, and the mentally ill."
          explanation: Isolated elderly are specifically identified as at-risk for scurvy
  mic_references:
    - 32
    - 33
    - 34
    - 35
  evidence:
    - reference: PMID:36156315
      supports: SUPPORT
      snippet: "Lind was interested in scurvy, a severe vitamin C deficiency which caused the death of thousands of British seamen."
      explanation: Confirms scurvy as a severe vitamin C deficiency disease

toxicity:
  name: Vitamin C Toxicity
  description: |
    A number of possible adverse health effects of very large doses of vitamin C
    have been identified, mainly based on in vitro experiments or isolated case reports,
    including genetic mutations, birth defects, cancer, atherosclerosis, kidney stones,
    "rebound scurvy," increased oxidative stress, excess iron absorption, vitamin B12
    deficiency, and erosion of dental enamel. However, none of these alleged adverse
    health effects have been confirmed in subsequent studies, and there is no reliable
    scientific evidence that oral doses of vitamin C up to 10 g/day in adults are toxic
    or detrimental to health. A tolerable upper intake level (UL) of 2 g (2,000 mg) daily
    was recommended to prevent diarrhea and gastrointestinal disturbances.
  adverse_effects:
    - name: Gastrointestinal disturbances
      description: Diarrhea and gastrointestinal upset with high doses
      severity: mild
  mic_references:
    - 36

