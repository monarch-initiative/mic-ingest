name: Riboflavin
nutrient_term:
  preferred_term: riboflavin
  term:
    id: CHEBI:17015
    label: riboflavin
category: vitamin
source_url: https://lpi.oregonstate.edu/mic/vitamins/riboflavin
alternate_names:
  - Vitamin B2
description: |
  Riboflavin is a water-soluble B vitamin that serves as the precursor of the coenzymes
  flavin adenine dinucleotide (FAD) and flavin mononucleotide (FMN). These flavocoenzymes
  act as electron carriers in numerous oxidation-reduction (redox) reactions involved in
  energy production, cellular antioxidant function, and metabolic pathways. Riboflavin is
  required for the metabolism of iron and vitamin B6, the synthesis of niacin from
  tryptophan, and plays an essential role in folate and one-carbon metabolism where FAD
  serves as a cofactor for methylenetetrahydrofolate reductase (MTHFR).

functions:
  - name: Oxidation-Reduction Reactions
    description: |
      Flavocoenzymes (FAD and FMN) participate in redox reactions in numerous metabolic
      pathways. They are critical for the metabolism of carbohydrates, lipids, and proteins.
      FAD is part of the electron transport (respiratory) chain, which is central to energy
      production. In conjunction with cytochrome P-450, flavocoenzymes also participate in
      the metabolism of drugs and toxins.
    biological_processes:
      - preferred_term: electron transport chain
        term:
          id: GO:0022900
          label: electron transport chain
    mic_references:
      - 3
      - 4

  - name: Antioxidant Function
    description: |
      Glutathione reductase is a FAD-dependent enzyme that participates in the redox cycle
      of glutathione. The glutathione redox cycle plays a major role in protecting organisms
      from reactive oxygen species, such as hydroperoxides. Glutathione reductase requires
      FAD to regenerate two molecules of reduced glutathione from oxidized glutathione.
      Riboflavin deficiency has been associated with increased oxidative stress.
    genes:
      - preferred_term: GSR
        description: Glutathione-disulfide reductase
        term:
          id: HGNC:4623
          label: GSR
    mic_references:
      - 4
      - 5

  - name: Uric Acid Production
    description: |
      Xanthine oxidase, another FAD-dependent enzyme, catalyzes the oxidation of hypoxanthine
      and xanthine to uric acid. Uric acid is one of the most effective water-soluble
      antioxidants in the blood. Riboflavin deficiency can result in decreased xanthine
      oxidase activity, reducing blood uric acid levels.
    genes:
      - preferred_term: XDH
        description: Xanthine dehydrogenase
        term:
          id: HGNC:12805
          label: XDH
    mic_references:
      - 6

  - name: Cofactor for MTHFR
    description: |
      FAD is required as a cofactor for methylenetetrahydrofolate reductase (MTHFR), a key
      folate-metabolizing enzyme. MTHFR converts 5,10-methylenetetrahydrofolate to
      5-methyltetrahydrofolate, the cofactor form necessary for the re-methylation of
      homocysteine to methionine. Low riboflavin status can impair MTHFR function,
      particularly in individuals with the MTHFR C677T polymorphism.
    genes:
      - preferred_term: MTHFR
        description: Methylenetetrahydrofolate reductase
        term:
          id: HGNC:7436
          label: MTHFR
    mic_references:
      - 14
      - 15
    evidence:
      - reference: PMID:16380544
        supports: SUPPORT
        snippet: "Riboflavin lowers homocysteine in individuals homozygous for the MTHFR 677C->T polymorphism"
        explanation: Demonstrates riboflavin's role as MTHFR cofactor and ability to lower homocysteine in TT genotype

deficiency:
  name: Riboflavin Deficiency (Ariboflavinosis)
  description: |
    Ariboflavinosis is the medical name for clinical riboflavin deficiency, which occurs
    commonly in low- and middle-income countries. Riboflavin deficiency is rarely found
    in isolation; it typically occurs in combination with deficiencies of other
    water-soluble vitamins. Subclinical deficiency (low status) without clinical signs
    may be widespread, including in high-income countries, but usually goes undetected
    because riboflavin biomarkers are rarely measured in human studies.
  sequelae:
    - name: Angular Stomatitis
      phenotype_term:
        preferred_term: angular cheilitis
        term:
          id: HP:0030318
          label: Angular cheilitis
      frequency: FREQUENT
      context: Cracks or sores at the corners of the mouth
      mic_references:
        - 1
        - 3

    - name: Cheilosis
      phenotype_term:
        preferred_term: cheilitis
        term:
          id: HP:0100825
          label: Cheilitis
      frequency: FREQUENT
      context: Cracks or sores on the outsides of the lips
      mic_references:
        - 1
        - 3

    - name: Glossitis
      phenotype_term:
        preferred_term: glossitis
        term:
          id: HP:0000206
          label: Glossitis
      frequency: FREQUENT
      context: Inflammation and redness of the tongue (magenta tongue)
      mic_references:
        - 1
        - 3

    - name: Seborrheic Dermatitis
      phenotype_term:
        preferred_term: seborrheic dermatitis
        term:
          id: HP:0001051
          label: Seborrheic dermatitis
      frequency: FREQUENT
      context: Moist, scaly skin inflammation
      mic_references:
        - 1
        - 3

    - name: Corneal Neovascularization
      phenotype_term:
        preferred_term: corneal neovascularization
        term:
          id: HP:0011496
          label: Corneal neovascularization
      frequency: OCCASIONAL
      context: Formation of blood vessels in the clear covering of the eye
      mic_references:
        - 1
        - 3

    - name: Normochromic Normocytic Anemia
      phenotype_term:
        preferred_term: normocytic anemia
        term:
          id: HP:0001897
          label: Normocytic anemia
      frequency: OCCASIONAL
      context: Decreased red blood cell count with normal hemoglobin levels and cell size
      mic_references:
        - 1
        - 3

  at_risk_groups:
    - name: Pregnant women
      description: |
        Low riboflavin status is associated with preeclampsia in pregnant women. A study
        found that women who were riboflavin deficient were 4.7 times more likely to
        develop preeclampsia than those with adequate riboflavin status.
      mic_references:
        - 25
        - 26

    - name: Individuals with MTHFR 677TT genotype
      description: |
        The reduction in MTHFR activity observed in individuals with the variant MTHFR
        677TT genotype leads to increased plasma homocysteine. Riboflavin supplementation
        can help normalize MTHFR function in these individuals.
      mic_references:
        - 14
        - 27

    - name: Chronic alcohol consumers
      description: |
        Chronic alcohol consumption has been associated with riboflavin deficiency. In
        rats chronically fed alcohol, inhibition of riboflavin transporters caused
        impairment in intestinal absorption and renal re-uptake of the vitamin.
      mic_references:
        - 30
        - 114

    - name: Athletes
      description: |
        Exercise may increase riboflavin requirements. Some evidence suggests that
        riboflavin status may be compromised in athletes, particularly young women.
      mic_references:
        - 31
        - 32

    - name: Elderly individuals
      description: |
        Older adults may have increased riboflavin requirements or decreased absorption.
        Studies have shown suboptimal riboflavin status in free-living elderly people.
      mic_references:
        - 8
        - 115
        - 116
        - 117

  mic_references:
    - 1
    - 3

toxicity:
  name: Riboflavin Safety
  description: |
    No toxic or adverse effects of high riboflavin intake in humans are known. High-dose
    riboflavin therapy has been found to intensify urine color to a bright yellow
    (flavinuria), but this is a harmless side effect. The Food and Nutrition Board did
    not establish a tolerable upper intake level (UL) when the RDA was revised in 1998.
  adverse_effects:
    - name: Flavinuria
      description: |
        Bright yellow urine coloration from excess riboflavin excretion. This is a harmless
        side effect with no clinical significance.
      severity: mild
  mic_references:
    - 1
    - 113

