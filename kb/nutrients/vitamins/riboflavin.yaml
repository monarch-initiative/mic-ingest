drug_interactions:
  - name: Phenothiazine Derivatives
    description: |
      Phenothiazine derivatives like the anti-psychotic medication chlorpromazine (Thorazine)
      inhibit the conversion of riboflavin to FAD and FMN.
    drug_term:
      preferred_term: chlorpromazine
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 4

  - name: Tricyclic Antidepressants
    description: |
      Tricyclic antidepressants inhibit the conversion of riboflavin to FAD and FMN.
    drug_term:
      preferred_term: tricyclic antidepressant
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 4

  - name: Anticonvulsants
    description: |
      Long-term use of the anticonvulsant phenobarbital may increase destruction of
      riboflavin by liver enzymes, increasing the risk of deficiency.
    drug_term:
      preferred_term: phenobarbital
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 3

  - name: Quinacrine
    description: |
      The anti-malarial medication quinacrine inhibits the conversion of riboflavin
      to FAD and FMN.
    drug_term:
      preferred_term: quinacrine
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 4

  - name: Adriamycin
    description: |
      The cancer chemotherapy agent adriamycin (doxorubicin) inhibits the conversion of
      riboflavin to FAD and FMN.
    drug_term:
      preferred_term: doxorubicin
    interaction_type: AFFECTS_METABOLISM
    clinical_significance: MODERATE
    mic_references:
      - 4

nutrient_interactions:
  - name: Iron Interaction
    description: |
      Riboflavin deficiency may impair iron metabolism. Riboflavin is required for the
      mobilization of stored iron. Studies have shown that correcting marginal riboflavin
      deficiency improves hematologic status in young women.
    nutrient_term:
      preferred_term: iron
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 16
      - 17
      - 18
      - 19
    evidence:
      - reference: PMID:21525198
        supports: SUPPORT
        snippet: "Moderately poor riboflavin status can affect iron status: the lower the riboflavin status, the greater the hematologic benefits of improving status"
        explanation: Demonstrates riboflavin's role in iron metabolism and hematologic status

  - name: Vitamin B6 Interaction
    description: |
      Riboflavin (as FMN) is required for the conversion of vitamin B6 to its active
      coenzyme form (PLP). Riboflavin deficiency may result in decreased conversion
      of vitamin B6.
    nutrient_term:
      preferred_term: vitamin B6
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 7
      - 8
      - 9
      - 10

  - name: Folate and Homocysteine
    description: |
      Riboflavin (as FAD) is required for MTHFR, a key enzyme in folate metabolism. Low
      riboflavin status impairs MTHFR function and can lead to elevated homocysteine,
      particularly in individuals with the MTHFR C677T polymorphism.
    nutrient_term:
      preferred_term: folate
    interaction_type: AFFECTS_METABOLISM
    mic_references:
      - 11
      - 12
      - 13
      - 14
      - 15

disease_associations:
  - name: Migraine Prevention
    description: |
      Some evidence indicates that impaired mitochondrial oxygen metabolism in the brain
      may play a role in migraine pathology. Since riboflavin is the precursor of FAD and
      FMN required by mitochondrial electron transport chain flavoproteins, supplemental
      riboflavin has been investigated for migraine prophylaxis. Multiple trials have
      shown that high-dose riboflavin (400 mg/day) may reduce migraine frequency and
      headache days in adults, though results in children are more conflicting.
    disease_term:
      preferred_term: migraine disorder
      term:
        id: MONDO:0005277
        label: migraine disorder
    relationship_type: THERAPEUTIC
    population_context: Adults with recurrent migraines; 400 mg/day for prophylaxis
    mic_references:
      - 56
      - 57
      - 58
      - 59
      - 60
    evidence:
      - reference: PMID:9484373
        supports: SUPPORT
        snippet: "riboflavin was superior to placebo in reducing attack frequency (p = 0.005) and headache days (p = 0.012)"
        explanation: Randomized controlled trial demonstrating efficacy of high-dose riboflavin for migraine prophylaxis

  - name: Hypertension in MTHFR 677TT Genotype
    description: |
      The MTHFR C677T polymorphism is associated with increased risk of hypertension.
      Intervention studies have shown that supplementation with riboflavin (the MTHFR
      cofactor) effectively lowers blood pressure specifically in individuals with
      the variant MTHFR 677TT genotype. Riboflavin intervention reduced mean blood
      pressure from 144/87 to 131/80 mmHg in those with the TT genotype.
    disease_term:
      preferred_term: essential hypertension
      term:
        id: MONDO:0001134
        label: essential hypertension
    relationship_type: THERAPEUTIC
    population_context: Individuals with MTHFR 677TT genotype
    mic_references:
      - 90
      - 91
      - 92
      - 94
      - 95
    evidence:
      - reference: PMID:19952781
        supports: SUPPORT
        snippet: "Riboflavin intervention reduced mean blood pressure specifically in those with the TT genotype (from 144/87 to 131/80 mmHg; P < 0.05 systolic; P < 0.05 diastolic)"
        explanation: Demonstrates riboflavin's genotype-specific blood pressure lowering effect

  - name: Cataract Prevention
    description: |
      Age-related cataracts are the leading cause of visual disability in developed
      countries. Several observational studies have found associations between higher
      riboflavin intake or status and reduced risk of cataracts, though randomized
      controlled trial evidence is limited.
    disease_term:
      preferred_term: cataract
      term:
        id: MONDO:0005129
        label: cataract
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: Older adults; observational evidence primarily
    mic_references:
      - 33
      - 34
      - 35
      - 36
      - 37
      - 38
    evidence:
      - reference: PMID:7840110
        supports: SUPPORT
        snippet: "intakes of numerous nutrients in the highest versus lowest quintile were associated with 40-50 percent reduced odds of more severe nuclear sclerosis"
        explanation: Observational study showing inverse association between riboflavin intake and nuclear cataracts

  - name: Colorectal Cancer
    description: |
      Meta-analyses have found inverse associations between riboflavin intake and risk
      of colorectal cancer. A dose-response meta-analysis found that higher intakes of
      riboflavin were associated with a significantly lower risk of colorectal cancer
      (RR=0.87), with CRC risk reduced by 10% when riboflavin intake increased to 5 mg/day.
    disease_term:
      preferred_term: colorectal cancer
      term:
        id: MONDO:0005575
        label: colorectal cancer
    relationship_type: RISK_FACTOR
    direction: DECREASED
    population_context: General population; dose-response relationship observed
    mic_references:
      - 45
      - 46
      - 47
      - 48
    evidence:
      - reference: PMID:29744609
        supports: SUPPORT
        snippet: "Vitamin B2 intake was inversely associated with CRC risk (RR = 0.87; 95% CI 0.81-0.93)"
        explanation: Meta-analysis demonstrating inverse association between riboflavin intake and colorectal cancer risk

  - name: Multiple Acyl-CoA Dehydrogenase Deficiency (MADD)
    description: |
      Multiple acyl-CoA dehydrogenase deficiency is an inherited disorder of fatty acid
      and amino acid oxidation. Many patients with MADD respond to riboflavin
      supplementation, with improvements in clinical symptoms and biochemical markers.
    disease_term:
      preferred_term: multiple acyl-CoA dehydrogenase deficiency
    relationship_type: THERAPEUTIC
    population_context: Patients with riboflavin-responsive MADD
    mic_references:
      - 68
      - 69
      - 70
      - 71
      - 72

  - name: Riboflavin Transporter Deficiency
    description: |
      Riboflavin transporter deficiency (formerly Brown-Vialetto-Van Laere syndrome) is
      a rare genetic disorder affecting riboflavin transport. Affected patients may
      benefit from high-dose riboflavin supplementation.
    disease_term:
      preferred_term: riboflavin transporter deficiency
    relationship_type: THERAPEUTIC
    population_context: Patients with inherited riboflavin transporter defects
    mic_references:
      - 81
      - 82
      - 83
      - 84

  - name: Trimethylaminuria
    description: |
      Trimethylaminuria is a metabolic condition characterized by accumulation of
      trimethylamine, causing a fish-like body odor. Riboflavin supplementation may
      help by supporting flavin-containing monooxygenase 3 (FMO3) activity.
    disease_term:
      preferred_term: trimethylaminuria
    relationship_type: THERAPEUTIC
    population_context: Some patients with trimethylaminuria may respond to riboflavin
    mic_references:
      - 85
      - 86
      - 87
      - 88
      - 89

recommendations:
  rda:
    - population: Infants 0-6 months
      amount: "0.3 mg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Infants 7-12 months
      amount: "0.4 mg/day"
      source: Institute of Medicine
      notes: Adequate Intake (AI)
    - population: Children 1-3 years
      amount: "0.5 mg/day"
      source: Institute of Medicine
    - population: Children 4-8 years
      amount: "0.6 mg/day"
      source: Institute of Medicine
    - population: Children 9-13 years
      amount: "0.9 mg/day"
      source: Institute of Medicine
    - population: Males 14-18 years
      amount: "1.3 mg/day"
      source: Institute of Medicine
    - population: Females 14-18 years
      amount: "1.0 mg/day"
      source: Institute of Medicine
    - population: Males 19+ years
      amount: "1.3 mg/day"
      source: Institute of Medicine
    - population: Females 19+ years
      amount: "1.1 mg/day"
      source: Institute of Medicine
    - population: Pregnancy
      amount: "1.4 mg/day"
      source: Institute of Medicine
    - population: Breastfeeding
      amount: "1.6 mg/day"
      source: Institute of Medicine
  notes: |
    Clinical signs of deficiency in humans appear at intakes of less than 0.5 to 0.6 mg/day,
    and urinary excretion of riboflavin is seen at intake levels of approximately 1 mg/day.
    No UL has been established due to lack of adverse event reports. The Linus Pauling
    Institute recommends that adults should ensure adequate riboflavin intake by taking a
    multivitamin/mineral supplement containing 100% of the Daily Value for riboflavin,
    which will provide at least 1.3 mg/day.

bioavailability:
  description: |
    The bioavailability of riboflavin from food is reported to be very high, nearly 95%.
    Limited data exist for the relative bioavailability of riboflavin from different food
    sources, however a cross-over study in healthy women using stable isotopes and kinetic
    modeling did not find significant differences in riboflavin absorption from milk and
    spinach. Riboflavin is heat-stable, but it is easily destroyed upon exposure to light.
    Up to 50% of the riboflavin in milk contained in a clear glass bottle can be destroyed
    after two hours of exposure to bright sunlight.
  mic_references:
    - 6
    - 108
    - 111

references:
  - reference: PMID:9484373
    title: Effectiveness of high-dose riboflavin in migraine prophylaxis
    findings:
      - statement: High-dose riboflavin (400 mg/day) is effective for migraine prophylaxis
        supporting_text: "riboflavin was superior to placebo in reducing attack frequency (p = 0.005) and headache days (p = 0.012)"
  - reference: PMID:19952781
    title: Riboflavin lowers blood pressure in cardiovascular disease patients homozygous for the 677C-->T polymorphism in MTHFR
    findings:
      - statement: Riboflavin specifically lowers blood pressure in MTHFR 677TT genotype
        supporting_text: "Riboflavin intervention reduced mean blood pressure specifically in those with the TT genotype (from 144/87 to 131/80 mmHg)"
  - reference: PMID:21525198
    title: Correcting a marginal riboflavin deficiency improves hematologic status in young women
    findings:
      - statement: Riboflavin status affects iron status and hemoglobin levels
        supporting_text: "Moderately poor riboflavin status can affect iron status: the lower the riboflavin status, the greater the hematologic benefits of improving status"
  - reference: PMID:29744609
    title: Vitamin B2 intake reduces the risk for colorectal cancer
    findings:
      - statement: Higher riboflavin intake associated with lower colorectal cancer risk
        supporting_text: "Vitamin B2 intake was inversely associated with CRC risk (RR = 0.87; 95% CI 0.81-0.93)"

notes: |
  This nutrient file was extracted from the Linus Pauling Institute Micronutrient
  Information Center page on Riboflavin. Evidence items include exact quotes from
  PubMed abstracts. The MIC reference numbers (mic_references) correspond to the
  numbered citations on the source page. The page contains 119 references.
